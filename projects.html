n:0;flex:1;font-size:.72rem}\n.addsm{flex:none;padding:6px 12px;font-size:.78rem;font-weight:700;border-radius:8px;background:#8b5cf6;color:#fff;white-space:nowrap}\n#sbo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25;display:none}#sbo.show{display:block}\n#sbt{margin-left:auto;font-size:1.5rem;line-height:1;color:var(--ink);background:var(--card);border:1px solid var(--line)}\n@media(min-width:900px){#sb{transform:none;width:260px}#sbt,#sbo{display:none!important}#app .wrap{margin-left:260px;margin-right:0;max-width:none}}\n@media(min-width:900px){\n .bar2{top:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--line);padding:14px 10px}\n .bar2::before{content:\"\u2611 Task Maintenance\";display:block;font-weight:700;font-size:1.1rem;padding:4px 10px 14px;margin-bottom:8px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#ec4899,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n .bar2 div{max-width:none;display:flex;flex-direction:column;gap:2px}\n .bar2 button{flex-direction:row;gap:10px;padding:10px 12px;font-size:.9rem;border-radius:8px;text-align:left}\n .bar2 button b{font-size:1.1rem}\n .bar2 button:hover{background:var(--soft)}\n .bar2 button.main{background:#3b6cf6;color:#fff}\n .wrap{margin-left:240px;max-width:900px}\n}\n\n\n/* icon action buttons: plain, small, no colour coding */\n.task .ia{gap:4px}\n.task .ia button{background:var(--soft);border:1px solid var(--line);font-weight:400}\n.task .ia button:hover{background:var(--line)}\n/* hours badge: plain, small, not bold, no colour */\n.hrs{background:none;color:var(--ink);border:1px solid var(--line);font-weight:700;font-size:.74rem;padding:0 8px}\n.addsm{background:none;color:var(--ink);border:1px solid var(--line);font-weight:700;font-size:.74rem;padding:3px 10px}\n.addsm:hover{background:var(--soft)}\n#sb .bar2 button.main{color:var(--ink);font-weight:700}\n/* add-on features */\n#tmtoast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:.88rem}\n#tmtoast button{color:#a78bfa;font-weight:700}\n#tmrem{margin:0 0 10px;display:grid;gap:6px}\n#tmrem div{background:var(--card);border:1px solid var(--line);border-left:3px solid #f59e0b;border-radius:8px;padding:7px 10px;font-size:.82rem;color:var(--mute)}\n#tmcols{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}\n#tmcols h3{margin:0 0 2px;font-size:.92rem}#tmcols p{margin:0 0 8px;font-size:.78rem;color:var(--mute)}\n#tmcols .tmchips,#tmcols .tmpre{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}\n#tmcols label.tmc{display:inline-flex;align-items:center;gap:6px;margin:0;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--ink);font-weight:600;cursor:pointer}\n#tmcols label.tmc input{width:auto;margin:0;accent-color:#8b5cf6}\n#tmcols .tmpre button{padding:5px 12px;font-size:.78rem;border-radius:8px;background:var(--soft);border:1px solid var(--line);font-weight:600}\n#tmchart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}\n#tmchart h3{margin:0 0 8px;font-size:.82rem;color:var(--mute);font-weight:600}\n#tmchart .tmbars{position:relative;display:flex;align-items:flex-end;gap:4px;height:70px;border-bottom:1px solid var(--line)}\n#tmchart .tmb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}\n#tmchart .tmb i{display:block;width:70%;background:#8b5cf6;border-radius:3px 3px 0 0;min-height:0}\n#tmchart .tmb.over i{background:#f43f5e}\n#tmchart .tmline{position:absolute;left:0;right:0;border-top:1px dashed var(--mute);opacity:.6;pointer-events:none}\n#tmchart .tmx{display:flex;gap:4px;margin-top:3px}#tmchart .tmx span{flex:1;text-align:center;font-size:.6rem;color:var(--mute);min-width:0;overflow:hidden}\n#tmfil{width:auto;max-width:42%}\n#tmchart .tmh{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.8rem}\n#tmchart .tmh .l{flex:0 0 28%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n#tmchart .tmh .tr{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}\n#tmchart .tmh .tr i{display:block;height:100%;background:#8b5cf6;border-radius:99px}\n#tmchart .tmh b{flex:0 0 auto;min-width:42px;text-align:right}\n#tmchart .tmd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}\n#tmchart .tmg{display:grid;gap:6px;font-size:.84rem}#tmchart .tmg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}\n#tmchart .tmn{color:var(--mute);font-size:.84rem;margin:6px 0}\n#tmchart .tmf{margin:8px 0 0;font-size:.82rem;color:var(--mute)}#tmchart .tmf b{color:var(--ink)}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"warn\" id=\"warn\" hidden>Saving is blocked in this browser, so new tasks will be lost when you close it.\u003c/div>\n\n\u003csection id=\"login\">\n  \u003cdiv class=\"lcard\">\n    \u003cdiv class=\"avs\">\u003cspan>\ud83e\udd8a\u003c/span>\u003cspan>\ud83d\udc3c\u003c/span>\u003cspan>\ud83d\udc2f\u003c/span>\u003cspan>\ud83d\udc38\u003c/span>\u003cspan>\ud83e\udd81\u003c/span>\u003c/div>\n    \u003cdiv class=\"em\">\ud83d\udee0\ufe0f\u003c/div>\u003ch1>Task Maintenance\u003c/h1>\u003cp>Enter your name to open your tasks.\u003c/p>\n    \u003cinput id=\"nm\" maxlength=\"20\" placeholder=\"Your name\" autocomplete=\"off\" aria-label=\"Your name\">\n    \u003cp class=\"err\" id=\"lerr\" role=\"alert\">\u003c/p>\n    \u003cbutton class=\"btn full\" id=\"go\">Continue\u003c/button>\n  \u003c/div>\n\u003c/section>\n\n\u003cmain id=\"app\" hidden>\n  \u003cdiv class=\"wrap\">\n    \u003cheader>\u003ch1 id=\"hi\">\u003c/h1>\u003c/header>\n    \u003cdiv class=\"qa\">\u003cbutton data-a=\"notes\">\ud83d\udcdd Notes\u003c/button>\u003cbutton data-a=\"copilot\">\ud83e\udd16 Copilot tasks\u003c/button>\u003cbutton data-a=\"defaults\">\ud83d\udccb Default values\u003c/button>\u003cbutton data-a=\"fields\">\ud83e\udde9 Form fields\u003c/button>\u003c/div>\n    \u003cdiv class=\"tabs\">\u003cbutton data-a=\"tab\" data-t=\"tasks\" class=\"on\">\ud83d\udccb Tasks\u003c/button>\u003cbutton data-a=\"tab\" data-t=\"cal\">\ud83d\udcc5 Calendar\u003c/button>\u003cbutton data-a=\"tab\" data-t=\"sprints\">\ud83c\udfc1 Sprints\u003c/button>\u003cbutton data-a=\"tab\" data-t=\"jira\">\ud83d\udd17 Jira\u003c/button>\u003c/div>\n    \u003cdiv id=\"tview\">\u003cdiv class=\"tools\">\u003cinput id=\"q\" placeholder=\"Search defect, description, story\" aria-label=\"Search\">\u003cselect id=\"qs\" aria-label=\"Filter by sprint\">\u003c/select>\u003c/div>\u003cp class=\"ro\" id=\"dleg\">\u003c/p>\u003cdiv id=\"list\">\u003c/div>\u003cdiv id=\"pager\">\u003c/div>\u003c/div>\n    \u003cdiv id=\"cview\" hidden>\u003c/div>\n    \u003cdiv id=\"sview\" hidden>\u003c/div>\n    \u003cdiv id=\"jview\" hidden>\u003c/div>\n  \u003c/div>\n  \u003cnav class=\"bar2\" aria-label=\"Main actions\">\u003cdiv>\n    \u003cbutton class=\"main\" data-a=\"add\">\u003cb>\u2795\u003c/b>Add task\u003c/button>\u003cbutton data-a=\"settings\">\u003cb>\u2699\ufe0f\u003c/b>Settings\u003c/button>\u003cbutton data-a=\"del\">\u003cb>\ud83d\uddd1\ufe0f\u003c/b>Delete records\u003c/button>\u003cbutton data-a=\"logout\">\u003cb>\ud83d\udeaa\u003c/b>Logout\u003c/button>\n  \u003c/div>\u003c/nav>\n\u003c/main>\n\n\u003cdialog id=\"tdlg\">\u003cdiv class=\"dh\">\u003ch2 id=\"ttl\">\ud83d\udcdd Add task\u003c/h2>\u003c/div>\n  \u003cdiv id=\"attrow\">\u003clabel>Attendance\u003c/label>\u003cdiv class=\"seg\">\u003cbutton data-a=\"att\" data-v=\"P\" class=\"on\">\u2705 Present\u003c/button>\u003cbutton data-a=\"att\" data-v=\"A\">\ud83c\udfd6\ufe0f Absent\u003c/button>\u003c/div>\n    \u003cdiv id=\"lrow\" hidden>\u003clabel>Leave type\u003c/label>\u003cdiv class=\"seg\">\u003cbutton data-a=\"lt\" data-v=\"planned\" class=\"on\">\ud83d\udcc5 Planned\u003c/button>\u003cbutton data-a=\"lt\" data-v=\"unplanned\">\u26a0\ufe0f Unplanned\u003c/button>\u003c/div>\u003clabel for=\"fad\">Description (optional)\u003c/label>\u003cinput id=\"fad\" maxlength=\"200\" placeholder=\"Reason or details (not mandatory)\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"dur\">\u003cdiv>\u003clabel for=\"fdt\">Date\u003c/label>\u003cinput id=\"fdt\" type=\"date\">\u003c/div>\u003cdiv id=\"hw\">\u003clabel for=\"fh\">Hours\u003c/label>\u003cinput id=\"fh\" type=\"number\" min=\"0.25\" max=\"24\" step=\"0.25\" placeholder=\"9\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"pf\" class=\"fg\">\u003c/div>\n  \u003cp class=\"err\" id=\"terr\" role=\"alert\">\u003c/p>\n  \u003cbutton class=\"btn full\" data-a=\"savetask\">Save\u003c/button>\u003cbutton class=\"btn alt full\" data-a=\"close\">Cancel\u003c/button>\n\u003c/dialog>\n\n\u003cdialog id=\"sdlg\">\u003cdiv class=\"dh\">\u003ch2>\ud83e\udd16 Settings\u003c/h2>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>\ud83d\udcc4 Records\u003c/h3>\u003cbutton class=\"btn alt full\" data-a=\"records\">View all my records\u003c/button>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>\ud83d\udcc6 Tasks done between two dates\u003c/h3>\n    \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"rf\">From date\u003c/label>\u003cinput id=\"rf\" type=\"date\">\u003c/div>\u003cdiv>\u003clabel for=\"rt\">To date\u003c/label>\u003cinput id=\"rt\" type=\"date\">\u003c/div>\u003c/div>\n    \u003clabel for=\"rs\">Sprint\u003c/label>\u003cselect id=\"rs\">\u003c/select>\n    \u003cbutton class=\"btn full\" data-a=\"range\">Show tasks done\u003c/button>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>\ud83d\udcbe Backup and restore\u003c/h3>\u003cp class=\"meta\">Keep a copy of your data, or move it to another browser.\u003c/p>\n    \u003cbutton class=\"btn alt full\" data-a=\"bkcopy\">Copy my backup\u003c/button>\n    \u003clabel for=\"bk\">Paste a backup here to restore it\u003c/label>\u003ctextarea id=\"bk\" placeholder=\"Paste backup text\">\u003c/textarea>\n    \u003cbutton class=\"btn alt full\" data-a=\"restore\">Restore from backup\u003c/button>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>\ud83d\udd17 Jira tab\u003c/h3>\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"jon\" data-a=\"jtoggle\"> Show the Jira tab and add every new task to it\u003c/label>\u003cp class=\"meta\" style=\"margin:0\">New tasks wait in the Jira tab until you mark their hours as saved in Jira. Turn this off if you do not use Jira.\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>\ud83c\udfa8 Theme\u003c/h3>\u003cbutton class=\"btn alt full\" data-a=\"theme\">Switch light / dark\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"smsg\" role=\"status\">\u003c/p>\n  \u003cbutton class=\"btn alt full\" data-a=\"close\">Close\u003c/button>\n\u003c/dialog>\n\n\u003cdialog id=\"ddlg\">\u003cdiv class=\"dh\">\u003ch2>\ud83e\uddf9 Delete records\u003c/h2>\u003c/div>\n  \u003cdiv class=\"sec\" style=\"border:0;margin-top:0\">\u003ch3>Delete specific data\u003c/h3>\n    \u003cdiv class=\"two\">\u003cselect id=\"sk\" aria-label=\"Delete by\">\u003coption value=\"defect\">Defect ID\u003c/option>\u003coption value=\"sprint\">Sprint ID\u003c/option>\u003coption value=\"date\">Date\u003c/option>\u003c/select>\u003cdiv>\u003cinput id=\"sv\" aria-label=\"Value to delete\">\u003cdiv id=\"sdw\" hidden>\u003cinput id=\"sd\" type=\"date\" aria-label=\"Date to delete as DD/MM/YYYY\">\u003c/div>\u003c/div>\u003c/div>\n    \u003cbutton class=\"btn bad full\" data-a=\"delspec\">Delete matching tasks\u003c/button>\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>Delete all\u003c/h3>\u003cp class=\"meta\">Removes all your tasks and attendance.\u003c/p>\u003cbutton class=\"btn bad full\" data-a=\"delall\">Delete everything of mine\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"dmsg\" role=\"status\">\u003c/p>\n  \u003cbutton class=\"btn alt full\" data-a=\"close\">Close\u003c/button>\n\u003c/dialog>\n\n\u003cdialog id=\"ndlg\">\u003cdiv class=\"dh\">\u003ch2>\ud83d\udcdd Notes\u003c/h2>\u003c/div>\n  \u003clabel for=\"nt\">Title (optional)\u003c/label>\u003cinput id=\"nt\" maxlength=\"60\" placeholder=\"Meeting points\">\n  \u003clabel for=\"nx\">Note\u003c/label>\u003ctextarea id=\"nx\" placeholder=\"Write your note\">\u003c/textarea>\n  \u003cp class=\"err\" id=\"nerr\" role=\"alert\">\u003c/p>\n  \u003cbutton class=\"btn full\" id=\"nsave\" data-a=\"notesave\">Add note\u003c/button>\u003cbutton class=\"btn alt full\" id=\"ncancel\" data-a=\"notecancel\" hidden>Cancel edit\u003c/button>\n  \u003cdiv id=\"nlist\">\u003c/div>\n  \u003cbutton class=\"btn alt full\" data-a=\"close\">Close\u003c/button>\u003c/dialog>\n\n\u003cdialog id=\"fdlg\" class=\"big\">\u003cdiv class=\"dh\">\u003ch2>\ud83d\udccb Default values\u003c/h2>\u003c/div>\n  \u003cp class=\"ro\">These fill the Sprint, Task ID and Iteration lists in Add task. Edit them here only.\u003c/p>\n  \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"dsp\">Sprint\u003c/label>\u003cinput id=\"dsp\" maxlength=\"30\" placeholder=\"Sprint 12\">\u003c/div>\u003cdiv>\u003clabel for=\"dti\">Task ID\u003c/label>\u003cinput id=\"dti\" maxlength=\"30\" placeholder=\"T-101\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"dit\">Iteration\u003c/label>\u003cinput id=\"dit\" maxlength=\"30\" placeholder=\"Iteration 1\">\u003c/div>\u003cdiv>\u003clabel for=\"dds\">Description\u003c/label>\u003cinput id=\"dds\" maxlength=\"200\" placeholder=\"What is this task?\">\u003c/div>\u003c/div>\n  \u003cp class=\"err\" id=\"derr\" role=\"alert\">\u003c/p>\n  \u003cbutton class=\"btn full\" id=\"dsave\" data-a=\"defsave\">Add default\u003c/button>\u003cbutton class=\"btn alt full\" id=\"dcancel\" data-a=\"defcancel\" hidden>Cancel edit\u003c/button>\n  \u003cdiv id=\"dlist\">\u003c/div>\n  \u003cbutton class=\"btn alt full\" data-a=\"close\">Close\u003c/button>\u003c/dialog>\n\n\u003cdialog id=\"fldlg\" class=\"big\">\u003cdiv class=\"dh\">\u003ch2>\ud83e\udde9 Form fields\u003c/h2>\u003c/div>\n  \u003cp class=\"ro\">Rename the fields for your project (for example Defect ID to ABC ID), show or hide them, make each one \u003cb>Mandatory\u003c/b> or \u003cb>Optional\u003c/b>, and move them up or down. This changes the Add task form, the cards, the records, the CSV and the PDF.\u003c/p>\n  \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"dtg\">Daily target hours\u003c/label>\u003cinput id=\"dtg\" type=\"number\" min=\"1\" max=\"24\" step=\"0.5\">\u003c/div>\u003cp class=\"ro\" style=\"align-self:end;margin:0 0 10px\">Spent that day is \ud83d\udfe8 yellow below the target, \ud83d\udfe6 blue at the target and \ud83d\udfe5 red above it.\u003c/p>\u003c/div>\n  \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"pgs\">Records per page\u003c/label>\u003cinput id=\"pgs\" type=\"number\" min=\"1\" max=\"200\" step=\"1\">\u003c/div>\u003cp class=\"ro\" style=\"align-self:end;margin:0 0 10px\">The task list shows this many records at a time. Use the page buttons under the list to move to the next page.\u003c/p>\u003c/div>\n  \u003cdiv id=\"flist\">\u003c/div>\n  \u003cdiv id=\"rlist\">\u003c/div>\n  \u003cdiv class=\"sec\">\u003ch3>\u2795 Add your own field\u003c/h3>\n    \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"nfn\">Field name\u003c/label>\u003cinput id=\"nfn\" maxlength=\"30\" placeholder=\"Priority\">\u003c/div>\u003cdiv>\u003clabel for=\"nft\">Type\u003c/label>\u003cselect id=\"nft\">\u003coption value=\"text\">Text\u003c/option>\u003coption value=\"num\">Number\u003c/option>\u003coption value=\"sel\">Dropdown\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n    \u003cdiv id=\"nfo\" hidden>\u003clabel for=\"nfop\">Dropdown choices (separate with commas)\u003c/label>\u003cinput id=\"nfop\" placeholder=\"High, Medium, Low\">\u003c/div>\n    \u003cp class=\"err\" id=\"nferr\" role=\"alert\">\u003c/p>\n    \u003cbutton class=\"btn full\" data-a=\"fadd\">Add field\u003c/button>\u003c/div>\n  \u003cbutton class=\"btn alt full\" data-a=\"freset\">Reset to default names and order\u003c/button>\n  \u003cbutton class=\"btn alt full\" data-a=\"close\">Close\u003c/button>\u003c/dialog>\n\n\u003cdialog id=\"rdlg\" class=\"big\">\u003cdiv class=\"dh\">\u003ch2 id=\"rtitle\">Records\u003c/h2>\u003c/div>\u003cdiv id=\"rbody\">\u003c/div>\n  \u003cdiv class=\"row2\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px\">\u003cbutton class=\"btn\" data-a=\"copycsv\" style=\"margin:0\">\ud83d\udccb Copy as CSV\u003c/button>\u003cbutton class=\"btn alt\" data-a=\"dlcsv\" style=\"margin:0\">\u2b07\ufe0f Download CSV\u003c/button>\u003cbutton class=\"btn alt\" data-a=\"dlpdf\" style=\"margin:0\">\ud83d\udcc4 Download PDF\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"rmsg\" role=\"status\">\u003c/p>\n  \u003cbutton class=\"btn alt full\" data-a=\"close\">Close\u003c/button>\u003c/dialog>\n\n\u003cscript>\nconst KEY='taskmaint_v1';\nconst WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst AVS=['\ud83e\udd8a','\ud83d\udc3c','\ud83d\udc2f','\ud83d\udc38','\ud83e\udd81','\ud83d\udc35','\ud83d\udc19','\ud83e\udd84','\ud83d\udc27','\ud83d\udc3b'];\nconst $=id=>document.getElementById(id);\nconst esc=x=>String(x).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst r2=n=>Math.round(n*100)/100,H=n=>r2(n)+' h',p2=n=>String(n).padStart(2,'0');\nconst iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());\nconst dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'',fmt=dmy;   /* dates are shown as DD/MM/YYYY */\nconst hue=k=>{let h=0;for(const c of String(k))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 68% 52%)`};\nconst avOf=n=>AVS[[...String(n).toLowerCase()].reduce((a,c)=>a+c.charCodeAt(0),0)%AVS.length];\nlet DB={users:{},last:''},me=null,editId=null,view='tasks',page=1,selDay=null,calY=new Date().getFullYear(),calM=new Date().getMonth();\nlet attSel='P',leaveSel='planned',csvText='',csvName='records',noteEdit=null,defEdit=null,pdfDoc=null;\nconst N=()=>U().notes||(U().notes=[]),D=()=>U().defaults||(U().defaults=[]),C=()=>U().copilot||(U().copilot={});\nconst ck=x=>String(x).trim().toLowerCase(),csvq=x=>'\"'+String(x).replace(/\"/g,'\"\"')+'\"';\nconst newId=()=>Date.now()+'-'+Math.random().toString(36).slice(2,7);\nfunction parseDMY(t){\n  const m=String(t).trim().match(/^(\\d{1,2})[\\/.\\-](\\d{1,2})[\\/.\\-](\\d{4})$/);if(!m)return '';\n  const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);\n  return dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d?y+'-'+p2(mo)+'-'+p2(d):'';\n}\nfunction dsync(id){$(id+'_t').value=dmy($(id).value)}\nfunction mkDate(id){\n  const n=$(id),w=document.createElement('span'),t=document.createElement('input'),b=document.createElement('button');\n  w.className='dp';t.type='text';t.id=id+'_t';t.placeholder='DD/MM/YYYY';t.inputMode='numeric';t.maxLength=10;t.autocomplete='off';t.setAttribute('aria-label',n.getAttribute('aria-label')||'Date as day/month/year');\n  b.type='button';b.className='cb';b.textContent='\ud83d\udcc5';b.setAttribute('aria-label','Pick from calendar');\n  n.parentNode.insertBefore(w,n);w.append(t,b,n);n.className='nat';n.tabIndex=-1;n.setAttribute('aria-hidden','true');\n  const lb=document.querySelector('label[for=\"'+id+'\"]');if(lb)lb.htmlFor=id+'_t';\n  b.onclick=()=>{try{n.showPicker()}catch(e){n.focus();n.click()}};\n  n.addEventListener('change',()=>{t.value=dmy(n.value)});\n  t.addEventListener('input',()=>{n.value=parseDMY(t.value)});\n  t.addEventListener('blur',()=>{if(n.value)t.value=dmy(n.value)});\n}\nconst U=()=>DB.users[me],T=()=>U().tasks,A=()=>U().att||(U().att={});\n\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(DB));$('warn').hidden=true}catch(e){$('warn').hidden=false}}\nfunction load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.users)DB=d}}catch(e){}\n  try{const s=sessionStorage.getItem('taskmaint_me');if(s&&DB.users[s])me=s}catch(e){}\n  try{const t=localStorage.getItem('taskmaint_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}\n\n/* ---------- login ---------- */\nfunction login(){\n  const name=$('nm').value.trim().replace(/\\s+/g,' ').slice(0,20);\n  if(!name){$('lerr').textContent='Please enter your name.';$('nm').focus();return}\n  const k=name.toLowerCase();\n  if(!DB.users[k])DB.users[k]={name,tasks:[],att:{}};   /* same name (any capitals) = same account */\n  DB.last=DB.users[k].name;me=k;save();\n  try{sessionStorage.setItem('taskmaint_me',k)}catch(e){}\n  $('lerr').textContent='';show();\n}\nfunction logout(){me=null;selDay=null;try{sessionStorage.removeItem('taskmaint_me')}catch(e){}$('nm').value=DB.last||'';show()}\nfunction show(){$('login').hidden=!!me;$('app').hidden=!me;if(me)render();else $('nm').focus()}\n\n/* ---------- helpers ---------- */\nconst sprints=()=>[...new Set(T().map(x=>(x.sprint||'').trim()).filter(Boolean))].sort();\nconst dayTotals=()=>{const m={};T().forEach(x=>m[x.date]=r2((m[x.date]||0)+x.hours));return m};\nconst monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};\nconst sumRange=(t,a,b)=>r2(t.filter(x=>x.date>=a&&x.date\u003c=b).reduce((s,x)=>s+x.hours,0));\nconst card=(x,no,day,last)=>{\n  const fs=shown(),chips=fs.filter(f=>f.k!=='defect'&&f.k!=='desc'&&f.k!=='notes').map(f=>{\n    if(f.k==='cop')return x.cop?`\u003cspan class=\"sp\">\ud83e\udd16 ${esc(f.label)}\u003c/span>`:'';\n    const v=getV(x,f.k);return v===''?'':`\u003cspan${f.k==='sprint'?' class=\"sp\"':''}>\u003ci>${esc(f.label)}:\u003c/i> ${esc(v)}\u003c/span>`}).join('');\n  const hd=fs.some(f=>f.k==='defect'),hs=fs.some(f=>f.k==='desc');\n  const main=(hd?`\u003ci>${esc(lab('defect'))}:\u003c/i> \u003cb>${esc(x.defect||'-')}\u003c/b>`:'')+(hd&&hs?` \u003ci>\u00b7 ${esc(lab('desc'))}:\u003c/i> `:(hs?`\u003ci>${esc(lab('desc'))}:\u003c/i> `:''))+(hs?esc(x.desc||'-'):'')||`\u003cb>Task ${no}\u003c/b>`;\n  const jst=jiraOn()&&x.jira?`\u003cbutton class=\"jst ${x.jira==='done'?'ok':'wait'}\" data-a=\"jtog\" data-id=\"${x.id}\" title=\"Tap to change\">\ud83d\udd17 Jira ${x.jira==='done'?'saved':'pending'}\u003c/button>`:'';\n  const nt=fs.some(f=>f.k==='notes')&&x.notes?`\u003cdiv class=\"l3\">\ud83d\udcdd ${esc(x.notes)}\u003c/div>`:'';\n  return `\u003carticle class=\"task\" style=\"--sc:${x.sprint?hue(x.sprint):'var(--acc)'}\">\u003cdiv class=\"l1\">\u003cspan class=\"no\">${no}\u003c/span>\u003cspan class=\"ds\" title=\"${esc(x.desc)}\">${main}\u003c/span>\u003cspan class=\"hrs\">${H(x.hours)}\u003c/span>\u003c/div>\u003cdiv class=\"l2\">${chips}${jst}\u003cspan>${fmt(x.date)}\u003c/span>${last?`\u003cspan class=\"day ${dayCls(day[x.date]).replace('c-','t-')}\" title=\"Daily target ${H(target())}\">Spent that day ${H(day[x.date])}\u003c/span>`:''}\u003cspan class=\"ia\">\u003cbutton data-a=\"edit\" data-id=\"${x.id}\" aria-label=\"Edit ${esc(x.defect)}\" title=\"Edit\">\u270f\ufe0f\u003c/button>\u003cbutton data-a=\"rm\" data-id=\"${x.id}\" aria-label=\"Delete ${esc(x.defect)}\" title=\"Delete\">\ud83d\uddd1\ufe0f\u003c/button>\u003c/span>\u003c/div>${nt}\u003c/article>`;\n};\n\n/* ---------- main page ---------- */\nfunction render(){\n  const u=U(),t=T(),now=new Date(),today=iso(now),day=dayTotals();\n  $('hi').innerHTML=`\u003cspan class=\"avt\">${avOf(u.name)}\u003c/span>\u003cspan>Hi, ${esc(u.name)} \ud83d\udc4b\u003csmall>${t.length} task${t.length===1?'':'s'} saved\u003c/small>\u003c/span>`;\n  const m1=monday(now),m2=new Date(m1);m2.setDate(m2.getDate()+6);\n  const pre=today.slice(0,8);\n  applyLabels();\n  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===view));\n  $('tview').hidden=view!=='tasks';$('cview').hidden=view!=='cal';$('sview').hidden=view!=='sprints';$('jview').hidden=view!=='jira';\n  const ord={};[...t].sort((a,b)=>a.at-b.at).forEach((x,i)=>ord[x.id]=i+1);   /* saved order: 1st, 2nd, 3rd... */\n  if(view==='cal'){$('cview').innerHTML=calHTML(ord,day);return}\n  if(view==='sprints'){$('sview').innerHTML=sprintHTML();return}\n  if(view==='jira'){$('jview').innerHTML=jiraHTML(ord);return}\n  const cur=$('qs').value,sp=sprints();\n  $('qs').innerHTML='\u003coption value=\"\">All '+esc(lab('sprint'))+'\u003c/option>'+sp.map(s=>`\u003coption value=\"${esc(s)}\">${esc(s)}\u003c/option>`).join('');$('qs').value=sp.includes(cur)?cur:'';\n  const q=$('q').value.trim().toLowerCase(),f=$('qs').value;\n  const rows=t.filter(x=>(!q||[x.defect,x.desc,x.sprint||'',x.taskId||'',x.iter||'',x.notes||'',...Object.values(x.x||{})].join(' ').toLowerCase().includes(q))&&(!f||x.sprint===f)).sort((a,b)=>a.at-b.at);\n  const per=pageSize(),pages=Math.max(1,Math.ceil(rows.length/per));if(page>pages)page=pages;if(page\u003c1)page=1;\n  $('pager').innerHTML=pages>1?pagerHTML(rows.length,per,pages):'';\n  $('list').innerHTML=rows.length?(()=>{const lastOf={};rows.forEach(x=>lastOf[x.date]=x.id);return rows.slice((page-1)*per,page*per).map(x=>card(x,ord[x.id],day,lastOf[x.date]===x.id)).join('')})():`\u003cdiv class=\"empty\">\u003cspan class=\"big\">\ud83e\udd89\u003c/span>${t.length?'No tasks match your filter.':'No tasks yet. Tap \u2795 Add task to start.'}\u003c/div>`;\n}\nfunction sprintHTML(){\n  const g={};T().forEach(x=>{const k=(x.sprint||'').trim()||'No sprint';const o=g[k]=g[k]||{h:0,n:0,a:x.date,b:x.date};o.h=r2(o.h+x.hours);o.n++;if(x.date\u003co.a)o.a=x.date;if(x.date>o.b)o.b=x.date});\n  const ks=Object.keys(g).sort((m,n)=>g[n].b.localeCompare(g[m].b)),max=Math.max(1,...ks.map(k=>g[k].h));\n  return ks.length?ks.map(k=>{const o=g[k];return `\u003cbutton class=\"spc\" data-a=\"sprint\" data-s=\"${esc(k)}\" style=\"--sc:${k==='No sprint'?'var(--mute)':hue(k)}\">\u003cdiv class=\"r\">\u003cb>\ud83c\udfc1 ${esc(k)}\u003c/b>\u003cspan class=\"hrs\">${H(o.h)}\u003c/span>\u003c/div>\u003cdiv class=\"spb\">\u003ci style=\"width:${o.h/max*100}%\">\u003c/i>\u003c/div>\u003cdiv class=\"meta\">\u003cspan>${o.n} task${o.n===1?'':'s'}\u003c/span>\u003cspan>${fmt(o.a)} \u2013 ${fmt(o.b)}\u003c/span>\u003c/div>\u003c/button>`}).join('')+'\u003cp class=\"meta\">Tap a sprint to see its tasks.\u003c/p>':'\u003cdiv class=\"empty\">\u003cspan class=\"big\">\ud83e\udd89\u003c/span>No sprints yet. Add a Sprint ID to a task.\u003c/div>';\n}\n/* month calendar: hours, planned / unplanned leave, and a total for every week */\nfunction calHTML(ord,day){\n  const t=T(),att=A(),pre=calY+'-'+p2(calM+1)+'-',today=iso(new Date());\n  const first=(new Date(calY,calM,1).getDay()+6)%7,dim=new Date(calY,calM+1,0).getDate();\n  let cells=WD.map(d=>`\u003cdiv class=\"wh\">${d}\u003c/div>`).join('')+'\u003cdiv class=\"wh\">Week\u003c/div>'+'\u003cdiv>\u003c/div>'.repeat(first);\n  let wk=0,col=first,worked=0,lp=0,lu=0,mh=0;\n  for(let d=1;d\u003c=dim;d++){\n    const k=pre+p2(d),h=day[k]||0,a=att[k];wk=r2(wk+h);mh=r2(mh+h);\n    if(h>0)worked++;else if(a&&a.s==='A'){a.k==='unplanned'?lu++:lp++}\n    const cl=a&&a.s==='A'?(a.k==='unplanned'?'au':'ap'):h>0?'has':'';\n    const lab=a&&a.s==='A'?(a.k==='unplanned'?'\u26a0\ufe0f':'\ud83c\udfd6\ufe0f'):h>0?r2(h)+'h':'';\n    cells+=`\u003cbutton class=\"dc ${cl} ${k===today?'today':''} ${k===selDay?'sel':''}\" data-a=\"day\" data-d=\"${k}\" aria-label=\"${fmt(k)}\">\u003cspan class=\"dn\">${d}\u003c/span>\u003cspan class=\"dh2\">${lab}\u003c/span>\u003c/button>`;\n    col++;if(col===7||d===dim){cells+='\u003cdiv>\u003c/div>'.repeat(7-col)+`\u003cdiv class=\"wk\">\u003cspan>${r2(wk)}h\u003c/span>\u003c/div>`;wk=0;col=0}\n  }\n  const n=t.filter(x=>x.date.startsWith(pre)).length;\n  let detail='';\n  if(selDay){\n    const dt=t.filter(x=>x.date===selDay).sort((a,b)=>a.at-b.at),h=day[selDay]||0,a=att[selDay];\n    const status=a&&a.s==='A'?(a.k==='unplanned'?'\u26a0\ufe0f Absent \u00b7 Unplanned':'\ud83c\udfd6\ufe0f Absent \u00b7 Planned'):h>0?'\u2705 Present':'No data';\n    detail=`\u003cdiv class=\"panel\">\u003ch2>${fmt(selDay)}\u003c/h2>\u003cdiv class=\"det\">\u003cspan>\u23f1\ufe0f Time spent: ${H(h)}\u003c/span>\u003cspan>${status}\u003c/span>\u003c/div>${a&&a.s==='A'&&a.desc?`\u003cp class=\"meta\">\ud83d\udcdd ${esc(a.desc)}\u003c/p>`:''}${dt.map((x,i)=>card(x,ord[x.id],day,i===dt.length-1)).join('')}${dt.length?'':'\u003cp class=\"meta\">No tasks on this day.\u003c/p>'}\u003cbutton class=\"btn full\" data-a=\"addday\" data-d=\"${selDay}\">\u2795 Add task or attendance on this day\u003c/button>${a&&a.s==='A'?`\u003cbutton class=\"btn alt full\" data-a=\"clratt\">Clear this absence\u003c/button>`:''}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"calhead\">\u003cbutton class=\"ib\" data-a=\"pm\" aria-label=\"Previous month\">\u2039\u003c/button>\u003cb>${MN[calM]} ${calY}\u003c/b>\u003cbutton class=\"ib\" data-a=\"nm\" aria-label=\"Next month\">\u203a\u003c/button>\u003cbutton class=\"btn alt\" data-a=\"tdy\">Today\u003c/button>\u003c/div>\n  \u003cdiv class=\"msum\">\u003cspan>\u003cb>${n}\u003c/b> task${n===1?'':'s'}\u003c/span>\u003cspan>\u003cb>${H(mh)}\u003c/b> this month\u003c/span>\u003cspan>\u003cb>${worked}\u003c/b> worked\u003c/span>\u003cspan>\ud83c\udfd6\ufe0f \u003cb>${lp}\u003c/b> planned\u003c/span>\u003cspan>\u26a0\ufe0f \u003cb>${lu}\u003c/b> unplanned\u003c/span>\u003c/div>\n  \u003cdiv class=\"cal\">${cells}\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\ud83d\udfe9 worked\u003c/span>\u003cspan>\ud83d\udfe6 \ud83c\udfd6\ufe0f planned leave\u003c/span>\u003cspan>\ud83d\udfe7 \u26a0\ufe0f unplanned absence\u003c/span>\u003c/div>${detail}`;\n}\n\n/* ---------- configurable fields (names, order, show/hide, custom fiel let custom=[],pending=null,blobUrl=null,hid=[];try{hid=JSON.parse(localStorage.getItem('hub_hidden')||'[]')}catch(e){}

/* IndexedDB for uploaded projects (stays in this browser) */
const db=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('projects-hub',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(m,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('p',m),s=t.objectStore('p'),q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
async function load(){try{custom=(await tx('readonly',s=>s.getAll()))||[]}catch(e){custom=[]}render()}

function render(){
  const all=[...seed.map(p=>({...p,built:1})),...custom].filter(p=>!hid.includes(p.id));
  $('grid').innerHTML='';
  all.forEach((p,i)=>{
    const c=document.createElement('div');c.className='card';
    const t=document.createElement('div');t.className='tile';t.style.background=COLORS[i%COLORS.length];t.textContent=(p.name||'?')[0].toUpperCase();
    const b=document.createElement('div');b.className='body';
    const h=document.createElement('h3');h.textContent=p.name;
    const d=document.createElement('p');d.textContent=p.desc||'No description yet.';
    const r=document.createElement('div');r.className='row';
    const o=document.createElement('button');o.className='btn';o.textContent='Open';o.onclick=()=>open(p);
    const tg=document.createElement('span');tg.className='tag';tg.textContent=p.built?'Included':'Uploaded';
    r.append(tg);
    {const x=document.createElement('button');x.className='del';x.textContent='Remove';x.onclick=async()=>{if(!askKey('remove'))return;if(!confirm('Remove "'+p.name+'" from this website?'))return;if(p.built){hid.push(p.id);try{localStorage.setItem('hub_hidden',JSON.stringify(hid))}catch(e){}}else{try{await tx('readwrite',s=>s.delete(p.id))}catch(e){}}load()};r.append(x)}
    r.append(o);b.append(h,d,r);c.append(t,b);$('grid').append(c);
  });
}
function open(p){$('vt').textContent=p.name;$('frame').srcdoc=p.html;$('viewer').classList.add('on');$('viewer').dataset.id=p.id;current=p}
let current;
$('back').onclick=()=>{$('viewer').classList.remove('on');$('frame').srcdoc=''};
$('tab').onclick=()=>{if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([current.html],{type:'text/html'}));window.open(blobUrl,'_blank')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('viewer').classList.contains('on'))$('back').click()});

/* Add project */
$('add').onclick=()=>{if(!askKey('add'))return;pending=null;$('f').value='';$('n').value='';$('d').value='';$('err').textContent='';$('drop').textContent='Choose or drop an .html file';$('drop').classList.remove('has');$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('drop').onclick=()=>$('f').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('f').click()};
['dragover','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'&&e.dataTransfer.files[0])read(e.dataTransfer.files[0])}));
$('f').onchange=()=>$('f').files[0]&&read($('f').files[0]);
function read(file){
  if(!/\.html?$/i.test(file.name)){$('err').textContent='This needs to be an .html file.';return}
  const r=new FileReader();r.onload=()=>{
    pending=r.result;$('err').textContent='';$('drop').textContent=file.name;$('drop').classList.add('has');
    if(!$('n').value){const m=pending.match(/<title>([^<]*)/i);$('n').value=(m?m[1]:file.name.replace(/\.html?$/i,'')).split(/\s[—–-]\s/)[0].trim()}
  };r.readAsText(file);
}
$('save').onclick=async()=>{
  if(!pending){$('err').textContent='Choose an HTML file first.';return}
  const p={id:'u'+Date.now(),name:$('n').value.trim()||'Untitled project',desc:$('d').value.trim(),html:pending};
  try{await tx('readwrite',s=>s.put(p))}catch(e){$('err').textContent='Could not save in this browser. Storage may be blocked.';return}
  $('dlg').close();load();
};
load();
</script></body></html>
