n              \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" data-open-editor=\"stf-syl-editor\" data-editor-title=\"Edit Syllabus\" data-refresh=\"renderStfSyllabusReadonly\">Edit Syllabus\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"stf-syl-class\">\u003c/select>\n            \u003cselect id=\"stf-syl-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n          \u003c/div>\n          \u003cdiv id=\"stf-syl-readonly\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"stf-syl-editor-slot\" class=\"hidden\">\n        \u003cdiv id=\"stf-syl-editor\">\n          \u003ctable>\u003cthead>\u003ctr>\u003cth>Topic\u003c/th>\u003cth>Status\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"stf-syl-tbody\">\u003c/tbody>\u003c/table>\n          \u003cdiv class=\"row-flex\" style=\"margin-top:12px;\">\n            \u003cinput type=\"text\" id=\"stf-syl-topic\" placeholder=\"New topic name\">\n            \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"stf-syl-add\">+ Add Topic\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"stf-marks\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>Student Marks \u2014 Add / Update\u003c/h3>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"stf-marks-class\">\u003c/select>\n            \u003cselect id=\"stf-marks-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n            \u003cselect id=\"stf-marks-exam\">\u003c/select>\n            \u003cselect id=\"stf-marks-subject\">\u003c/select>\n          \u003c/div>\n          \u003ctable>\u003cthead>\u003ctr>\u003cth>Roll\u003c/th>\u003cth>Name\u003c/th>\u003cth>Marks\u003c/th>\u003cth>Max\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"stf-marks-tbody\">\u003c/tbody>\u003c/table>\n          \u003cbutton class=\"btn btn-amber\" style=\"width:auto;margin-top:12px;\" id=\"stf-marks-save\">Save Marks\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"stf-topper\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>\ud83c\udfc6 School Topper\u003c/h3>\n          \u003cdiv class=\"row-flex\">\u003cselect id=\"stf-schooltopper-exam\">\u003c/select>\u003c/div>\n          \u003cdiv id=\"stf-schooltopper-card\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"panel\">\n          \u003ch3>Class / Section Toppers\u003c/h3>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"stf-topper-class\">\u003c/select>\n            \u003cselect id=\"stf-topper-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n            \u003cselect id=\"stf-topper-exam\">\u003c/select>\n          \u003c/div>\n          \u003cdiv id=\"stf-topper-list\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"stf-leave\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>Student Leave Requests\u003c/h3>\n          \u003cdiv id=\"stf-leave-list\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Add/Edit staff or housekeeping modal -->\n\u003cdiv class=\"modal-bg\" id=\"modal-bg\">\n  \u003cdiv class=\"modal\">\n    \u003ch3 id=\"modal-title\">Add Staff\u003c/h3>\n    \u003cinput type=\"hidden\" id=\"f-id\">\n    \u003cdiv class=\"field\">\u003clabel>Full Name\u003c/label>\u003cinput id=\"f-name\" placeholder=\"e.g. Kavitha Reddy\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel id=\"f-role-label\">Subject Taught\u003c/label>\u003cinput id=\"f-role\" placeholder=\"e.g. Mathematics\">\u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn-ghost\" id=\"modal-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"modal-save\">Save\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Add / Edit student modal -->\n\u003cdiv class=\"modal-bg\" id=\"student-modal-bg\">\n  \u003cdiv class=\"modal\">\n    \u003ch3 id=\"student-modal-title\">Add Student\u003c/h3>\n    \u003cinput type=\"hidden\" id=\"s-id\">\n    \u003cdiv class=\"field\">\u003clabel>Full Name\u003c/label>\u003cinput id=\"s-name\" placeholder=\"e.g. Ananya Rao\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel>Class\u003c/label>\u003cselect id=\"s-class\">\u003c/select>\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel>Section\u003c/label>\u003cinput id=\"s-section\" placeholder=\"e.g. A\" maxlength=\"1\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel>Roll No\u003c/label>\u003cinput id=\"s-roll\" type=\"number\" min=\"1\">\u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn-ghost\" id=\"student-modal-cancel\">Cancel\u003c/button>\n      \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"student-modal-save\">Save\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Generic editor modal (used by Timetable / Exam Timetable / Holidays / Syllabus edit buttons) -->\n\u003cdiv class=\"modal-bg\" id=\"op-modal-bg\">\n  \u003cdiv class=\"modal\" style=\"width:640px;\">\n    \u003ch3 id=\"op-modal-title\">Edit\u003c/h3>\n    \u003cdiv id=\"op-modal-body\">\u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"op-modal-done\">Done\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Exam reminder popup (students) -->\n\u003cdiv class=\"modal-bg\" id=\"reminder-modal-bg\">\n  \u003cdiv class=\"modal\" style=\"width:420px;\">\n    \u003ch3>\ud83d\udcc5 Upcoming Exams\u003c/h3>\n    \u003cdiv id=\"reminder-list\">\u003c/div>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"reminder-close\">Got it\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- Term-end notification (staff/management) -->\n\u003cdiv class=\"modal-bg\" id=\"staff-notify-modal-bg\">\n  \u003cdiv class=\"modal\" style=\"width:420px;\">\n    \u003ch3>\ud83d\udcda Term Complete\u003c/h3>\n    \u003cp id=\"staff-notify-text\" style=\"color:var(--text-dim);font-size:13.5px;line-height:1.6;\">\u003c/p>\n    \u003cdiv class=\"modal-actions\">\n      \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"staff-notify-close\">Got it\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\nconst $ = s => document.querySelector(s);\nconst $$ = s => Array.from(document.querySelectorAll(s));\nconst pad = (n,l=2) => String(n).padStart(l,'0');\nconst todayStr = () => new Date().toISOString().slice(0,10);\nconst classSecKey = (c,s) => `${c}${s}`;\n\n/* ---------- Name pools & ID/password generation ---------- */\nconst firstNames = ['Balasubramani','Aarav','Diya','Kiran','Meera','Rohan','Ananya','Vikram','Sneha','Arjun',\n  'Kavya','Rahul','Priya','Suresh','Lakshmi','Manoj','Divya','Karthik','Pooja','Naveen',\n  'Deepa','Ashwin','Nisha','Ganesh','Ritu','Sanjay','Anitha','Vijay','Swathi','Harish'];\nconst lastNames = ['Kumar','Reddy','Sharma','Iyer','Nair','Rao','Menon','Pillai','Gupta','Verma','Das','Patil'];\n\nlet serial = 0;\nfunction nextName(i){\n  const f = firstNames[i % firstNames.length];\n  const l = lastNames[Math.floor(i / firstNames.length) % lastNames.length];\n  return `${f} ${l}`;\n}\nfunction makePassword(name, roleCode){\n  serial++;\n  const base = name.replace(/[^A-Za-z]/g,'').slice(0,4);\n  const cap = base.charAt(0).toUpperCase() + base.slice(1).toLowerCase();\n  return `${cap}@${roleCode}${pad(serial,3)}`;\n}\n\n/* ---------- Seed: students / staff / housekeeping / management ---------- */\nlet students = [];\nlet nameIdx = 0;\nfor(let c=1;c\u003c=12;c++){\n  for(const sec of ['A','B','C']){\n    for(let roll=1;roll\u003c=30;roll++){\n      const name = nextName(nameIdx++);\n      const id = `STU${pad(c)}${sec}${pad(roll)}`;\n      students.push({id, name, cls:c, section:sec, roll, password: makePassword(name,'STU')});\n    }\n  }\n}\n\nconst teachSubjects = ['Mathematics','English','Science','Social Studies','Physical Education','Computer Science','Hindi','Art'];\nlet staff = [];\nfor(let i=0;i\u003c24;i++){\n  const name = nextName(nameIdx++);\n  const id = `STF${pad(i+1,3)}`;\n  staff.push({id, name, role: teachSubjects[i % teachSubjects.length] + ' Teacher', password: makePassword(name,'STF')});\n}\n\nconst duties = ['Housekeeping \u2014 Block A','Housekeeping \u2014 Block B','Maintenance \u2014 Electrical','Maintenance \u2014 Plumbing','Groundskeeping'];\nlet housekeeping = [];\nfor(let i=0;i\u003c5;i++){\n  const name = nextName(nameIdx++);\n  const id = `HSK${pad(i+1,3)}`;\n  housekeeping.push({id, name, role: duties[i % duties.length], password: makePassword(name,'HSK')});\n}\n\nlet management = [\n  {id:'MGT001', name:'Balasubramani Kumar', role:'Principal', password:'Bala@BK001'},\n  {id:'MGT002', name:'Radhika Menon', role:'Vice Principal', password: makePassword('Radhika Menon','MGT')},\n  {id:'MGT003', name:'Suresh Iyer', role:'Admin Officer', password: makePassword('Suresh Iyer','MGT')},\n];\n\n// School structure: which sections exist per class, and class-teacher assignments\nlet sectionsByClass = {};\nfor(let c=1;c\u003c=12;c++) sectionsByClass[c] = ['A','B','C'];\nlet classTeachers = {}; // { \"7C\": staffId }\n\n/* ---------- Part 3/4 shared academic data ---------- */\nconst academicSubjects = ['Mathematics','English','Science','Social Studies','Hindi','Computer Science'];\nconst periodTimes = ['9:00\u20139:45','9:45\u201310:30','10:45\u201311:30','11:30\u201312:15','1:00\u20131:45','1:45\u20132:30'];\nconst weekDays = ['Mon','Tue','Wed','Thu','Fri','Sat'];\n\n// Holidays (global list)\nlet holidays = [\n  {date:'2026-09-05', name:\"Teachers' Day\"},\n  {date:'2026-10-02', name:'Gandhi Jayanti'},\n  {date:'2026-10-20', name:'Dussehra'},\n  {date:'2026-11-08', name:'Diwali'},\n  {date:'2026-12-25', name:'Christmas'},\n  {date:'2027-01-01', name:'New Year'},\n  {date:'2027-01-14', name:'Makar Sankranti / Pongal'},\n];\n\n// Daily timetable: { \"7C\": [{day,period,time,subject}] }\nlet dailyTimetable = {};\nfor(let c=1;c\u003c=12;c++){\n  for(const sec of ['A','B','C']){\n    const key = classSecKey(c,sec);\n    const rows = [];\n    weekDays.forEach((day, dIdx) => {\n      periodTimes.forEach((time, pIdx) => {\n        rows.push({day, period: pIdx+1, time, subject: academicSubjects[(pIdx+dIdx) % academicSubjects.length]});\n      });\n    });\n    dailyTimetable[key] = rows;\n  }\n}\n\n// Exam timetable: { \"7\": [{exam,subject,date,time}] }\nlet examTimetable = {};\nfor(let c=1;c\u003c=12;c++){\n  const rows = [];\n  academicSubjects.forEach((subj, i) => {\n    const day = 10 + i;\n    rows.push({exam:'Term 1 Exam', subject: subj, date:`2026-09-${pad(day)}`, time:'10:00 AM \u2013 12:00 PM'});\n  });\n  examTimetable[String(c)] = rows;\n}\n\n// Syllabus: { \"7C\": { \"Mathematics\": [{topic,status}] } }\nlet syllabus = {};\nfor(let c=1;c\u003c=12;c++){\n  for(const sec of ['A','B','C']){\n    const key = classSecKey(c,sec);\n    syllabus[key] = {};\n    academicSubjects.forEach(subj => {\n      syllabus[key][subj] = [1,2,3,4,5].map(n => ({\n        topic:`Chapter ${n}`,\n        status: n\u003c=3 ? 'Completed' : 'Pending'\n      }));\n    });\n  }\n}\n\n// Attendance: { studentId: { date: 'present'|'absent' } } \u2014 seeded for the last 14 days (not incl. today)\nlet attendance = {};\nstudents.forEach(s => {\n  const rec = {};\n  for(let i=1;i\u003c=14;i++){\n    const d = new Date(); d.setDate(d.getDate()-i);\n    const key = d.toISOString().slice(0,10);\n    rec[key] = Math.random() \u003c 0.9 ? 'present' : 'absent';\n  }\n  attendance[s.id] = rec;\n});\n\n// Marks: { \"7C\": { \"Term 1 Exam\": { studentId: { subject: marks } } } }\nlet marksData = {};\nstudents.forEach(s => {\n  const key = classSecKey(s.cls, s.section);\n  if(!marksData[key]) marksData[key] = {};\n  if(!marksData[key]['Term 1 Exam']) marksData[key]['Term 1 Exam'] = {};\n  const subjMarks = {};\n  academicSubjects.forEach(subj => { subjMarks[subj] = 40 + Math.floor(Math.random()*61); });\n  marksData[key]['Term 1 Exam'][s.id] = subjMarks;\n});\n\n// Maintenance issues / tasks: { id, location, title, desc, status, assignedTo, reportedBy, materials:[{name,qty}], createdAt }\nlet issues = [];\nlet issueSerial = 0;\nfunction newIssueId(){ issueSerial++; return `ISS${pad(issueSerial,3)}`; }\n\n// Leave requests: student -> staff/management approval workflow\nlet leaveRequests = [];\nlet leaveSerial = 0;\nfunction newLeaveId(){ leaveSerial++; return `LV${pad(leaveSerial,3)}`; }\n\n// seed: one completed example (the fan story) + one open unassigned issue\nissues.push({\n  id:newIssueId(), location:'Classroom 5A', title:'Ceiling fan not working',\n  desc:'Fan makes noise then stops.', status:'Completed',\n  assignedTo: housekeeping[0].id, reportedBy: housekeeping[0].id,\n  materials:[{name:'Fan capacitor', qty:1}], createdAt:'2026-08-10'\n});\nissues.push({\n  id:newIssueId(), location:'Staff Room', title:'Leaking tap',\n  desc:'Water dripping continuously from the sink tap.', status:'Open',\n  assignedTo:null, reportedBy: housekeeping[1].id,\n  materials:[], createdAt:'2026-08-19'\n});\nissues.push({\n  id:newIssueId(), location:'Classroom 9B', title:'Broken window latch',\n  desc:'', status:'In Progress',\n  assignedTo: housekeeping[2].id, reportedBy: housekeeping[2].id,\n  materials:[{name:'Window latch', qty:2}], createdAt:'2026-08-17'\n});\n\nfunction attendancePercent(studentId){\n  const rec = attendance[studentId] || {};\n  const days = Object.keys(rec);\n  if(!days.length) return {pct:0, present:0, total:0};\n  const present = days.filter(d => rec[d]==='present').length;\n  return {pct: Math.round(present/days.length*100), present, total: days.length};\n}\n\nfunction examListFor(classSec){\n  const key = classSec;\n  if(!marksData[key]) return [];\n  return Object.keys(marksData[key]).filter(exam => Object.keys(marksData[key][exam]).length > 0);\n}\n\nfunction computeToppers(cls, section, exam){\n  const key = classSecKey(cls, section);\n  const examMarks = (marksData[key] && marksData[key][exam]) || {};\n  const rows = Object.keys(examMarks).map(studentId => {\n    const st = students.find(s=>s.id===studentId);\n    const subjMarks = examMarks[studentId];\n    const subjCount = Object.keys(subjMarks).length;\n    const total = Object.values(subjMarks).reduce((a,b)=>a+b,0);\n    return {studentId, name: st ? st.name : studentId, total, max: subjCount*100};\n  });\n  rows.sort((a,b)=>b.total-a.total);\n  return rows;\n}\n\nfunction allExamNames(){\n  const names = new Set();\n  Object.keys(marksData).forEach(key=>{\n    Object.keys(marksData[key]).forEach(exam=>{\n      if(Object.keys(marksData[key][exam]).length > 0) names.add(exam);\n    });\n  });\n  return [...names];\n}\n\nfunction computeSchoolToppers(exam){\n  const rows = [];\n  Object.keys(marksData).forEach(key=>{\n    const examMarks = marksData[key][exam];\n    if(!examMarks) return;\n    Object.keys(examMarks).forEach(studentId=>{\n      const st = students.find(s=>s.id===studentId);\n      if(!st) return;\n      const subjMarks = examMarks[studentId];\n      const subjCount = Object.keys(subjMarks).length;\n      const total = Object.values(subjMarks).reduce((a,b)=>a+b,0);\n      rows.push({studentId, name: st.name, cls: st.cls, section: st.section, total, max: subjCount*100});\n    });\n  });\n  rows.sort((a,b)=>b.total-a.total);\n  return rows;\n}\n\nfunction renderSchoolTopperCard(containerId, exam){\n  const el = $(`#${containerId}`);\n  if(!el) return;\n  if(!exam){ el.innerHTML = '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No marks recorded yet.\u003c/p>'; return; }\n  const rows = computeSchoolToppers(exam);\n  if(!rows.length){ el.innerHTML = '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No marks recorded for this exam yet.\u003c/p>'; return; }\n  const top = rows[0];\n  el.innerHTML = `\n    \u003cdiv class=\"school-topper-card\">\n      \u003cdiv class=\"trophy\">\ud83c\udfc6\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"st-name\">${top.name}\u003c/div>\n        \u003cdiv class=\"st-meta\">Class ${top.cls} - ${top.section} \u00b7 ${top.total} / ${top.max} marks \u00b7 ${exam}\u003c/div>\n      \u003c/div>\n    \u003c/div>`;\n}\n\n/* ---------- Login ---------- */\nlet selectedRole = 'student';\nlet currentUser = null, currentRole = null;\n\n$$('.role-opt').forEach(o=>o.addEventListener('click', ()=>{\n  $$('.role-opt').forEach(x=>x.classList.remove('active'));\n  o.classList.add('active');\n  selectedRole = o.dataset.role;\n}));\n\nfunction findUser(name, pass, role){\n  const pool = role==='student'?students : role==='staff'?staff : role==='housekeeping'?housekeeping : management;\n  return pool.find(u => u.name.toLowerCase()===name.trim().toLowerCase() && u.password===pass);\n}\n\nfunction renderDemoList(){\n  const rows = [\n    ['Student', students[210]], // a mid-list student so class/section data looks populated\n    ['Staff', staff[0]],\n    ['Housekeeping', housekeeping[0]],\n    ['Management', management[0]],\n  ];\n  $('#demo-list').innerHTML = rows.map(([label,u])=>`\n    \u003cdiv class=\"demo-row\">\u003cb>${label}\u003c/b>\u003cspan>${u.name} / ${u.password}\u003c/span>\u003c/div>\n  `).join('');\n}\n\n$('#login-btn').addEventListener('click', ()=>{\n  const name = $('#li-name').value;\n  const pass = $('#li-pass').value;\n  const user = findUser(name, pass, selectedRole);\n  if(!user){\n    $('#login-err').style.display = 'block';\n    return;\n  }\n  $('#login-err').style.display = 'none';\n  currentUser = user; currentRole = selectedRole;\n  enterApp();\n});\n\n$('#logout-btn').addEventListener('click', ()=>{\n  currentUser = null; currentRole = null;\n  $('#app-screen').style.display = 'none';\n  $('#login-screen').style.display = 'flex';\n  $('#li-name').value=''; $('#li-pass').value='';\n});\n\nfunction showToast(msg){\n  const t=$('#toast'); t.textContent=msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');\n  scheduleSave();\n}\n\nfunction enterApp(){\n  $('#login-screen').style.display = 'none';\n  $('#app-screen').style.display = 'block';\n  $('#who-name').textContent = currentUser.name;\n  $('#who-role').textContent = currentRole;\n\n  $('#view-management').classList.toggle('hidden', currentRole!=='management');\n  $('#view-housekeeping').classList.toggle('hidden', currentRole!=='housekeeping');\n  $('#view-student').classList.toggle('hidden', currentRole!=='student');\n  $('#view-staff').classList.toggle('hidden', currentRole!=='staff');\n\n  if(currentRole==='management'){\n    renderOverview(); populateClassSelect(); renderStudentsTable(); renderStaffTable(); renderHskTable();\n    populateAssignSelects(); renderAssignTable(); renderMgtClasses(); populateMgtOpsSelects();\n    renderMgtMyAttendance();\n    checkTermCompletion();\n  } else if(currentRole==='housekeeping'){\n    initHousekeepingModule();\n  } else if(currentRole==='student'){\n    initStudentModule();\n  } else if(currentRole==='staff'){\n    initStaffModule();\n  }\n}\n\n/* ================= HOUSEKEEPING / MAINTENANCE MODULE ================= */\nfunction initHousekeepingModule(){\n  $$('.tab-btn[data-hk-tab]').forEach(b=>b.classList.remove('active'));\n  $$('.tab-btn[data-hk-tab]')[0].classList.add('active');\n  ['attendance','report','tasks','profile'].forEach((t,i)=>{\n    $(`#hk-${t}`).classList.toggle('hidden', i!==0);\n  });\n  renderHkAttendance();\n  renderHkTasks();\n  renderHkProfile();\n}\n$$('.tab-btn[data-hk-tab]').forEach(b=>b.addEventListener('click', ()=>{\n  $$('.tab-btn[data-hk-tab]').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  ['attendance','report','tasks','profile'].forEach(t=>{\n    $(`#hk-${t}`).classList.toggle('hidden', t!==b.dataset.hkTab);\n  });\n  if(b.dataset.hkTab==='tasks') renderHkTasks();\n}));\n\nfunction renderHkProfile(){\n  const u = currentUser;\n  $('#hk-initial').textContent = u.name.charAt(0).toUpperCase();\n  $('#hk-name').textContent = u.name;\n  $('#hk-id').textContent = u.id;\n  $('#hk-duty').textContent = u.role;\n}\n\nfunction renderHkAttendance(){\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  const {pct, present, total} = attendancePercent(currentUser.id);\n  $('#hk-att-pct').textContent = total ? pct + '%' : '\u2014';\n  $('#hk-att-present').textContent = present;\n  $('#hk-att-total').textContent = total;\n  renderCalendar('hk-att-calendar', { markerFn: d => attendance[currentUser.id][d] || null, selectable:false });\n  const marked = !!attendance[currentUser.id][todayStr()];\n  $('#hk-mark-btn').disabled = marked;\n  $('#hk-mark-btn').textContent = marked ? 'Already Marked Today' : 'Mark Today Present';\n}\n$('#hk-mark-btn').addEventListener('click', ()=>{\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  attendance[currentUser.id][todayStr()] = 'present';\n  showToast('Attendance marked for today');\n  renderHkAttendance();\n});\n\n$('#hk-rep-submit').addEventListener('click', ()=>{\n  const location = $('#hk-rep-location').value.trim();\n  const title = $('#hk-rep-title').value.trim();\n  const desc = $('#hk-rep-desc').value.trim();\n  if(!location || !title){ showToast('Please fill in location and issue'); return; }\n  issues.unshift({\n    id:newIssueId(), location, title, desc, status:'Open',\n    assignedTo:null, reportedBy: currentUser.id, materials:[], createdAt: todayStr()\n  });\n  $('#hk-rep-location').value=''; $('#hk-rep-title').value=''; $('#hk-rep-desc').value='';\n  showToast(`Reported: ${title} \u2014 ${location}`);\n  renderHkTasks();\n});\n\nfunction statusClass(s){ return s==='Completed'?'completed':s==='In Progress'?'inprogress':'open'; }\n\nfunction taskCardHtml(t, showClaim){\n  return `\n  \u003cdiv class=\"task-card\" data-issue=\"${t.id}\">\n    \u003cdiv class=\"task-head\">\n      \u003cdiv>\u003cdiv class=\"task-loc\">${t.location}\u003c/div>\u003cdiv class=\"task-title\">${t.title}${t.desc? ' \u2014 '+t.desc:''}\u003c/div>\u003c/div>\n      \u003cspan class=\"badge ${statusClass(t.status)}\">${t.status}\u003c/span>\n    \u003c/div>\n    ${showClaim ? `\u003cbutton class=\"status-btn\" data-claim=\"${t.id}\">Claim this task\u003c/button>` : `\n    \u003cdiv class=\"status-btns\">\n      \u003cbutton class=\"status-btn ${t.status==='Open'?'active':''}\" data-setstatus=\"${t.id}\" data-val=\"Open\">Open\u003c/button>\n      \u003cbutton class=\"status-btn ${t.status==='In Progress'?'active':''}\" data-setstatus=\"${t.id}\" data-val=\"In Progress\">In Progress\u003c/button>\n      \u003cbutton class=\"status-btn ${t.status==='Completed'?'active':''}\" data-setstatus=\"${t.id}\" data-val=\"Completed\">Completed\u003c/button>\n    \u003c/div>\n    \u003cul class=\"mat-list\">\n      ${t.materials.map(m=>`\u003cli>${m.name} \u00d7 ${m.qty}\u003c/li>`).join('') || '\u003cli>No materials added yet\u003c/li>'}\n    \u003c/ul>\n    \u003cdiv class=\"mat-add-row\">\n      \u003cinput type=\"text\" placeholder=\"Material / item name\" data-mat-name=\"${t.id}\">\n      \u003cinput type=\"number\" min=\"1\" value=\"1\" style=\"width:60px;\" data-mat-qty=\"${t.id}\">\n      \u003cbutton data-mat-add=\"${t.id}\">+ Add\u003c/button>\n    \u003c/div>`}\n  \u003c/div>`;\n}\n\nfunction renderHkTasks(){\n  const mine = issues.filter(t=>t.assignedTo===currentUser.id);\n  const open = issues.filter(t=>!t.assignedTo);\n  $('#hk-mytasks-list').innerHTML = mine.length\n    ? mine.map(t=>taskCardHtml(t,false)).join('')\n    : '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No tasks assigned to you yet.\u003c/p>';\n  $('#hk-open-list').innerHTML = open.length\n    ? open.map(t=>taskCardHtml(t,true)).join('')\n    : '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No unassigned issues right now.\u003c/p>';\n\n  $$('[data-claim]').forEach(b=>b.addEventListener('click', ()=>{\n    const t = issues.find(x=>x.id===b.dataset.claim);\n    t.assignedTo = currentUser.id;\n    t.status = 'In Progress';\n    showToast(`Task claimed: ${t.title}`);\n    renderHkTasks();\n  }));\n  $$('[data-setstatus]').forEach(b=>b.addEventListener('click', ()=>{\n    const t = issues.find(x=>x.id===b.dataset.setstatus);\n    t.status = b.dataset.val;\n    showToast(`Status updated: ${t.status}`);\n    renderHkTasks();\n  }));\n  $$('[data-mat-add]').forEach(b=>b.addEventListener('click', ()=>{\n    const id = b.dataset.matAdd;\n    const t = issues.find(x=>x.id===id);\n    const nameInp = document.querySelector(`[data-mat-name=\"${id}\"]`);\n    const qtyInp = document.querySelector(`[data-mat-qty=\"${id}\"]`);\n    const name = nameInp.value.trim();\n    const qty = Math.max(1, Number(qtyInp.value)||1);\n    if(!name){ showToast('Enter a material name'); return; }\n    t.materials.push({name, qty});\n    showToast(`${name} added to ${t.title}`);\n    renderHkTasks();\n  }));\n}\n\n/* ---------- Management: Overview ---------- */\nfunction renderOverview(){\n  $('#m-total-students').textContent = students.length;\n  $('#m-total-staff').textContent = staff.length;\n  $('#m-total-hsk').textContent = housekeeping.length;\n}\n$$('.tab-btn[data-tab]').forEach(b=>b.addEventListener('click', ()=>{\n  $$('.tab-btn[data-tab]').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  const allTabs = ['overview','students','staff','housekeeping','classes','myattendance','attendance','timetable','exams','holidays','syllabus','marks','toppers','reports','maintenance','leave'];\n  allTabs.forEach(t=>{\n    const el = $(`#tab-${t}`);\n    if(el) el.classList.toggle('hidden', t!==b.dataset.tab);\n  });\n  if(b.dataset.tab==='classes') renderMgtClasses();\n  if(b.dataset.tab==='myattendance') renderMgtMyAttendance();\n  if(b.dataset.tab==='attendance') renderMgtAttendance();\n  if(b.dataset.tab==='timetable') renderMgtTimetable();\n  if(b.dataset.tab==='exams') renderMgtExamTT();\n  if(b.dataset.tab==='holidays') renderMgtHolidays();\n  if(b.dataset.tab==='syllabus') renderMgtSyllabus();\n  if(b.dataset.tab==='marks') renderMgtMarks();\n  if(b.dataset.tab==='toppers') populateMgtTopperExam();\n  if(b.dataset.tab==='reports') renderMgtReports();\n  if(b.dataset.tab==='maintenance') renderMgtMaintenance();\n  if(b.dataset.tab==='leave') renderMgtLeave();\n}));\nfunction populateClassSelect(){\n  const opts = Array.from({length:12},(_,i)=>i+1).map(c=>`\u003coption value=\"${c}\">Class ${c}\u003c/option>`).join('');\n  $('#sel-class').innerHTML = opts;\n}\nfunction renderStudentsTable(){\n  const cls = Number($('#sel-class').value)||1;\n  const sec = $('#sel-section').value;\n  const rows = students.filter(s=>s.cls===cls && s.section===sec).sort((a,b)=>a.roll-b.roll);\n  $('#students-tbody').innerHTML = rows.map(s=>`\n    \u003ctr>\n      \u003ctd>${s.roll}\u003c/td>\u003ctd class=\"idcode\">${s.id}\u003c/td>\u003ctd>${s.name}\u003c/td>\u003ctd class=\"pw\">${s.password}\u003c/td>\n      \u003ctd>\u003cbutton class=\"btn-ghost btn-sm\" data-edit-student=\"${s.id}\">Edit\u003c/button> \u003cbutton class=\"btn-ghost btn-sm\" style=\"color:var(--red);\" data-del-student=\"${s.id}\">Delete\u003c/button>\u003c/td>\n    \u003c/tr>\n  `).join('') || `\u003ctr>\u003ctd colspan=\"5\" style=\"color:var(--text-dim);\">No students in this section yet.\u003c/td>\u003c/tr>`;\n  $$('[data-edit-student]').forEach(b=>b.addEventListener('click', ()=>openStudentModal(students.find(s=>s.id===b.dataset.editStudent))));\n  $$('[data-del-student]').forEach(b=>b.addEventListener('click', ()=>{\n    const s = students.find(x=>x.id===b.dataset.delStudent);\n    if(!confirm(`Delete ${s.name} (${s.id}) permanently?`)) return;\n    students = students.filter(x=>x.id!==s.id);\n    showToast(`${s.name} deleted`);\n    renderStudentsTable(); renderOverview();\n  }));\n}\n$('#sel-class').addEventListener('change', renderStudentsTable);\n$('#sel-section').addEventListener('change', renderStudentsTable);\n\n/* --- Add / Edit / reassign student --- */\nfunction openStudentModal(student){\n  $('#student-class-options') // no-op guard\n  $('#s-class').innerHTML = Array.from({length:12},(_,i)=>i+1).map(c=>`\u003coption value=\"${c}\">Class ${c}\u003c/option>`).join('');\n  $('#student-modal-title').textContent = student ? 'Edit Student' : 'Add Student';\n  $('#s-id').value = student ? student.id : '';\n  $('#s-name').value = student ? student.name : '';\n  $('#s-class').value = student ? student.cls : 1;\n  $('#s-section').value = student ? student.section : 'A';\n  $('#s-roll').value = student ? student.roll : '';\n  $('#student-modal-bg').classList.add('open');\n  $('#s-name').focus();\n}\nfunction closeStudentModal(){ $('#student-modal-bg').classList.remove('open'); }\n$('#add-student-btn').addEventListener('click', ()=>openStudentModal(null));\n$('#student-modal-cancel').addEventListener('click', closeStudentModal);\n$('#student-modal-bg').addEventListener('click', e=>{ if(e.target.id==='student-modal-bg') closeStudentModal(); });\n\nfunction migrateStudentRecords(oldId, newId, oldKey, newKey){\n  if(oldId!==newId && attendance[oldId]){\n    attendance[newId] = attendance[oldId];\n    delete attendance[oldId];\n  }\n  if(oldKey!==newKey){\n    Object.keys(marksData).forEach(k=>{\n      if(k!==oldKey) return;\n      Object.keys(marksData[oldKey]).forEach(exam=>{\n        const rec = marksData[oldKey][exam][oldId];\n        if(rec){\n          if(!marksData[newKey]) marksData[newKey] = {};\n          if(!marksData[newKey][exam]) marksData[newKey][exam] = {};\n          marksData[newKey][exam][newId] = rec;\n          delete marksData[oldKey][exam][oldId];\n        }\n      });\n    });\n  } else if(oldId!==newId && marksData[oldKey]){\n    Object.keys(marksData[oldKey]).forEach(exam=>{\n      const rec = marksData[oldKey][exam][oldId];\n      if(rec){ marksData[oldKey][exam][newId] = rec; delete marksData[oldKey][exam][oldId]; }\n    });\n  }\n}\n\n$('#student-modal-save').addEventListener('click', ()=>{\n  const id = $('#s-id').value;\n  const name = $('#s-name').value.trim();\n  const cls = Number($('#s-class').value)||1;\n  const section = ($('#s-section').value.trim()||'A').toUpperCase().slice(0,1);\n  const roll = Number($('#s-roll').value)||1;\n  if(!name){ showToast('Enter a student name'); return; }\n  if(!sectionsByClass[cls]) sectionsByClass[cls] = [];\n  if(!sectionsByClass[cls].includes(section)) sectionsByClass[cls].push(section);\n\n  if(id){\n    const s = students.find(x=>x.id===id);\n    const oldKey = classSecKey(s.cls, s.section);\n    const newKey = classSecKey(cls, section);\n    const newId = `STU${pad(cls)}${section}${pad(roll)}`;\n    migrateStudentRecords(s.id, newId, oldKey, newKey);\n    s.name = name; s.cls = cls; s.section = section; s.roll = roll; s.id = newId;\n    showToast(`${name} updated`);\n  } else {\n    const newId = `STU${pad(cls)}${section}${pad(roll)}`;\n    students.push({id:newId, name, cls, section, roll, password: makePassword(name,'STU')});\n    showToast(`${name} added`);\n  }\n  closeStudentModal();\n  renderStudentsTable(); renderOverview();\n});\nfunction renderStaffTable(){\n  $('#staff-tbody').innerHTML = staff.map(s=>`\n    \u003ctr>\u003ctd class=\"idcode\">${s.id}\u003c/td>\u003ctd>${s.name}\u003c/td>\u003ctd>${s.role}\u003c/td>\u003ctd class=\"pw\">${s.password}\u003c/td>\n      \u003ctd>\u003cbutton class=\"btn-ghost btn-sm\" data-edit-staff=\"${s.id}\">Edit\u003c/button> \u003cbutton class=\"btn-ghost btn-sm\" style=\"color:var(--red);\" data-del-staff=\"${s.id}\">Delete\u003c/button>\u003c/td>\n    \u003c/tr>\n  `).join('');\n  $$('[data-edit-staff]').forEach(b=>b.addEventListener('click', ()=>openAddModal('staff', staff.find(s=>s.id===b.dataset.editStaff))));\n  $$('[data-del-staff]').forEach(b=>b.addEventListener('click', ()=>{\n    const s = staff.find(x=>x.id===b.dataset.delStaff);\n    if(!confirm(`Delete ${s.name} (${s.id}) from staff?`)) return;\n    staff = staff.filter(x=>x.id!==s.id);\n    Object.keys(classTeachers).forEach(k=>{ if(classTeachers[k]===s.id) delete classTeachers[k]; });\n    showToast(`${s.name} deleted`);\n    renderStaffTable(); renderOverview(); renderAssignTable();\n  }));\n}\nfunction renderHskTable(){\n  $('#hsk-tbody').innerHTML = housekeeping.map(s=>`\n    \u003ctr>\u003ctd class=\"idcode\">${s.id}\u003c/td>\u003ctd>${s.name}\u003c/td>\u003ctd>${s.role}\u003c/td>\u003ctd class=\"pw\">${s.password}\u003c/td>\n      \u003ctd>\u003cbutton class=\"btn-ghost btn-sm\" data-edit-hsk=\"${s.id}\">Edit\u003c/button> \u003cbutton class=\"btn-ghost btn-sm\" style=\"color:var(--red);\" data-del-hsk=\"${s.id}\">Delete\u003c/button>\u003c/td>\n    \u003c/tr>\n  `).join('');\n  $$('[data-edit-hsk]').forEach(b=>b.addEventListener('click', ()=>openAddModal('housekeeping', housekeeping.find(s=>s.id===b.dataset.editHsk))));\n  $$('[data-del-hsk]').forEach(b=>b.addEventListener('click', ()=>{\n    const s = housekeeping.find(x=>x.id===b.dataset.delHsk);\n    if(!confirm(`Delete ${s.name} (${s.id}) from housekeeping?`)) return;\n    housekeeping = housekeeping.filter(x=>x.id!==s.id);\n    issues.forEach(t=>{ if(t.assignedTo===s.id) t.assignedTo=null; });\n    showToast(`${s.name} deleted`);\n    renderHskTable(); renderOverview();\n  }));\n}\nlet addTarget = null;\nfunction openAddModal(target, record){\n  addTarget = target;\n  $('#modal-title').textContent = record ? `Edit ${target==='staff'?'Staff':'Housekeeping'}` : (target==='staff' ? 'Add Staff' : 'Add Housekeeping / Maintenance');\n  $('#f-role-label').textContent = target==='staff' ? 'Subject Taught' : 'Duty';\n  $('#f-id').value = record ? record.id : '';\n  $('#f-name').value = record ? record.name : '';\n  $('#f-role').value = record ? (target==='staff' ? record.role.replace(' Teacher','') : record.role) : '';\n  $('#modal-bg').classList.add('open');\n  $('#f-name').focus();\n}\nfunction closeModal(){ $('#modal-bg').classList.remove('open'); }\n$('#add-staff-btn').addEventListener('click', ()=>openAddModal('staff'));\n$('#add-hsk-btn').addEventListener('click', ()=>openAddModal('housekeeping'));\n$('#modal-cancel').addEventListener('click', closeModal);\n$('#modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });\n$('#modal-save').addEventListener('click', ()=>{\n  const id = $('#f-id').value;\n  const name = $('#f-name').value.trim();\n  const role = $('#f-role').value.trim();\n  if(!name || !role){ showToast('Please fill in both fields'); return; }\n  if(addTarget==='staff'){\n    if(id){\n      const s = staff.find(x=>x.id===id);\n      s.name = name; s.role = role + ' Teacher';\n      showToast(`${name} updated`);\n    } else {\n      const newId = `STF${pad(staff.length+1,3)}`;\n      staff.push({id:newId, name, role: role + ' Teacher', password: makePassword(name,'STF')});\n      showToast(`${name} added`);\n    }\n    renderStaffTable();\n    renderAssignTable();\n  } else {\n    if(id){\n      const s = housekeeping.find(x=>x.id===id);\n      s.name = name; s.role = role;\n      showToast(`${name} updated`);\n    } else {\n      const newId = `HSK${pad(housekeeping.length+1,3)}`;\n      housekeeping.push({id:newId, name, role, password: makePassword(name,'HSK')});\n      showToast(`${name} added`);\n    }\n    renderHskTable();\n  }\n  renderOverview();\n  closeModal();\n});\n\n/* --- Classes & Sections --- */\nfunction renderMgtClasses(){\n  $('#cls-add-class').innerHTML = classOptions();\n  const rows = Array.from({length:12},(_,i)=>i+1).map(c=>{\n    const secs = sectionsByClass[c] || [];\n    const count = students.filter(s=>s.cls===c).length;\n    return `\u003ctr>\u003ctd>Class ${c}\u003c/td>\u003ctd>${secs.join(', ')}\u003c/td>\u003ctd>${count}\u003c/td>\u003c/tr>`;\n  }).join('');\n  $('#cls-tbody').innerHTML = rows;\n}\n$('#cls-add-btn').addEventListener('click', ()=>{\n  const cls = Number($('#cls-add-class').value)||1;\n  const sec = ($('#cls-add-section').value.trim()||'').toUpperCase().slice(0,1);\n  if(!sec){ showToast('Enter a section letter'); return; }\n  if(!sectionsByClass[cls]) sectionsByClass[cls] = [];\n  if(sectionsByClass[cls].includes(sec)){ showToast(`Section ${sec} already exists for Class ${cls}`); return; }\n  sectionsByClass[cls].push(sec);\n  $('#cls-add-section').value = '';\n  showToast(`Section ${sec} created for Class ${cls}`);\n  renderMgtClasses();\n});\n\n/* --- Assign Class Teacher --- */\nfunction populateAssignSelects(){\n  $('#assign-class').innerHTML = classOptions();\n  $('#assign-staff').innerHTML = staff.map(s=>`\u003coption value=\"${s.id}\">${s.name} (${s.role})\u003c/option>`).join('');\n}\nfunction renderAssignTable(){\n  const rows = [];\n  for(let c=1;c\u003c=12;c++){\n    (sectionsByClass[c]||[]).forEach(sec=>{\n      const key = classSecKey(c, sec);\n      const teacherId = classTeachers[key];\n      const teacher = teacherId ? staff.find(s=>s.id===teacherId) : null;\n      rows.push(`\u003ctr>\u003ctd>${c} - ${sec}\u003c/td>\u003ctd>${teacher ? teacher.name : '\u003cspan style=\"color:var(--text-dim);\">Unassigned\u003c/span>'}\u003c/td>\u003c/tr>`);\n    });\n  }\n  $('#assign-tbody').innerHTML = rows.join('');\n}\n$('#assign-teacher-btn').addEventListener('click', ()=>{\n  const cls = Number($('#assign-class').value)||1;\n  const sec = $('#assign-section').value;\n  const staffId = $('#assign-staff').value;\n  if(!staffId){ showToast('Add a staff member first'); return; }\n  classTeachers[classSecKey(cls, sec)] = staffId;\n  const t = staff.find(s=>s.id===staffId);\n  showToast(`${t.name} assigned as class teacher for ${cls} - ${sec}`);\n  renderAssignTable();\n});\n\n/* --- Reports --- */\nfunction renderMgtReports(){\n  $('#rep-tbody').innerHTML = Array.from({length:12},(_,i)=>i+1).map(c=>{\n    const clsStudents = students.filter(s=>s.cls===c);\n    const count = clsStudents.length;\n    const attAvg = count ? Math.round(clsStudents.reduce((sum,s)=>sum+attendancePercent(s.id).pct,0)/count) : 0;\n    let marksSum = 0, marksN = 0;\n    clsStudents.forEach(s=>{\n      const key = classSecKey(s.cls, s.section);\n      const rec = marksData[key] && marksData[key]['Term 1 Exam'] && marksData[key]['Term 1 Exam'][s.id];\n      if(rec){ marksSum += Object.values(rec).reduce((a,b)=>a+b,0)/Object.values(rec).length; marksN++; }\n    });\n    const marksAvg = marksN ? Math.round(marksSum/marksN) : 0;\n    return `\u003ctr>\u003ctd>Class ${c}\u003c/td>\u003ctd>${count}\u003c/td>\u003ctd>${attAvg}%\u003c/td>\u003ctd>${marksAvg}%\u003c/td>\u003c/tr>`;\n  }).join('');\n  $('#rep-open').textContent = issues.filter(t=>t.status==='Open').length;\n  $('#rep-inprogress').textContent = issues.filter(t=>t.status==='In Progress').length;\n  $('#rep-completed').textContent = issues.filter(t=>t.status==='Completed').length;\n}\n\n/* --- Maintenance (full access) --- */\nfunction mgtTaskCardHtml(t){\n  return `\n  \u003cdiv class=\"task-card\" data-issue=\"${t.id}\">\n    \u003cdiv class=\"task-head\">\n      \u003cdiv>\u003cdiv class=\"task-loc\">${t.location}\u003c/div>\u003cdiv class=\"task-title\">${t.title}${t.desc? ' \u2014 '+t.desc:''}\u003c/div>\u003c/div>\n      \u003cspan class=\"badge ${statusClass(t.status)}\">${t.status}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"row-flex\" style=\"margin-bottom:6px;\">\n      \u003cselect data-reassign=\"${t.id}\">\n        \u003coption value=\"\">Unassigned\u003c/option>\n        ${housekeeping.map(h=>`\u003coption value=\"${h.id}\" ${t.assignedTo===h.id?'selected':''}>${h.name}\u003c/option>`).join('')}\n      \u003c/select>\n      \u003cbutton class=\"btn-ghost btn-sm\" style=\"color:var(--red);\" data-del-issue=\"${t.id}\">Delete\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"status-btns\">\n      \u003cbutton class=\"status-btn ${t.status==='Open'?'active':''}\" data-setstatus=\"${t.id}\" data-val=\"Open\">Open\u003c/button>\n      \u003cbutton class=\"status-btn ${t.status==='In Progress'?'active':''}\" data-setstatus=\"${t.id}\" data-val=\"In Progress\">In Progress\u003c/button>\n      \u003cbutton class=\"status-btn ${t.status==='Completed'?'active':''}\" data-setstatus=\"${t.id}\" data-val=\"Completed\">Completed\u003c/button>\n    \u003c/div>\n    \u003cul class=\"mat-list\">${t.materials.map(m=>`\u003cli>${m.name} \u00d7 ${m.qty}\u003c/li>`).join('') || '\u003cli>No materials added yet\u003c/li>'}\u003c/ul>\n    \u003cdiv class=\"mat-add-row\">\n      \u003cinput type=\"text\" placeholder=\"Material / item name\" data-mat-name=\"${t.id}\">\n      \u003cinput type=\"number\" min=\"1\" value=\"1\" style=\"width:60px;\" data-mat-qty=\"${t.id}\">\n      \u003cbutton data-mat-add=\"${t.id}\">+ Add\u003c/button>\n    \u003c/div>\n  \u003c/div>`;\n}\nfunction renderMgtMaintenance(){\n  $('#mgt-rep-assign').innerHTML = '\u003coption value=\"\">Unassigned \u2014 anyone can claim\u003c/option>' + housekeeping.map(h=>`\u003coption value=\"${h.id}\">${h.name}\u003c/option>`).join('');\n  $('#mgt-issues-list').innerHTML = issues.length ? issues.map(mgtTaskCardHtml).join('') : '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No issues reported yet.\u003c/p>';\n  $$('[data-reassign]').forEach(sel=>sel.addEventListener('change', ()=>{\n    const t = issues.find(x=>x.id===sel.dataset.reassign);\n    t.assignedTo = sel.value || null;\n    if(sel.value && t.status==='Open') t.status = 'In Progress';\n    showToast('Task reassigned');\n    renderMgtMaintenance();\n  }));\n  $$('[data-del-issue]').forEach(b=>b.addEventListener('click', ()=>{\n    if(!confirm('Delete this maintenance issue?')) return;\n    issues = issues.filter(x=>x.id!==b.dataset.delIssue);\n    showToast('Issue deleted');\n    renderMgtMaintenance(); renderMgtMaterials();\n  }));\n  $$('[data-setstatus]').forEach(b=>b.addEventListener('click', ()=>{\n    const t = issues.find(x=>x.id===b.dataset.setstatus);\n    t.status = b.dataset.val;\n    showToast(`Status updated: ${t.status}`);\n    renderMgtMaintenance();\n  }));\n  $$('[data-mat-add]').forEach(b=>b.addEventListener('click', ()=>{\n    const id = b.dataset.matAdd;\n    const t = issues.find(x=>x.id===id);\n    const nameInp = document.querySelector(`[data-mat-name=\"${id}\"]`);\n    const qtyInp = document.querySelector(`[data-mat-qty=\"${id}\"]`);\n    const name = nameInp.value.trim();\n    const qty = Math.max(1, Number(qtyInp.value)||1);\n    if(!name){ showToast('Enter a material name'); return; }\n    t.materials.push({name, qty});\n    showToast(`${name} added to ${t.title}`);\n    renderMgtMaintenance(); renderMgtMaterials();\n  }));\n  renderMgtMaterials();\n}\n$('#mgt-rep-submit').addEventListener('click', ()=>{\n  const location = $('#mgt-rep-location').value.trim();\n  const title = $('#mgt-rep-title').value.trim();\n  const desc = $('#mgt-rep-desc').value.trim();\n  const assignedTo = $('#mgt-rep-assign').value || null;\n  if(!location || !title){ showToast('Please fill in location and issue'); return; }\n  issues.unshift({\n    id:newIssueId(), location, title, desc, status: assignedTo ? 'In Progress' : 'Open',\n    assignedTo, reportedBy: currentUser.id, materials:[], createdAt: todayStr()\n  });\n  $('#mgt-rep-location').value=''; $('#mgt-rep-title').value=''; $('#mgt-rep-desc').value=''; $('#mgt-rep-assign').value='';\n  showToast(`Reported: ${title} \u2014 ${location}`);\n  renderMgtMaintenance();\n});\nfunction renderMgtMaterials(){\n  const totals = {};\n  issues.forEach(t=>t.materials.forEach(m=>{\n    if(!totals[m.name]) totals[m.name] = {qty:0, used:new Set()};\n    totals[m.name].qty += m.qty;\n    totals[m.name].used.add(`${t.location} (${t.title})`);\n  }));\n  const names = Object.keys(totals);\n  $('#mgt-mat-tbody').innerHTML = names.length ? names.map(n=>`\n    \u003ctr>\u003ctd>${n}\u003c/td>\u003ctd>${totals[n].qty}\u003c/td>\u003ctd style=\"color:var(--text-dim);font-size:12px;\">${[...totals[n].used].join(', ')}\u003c/td>\u003c/tr>\n  `).join('') : '\u003ctr>\u003ctd colspan=\"3\" style=\"color:var(--text-dim);\">No materials logged yet.\u003c/td>\u003c/tr>';\n}\n\n/* ================= STUDENT MODULE ================= */\nfunction initStudentModule(){\n  $$('.tab-btn[data-stu-tab]').forEach(b=>b.classList.remove('active'));\n  $$('.tab-btn[data-stu-tab]')[0].classList.add('active');\n  ['attendance','timetable','examtt','holidays','syllabus','marks','topper','profile','leave'].forEach((t,i)=>{\n    $(`#stu-${t}`).classList.toggle('hidden', i!==0);\n  });\n  renderStuAttendance();\n  renderStuTimetable();\n  renderStuExamTT();\n  renderStuHolidays();\n  renderStuSyllabus();\n  populateStuMarksExamSelect();\n  populateStuTopperExamSelect();\n  renderStuProfile();\n  renderStuLeave();\n  checkExamReminders();\n}\n$$('.tab-btn[data-stu-tab]').forEach(b=>b.addEventListener('click', ()=>{\n  $$('.tab-btn[data-stu-tab]').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  ['attendance','timetable','examtt','holidays','syllabus','marks','topper','profile','leave'].forEach(t=>{\n    $(`#stu-${t}`).classList.toggle('hidden', t!==b.dataset.stuTab);\n  });\n  if(b.dataset.stuTab==='marks') populateStuMarksExamSelect();\n  if(b.dataset.stuTab==='topper') populateStuTopperExamSelect();\n}));\n\nfunction renderStuAttendance(){\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  const {pct, present, total} = attendancePercent(currentUser.id);\n  $('#stu-att-pct').textContent = total ? pct + '%' : '\u2014';\n  $('#stu-att-present').textContent = present;\n  $('#stu-att-total').textContent = total;\n  renderCalendar('stu-att-calendar', { markerFn: d => attendance[currentUser.id][d] || null, selectable:false });\n  const marked = !!attendance[currentUser.id][todayStr()];\n  $('#stu-mark-btn').disabled = marked;\n  $('#stu-mark-btn').textContent = marked ? 'Already Marked Today' : 'Mark Today Present';\n}\n$('#stu-mark-btn').addEventListener('click', ()=>{\n  attendance[currentUser.id][todayStr()] = 'present';\n  showToast('Attendance marked for today');\n  renderStuAttendance();\n});\n\nfunction renderStuTimetable(){\n  const key = classSecKey(currentUser.cls, currentUser.section);\n  $('#stu-tt-classsec').textContent = `Class ${currentUser.cls} - ${currentUser.section}`;\n  renderDayWiseTimetable('stu-tt-readonly', key);\n}\nfunction renderStuExamTT(){\n  $('#stu-exam-class').textContent = currentUser.cls;\n  const rows = examTimetable[String(currentUser.cls)] || [];\n  $('#stu-exam-tbody').innerHTML = rows.map(r=>`\n    \u003ctr>\u003ctd>${r.exam}\u003c/td>\u003ctd>${r.subject}\u003c/td>\u003ctd>${r.date}\u003c/td>\u003ctd>${r.time}\u003c/td>\u003c/tr>\n  `).join('');\n}\nfunction renderStuHolidays(){\n  const rows = [...holidays].sort((a,b)=>a.date.localeCompare(b.date));\n  $('#stu-hol-tbody').innerHTML = rows.map(h=>`\u003ctr>\u003ctd>${h.date}\u003c/td>\u003ctd>${h.name}\u003c/td>\u003c/tr>`).join('');\n}\nfunction renderStuSyllabus(){\n  const key = classSecKey(currentUser.cls, currentUser.section);\n  $('#stu-syl-classsec').textContent = `Class ${currentUser.cls} - ${currentUser.section}`;\n  const data = syllabus[key] || {};\n  $('#stu-syl-body').innerHTML = Object.keys(data).map(subj=>{\n    const topics = data[subj];\n    const done = topics.filter(t=>t.status==='Completed').length;\n    const pct = Math.round(done/topics.length*100);\n    return `\n    \u003cdiv class=\"subj-block\">\n      \u003cdiv class=\"subj-head\">\u003cspan>${subj}\u003c/span>\u003cspan>${pct}%\u003c/span>\u003c/div>\n      \u003cdiv class=\"progress-bar\">\u003cdiv class=\"progress-fill\" style=\"width:${pct}%;\">\u003c/div>\u003c/div>\n      ${topics.map(t=>`\u003cdiv class=\"topic-row\">\u003cspan>${t.topic}\u003c/span>\u003cspan class=\"badge ${t.status.toLowerCase()}\">${t.status}\u003c/span>\u003c/div>`).join('')}\n    \u003c/div>`;\n  }).join('');\n}\nfunction populateStuMarksExamSelect(){\n  const key = classSecKey(currentUser.cls, currentUser.section);\n  const exams = examListFor(key);\n  $('#stu-marks-exam').innerHTML = exams.map(e=>`\u003coption value=\"${e}\">${e}\u003c/option>`).join('');\n  renderStuMarks();\n}\n$('#stu-marks-exam').addEventListener('change', renderStuMarks);\nfunction renderStuMarks(){\n  const key = classSecKey(currentUser.cls, currentUser.section);\n  const exam = $('#stu-marks-exam').value;\n  const subjMarks = (marksData[key] && marksData[key][exam] && marksData[key][exam][currentUser.id]) || {};\n  $('#stu-marks-tbody').innerHTML = Object.keys(subjMarks).map(subj=>{\n    const m = subjMarks[subj];\n    return `\u003ctr>\u003ctd>${subj}\u003c/td>\u003ctd>${m}\u003c/td>\u003ctd>100\u003c/td>\u003ctd>${m}%\u003c/td>\u003c/tr>`;\n  }).join('');\n}\nfunction populateStuTopperExamSelect(){\n  const key = classSecKey(currentUser.cls, currentUser.section);\n  $('#stu-topper-classsec').textContent = `Class ${currentUser.cls} - ${currentUser.section}`;\n  const exams = examListFor(key);\n  $('#stu-topper-exam').innerHTML = exams.map(e=>`\u003coption value=\"${e}\">${e}\u003c/option>`).join('');\n  renderStuTopper();\n}\n$('#stu-topper-exam').addEventListener('change', renderStuTopper);\nfunction renderStuTopper(){\n  const exam = $('#stu-topper-exam').value;\n  const rows = computeToppers(currentUser.cls, currentUser.section, exam).slice(0,5);\n  $('#stu-topper-list').innerHTML = rows.map((r,i)=>`\n    \u003cdiv class=\"topper-item ${r.studentId===currentUser.id?'me':''}\">\n      \u003cdiv class=\"topper-rank\">${i+1}\u003c/div>\n      \u003cdiv style=\"flex:1;\">${r.name}${r.studentId===currentUser.id?' (You)':''}\u003c/div>\n      \u003cdiv class=\"pw\">${r.total} / ${r.max}\u003c/div>\n    \u003c/div>\n  `).join('');\n  renderSchoolTopperCard('stu-schooltopper-card', exam);\n}\nfunction renderStuProfile(){\n  const u = currentUser;\n  $('#stu-pf-initial').textContent = u.name.charAt(0).toUpperCase();\n  $('#stu-pf-name').textContent = u.name;\n  $('#stu-pf-id').textContent = u.id;\n  $('#stu-pf-classsec').textContent = `${u.cls} - ${u.section}`;\n  $('#stu-pf-roll').textContent = u.roll;\n}\n\n/* ================= STAFF MODULE ================= */\nfunction classOptions(){ return Array.from({length:12},(_,i)=>i+1).map(c=>`\u003coption value=\"${c}\">Class ${c}\u003c/option>`).join(''); }\nfunction subjOptions(){ return academicSubjects.map(s=>`\u003coption value=\"${s}\">${s}\u003c/option>`).join(''); }\n\nfunction initStaffModule(){\n  $$('.tab-btn[data-stf-tab]').forEach(b=>b.classList.remove('active'));\n  $$('.tab-btn[data-stf-tab]')[0].classList.add('active');\n  ['myattendance','attendance','timetable','examtt','holidays','syllabus','marks','topper','leave'].forEach((t,i)=>{\n    $(`#stf-${t}`).classList.toggle('hidden', i!==0);\n  });\n  $('#stf-att-class').innerHTML = classOptions();\n  $('#stf-tt-class').innerHTML = classOptions();\n  $('#stf-exam-class').innerHTML = classOptions();\n  $('#stf-syl-class').innerHTML = classOptions();\n  $('#stf-marks-class').innerHTML = classOptions();\n  $('#stf-topper-class').innerHTML = classOptions();\n  $('#stf-syl-subject').innerHTML = subjOptions();\n  $('#stf-marks-subject').innerHTML = subjOptions();\n  $('#stf-att-date').value = todayStr();\n\n  renderStfMyAttendance();\n  renderStfAttendance();\n  renderStfTimetable();\n  renderStfExamTT();\n  renderStfHolidays();\n  renderStfSyllabus();\n  renderStfMarks();\n  populateStfTopperExam();\n  renderStfLeave();\n  checkTermCompletion();\n}\n$$('.tab-btn[data-stf-tab]').forEach(b=>b.addEventListener('click', ()=>{\n  $$('.tab-btn[data-stf-tab]').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  ['myattendance','attendance','timetable','examtt','holidays','syllabus','marks','topper','leave'].forEach(t=>{\n    $(`#stf-${t}`).classList.toggle('hidden', t!==b.dataset.stfTab);\n  });\n  if(b.dataset.stfTab==='marks') renderStfMarks();\n  if(b.dataset.stfTab==='topper') populateStfTopperExam();\n}));\n\n/* --- Staff: Attendance --- */\nfunction renderStfAttendance(){\n  const cls = Number($('#stf-att-class').value)||1;\n  const sec = $('#stf-att-section').value;\n  if(!$('#stf-att-date').value) $('#stf-att-date').value = todayStr();\n  const date = $('#stf-att-date').value;\n  $('#stf-att-seldate').textContent = date;\n  renderCalendar('stf-att-calendar', {\n    selected: date,\n    selectable: true,\n    markerFn: d => {\n      const roster = students.filter(s=>s.cls===cls && s.section===sec);\n      const first = roster[0];\n      return (first && attendance[first.id] && attendance[first.id][d]) ? 'present' : null;\n    },\n    onSelect: d => { $('#stf-att-date').value = d; $('#stf-att-seldate').textContent = d; renderStfAttendanceRoster(); }\n  });\n  renderStfAttendanceRoster();\n}\nfunction renderStfAttendanceRoster(){\n  const cls = Number($('#stf-att-class').value)||1;\n  const sec = $('#stf-att-section').value;\n  const date = $('#stf-att-date').value || todayStr();\n  const rows = students.filter(s=>s.cls===cls && s.section===sec).sort((a,b)=>a.roll-b.roll);\n  const alreadyRecorded = rows.some(s => attendance[s.id] && attendance[s.id][date] !== undefined);\n  const badge = $('#stf-att-recorded-badge');\n  badge.textContent = alreadyRecorded ? '\u2713 Already recorded' : '\u26a0 Not yet recorded';\n  badge.className = 'badge ' + (alreadyRecorded ? 'completed' : 'pending');\n  $('#stf-att-save').textContent = alreadyRecorded ? 'Update Attendance' : 'Save Attendance';\n  $('#stf-att-tbody').innerHTML = rows.map(s=>{\n    const recorded = attendance[s.id] && attendance[s.id][date];\n    const st = recorded || 'present';\n    return `\n    \u003ctr data-sid=\"${s.id}\">\n      \u003ctd>${s.roll}\u003c/td>\u003ctd>${s.name}\u003c/td>\n      \u003ctd>\n        \u003cbutton class=\"toggle-att present ${st==='present'?'on':''}\" data-att=\"present\">Present\u003c/button>\n        \u003cbutton class=\"toggle-att absent ${st==='absent'?'on':''}\" data-att=\"absent\">Absent\u003c/button>\n        ${!recorded ? '\u003cspan style=\"color:var(--text-dim);font-size:11px;margin-left:6px;\">(defaulted \u2014 click Save to confirm)\u003c/span>' : ''}\n      \u003c/td>\n    \u003c/tr>`;\n  }).join('');\n  $$('.toggle-att').forEach(b=>b.addEventListener('click', ()=>{\n    const tr = b.closest('tr');\n    tr.querySelectorAll('.toggle-att').forEach(x=>x.classList.remove('on'));\n    b.classList.add('on');\n  }));\n}\n['stf-att-class','stf-att-section'].forEach(id=>$('#'+id).addEventListener('change', renderStfAttendance));\n$('#stf-att-save').addEventListener('click', ()=>{\n  const date = $('#stf-att-date').value || todayStr();\n  $$('#stf-att-tbody tr').forEach(tr=>{\n    const sid = tr.dataset.sid;\n    const on = tr.querySelector('.toggle-att.on');\n    const status = on ? on.dataset.att : 'present';\n    if(!attendance[sid]) attendance[sid] = {};\n    attendance[sid][date] = status;\n  });\n  showToast(`Attendance saved for ${date}`);\n  renderStfAttendance();\n});\n\n/* --- Staff: Daily Timetable --- */\n// School hours run 9:00 AM to ~2:30 PM. Hours 1-7 without a marker mean PM in this context.\nfunction to24Hour(h){ h = Number(h); return (h>=1 && h\u003c=7) ? h+12 : h; }\nfunction parseTimeRange(str){\n  const parts = String(str).split(/[\u2013-]/).map(s=>s.trim());\n  const parse = t => {\n    const [h,m] = t.split(':').map(Number);\n    return `${pad(to24Hour(h||0))}:${pad(m||0)}`;\n  };\n  return { start: parse(parts[0]||'9:00'), end: parse(parts[1]||'9:45') };\n}\nfunction toMinutes(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }\n\n// Exam time helpers: exam times can be any hour with AM/PM, unlike the short school day above.\nfunction parseExamTimeToInputs(str){\n  const parts = String(str||'').split(/[\u2013-]/).map(s=>s.trim()).filter(Boolean);\n  const parseOne = t => {\n    const m = t.match(/(\\d{1,2}):(\\d{2})\\s*([AaPp][Mm])?/);\n    if(!m) return '';\n    let h = Number(m[1]);\n    const min = Number(m[2]);\n    const ampm = m[3] ? m[3].toUpperCase() : null;\n    if(ampm === 'PM' && h \u003c 12) h += 12;\n    if(ampm === 'AM' && h === 12) h = 0;\n    return `${pad(h)}:${pad(min)}`;\n  };\n  return { start: parseOne(parts[0]||''), end: parts[1] ? parseOne(parts[1]) : '' };\n}\nfunction to12Hour(hhmm){\n  if(!hhmm) return '';\n  const [h,m] = hhmm.split(':').map(Number);\n  const ampm = h>=12 ? 'PM' : 'AM';\n  let h12 = h%12; if(h12===0) h12 = 12;\n  return `${h12}:${pad(m)} ${ampm}`;\n}\nfunction formatExamTime(start,end){\n  if(start && end) return `${to12Hour(start)} \u2013 ${to12Hour(end)}`;\n  if(start) return to12Hour(start);\n  return '';\n}\n\n/* Custom time picker: Hour / Minute / AM-PM dropdowns, styled consistently everywhere\n   instead of relying on the browser's native (often plain-looking) clock widget. */\nfunction timePickerHTML(name, idx, hhmm){\n  let h24 = 9, m = 0;\n  if(hhmm){ const p = hhmm.split(':').map(Number); if(!isNaN(p[0])) h24 = p[0]; if(!isNaN(p[1])) m = p[1]; }\n  let h12 = h24 % 12; if(h12===0) h12 = 12;\n  const ampm = h24 >= 12 ? 'PM' : 'AM';\n  const key = `${name}-${idx}`;\n  const hourOpts = Array.from({length:12},(_,i)=>i+1).map(h=>`\u003coption value=\"${h}\" ${h===h12?'selected':''}>${h}\u003c/option>`).join('');\n  const minOpts = [0,5,10,15,20,25,30,35,40,45,50,55].map(mm=>`\u003coption value=\"${mm}\" ${mm===m?'selected':''}>${pad(mm)}\u003c/option>`).join('');\n  return `\u003cspan class=\"time-picker\" data-tp-group=\"${key}\">\n    \u003cselect data-tp-h=\"${key}\" aria-label=\"Hour\">${hourOpts}\u003c/select>\n    \u003cspan class=\"tp-colon\">:\u003c/span>\n    \u003cselect data-tp-m=\"${key}\" aria-label=\"Minute\">${minOpts}\u003c/select>\n    \u003cselect data-tp-ap=\"${key}\" aria-label=\"AM or PM\">\u003coption value=\"AM\" ${ampm==='AM'?'selected':''}>AM\u003c/option>\u003coption value=\"PM\" ${ampm==='PM'?'selected':''}>PM\u003c/option>\u003c/select>\n  \u003c/span>`;\n}\nfunction readTimePicker(root, name, idx){\n  const key = `${name}-${idx}`;\n  const hEl = root.querySelector(`[data-tp-h=\"${key}\"]`);\n  const mEl = root.querySelector(`[data-tp-m=\"${key}\"]`);\n  const apEl = root.querySelector(`[data-tp-ap=\"${key}\"]`);\n  if(!hEl || !mEl || !apEl) return '';\n  let h = Number(hEl.value) % 12;\n  if(apEl.value === 'PM') h += 12;\n  return `${pad(h)}:${pad(Number(mEl.value))}`;\n}\nfunction setTimePickerValue(root, name, idx, hhmm){\n  const key = `${name}-${idx}`;\n  const hEl = root.querySelector(`[data-tp-h=\"${key}\"]`);\n  const mEl = root.querySelector(`[data-tp-m=\"${key}\"]`);\n  const apEl = root.querySelector(`[data-tp-ap=\"${key}\"]`);\n  if(!hEl || !mEl || !apEl || !hhmm) return;\n  const [h24,m] = hhmm.split(':').map(Number);\n  let h12 = h24 % 12; if(h12===0) h12 = 12;\n  hEl.value = h12;\n  mEl.value = m;\n  apEl.value = h24 >= 12 ? 'PM' : 'AM';\n}\n\nfunction renderTimetableEditorFor(prefix){\n  const cls = Number($(`#${prefix}-tt-class`).value)||1;\n  const sec = $(`#${prefix}-tt-section`).value;\n  const key = classSecKey(cls, sec);\n  if(!dailyTimetable[key]) dailyTimetable[key] = [];\n  const rows = dailyTimetable[key];\n  const wrap = $(`#${prefix}-tt-daywrap`);\n  wrap.innerHTML = weekDays.map(day=>{\n    const dayRows = rows.map((r,i)=>({...r, idx:i})).filter(r=>r.day===day).sort((a,b)=>a.period-b.period);\n    return `\n    \u003cdiv class=\"tt-day-block\">\n      \u003ch4>${day}\u003c/h4>\n      \u003ctable>\u003cthead>\u003ctr>\u003cth>Period\u003c/th>\u003cth>Start\u003c/th>\u003cth>End\u003c/th>\u003cth>Subject\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        ${dayRows.length ? dayRows.map(r=>{\n          const {start,end} = parseTimeRange(r.time);\n          return `\n        \u003ctr data-tt-rowday=\"${day}\" data-row-idx=\"${r.idx}\">\n          \u003ctd>\u003cinput type=\"number\" min=\"1\" data-tt-period=\"${r.idx}\" value=\"${r.period}\" style=\"width:55px;\">\u003c/td>\n          \u003ctd>${timePickerHTML('tt-start', r.idx, start)}\u003c/td>\n          \u003ctd>${timePickerHTML('tt-end', r.idx, end)}\u003c/td>\n          \u003ctd>\u003cselect data-tt-subject=\"${r.idx}\">${academicSubjects.map(s=>`\u003coption ${s===r.subject?'selected':''}>${s}\u003c/option>`).join('')}\u003c/select>\u003c/td>\n          \u003ctd>\u003cbutton class=\"btn-ghost\" data-tt-del=\"${r.idx}\">\u2715\u003c/button>\u003c/td>\n        \u003c/tr>`;}).join('') : `\u003ctr>\u003ctd colspan=\"5\" style=\"color:var(--text-dim);\">No periods yet.\u003c/td>\u003c/tr>`}\n      \u003c/tbody>\u003c/table>\n      \u003cbutton class=\"btn-ghost btn-sm\" data-tt-addday=\"${day}\">+ Add Period\u003c/button>\n    \u003c/div>`;\n  }).join('');\n  wrap.querySelectorAll('[data-tt-period]').forEach(el=>{\n    el.dataset.prevValue = el.value;\n    el.addEventListener('change', ()=>saveTimetableRow(el, prefix));\n  });\n  wrap.querySelectorAll('[data-tt-subject]').forEach(el=>el.addEventListener('change', ()=>saveTimetableRow(el, prefix)));\n  wrap.querySelectorAll('[data-tp-h],[data-tp-m],[data-tp-ap]').forEach(el=>el.addEventListener('change', ()=>saveTimetableRow(el, prefix)));\n  wrap.querySelectorAll('[data-tt-del]').forEach(b=>b.addEventListener('click', ()=>{\n    rows.splice(Number(b.dataset.ttDel),1);\n    renderTimetableEditorFor(prefix);\n    showToast('Period removed');\n  }));\n  wrap.querySelectorAll('[data-tt-addday]').forEach(b=>b.addEventListener('click', ()=>{\n    const day = b.dataset.ttAddday;\n    const dayCount = rows.filter(r=>r.day===day).length;\n    rows.push({day, period: dayCount+1, time: periodTimes[dayCount] || periodTimes[periodTimes.length-1], subject: academicSubjects[0]});\n    renderTimetableEditorFor(prefix);\n    showToast('Period added');\n  }));\n  renderTimetableReadonly(prefix);\n}\nfunction saveTimetableRow(el, prefix){\n  const cls = Number($(`#${prefix}-tt-class`).value)||1;\n  const sec = $(`#${prefix}-tt-section`).value;\n  const key = classSecKey(cls, sec);\n  const rows = dailyTimetable[key];\n  const tr = el.closest('tr');\n  const idx = Number(tr.dataset.rowIdx);\n  const day = tr.dataset.ttRowday;\n  const prevTime = rows[idx].time;\n  const start = readTimePicker(tr, 'tt-start', idx);\n  const end = readTimePicker(tr, 'tt-end', idx);\n\n  // validate: no overlap with other periods on the same day for this class-section\n  if(start && end){\n    const newStart = toMinutes(start), newEnd = toMinutes(end);\n    if(newEnd \u003c= newStart){\n      showToast('End time must be after start time');\n      const prev = parseTimeRange(prevTime);\n      setTimePickerValue(tr, 'tt-start', idx, prev.start);\n      setTimePickerValue(tr, 'tt-end', idx, prev.end);\n      return;\n    }\n    const conflict = rows.find((r,i)=>{\n      if(i===idx || r.day!==day) return false;\n      const rr = parseTimeRange(r.time);\n      const rs = toMinutes(rr.start), re = toMinutes(rr.end);\n      return newStart \u003c re && rs \u003c newEnd;\n    });\n    if(conflict){\n      showToast(`Time conflicts with Period ${conflict.period} (${conflict.time}) on ${day}`);\n      const prev = parseTimeRange(prevTime);\n      setTimePickerValue(tr, 'tt-start', idx, prev.start);\n      setTimePickerValue(tr, 'tt-end', idx, prev.end);\n      return;\n    }\n  }\n\n  rows[idx] = {\n    day,\n    period: Number(tr.querySelector('[data-tt-period]').value),\n    time: `${start}\u2013${end}`,\n    subject: tr.qu ks --- */\nfunction renderMgtMarks(){\n  populateMarksExamSelect('mgt');\n  const cls = Number($('#mgt-marks-class').value)||1;\n  const sec = $('#mgt-marks-section').value;\n  const exam = $('#mgt-marks-exam').value;\n  const subj = $('#mgt-marks-subject').value || academicSubjects[0];\n  const key = classSecKey(cls, sec);\n  const rows = students.filter(s=>s.cls===cls && s.section===sec).sort((a,b)=>a.roll-b.roll);\n  if(!exam){\n    $('#mgt-marks-tbody').innerHTML = `\u003ctr>\u003ctd colspan=\"4\" style=\"color:var(--text-dim);\">Schedule an exam for this class in Exam Timetable first.\u003c/td>\u003c/tr>`;\n    return;\n  }\n  $('#mgt-marks-tbody').innerHTML = rows.map(s=>{\n    const existing = (marksData[key] && marksData[key][exam] && marksData[key][exam][s.id] && marksData[key][exam][s.id][subj] !== undefined) ? marksData[key][exam][s.id][subj] : '';\n    return `\u003ctr>\u003ctd>${s.roll}\u003c/td>\u003ctd>${s.name}\u003c/td>\u003ctd>\u003cinput class=\"marks-input\" type=\"number\" min=\"0\" max=\"100\" placeholder=\"\u2014\" data-sid=\"${s.id}\" value=\"${existing}\">\u003c/td>\u003ctd>100\u003c/td>\u003c/tr>`;\n  }).join('');\n}\n['mgt-marks-class','mgt-marks-section','mgt-marks-subject','mgt-marks-exam'].forEach(id=>$('#'+id).addEventListener('change', renderMgtMarks));\n$('#mgt-marks-save').addEventListener('click', ()=>{\n  const cls = Number($('#mgt-marks-class').value)||1;\n  const sec = $('#mgt-marks-section').value;\n  const exam = $('#mgt-marks-exam').value;\n  const subj = $('#mgt-marks-subject').value || academicSubjects[0];\n  if(!exam){ showToast('Schedule an exam for this class first'); return; }\n  const key = classSecKey(cls, sec);\n  if(!marksData[key]) marksData[key] = {};\n  if(!marksData[key][exam]) marksData[key][exam] = {};\n  let entered = 0;\n  $$('#mgt-marks-tbody input').forEach(inp=>{\n    if(inp.value === '') return;\n    const sid = inp.dataset.sid;\n    const val = Math.max(0, Math.min(100, Number(inp.value)||0));\n    if(!marksData[key][exam][sid]) marksData[key][exam][sid] = {};\n    marksData[key][exam][sid][subj] = val;\n    entered++;\n  });\n  if(entered===0 && Object.keys(marksData[key][exam]).length===0) delete marksData[key][exam];\n  showToast(entered ? `Marks saved for ${subj} \u2014 ${exam}` : 'No marks entered \u2014 nothing saved');\n  populateMgtTopperExam();\n});\n\n/* --- Management: Toppers --- */\nfunction populateMgtTopperExam(){\n  const cls = Number($('#mgt-topper-class').value)||1;\n  const sec = $('#mgt-topper-section').value;\n  const key = classSecKey(cls, sec);\n  const exams = examListFor(key);\n  $('#mgt-topper-exam').innerHTML = exams.map(e=>`\u003coption value=\"${e}\">${e}\u003c/option>`).join('');\n  renderMgtTopper();\n  populateMgtSchoolTopper();\n}\n['mgt-topper-class','mgt-topper-section','mgt-topper-exam'].forEach(id=>$('#'+id).addEventListener('change', ()=>{\n  if(id==='mgt-topper-exam') renderMgtTopper(); else populateMgtTopperExam();\n}));\nfunction renderMgtTopper(){\n  const cls = Number($('#mgt-topper-class').value)||1;\n  const sec = $('#mgt-topper-section').value;\n  const exam = $('#mgt-topper-exam').value;\n  const rows = computeToppers(cls, sec, exam).slice(0,10);\n  $('#mgt-topper-list').innerHTML = rows.map((r,i)=>`\n    \u003cdiv class=\"topper-item\">\u003cdiv class=\"topper-rank\">${i+1}\u003c/div>\u003cdiv style=\"flex:1;\">${r.name}\u003c/div>\u003cdiv class=\"pw\">${r.total} / ${r.max}\u003c/div>\u003c/div>\n  `).join('') || '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No marks recorded for this exam yet.\u003c/p>';\n}\nfunction populateMgtSchoolTopper(){\n  const names = allExamNames();\n  const sel = $('#mgt-schooltopper-exam');\n  const prevVal = sel.value;\n  sel.innerHTML = names.length ? names.map(e=>`\u003coption value=\"${e}\">${e}\u003c/option>`).join('') : '\u003coption value=\"\">No marks recorded yet\u003c/option>';\n  if(names.includes(prevVal)) sel.value = prevVal;\n  renderSchoolTopperCard('mgt-schooltopper-card', sel.value);\n}\n$('#mgt-schooltopper-exam').addEventListener('change', ()=> renderSchoolTopperCard('mgt-schooltopper-card', $('#mgt-schooltopper-exam').value));\n\n/* ================= CALENDAR COMPONENT ================= */\nlet calState = {};\nfunction renderCalendar(containerId, opts){\n  opts = opts || {};\n  if(!calState[containerId]){\n    const now = new Date();\n    calState[containerId] = {year: now.getFullYear(), month: now.getMonth(), selected: null};\n  }\n  const st = calState[containerId];\n  if(opts.selected !== undefined) st.selected = opts.selected;\n  const first = new Date(st.year, st.month, 1);\n  const startDow = first.getDay();\n  const daysInMonth = new Date(st.year, st.month+1, 0).getDate();\n  const monthLabel = first.toLocaleString('en-US', {month:'long', year:'numeric'});\n  const todayKey = todayStr();\n  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n  let dowRow = dows.map(d=>`\u003cdiv class=\"cal-dow\">${d}\u003c/div>`).join('');\n  let dayCells = '';\n  for(let i=0;i\u003cstartDow;i++) dayCells += `\u003cdiv class=\"cal-cell empty\">\u003c/div>`;\n  for(let d=1; d\u003c=daysInMonth; d++){\n    const dateStr = `${st.year}-${pad(st.month+1)}-${pad(d)}`;\n    const marker = opts.markerFn ? opts.markerFn(dateStr) : null;\n    let cls = 'cal-cell';\n    if(marker==='present') cls += ' present';\n    else if(marker==='absent') cls += ' absent';\n    if(dateStr===todayKey) cls += ' today';\n    if(opts.selectable) cls += ' clickable';\n    if(st.selected===dateStr) cls += ' selected';\n    dayCells += `\u003cdiv class=\"${cls}\" data-cal-date=\"${dateStr}\">${d}\u003c/div>`;\n  }\n  $(`#${containerId}`).innerHTML = `\n    \u003cdiv class=\"cal-wrap\">\n      \u003cdiv class=\"cal-nav\">\n        \u003cbutton data-cal-prev>\u2039\u003c/button>\n        \u003cspan class=\"cal-title\">${monthLabel}\u003c/span>\n        \u003cbutton data-cal-next>\u203a\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"cal-grid\">${dowRow}${dayCells}\u003c/div>\n      ${opts.markerFn ? `\u003cdiv class=\"cal-legend\">\u003cspan>\u003ci style=\"background:var(--green);\">\u003c/i>Present\u003c/span>\u003cspan>\u003ci style=\"background:var(--red);\">\u003c/i>Absent\u003c/span>\u003c/div>` : ''}\n    \u003c/div>`;\n  const wrap = $(`#${containerId}`);\n  wrap.querySelector('[data-cal-prev]').addEventListener('click', ()=>{\n    st.month--; if(st.month\u003c0){ st.month=11; st.year--; }\n    renderCalendar(containerId, opts);\n  });\n  wrap.querySelector('[data-cal-next]').addEventListener('click', ()=>{\n    st.month++; if(st.month>11){ st.month=0; st.year++; }\n    renderCalendar(containerId, opts);\n  });\n  if(opts.selectable){\n    wrap.querySelectorAll('[data-cal-date]').forEach(cell=>cell.addEventListener('click', ()=>{\n      st.selected = cell.dataset.calDate;\n      if(opts.onSelect) opts.onSelect(st.selected);\n      renderCalendar(containerId, opts);\n    }));\n  }\n}\n\n/* ================= GENERIC EDITOR MODAL ================= */\nlet opReturnSlot = null;\nlet opRefreshFn = null;\nfunction openOpModal(editorId, title, refreshFnName){\n  const editor = document.getElementById(editorId);\n  const slot = document.getElementById(editorId + '-slot');\n  if(!editor || !slot) return;\n  document.getElementById('op-modal-body').appendChild(editor);\n  document.getElementById('op-modal-title').textContent = title || 'Edit';\n  document.getElementById('op-modal-bg').classList.add('open');\n  opReturnSlot = slot;\n  opRefreshFn = refreshFnName;\n}\nfunction closeOpModal(){\n  const modalBody = document.getElementById('op-modal-body');\n  const editor = modalBody.firstElementChild;\n  if(editor && opReturnSlot) opReturnSlot.appendChild(editor);\n  document.getElementById('op-modal-bg').classList.remove('open');\n  if(opRefreshFn && typeof window[opRefreshFn] === 'function') window[opRefreshFn]();\n  opReturnSlot = null; opRefreshFn = null;\n}\n$$('[data-open-editor]').forEach(b=>b.addEventListener('click', ()=>{\n  openOpModal(b.dataset.openEditor, b.dataset.editorTitle, b.dataset.refresh);\n}));\n$('#op-modal-done').addEventListener('click', closeOpModal);\n$('#op-modal-bg').addEventListener('click', e=>{ if(e.target.id==='op-modal-bg') closeOpModal(); });\n\n/* ================= READ-ONLY VIEWS (shown behind the Edit buttons) ================= */\nfunction renderDayWiseTimetable(containerId, key){\n  const rows = dailyTimetable[key] || [];\n  const byDay = {}; weekDays.forEach(d=>byDay[d]=[]);\n  rows.forEach(r=>{ if(byDay[r.day]) byDay[r.day].push(r); });\n  const html = weekDays.map(day=>{\n    const periods = byDay[day].slice().sort((a,b)=>a.period-b.period);\n    return `\n    \u003cdiv class=\"tt-day-block\">\n      \u003ch4>${day}\u003c/h4>\n      ${periods.length ? `\n      \u003ctable>\u003cthead>\u003ctr>\u003cth>Period\u003c/th>\u003cth>Time\u003c/th>\u003cth>Subject\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>${periods.map(p=>`\u003ctr>\u003ctd>${p.period}\u003c/td>\u003ctd>${p.time}\u003c/td>\u003ctd>${p.subject}\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>` :\n      `\u003cp style=\"color:var(--text-dim);font-size:12.5px;\">No periods scheduled.\u003c/p>`}\n    \u003c/div>`;\n  }).join('');\n  const el = $(`#${containerId}`);\n  if(el) el.innerHTML = html;\n}\nfunction renderTimetableReadonly(prefix){\n  const cls = Number($(`#${prefix}-tt-class`).value)||1;\n  const sec = $(`#${prefix}-tt-section`).value;\n  const key = classSecKey(cls, sec);\n  renderDayWiseTimetable(`${prefix}-tt-readonly`, key);\n}\nfunction renderMgtTimetableReadonly(){ renderTimetableReadonly('mgt'); }\nfunction renderStfTimetableReadonly(){ renderTimetableReadonly('stf'); }\n\nfunction renderExamTTReadonly(prefix){\n  const cls = $(`#${prefix}-exam-class`).value || '1';\n  const rows = examTimetable[cls] || [];\n  const el = $(`#${prefix}-exam-readonly`);\n  if(!el) return;\n  el.innerHTML = rows.length\n    ? `\u003ctable>\u003cthead>\u003
