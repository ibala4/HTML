/div>\n        \u003c/div>`;\n    }).join('');\n\n    document.getElementById('managerPending').innerHTML = pending.length\n      ? pending.map(r => approvalRowHTML(r, true)).join('')\n      : `\u003cdiv class=\"panel empty-note\">Nothing pending \u2014 all caught up.\u003c/div>`;\n  }\n\n  // ==================== PART 9: HR DASHBOARD ====================\n  function renderHR(){\n    const me = currentEmployee();\n    const pendingHR = state.requests.filter(r => r.status === 'Pending HR' && (r.hrId === me.id || r.hrId == null) && empById(r.employeeId));\n    const totalDaysTaken = state.requests.filter(r => r.status === 'Approved').reduce((s,r) => s + r.days, 0);\n\n    document.getElementById('hrStats').innerHTML = `\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Total employees\u003c/div>\u003cdiv class=\"stat-num\">${state.employees.length}\u003c/div>\u003cdiv class=\"stat-note\">${new Set(state.employees.map(e=>e.dept)).size} departments\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Awaiting HR sign-off\u003c/div>\u003cdiv class=\"stat-num\" style=\"color:var(--primary);\">${pendingHR.length}\u003c/div>\u003cdiv class=\"stat-note\">Final approval stage\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Leave days taken (2026)\u003c/div>\u003cdiv class=\"stat-num\">${totalDaysTaken}\u003c/div>\u003cdiv class=\"stat-note\">Company-wide, approved\u003c/div>\u003c/div>\n    `;\n\n    document.getElementById('hrApprovalList').innerHTML = pendingHR.length ? pendingHR.map(r => {\n      const emp = empById(r.employeeId);\n      return `\n      \u003cdiv class=\"approval-row\">\n        \u003cdiv>\u003cdiv class=\"emp-name\">${emp.name}\u003c/div>\u003cdiv class=\"emp-id mono\">${emp.id} \u00b7 REQ-${String(r.id).padStart(4,'0')}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"col-label\">Type\u003c/div>\u003cdiv>${r.type}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"col-label\">Dates\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:0.84rem;\">${fmt(r.from)} \u2192 ${fmt(r.to)} (${r.days}d)\u003c/div>\u003c/div>\n        \u003cdiv class=\"row-actions\">\n          \u003cbutton class=\"btn btn-success btn-sm\" onclick=\"hrDecision(${r.id},'approve')\">Approve\u003c/button>\n          \u003cbutton class=\"btn btn-danger btn-sm\" onclick=\"hrDecision(${r.id},'reject')\">Reject\u003c/button>\n        \u003c/div>\n        ${reasonChainHTML(r)}\n      \u003c/div>`;\n    }).join('') : `\u003cdiv class=\"panel empty-note\">No requests waiting on HR right now.\u003c/div>`;\n\n    document.getElementById('employeeTableBody').innerHTML = state.employees.map(e => `\n      \u003ctr>\n        \u003ctd style=\"font-weight:700;\">${e.name}\u003c/td>\n        \u003ctd class=\"mono\">${e.id}\u003c/td>\n        \u003ctd>${e.dept}\u003c/td>\n        \u003ctd>\u003cspan class=\"role-tag\">${e.role}\u003c/span>\u003c/td>\n        \u003ctd class=\"mono\">${e.username}\u003c/td>\n        \u003ctd class=\"mono\">${e.password}\u003c/td>\n        \u003ctd style=\"display:flex; gap:6px; white-space:nowrap;\">\n          \u003cbutton class=\"btn btn-outline btn-sm\" onclick=\"openEditEmployee('${e.id}')\">Edit\u003c/button>\n          \u003cbutton class=\"type-remove\" onclick=\"deleteEmployee('${e.id}')\">Delete\u003c/button>\n        \u003c/td>\n      \u003c/tr>\n    `).join('');\n\n    const deptSelect = document.getElementById('newEmpDept');\n    if(deptSelect) deptSelect.innerHTML = DEPARTMENTS.map(d => `\u003coption>${d}\u003c/option>`).join('');\n\n    const empSelect = document.getElementById('adjEmployee');\n    empSelect.innerHTML = state.employees.map(e => `\u003coption value=\"${e.id}\">${e.name}\u003c/option>`).join('');\n    const typeSelect = document.getElementById('adjType');\n    typeSelect.innerHTML = state.leaveTypeList.map(t => `\u003coption value=\"${t}\">${t}\u003c/option>`).join('');\n\n    document.getElementById('adjustmentLog').innerHTML = state.adjustments.slice(0,8).map(a => {\n      const emp = empById(a.employeeId);\n      return `\u003cdiv class=\"list-row\">\n        \u003cdiv class=\"lr-left\">\n          \u003cspan class=\"lr-type-tag\">${a.type}\u003c/span>\n          \u003cdiv>\u003cdiv class=\"lr-dates\">+${a.days}d for ${emp ? emp.name : 'a removed employee'}\u003c/div>\u003cdiv class=\"lr-reason\">${a.reason} \u00b7 by ${a.by}\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>`;\n    }).join('') || `\u003cdiv class=\"empty-note\">No adjustments yet.\u003c/div>`;\n  }\n\n  function hrDecision(reqId, decision){\n    const req = state.requests.find(r => r.id === reqId);\n    if(!req || req.status !== 'Pending HR') return;\n    const emp = empById(req.employeeId);\n    const comment = window.prompt(`Add a comment for ${emp.name} (optional):`, '') || '';\n    if(decision === 'approve'){\n      req.status = 'Approved';\n      req.hrComment = comment;\n      emp.leaveUsed[req.type] = (emp.leaveUsed[req.type] || 0) + req.days;\n      pushNotification({ employeeId: emp.id, type:'approved', message:`Your ${req.type} leave (${fmt(req.from)} \u2192 ${fmt(req.to)}) was approved by HR. Enjoy your time off.${comment ? ' Comment: \"'+comment+'\"' : ''}` });\n      toast('Approved \u2014 leave finalized');\n    } else {\n      req.status = 'Rejected';\n      req.hrComment = comment;\n      pushNotification({ employeeId: emp.id, type:'rejected', message:`Your ${req.type} leave (${fmt(req.from)} \u2192 ${fmt(req.to)}) was rejected by HR.${comment ? ' Reason: \"'+comment+'\"' : ''}` });\n      toast('Request rejected');\n    }\n    renderHR();\n    saveState();\n  }\n\n  // ==================== PART 16: CEO APPROVALS ====================\n  function renderCEO(){\n    const me = currentEmployee();\n    const pendingCEO = state.requests.filter(r => r.status === 'Pending CEO' && (r.ceoId === me.id || r.ceoId == null) && empById(r.employeeId));\n    document.getElementById('ceoApprovalList').innerHTML = pendingCEO.length ? pendingCEO.map(r => {\n      const emp = empById(r.employeeId);\n      return `\n      \u003cdiv class=\"approval-row\">\n        \u003cdiv>\u003cdiv class=\"emp-name\">${emp.name} \u003cspan class=\"badge role\" style=\"margin-left:6px;\">${emp.role}\u003c/span>\u003c/div>\u003cdiv class=\"emp-id mono\">${emp.id} \u00b7 REQ-${String(r.id).padStart(4,'0')}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"col-label\">Type\u003c/div>\u003cdiv>${r.type}\u003c/div>\u003c/div>\n        \u003cdiv>\u003cdiv class=\"col-label\">Dates\u003c/div>\u003cdiv class=\"mono\" style=\"font-size:0.84rem;\">${fmt(r.from)} \u2192 ${fmt(r.to)} (${r.days}d)\u003c/div>\u003c/div>\n        \u003cdiv class=\"row-actions\">\n          \u003cbutton class=\"btn btn-success btn-sm\" onclick=\"ceoDecision(${r.id},'approve')\">Approve\u003c/button>\n          \u003cbutton class=\"btn btn-danger btn-sm\" onclick=\"ceoDecision(${r.id},'reject')\">Reject\u003c/button>\n        \u003c/div>\n        ${reasonChainHTML(r)}\n      \u003c/div>`;\n    }).join('') : `\u003cdiv class=\"panel empty-note\">No HR leave requests waiting on you right now.\u003c/div>`;\n\n    document.getElementById('ceoStats').innerHTML = `\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">HR requests awaiting you\u003c/div>\u003cdiv class=\"stat-num\" style=\"color:#7C4FE0;\">${pendingCEO.length}\u003c/div>\u003cdiv class=\"stat-note\">Final sign-off for HR leave\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Total employees\u003c/div>\u003cdiv class=\"stat-num\">${state.employees.length}\u003c/div>\u003cdiv class=\"stat-note\">Across ${new Set(state.employees.map(e=>e.dept)).size} departments\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Leave days taken (2026)\u003c/div>\u003cdiv class=\"stat-num\">${state.requests.filter(r=>r.status==='Approved').reduce((s,r)=>s+r.days,0)}\u003c/div>\u003cdiv class=\"stat-note\">Company-wide, approved\u003c/div>\u003c/div>\n    `;\n  }\n\n  function ceoDecision(reqId, decision){\n    const req = state.requests.find(r => r.id === reqId);\n    if(!req || req.status !== 'Pending CEO') return;\n    const emp = empById(req.employeeId);\n    const comment = window.prompt(`Add a comment for ${emp.name} (optional):`, '') || '';\n    if(decision === 'approve'){\n      req.status = 'Approved';\n      req.ceoComment = comment;\n      emp.leaveUsed[req.type] = (emp.leaveUsed[req.type] || 0) + req.days;\n      pushNotification({ employeeId: emp.id, type:'approved', message:`Your ${req.type} leave (${fmt(req.from)} \u2192 ${fmt(req.to)}) was approved by the CEO.${comment ? ' Comment: \"'+comment+'\"' : ''}` });\n      toast('Approved \u2014 leave finalized');\n    } else {\n      req.status = 'Rejected';\n      req.ceoComment = comment;\n      pushNotification({ employeeId: emp.id, type:'rejected', message:`Your ${req.type} leave (${fmt(req.from)} \u2192 ${fmt(req.to)}) was rejected by the CEO.${comment ? ' Reason: \"'+comment+'\"' : ''}` });\n      toast('Request rejected');\n    }\n    renderCEO();\n    saveState();\n  }\n\n  function updateEmployeeRole(id, role){\n    const emp = empById(id);\n    emp.role = role;\n    toast(emp.name + \"'s role changed to \" + role);\n    renderHR();\n    saveState();\n  }\n\n  function openEditEmployee(id){\n    const emp = empById(id);\n    if(!emp) return;\n    const parts = emp.name.trim().split(' ');\n    document.getElementById('editEmpId').value = id;\n    document.getElementById('editEmpFirstName').value = parts[0] || '';\n    document.getElementById('editEmpLastName').value = parts.slice(1).join(' ');\n    document.getElementById('editEmpDept').innerHTML = DEPARTMENTS.map(d => `\u003coption ${d===emp.dept?'selected':''}>${d}\u003c/option>`).join('')\n      + (DEPARTMENTS.includes(emp.dept) ? '' : `\u003coption selected>${emp.dept}\u003c/option>`);\n    document.getElementById('editEmpRole').innerHTML = ['Employee','Manager','HR','CEO'].map(r => `\u003coption ${r===emp.role?'selected':''}>${r}\u003c/option>`).join('');\n    document.getElementById('editEmpModalTitle').textContent = 'Edit ' + emp.name;\n    document.getElementById('editEmpModal').classList.remove('hidden');\n  }\n\n  function closeEditEmployee(){\n    document.getElementById('editEmpModal').classList.add('hidden');\n  }\n\n  function saveEditEmployee(){\n    const id = document.getElementById('editEmpId').value;\n    const emp = empById(id);\n    if(!emp) return;\n    const firstName = document.getElementById('editEmpFirstName').value.trim();\n    const lastName = document.getElementById('editEmpLastName').value.trim();\n    if(!firstName){ toast('First name cannot be empty'); return; }\n    const newName = lastName ? firstName + ' ' + lastName : firstName;\n    const newRole = document.getElementById('editEmpRole').value;\n    if(emp.role === 'HR' && newRole !== 'HR'){\n      const otherHR = state.employees.filter(e => e.role === 'HR' && e.id !== id);\n      if(otherHR.length === 0){ toast('This is the only HR account \u2014 promote someone else to HR first'); return; }\n    }\n    emp.name = newName;\n    emp.dept = document.getElementById('editEmpDept').value;\n    emp.role = newRole;\n    toast('Employee details updated');\n    closeEditEmployee();\n    renderHR();\n    saveState();\n  }\n\n  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }\n\n  function addEmployee(){\n    const firstNameEl = document.getElementById('newEmpFirstName');\n    const lastNameEl = document.getElementById('newEmpLastName');\n    const deptEl = document.getElementById('newEmpDept');\n    const roleEl = document.getElementById('newEmpRole');\n    const firstName = firstNameEl.value.trim();\n    const lastName = lastNameEl.value.trim();\n    const dept = deptEl.value || DEPARTMENTS[0];\n    const role = roleEl.value;\n    if(!firstName){ toast('Enter a first name for the new employee'); return; }\n    const name = lastName ? firstName + ' ' + lastName : firstName;\n\n    const idNum = state.nextEmpNum++;\n    const id = 'EMP-' + idNum;\n    let username = firstName.toUpperCase();\n    if(state.employees.some(e => e.username === username)) username = username + idNum.toString().slice(-2);\n    const password = firstName.slice(0,3).toUpperCase() + idNum;\n    const leaveUsed = {}; const bonusDays = {};\n    state.leaveTypeList.forEach(t => { leaveUsed[t] = 0; bonusDays[t] = 0; });\n\n    state.employees.push({ id, name, dept, role, color: colorFor(name), username, password, leaveUsed, bonusDays });\n\n    document.getElementById('credCallout').classList.add('show');\n    document.getElementById('credCalloutBody').innerHTML = `${name} was added as \u003cstrong>${role}\u003c/strong> (${id}). Login: \u003cspan class=\"mono\">${username}\u003c/span> / \u003cspan class=\"mono\">${password}\u003c/span>`;\n\n    firstNameEl.value = '';\n    lastNameEl.value = '';\n    toast(name + ' added to the directory');\n    renderHR();\n    saveState();\n  }\n\n  function deleteEmployee(id){\n    const emp = empById(id);\n    if(!emp) return;\n    if(emp.id === state.currentUserId){ toast(\"You can't delete your own account while signed in\"); return; }\n\n    if(emp.role === 'HR'){\n      const otherHR = state.employees.filter(e => e.role === 'HR' && e.id !== id);\n      if(otherHR.length === 0){\n        const name = window.prompt('This is the only HR account. Enter the name of the employee who should become the new HR before deleting ' + emp.name + ':');\n        if(!name){ toast('Deletion cancelled \u2014 a new HR is required'); return; }\n        const candidate = state.employees.find(e => e.id !== id && e.name.trim().toLowerCase() === name.trim().toLowerCase());\n        if(!candidate){ toast('No employee found with that name \u2014 deletion cancelled'); return; }\n        candidate.role = 'HR';\n        toast(candidate.name + ' promoted to HR');\n      }\n    }\n\n    if(!window.confirm('Delete ' + emp.name + '? This cannot be undone.')) return;\n\n    // If a Manager is removed, unassign their pending requests and tell the affected employees\n    if(emp.role === 'Manager'){\n      const orphaned = state.requests.filter(r => r.status === 'Pending' && r.managerId === id);\n      orphaned.forEach(r => {\n        r.managerId = null;\n        r.orphanNote = `${emp.name} is no longer your manager \u2014 please choose a new manager.`;\n        const owner = empById(r.employeeId);\n        if(owner){\n          pushNotification({ employeeId: owner.id, type:'alert', message: `${emp.name} is no longer with the company. Your ${r.type} leave request (REQ-${String(r.id).padStart(4,'0')}) needs a new manager \u2014 please raise this from Leave History.` });\n        }\n      });\n    }\n\n    state.employees = state.employees.filter(e => e.id !== id);\n    delete state.attendance[id];\n    toast(emp.name + ' removed from the directory');\n    renderHR();\n    saveState();\n  }\n\n  function clearAllKeepHR(){\n    const me = currentEmployee();\n    if(!me || me.role !== 'HR'){ toast('Only an HR account can do this'); return; }\n    if(!window.confirm('This will permanently delete every other employee, all leave requests, notifications, attendance, and balance adjustments \u2014 keeping only your HR account. This cannot be undone. Continue?')) return;\n    if(!window.confirm('Are you absolutely sure? Type OK on the next prompt to confirm.')) return;\n    const check = window.prompt('Type CLEAR to confirm wiping all data:');\n    if(check !== 'CLEAR'){ toast('Cancelled \u2014 nothing was deleted'); return; }\n\n    const freshMe = {\n      id: me.id, name: me.name, dept: me.dept, role: 'HR', color: me.color,\n      username: me.username, password: me.password,\n      leaveUsed: {}, bonusDays: {}\n    };\n    state.leaveTypeList.forEach(t => { freshMe.leaveUsed[t] = 0; freshMe.bonusDays[t] = 0; });\n\n    state.employees = [freshMe];\n    state.requests = [];\n    state.notifications = [];\n    state.attendance = {};\n    state.adjustments = [];\n    state.nextReqId = 1;\n    state.nextNotifId = 1;\n    state.nextAdjId = 1;\n    state.nextEmpNum = 1201;\n    state.currentUserId = freshMe.id;\n\n    toast('All data cleared \u2014 only ' + freshMe.name + ' (HR) remains');\n    renderSidebar();\n    updateTopUser();\n    updateBellBadge();\n    renderHR();\n    saveState();\n  }\n\n  function reassignManager(reqId, newManagerId){\n    const req = state.requests.find(r => r.id === reqId);\n    if(!req) return;\n    if(newManagerId){\n      req.managerId = newManagerId;\n      req.orphanNote = null;\n      toast('New manager assigned to REQ-' + String(reqId).padStart(4,'0'));\n    } else {\n      req.status = 'Pending HR';\n      req.hrId = null;\n      req.orphanNote = null;\n      toast('Sent directly to HR');\n    }\n    renderHistory();\n    renderDashboard();\n    saveState();\n  }\n\n  function orphanFixHTML(r){\n    if(!r.orphanNote || r.status !== 'Pending') return '';\n    const managers = state.employees.filter(e => e.role === 'Manager');\n    const options = managers.map(m => `\u003coption value=\"${m.id}\">${m.name} \u2014 ${m.dept}\u003c/option>`).join('');\n    return `\n      \u003cdiv class=\"flow-note\" style=\"background:var(--danger-soft); color:var(--danger); margin:8px 0 0;\">\n        \u26a0 ${r.orphanNote}\n        ${managers.length ? `\n          \u003cselect class=\"report-select\" id=\"reassign-${r.id}\" style=\"margin:0 0 0 auto; max-width:220px;\">${options}\u003c/select>\n          \u003cbutton class=\"btn btn-primary btn-sm\" onclick=\"reassignManager(${r.id}, document.getElementById('reassign-${r.id}').value)\">Reassign\u003c/button>\n        ` : `\u003cbutton class=\"btn btn-primary btn-sm\" style=\"margin-left:auto;\" onclick=\"reassignManager(${r.id}, null)\">Send to HR instead\u003c/button>`}\n      \u003c/div>`;\n  }\n\n  function adjustBalance(){\n    const empId = document.getElementById('adjEmployee').value;\n    const type = document.getElementById('adjType').value;\n    const days = Math.max(1, parseInt(document.getElementById('adjDays').value) || 0);\n    const reason = document.getElementById('adjReason').value.trim();\n    if(!empId){ toast('Choose an employee'); return; }\n    if(!reason){ toast('Enter a reason for this adjustment'); return; }\n    const emp = empById(empId);\n    emp.bonusDays[type] = (emp.bonusDays[type] || 0) + days;\n    const hr = currentEmployee();\n    state.adjustments.unshift({ id: state.nextAdjId++, employeeId: empId, type, days, reason, date: TODAY, by: hr.name });\n    pushNotification({ employeeId: empId, type:'info', message: `HR added ${days} extra day(s) of ${type} leave: ${reason}` });\n    toast(`Added ${days} day(s) of ${type} leave to ${emp.name}`);\n    document.getElementById('adjReason').value = '';\n    renderHR();\n    saveState();\n  }\n\n  // ==================== PART 10: HOLIDAY CALENDAR ====================\n  function renderHolidays(){\n    const me = currentEmployee();\n    const isHR = me.role === 'HR' || me.role === 'CEO';\n\n    const years = Array.from(new Set(state.holidays.map(h => new Date(h.date+'T00:00:00').getFullYear())));\n    if(!years.includes(state.holidayYear)) years.push(state.holidayYear);\n    years.sort((a,b) => a-b);\n    const yearSelect = document.getElementById('holidayYearSelect');\n    yearSelect.innerHTML = years.map(y => `\u003coption value=\"${y}\" ${y===state.holidayYear?'selected':''}>${y}\u003c/option>`).join('');\n\n    const filtered = state.holidays.filter(h => new Date(h.date+'T00:00:00').getFullYear() === state.holidayYear);\n    const sorted = filtered.slice().sort((a,b) => new Date(a.date) - new Date(b.date));\n    const byMonth = {};\n    sorted.forEach(h => { const m = MONTH_NAMES[new Date(h.date+'T00:00:00').getMonth()]; (byMonth[m]=byMonth[m]||[]).push(h); });\n\n    let html = '';\n    Object.keys(byMonth).forEach(month => {\n      html += `\u003cdiv class=\"holiday-month-label\">${month} ${state.holidayYear}\u003c/div>`;\n      html += byMonth[month].map(h => {\n        const dt = new Date(h.date + 'T00:00:00');\n        return `\u003cdiv class=\"holiday-stub\">\n          \u003cdiv class=\"holiday-date\">\u003cdiv class=\"hd-day\">${dt.getDate()}\u003c/div>\u003cdiv class=\"hd-dow\">${DOW_NAMES[dt.getDay()].toUpperCase()}\u003c/div>\u003c/div>\n          \u003cdiv class=\"holiday-name\">${h.name}\u003c/div>\n          \u003cspan class=\"holiday-tag ${h.type}\">${h.type}\u003c/span>\n          ${isHR ? `\u003cbutton class=\"type-remove\" style=\"margin-left:10px;\" onclick=\"deleteHoliday(${h.id})\">Delete\u003c/button>` : ''}\n        \u003c/div>`;\n      }).join('');\n    });\n    document.getElementById('holidayList').innerHTML = html || `\u003cdiv class=\"empty-note\">No holidays added for ${state.holidayYear} yet.\u003c/div>`;\n\n    document.querySelectorAll('.hr-only-holiday').forEach(el => el.style.display = isHR ? '' : 'none');\n  }\n\n  function addHoliday(){\n    const dateEl = document.getElementById('newHolidayDate');\n    const nameEl = document.getElementById('newHolidayName');\n    const typeEl = document.getElementById('newHolidayType');\n    const date = dateEl.value;\n    const name = nameEl.value.trim();\n    const type = typeEl.value;\n    if(!date){ toast('Pick a date'); return; }\n    if(!name){ toast('Enter a holiday name'); return; }\n    if(state.holidays.some(h => h.date === date)){ toast('A holiday is already set for that date'); return; }\n    state.holidays.push({ id: state.nextHolidayId++, date, name, type });\n    state.holidayYear = new Date(date + 'T00:00:00').getFullYear();\n    nameEl.value = ''; dateEl.value = '';\n    toast(name + ' added to the holiday calendar');\n    renderHolidays();\n    saveState();\n  }\n\n  function deleteHoliday(id){\n    const h = state.holidays.find(x => x.id === id);\n    if(!h) return;\n    if(!window.confirm('Remove \"' + h.name + '\" from the holiday calendar?')) return;\n    state.holidays = state.holidays.filter(x => x.id !== id);\n    toast('Holiday removed');\n    renderHolidays();\n    saveState();\n  }\n\n  // ==================== PART 11: NOTIFICATIONS ====================\n  const NOTIF_ICON = { submitted:'apply', approved:'check', rejected:'shield', reminder:'bell', info:'bell' };\n\n  function pushNotification({ employeeId=null, role=null, type, message }){\n    state.notifications.unshift({ id: state.nextNotifId++, forEmployeeId: employeeId, forRole: role, type, message,\n      time: '2026-08-15 ' + String(9+Math.floor(Math.random()*8)).padStart(2,'0') + ':' + String(Math.floor(Math.random()*60)).padStart(2,'0'), read:false });\n    updateBellBadge();\n  }\n\n  function myNotifications(){\n    const emp = currentEmployee(); if(!emp) return [];\n    return state.notifications.filter(n => n.forEmployeeId === emp.id || n.forRole === emp.role);\n  }\n\n  function updateBellBadge(){\n    const unread = myNotifications().filter(n => !n.read).length;\n    const badge = document.getElementById('bellBadge');\n    badge.textContent = unread;\n    badge.classList.toggle('hidden', unread === 0);\n  }\n\n  function renderNotifications(){\n    const mine = myNotifications();\n    document.getElementById('notifList').innerHTML = mine.map(n => `\n      \u003cdiv class=\"notif-item ${n.read?'':'unread'}\">\n        \u003cdiv class=\"notif-icon ${n.type}\">${iconHtml(NOTIF_ICON[n.type] || 'bell')}\u003c/div>\n        \u003cdiv style=\"flex:1;\">\u003cdiv class=\"notif-msg\">${n.message}\u003c/div>\u003cdiv class=\"notif-time mono\">${n.time}\u003c/div>\u003c/div>\n        ${n.read?'':'\u003cdiv class=\"notif-dot\">\u003c/div>'}\n      \u003c/div>\n    `).join('') || `\u003cdiv class=\"empty-note\">You're all caught up.\u003c/div>`;\n    mine.forEach(n => n.read = true);\n    updateBellBadge();\n    saveState();\n  }\n\n  function markAllRead(){ myNotifications().forEach(n => n.read = true); renderNotifications(); toast('All notifications marked read'); }\n\n  // ==================== PART 12: REPORTS ====================\n  document.getElementById('reportFilterRow').addEventListener('click', e => {\n    const chip = e.target.closest('.filter-chip'); if(!chip) return;\n    document.querySelectorAll('#reportFilterRow .filter-chip').forEach(c => c.classList.remove('active'));\n    chip.classList.add('active');\n    state.reportType = chip.dataset.rtype;\n    renderReports();\n  });\n\n  function renderReports(){\n    const panel = document.getElementById('reportPanel');\n    if(state.reportType === 'Employee'){\n      const options = state.employees.map(e => `\u003coption value=\"${e.id}\" ${e.id===state.reportEmployeeId?'selected':''}>${e.name}\u003c/option>`).join('');\n      const mine = state.requests.filter(r => r.employeeId === state.reportEmployeeId);\n      const counts = { Pending:0, 'Pending HR':0, Approved:0, Rejected:0, Cancelled:0 };\n      mine.forEach(r => counts[r.status] = (counts[r.status]||0) + 1);\n      const daysByType = {};\n      mine.filter(r => r.status === 'Approved').forEach(r => daysByType[r.type] = (daysByType[r.type]||0) + r.days);\n      const maxDays = Math.max(1, ...Object.values(daysByType));\n      panel.innerHTML = `\n        \u003cselect class=\"report-select\" onchange=\"state.reportEmployeeId=this.value; renderReports();\">${options}\u003c/select>\n        \u003cdiv class=\"grid grid-3\">\n          \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Awaiting manager\u003c/div>\u003cdiv class=\"stat-num\" style=\"font-size:1.4rem;\">${counts.Pending}\u003c/div>\u003c/div>\n          \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Awaiting HR\u003c/div>\u003cdiv class=\"stat-num\" style=\"font-size:1.4rem; color:var(--primary);\">${counts['Pending HR']}\u003c/div>\u003c/div>\n          \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Approved\u003c/div>\u003cdiv class=\"stat-num\" style=\"font-size:1.4rem; color:var(--success);\">${counts.Approved}\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"section-label\">Approved days by type\u003c/div>\n        ${Object.keys(daysByType).length ? Object.entries(daysByType).map(([type,days]) => `\n          \u003cdiv class=\"hbar-row\">\u003cdiv class=\"hbar-label\">${type}\u003c/div>\n            \u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:${(days/maxDays)*100}%; background:${typeColor(type)};\">\u003c/div>\u003c/div>\n            \u003cdiv class=\"hbar-val\">${days}d\u003c/div>\u003c/div>`).join('') : `\u003cdiv class=\"empty-note\">No approved leave yet.\u003c/div>`}\n      `;\n    } else if(state.reportType === 'Team'){\n      const byDept = {};\n      state.requests.filter(r => r.status === 'Approved').forEach(r => {\n        const emp = empById(r.employeeId); const dept = emp ? emp.dept : 'Other';\n        byDept[dept] = (byDept[dept]||0) + r.days;\n      });\n      const maxDept = Math.max(1, ...Object.values(byDept));\n      panel.innerHTML = `\u003cdiv class=\"section-label\" style=\"margin-top:0;\">Approved leave days by department\u003c/div>\n        ${Object.keys(byDept).length ? Object.entries(byDept).map(([dept,days]) => `\n          \u003cdiv class=\"hbar-row\">\u003cdiv class=\"hbar-label\">${dept}\u003c/div>\n            \u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:${(days/maxDept)*100}%; background:var(--primary);\">\u003c/div>\u003c/div>\n            \u003cdiv class=\"hbar-val\">${days}d\u003c/div>\u003c/div>`).join('') : `\u003cdiv class=\"empty-note\">No approved leave recorded.\u003c/div>`}`;\n    } else if(state.reportType === 'Monthly'){\n      const byMonth = new Array(12).fill(0);\n      state.requests.filter(r => r.status === 'Approved').forEach(r => {\n        let d = new Date(r.from+'T00:00:00'); const end = new Date(r.to+'T00:00:00');\n        while(d \u003c= end){ if(d.getFullYear()===2026) byMonth[d.getMonth()]++; d.setDate(d.getDate()+1); }\n      });\n      const maxMonth = Math.max(1, ...byMonth);\n      panel.innerHTML = `\u003cdiv class=\"section-label\" style=\"margin-top:0;\">Approved leave days per month, 2026\u003c/div>\n        \u003cdiv class=\"month-chart\">${byMonth.map((v,i) => `\n          \u003cdiv class=\"month-col\">\u003cdiv class=\"month-bar-track\">\u003cdiv class=\"month-fill\" style=\"height:${(v/maxMonth)*100}%;\">\u003c/div>\u003c/div>\n          \u003cdiv class=\"month-label\">${MONTH_NAMES[i].slice(0,3)}\u003c/div>\u003c/div>`).join('')}\u003c/div>`;\n    } else {\n      const approved = state.requests.filter(r => r.status === 'Approved');\n      const rejected = state.requests.filter(r => r.status === 'Rejected');\n      const totalDays = approved.reduce((s,r) => s+r.days, 0);\n      const rate = (approved.length+rejected.length) ? Math.round((approved.length/(approved.length+rejected.length))*100) : 0;\n      const typeCounts = {}; approved.forEach(r => typeCounts[r.type] = (typeCounts[r.type]||0)+1);\n      const topType = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1])[0];\n      panel.innerHTML = `\u003cdiv class=\"grid grid-3\">\n        \u003cdiv class=\"stat-card\">\u003cdiv class=\"stat-label\">Total leave days taken\u003c/div>\u003cdiv class=\"stat-num\">${totalDays}\u003c/div>\u003cdiv class=\"stat-note\">Across ${state.employees.length} employees, 2026\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat-card\">\u003cdiv class=\"stat-label\">Approval rate\u003c/div>\u003cdiv class=\"stat-num\" style=\"color:var(--success);\">${rate}%\u003c/div>\u003cdiv class=\"stat-note\">${approved.length} approved \u00b7 ${rejected.length} rejected\u003c/div>\u003c/div>\n        \u003cdiv class=\"stat-card\">\u003cdiv class=\"stat-label\">Most-used type\u003c/div>\u003cdiv class=\"stat-num\" style=\"font-size:1.3rem;\">${topType?topType[0]:'\u2014'}\u003c/div>\u003cdiv class=\"stat-note\">${topType?topType[1]+' approved requests':''}\u003c/div>\u003c/div>\n      \u003c/div>`;\n    }\n  }\n\n  // ==================== PART 13: ATTENDANCE ====================\n  function ensureAttendanceSeed(){\n    const emp = currentEmployee();\n    state.attendance[emp.id] = state.attendance[emp.id] || {};\n    const rec = state.attendance[emp.id];\n    const daysInMonth = new Date(state.attYear, state.attMonth+1, 0).getDate();\n    for(let day=1; day\u003c=daysInMonth; day++){\n      const dateStr = `${state.attYear}-${String(state.attMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;\n      if(dateStr > TODAY || rec[dateStr]) continue;\n      const dow = new Date(state.attYear, state.attMonth, day).getDay();\n      if(dow===0 || dow===6) continue;\n      const onLeave = state.requests.some(r => r.employeeId === emp.id && r.status === 'Approved' && r.from \u003c= dateStr && r.to >= dateStr);\n      rec[dateStr] = onLeave ? 'Absent' : 'Present';\n    }\n  }\n\n  const ATT_CYCLE = ['Present','WFH','Half-day','Absent'];\n  function cycleAttendance(dateStr){\n    if(dateStr > TODAY) return;\n    const emp = currentEmployee();\n    const rec = state.attendance[emp.id];\n    const cur = rec[dateStr] || 'Present';\n    rec[dateStr] = ATT_CYCLE[(ATT_CYCLE.indexOf(cur)+1) % ATT_CYCLE.length];\n    renderAttendance();\n    saveState();\n  }\n\n  function markToday(status){\n    const emp = currentEmployee();\n    state.attendance[emp.id] = state.attendance[emp.id] || {};\n    const dow = new Date(TODAY + 'T00:00:00').getDay();\n    if(dow === 0 || dow === 6){ toast(\"Today is a weekend \u2014 nothing to mark\"); return; }\n    state.attendance[emp.id][TODAY] = status;\n    toast('Today marked as ' + status);\n    renderAttendance();\n    saveState();\n  }\n\n  function renderAttendance(){\n    ensureAttendanceSeed();\n    const emp = currentEmployee();\n    const rec = state.attendance[emp.id];\n    document.getElementById('attDow').innerHTML = DOW_NAMES.map(d => `\u003cdiv class=\"cal-dow\">${d}\u003c/div>`).join('');\n    const firstDay = new Date(state.attYear, state.attMonth, 1).getDay();\n    const daysInMonth = new Date(state.attYear, state.attMonth+1, 0).getDate();\n    const cells = []; for(let i=0;i\u003cfirstDay;i++) cells.push('\u003cdiv class=\"cal-cell empty\">\u003c/div>');\n    const counts = { Present:0, WFH:0, 'Half-day':0, Absent:0 };\n    for(let day=1; day\u003c=daysInMonth; day++){\n      const dateStr = `${state.attYear}-${String(state.attMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;\n      const dow = new Date(state.attYear, state.attMonth, day).getDay();\n      const status = rec[dateStr]; if(status) counts[status]++;\n      const future = dateStr > TODAY;\n      const colorMap = { Present:'var(--success)', WFH:'var(--primary)', 'Half-day':'#7C4FE0', Absent:'var(--danger)' };\n      cells.push(`\u003cdiv class=\"cal-cell att-cell ${status||''}\" ${(future||dow===0||dow===6)?'':`onclick=\"cycleAttendance('${dateStr}')\"`}>\n        \u003cdiv class=\"cal-daynum\">${day}\u003c/div>${status?`\u003cdiv class=\"att-tag\" style=\"color:${colorMap[status]};\">${status}\u003c/div>`:''}\u003c/div>`);\n    }\n    document.getElementById('attGrid').innerHTML = cells.join('');\n    document.getElementById('attendanceStats').innerHTML = `\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Present days\u003c/div>\u003cdiv class=\"stat-num\" style=\"color:var(--success);\">${counts.Present}\u003c/div>\u003cdiv class=\"stat-note\">This month\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">WFH days\u003c/div>\u003cdiv class=\"stat-num\" style=\"color:var(--primary);\">${counts.WFH}\u003c/div>\u003cdiv class=\"stat-note\">This month\u003c/div>\u003c/div>\n      \u003cdiv class=\"panel stat-card\">\u003cdiv class=\"stat-label\">Absent / half-day\u003c/div>\u003cdiv class=\"stat-num\" style=\"color:var(--danger);\">${counts.Absent+counts['Half-day']}\u003c/div>\u003cdiv class=\"stat-note\">${counts.Absent} absent \u00b7 ${counts['Half-day']} half-day\u003c/div>\u003c/div>\n    `;\n\n    const todayStatus = rec[TODAY];\n    document.querySelectorAll('#markTodayRow .filter-chip').forEach(chip => {\n      chip.classList.toggle('active', chip.dataset.mt === todayStatus);\n    });\n    const statusNote = document.getElementById('markTodayStatus');\n    if(statusNote){\n      statusNote.textContent = todayStatus ? `marked as ${todayStatus} (${fmt(TODAY)})` : `not marked yet (${fmt(TODAY)})`;\n      statusNote.style.color = todayStatus ? 'var(--success)' : 'var(--ink-faint)';\n    }\n  }\n\n  // ==================== PART 14: LEAVE POLICIES ====================\n  function renderPolicies(){\n    document.getElementById('policiesGrid').innerHTML = state.leaveTypeList.map(type => {\n      const p = state.policy[type];\n      const removable = state.leaveTypeList.length > 1;\n      return `\u003cdiv class=\"panel\">\n        \u003cdiv class=\"policy-head\">\u003cspan class=\"policy-type\" style=\"color:${typeColor(type)};\">${type}\u003c/span>${removable?`\u003cbutton class=\"type-remove\" onclick=\"removeLeaveType('${type}')\">Remove\u003c/button>`:''}\u003c/div>\n        \u003cdiv class=\"policy-field\">\u003clabel>Annual entitlement\u003c/label>\u003cinput type=\"number\" min=\"0\" value=\"${p.total}\" onchange=\"updatePolicyTotal('${type}', this.value)\" />\u003c/div>\n        \u003cdiv class=\"policy-field\">\u003clabel>Carry forward\u003c/label>\u003cinput type=\"checkbox\" ${p.carryForward?'checked':''} onchange=\"updatePolicyCarry('${type}', this.checked)\" />\u003c/div>\n        \u003cdiv class=\"policy-field\">\u003clabel>Max carry-forward days\u003c/label>\u003cinput type=\"number\" min=\"0\" value=\"${p.maxCarry||0}\" ${p.carryForward?'':'disabled'} onchange=\"updatePolicyMaxCarry('${type}', this.value)\" />\u003c/div>\n        \u003cdiv class=\"policy-field\">\u003clabel>Requires approval\u003c/label>\u003cinput type=\"checkbox\" ${p.requiresApproval!==false?'checked':''} onchange=\"updatePolicyApproval('${type}', this.checked)\" />\u003c/div>\n        \u003cdiv class=\"policy-field\">\u003clabel>Proof required after (days)\u003c/label>\u003cinput type=\"number\" min=\"0\" value=\"${p.proofAfter||0}\" onchange=\"updatePolicyProof('${type}', this.value)\" />\u003c/div>\n      \u003c/div>`;\n    }).join('');\n  }\n  function updatePolicyTotal(type, v){ state.policy[type].total = Math.max(0, parseInt(v)||0); toast(type+' entitlement updated'); saveState(); }\n  function updatePolicyCarry(type, checked){ state.policy[type].carryForward = checked; renderPolicies(); saveState(); }\n  function updatePolicyMaxCarry(type, v){ state.policy[type].maxCarry = Math.max(0, parseInt(v)||0); saveState(); }\n  function updatePolicyApproval(type, checked){ state.policy[type].requiresApproval = checked; saveState(); }\n  function updatePolicyProof(type, v){ state.policy[type].proofAfter = Math.max(0, parseInt(v)||0); saveState(); }\n\n  function addLeaveType(){\n    const nameEl = document.getElementById('newTypeName'), daysEl = document.getElementById('newTypeDays');\n    const name = nameEl.value.trim(); const days = Math.max(0, parseInt(daysEl.value)||0);\n    if(!name){ toast('Give the new leave type a name'); return; }\n    if(state.leaveTypeList.includes(name)){ toast('That leave type already exists'); return; }\n    state.leaveTypeList.push(name);\n    state.policy[name] = { total:days, carryForward:false, maxCarry:0, proofAfter:0, requiresApproval:true };\n    state.employees.forEach(e => { e.leaveUsed[name] = 0; e.bonusDays[name] = 0; });\n    nameEl.value=''; daysEl.value=10;\n    toast(name + ' added as a leave type');\n    renderPolicies(); saveState();\n  }\n  function removeLeaveType(type){\n    if(state.leaveTypeList.length \u003c= 1){ toast('At least one leave type must remain'); return; }\n    if(!window.confirm(`Remove \"${type}\" as a leave type? Existing history for it is kept, but it can no longer be applied for.`)) return;\n    state.leaveTypeList = state.leaveTypeList.filter(t => t !== type);\n    delete state.policy[type];\n    state.employees.forEach(e => { delete e.leaveUsed[type]; delete e.bonusDays[type]; });\n    if(state.selectedType === type) state.selectedType = state.leaveTypeList[0];\n    toast(type + ' removed');\n    renderPolicies(); saveState();\n  }\n\n  // ==================== PART 15: FINAL INTEGRATION ====================\n  function renderIntegration(){\n    document.getElementById('persistToggle').checked = state.persistEnabled;\n    updateViewportReadout();\n    const emp = currentEmployee();\n    const allKeys = allowedKeys(emp.role);\n    document.getElementById('sitemapGrid').innerHTML = Object.keys(PART_NUM).map(key => {\n      const locked = !allKeys.includes(key);\n      return `\u003cdiv class=\"sitemap-card ${locked?'locked':''}\" onclick=\"${locked?'':`showView('${key}')`}\">\n        \u003cdiv class=\"sm-num\">PT.${PART_NUM[key]}\u003c/div>\n        \u003cdiv class=\"sm-title\">${PART_TITLE[key]}\u003c/div>\n        \u003cdiv class=\"sm-role\">${locked ? 'Not available for ' + emp.role : GROUP_OF[key]}\u003c/div>\n      \u003c/div>`;\n    }).join('');\n    refreshLastSavedNote();\n    refreshStorageStatus();\n  }\n  function updateViewportReadout(){ document.getElementById('viewportReadout').textContent = window.innerWidth + 'px \u00d7 ' + window.innerHeight + 'px'; }\n  window.addEventListener('resize', updateViewportReadout);\n\n  function togglePersist(checked){ state.persistEnabled = checked; if(checked){ saveState(); toast('Local saving turned on'); } else toast('Local saving turned off'); }\n  function resetDemoData(){\n    try{\n      if(window.storage) window.storage.delete('lms-state', false).catch(()=>{});\n      else localStorage.removeItem('lms-state');\n    }catch(e){ /* ignore */ }\n    toast('Demo data reset \u2014 reloading');\n    setTimeout(() => location.reload(), 900);\n  }\n\n  function changePassword(){\n    const emp = currentEmployee();\n    const cur = document.getElementById('curPass').value;\n    const next = document.getElementById('newPass').value;\n    const confirmVal = document.getElementById('confirmPass').value;\n    if(cur !== emp.password){ toast('Current password is incorrect'); return; }\n    if(!next || next.length \u003c 4){ toast('New password must be at least 4 characters'); return; }\n    if(next !== confirmVal){ toast('New passwords do not match'); return; }\n    emp.password = next;\n    document.getElementById('curPass').value = '';\n    document.getElementById('newPass').value = '';\n    document.getElementById('confirmPass').value = '';\n    toast('Password updated');\n    saveState();\n  }\n\n  function toggleForgot(show){\n    document.getElementById('forgotPanel').classList.toggle('hidden', !show);\n    const box = document.getElementById('forgotResultBox');\n    box.classList.remove('show'); box.innerHTML = '';\n    if(show) document.getElementById('forgotUsername').value = '';\n  }\n  function handleForgotPassword(){\n    const u = document.getElementById('forgotUsername').value.trim().toUpperCase();\n    const emp = state.employees.find(e => e.username === u);\n    const box = document.getElementById('forgotResultBox');\n    if(!emp){\n      box.classList.add('show');\n      box.innerHTML = `\u003cdiv class=\"cc-title\" style=\"color:var(--danger);\">Not found\u003c/div>No account with that username.`;\n      return;\n    }\n    const idNum = emp.id.split('-')[1];\n    const newPassword = cap(emp.name.split(' ')[0]) + '@' + idNum;\n    emp.password = newPassword;\n    box.classList.add('show');\n    box.innerHTML = `\u003cdiv class=\"cc-title\">Password reset\u003c/div>Your new password is \u003cspan class=\"mono\">${newPassword}\u003c/span>. Use it to sign in.`;\n    saveState();\n    renderDemoAccounts();\n  }\n\n  // ==================== LOCAL DATA PERSISTENCE ====================\n  function refreshLastSavedNote(){\n    const el = document.getElementById('lastSavedNote'); if(!el) return;\n    el.textContent = state.lastSaved ? ('Saved at ' + state.lastSaved) : 'Not saved yet';\n  }\n  function refreshStorageStatus(){\n    const el = document.getElementById('storageStatusNote'); if(!el) return;\n    if(window.storage){ el.textContent = 'Connected \u2014 synced to your Claude.ai account'; return; }\n    try{\n      localStorage.setItem('__lms_probe__','1'); localStorage.removeItem('__lms_probe__');\n      el.textContent = 'Connected \u2014 saved to this browser only (won\\'t follow you to another device)';\n    }catch(e){\n      el.textContent = 'Unavailable in this environment \u2014 changes reset on refresh';\n    }\n  }\n  function snapshotState(){\n    return {\n      employees: state.employees, requests: state.requests, policy: state.policy,\n      notifications: state.notifications, nextReqId: state.nextReqId, nextNotifId: state.nextNotifId,\n      nextEmpNum: state.nextEmpNum, attendance: state.attendance, leaveTypeList: state.leaveTypeList,\n      adjustments: state.adjustments, nextAdjId: state.nextAdjId\n    };\n  }\n  async function saveState(){\n    if(!state.persistEnabled) return;\n    const payload = JSON.stringify(snapshotState());\n    try{\n      if(window.storage){\n        await window.storage.set('lms-state', payload, false);\n      } else {\n        localStorage.setItem('lms-state', payload);\n      }\n      state.lastSaved = new Date().toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });\n      refreshLastSavedNote();\n    }catch(e){ /* saving unavailable in this environment \u2014 app still works in-memory for this session */ }\n  }\n  async function loadState(){\n    let raw = null;\n    try{\n      if(window.storage){\n        const res = await window.storage.get('lms-state', false);\n        raw = res && res.value;\n      } else {\n        raw = localStorage.getItem('lms-state');\n      }\n    }catch(e){ raw = null; }\n    if(!raw) return;\n    try{\n      const saved = JSON.parse(raw);\n      Object.assign(state, {\n        employees: saved.employees || state.employees,\n        requests: saved.requests || state.requests,\n        policy: saved.policy || state.policy,\n        notifications: saved.notifications || state.notifications,\n        nextReqId: saved.nextReqId || state.nextReqId,\n        nextNotifId: saved.nextNotifId || state.nextNotifId,\n        nextEmpNum: saved.nextEmpNum || state.nextEmpNum,\n        attendance: saved.attendance || state.attendance,\n        leaveTypeList: saved.leaveTypeList || state.leaveTypeList,\n        adjustments: saved.adjustments || state.adjustments,\n        nextAdjId: saved.nextAdjId || state.nextAdjId\n      });\n      state.employees.forEach(e => { if(!e.bonusDays) e.bonusDays = {}; state.leaveTypeList.forEach(t => { if(e.bonusDays[t] === undefined) e.bonusDays[t] = 0; }); });\n      migrateSavedData();\n    }catch(e){ /* corrupted or no saved data yet */ }\n  }\n\n  // Repairs data saved by an older version of this app so nothing already added gets lost \u2014\n  // fills in fields the current version expects, but never adds or removes employees.\n  function migrateSavedData(){\n    let changed = false;\n\n    // Older saves may be missing newer per-request fields \u2014 fill them in so nothing breaks.\n    state.requests.forEach(r => {\n      if(r.ceoId === undefined){ r.ceoId = null; changed = true; }\n      if(r.managerComment === undefined){ r.managerComment = ''; changed = true; }\n      if(r.hrComment === undefined){ r.hrComment = ''; changed = true; }\n      if(r.ceoComment === undefined){ r.ceoComment = ''; changed = true; }\n    });\n\n    if(state.holidayYear === undefined){ state.holidayYear = 2026; changed = true; }\n    if(!state.holidays.length || state.holidays[0].id === undefined){\n      state.holidays.forEach((h, i) => { if(h.id === undefined){ h.id = i + 1; changed = true; } });\n      if(state.nextHolidayId === undefined) state.nextHolidayId = state.holidays.length + 1;\n    }\n\n    // Make sure there is always at least one HR account to sign in with \u2014 but never add one back\n    // just because a CEO or other role happens to be missing; that's now a deliberate HR decision.\n    if(!state.employees.some(e => e.role === 'HR') && state.employees.length){\n      state.employees[0].role = 'HR';\n      changed = true;\n    }\n\n    if(changed){ saveState(); }\n  }\n\n  // ==================== INIT ====================\n  renderDemoAccounts();\n  loadState().then(() => { renderDemoAccounts(); });\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"}, {"id": "parkgrid.html", "name": "ParkGrid", "desc": "Smart parking management: slots, vehicles and occupancy.", "html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n\u003ctitle>ParkGrid \u2014 Smart Parking Management\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\" />\n\u003cstyle>\n:root{\n  /* Core palette \u2014 cool slate / control-room with cyan accent (distinct from any restaurant identity) */\n  --ink:#0b1220; --surface:#111b2e; --surface-raised:#16233a; --surface-hover:#1c2c47;\n  --border:#25344f; --paper:#eaf1fb; --paper-dim:#a9b8d1; --muted:#7387a8;\n  --cyan:#22c3e6; --cyan-bright:#5fdcf5; --cyan-dim:rgba(34,195,230,.14);\n\n  /* Slot / booking status colors */\n  --available:#2fd67e; --available-bg:rgba(47,214,126,.14);\n  --reserved:#f2b23c; --reserved-bg:rgba(242,178,60,.14);\n  --occupied:#f2495c; --occupied-bg:rgba(242,73,92,.14);\n  --outofservice:#6c7891; --outofservice-bg:rgba(108,120,145,.16);\n  --active:#4a8fe0; --active-bg:rgba(74,143,224,.14);\n  --completed:#6c7891; --completed-bg:rgba(108,120,145,.16);\n  --cancelled:#f2495c; --cancelled-bg:rgba(242,73,92,.14);\n\n  --font-display:'Sora',-apple-system,sans-serif; --font-body:'Manrope',-apple-system,sans-serif; --font-mono:'JetBrains Mono',monospace;\n  --radius:12px; --radius-sm:7px; --shadow:0 10px 28px rgba(0,0,0,.45); --sidebar-w:230px;\n}\n*{box-sizing:border-box}\nhtml,body,#root{height:100%}\nbody{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.01em}\n.mono{font-family:var(--font-mono)}\nbutton{font-family:var(--font-body);cursor:pointer}\ninput,select,textarea{font-family:var(--font-body)}\n::selection{background:var(--cyan);color:var(--ink)}\n:focus-visible{outline:2px solid var(--cyan-bright);outline-offset:2px}\n.hidden{display:none !important}\n\n/* ---- Login ---- */\n.login-wrap{min-height:100vh;display:flex}\n@media (max-width:760px){.login-wrap{flex-direction:column}}\n.login-left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;background:radial-gradient(circle at 25% 15%, rgba(34,195,230,.10), transparent 55%), var(--surface);border-right:1px solid var(--border)}\n@media (max-width:760px){.login-left{border-right:none;border-bottom:1px solid var(--border);padding:32px 24px}}\n.brand-hero{max-width:400px;text-align:center}\n.hero-emblem{width:108px;height:108px;margin-bottom:20px}\n.hero-title{font-family:var(--font-display);font-size:32px;font-weight:800;letter-spacing:-.01em}\n.hero-sub{color:var(--paper-dim);font-size:14.5px;margin-top:12px;line-height:1.55}\n.hero-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}\n.hero-pill{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--surface-raised);border:1px solid var(--border);color:var(--paper-dim)}\n.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}\n.login-form{width:340px;padding:32px}\n.field-label{display:block;font-size:12.5px;font-weight:600;color:var(--paper-dim);margin-top:14px;margin-bottom:6px}\n.text-input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-raised);color:var(--paper);font-size:16px}\n@media (min-width:600px){.text-input{font-size:14px}}\n.login-error{margin-top:14px;font-size:13px;color:var(--occupied);background:var(--occupied-bg);padding:8px 12px;border-radius:var(--radius-sm)}\n.login-hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}\n.role-toggle{display:flex;gap:6px;margin-bottom:16px;background:var(--surface-raised);padding:4px;border-radius:var(--radius-sm);border:1px solid var(--border)}\n.role-toggle button{flex:1;padding:8px;border:none;background:none;border-radius:5px;color:var(--paper-dim);font-size:12.5px;font-weight:600}\n.role-toggle button.active{background:var(--cyan);color:var(--ink)}\n\n/* ---- App shell ---- */\n.app-shell{display:flex;min-height:100vh}\n.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px}\n.sidebar-brand-row{display:flex;align-items:center;gap:10px;padding:0 8px;margin-bottom:20px}\n.brand-mark{width:36px;height:36px;flex-shrink:0}\n.sidebar-brand{font-family:var(--font-display);font-size:17px;font-weight:800;line-height:1.15}\n.sidebar-eyebrow{font-family:var(--font-mono);font-size:9.5px;color:var(--cyan);letter-spacing:.08em;margin-top:2px}\n.nav-group-label{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;padding:14px 12px 6px}\n.nav-group-label:first-of-type{padding-top:0}\n.nav-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--paper-dim);text-decoration:none;font-size:13.5px;font-weight:600;transition:background .15s,color .15s;border:none;background:none;text-align:left;width:100%}\n.nav-link:hover{background:var(--surface-hover);color:var(--paper)}\n.nav-link.active{background:var(--cyan-dim);color:var(--cyan-bright)}\n.sidebar-footer{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}\n.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-hover);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--cyan-bright);flex-shrink:0}\n.main-area{flex:1;display:flex;flex-direction:column;min-width:0}\n.topbar{min-height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;flex-wrap:wrap;gap:8px}\n.topbar-user{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--paper-dim)}\n.role-chip{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:999px;background:var(--surface-raised);color:var(--cyan-bright);letter-spacing:.05em;border:1px solid var(--border)}\n.logout-btn{background:none;border:1px solid var(--border);color:var(--paper-dim);padding:6px 12px;border-radius:var(--radius-sm);font-size:13px}\n.logout-btn:hover{border-color:var(--cyan);color:var(--cyan-bright)}\n.page{flex:1;overflow-y:auto;padding:22px}\n@media (max-width:860px){\n  .sidebar{width:64px;padding:16px 8px}\n  .sidebar-brand,.sidebar-eyebrow,.nav-link span.label,.sidebar-footer{display:none}\n  .nav-link{justify-content:center}\n}\n\n/* ---- Shared components ---- */\n.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;font-size:13.5px;font-weight:700;transition:filter .15s,transform .05s}\n.btn:active{transform:translateY(1px)}\n.btn-primary{background:var(--cyan);color:var(--ink)}\n.btn-primary:hover{filter:brightness(1.1)}\n.btn-primary:disabled{background:var(--surface-raised);color:var(--muted);cursor:not-allowed}\n.btn-ghost{background:transparent;border-color:var(--border);color:var(--paper-dim)}\n.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan-bright)}\n.btn-danger{background:transparent;border-color:var(--occupied);color:var(--occupied)}\n.btn-danger:hover{background:var(--occupied-bg)}\n.btn-sm{padding:5px 10px;font-size:12px}\n.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;font-family:var(--font-mono);letter-spacing:.02em;text-transform:uppercase}\n.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}\n.empty-state{text-align:center;padding:56px 20px;color:var(--muted)}\n.empty-state h3{color:var(--paper-dim);margin-bottom:6px}\n.toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:1000;max-width:calc(100vw - 32px)}\n.toast{background:var(--surface-raised);border:1px solid var(--border);border-left:3px solid var(--cyan);padding:12px 18px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:13.5px;max-width:360px;animation:slide-in .2s ease-out}\n.toast.error{border-left-color:var(--occupied)}\n.toast.warn{border-left-color:var(--reserved)}\n@keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n.center-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--muted);font-size:13px}\n.modal-overlay{position:fixed;inset:0;background:rgba(4,8,16,.65);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}\n.modal-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow);max-height:88vh;overflow-y:auto}\n.modal-actions{display:flex;gap:10px;flex-direction:column}\n.modal-actions .btn{width:100%}\nselect,input[type=text],input[type=number],input[type=password],input[type=tel],textarea{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-raised);color:var(--paper);font-size:13.5px}\nlabel.small{font-size:12px;color:var(--paper-dim)}\n.dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:170px;z-index:20;overflow:hidden}\n.dropdown button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;color:var(--paper-dim);font-size:13px}\n.dropdown button:hover{background:var(--surface-hover)}\n.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}\n.stat-card-v2{display:flex;align-items:center;gap:12px}\n.stat-icon{width:38px;height:38px;border-radius:10px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}\n.stat-label{font-size:12px;color:var(--muted);margin-bottom:3px}\n.stat-value{font-size:22px;font-weight:700}\n.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n@media (max-width:980px){.two-col{grid-template-columns:1fr}}\n.slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}\n.slot-tile{border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);position:relative;background:var(--surface)}\n.icon-btn-sm{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--occupied);display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;font-size:11px;line-height:1}\n.qr-box{background:#fff;padding:10px;border-radius:8px;display:inline-block}\n.receipt-paper{background:var(--paper);color:#12181f;padding:22px 20px;border-radius:6px;font-family:var(--font-mono);font-size:12.5px;line-height:1.6}\n.receipt-divider{border-top:1px dashed #8b93a3;margin:10px 0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"root\">\u003c/div>\n\u003cscript>\n/* =========================================================\n   ParkGrid \u2014 standalone client-only Smart Parking Management System\n   No backend. All data lives in localStorage.\n   ========================================================= */\n\nconst STORAGE_KEY = \"parkgrid_state_v1\";\n\nconst VEHICLE_TYPES = {\n  CAR: { label: \"Car\", icon: \"\ud83d\ude97\", rate: 30, dailyRate: 240 },\n  BIKE: { label: \"Bike\", icon: \"\ud83c\udfcd\ufe0f\", rate: 15, dailyRate: 120 },\n  EV: { label: \"EV\", icon: \"\u26a1\", rate: 40, dailyRate: 320 },\n  VIP: { label: \"VIP\", icon: \"\u2b50\", rate: 80, dailyRate: 640 },\n};\nconst FLOORS = [\"Basement\", \"Ground Floor\", \"Floor 1\", \"Floor 2\"];\nconst SLOT_COUNTS_PER_FLOOR_TYPE = { CAR: 6, BIKE: 4, EV: 2, VIP: 2 };\nconst SUBSCRIBER_SLOT_TYPES = [\"CAR\", \"BIKE\"]; // types that get a dedicated subscriber-only slot per floor\n\nfunction buildSlots() {\n  const slots = [];\n  let id = 1;\n  FLOORS.forEach((floor, fi) => {\n    Object.keys(VEHICLE_TYPES).forEach((vt) => {\n      const count = SLOT_COUNTS_PER_FLOOR_TYPE[vt];\n      for (let i = 1; i \u003c= count; i++) {\n        const floorCode = floor === \"Basement\" ? \"B\" : floor === \"Ground Floor\" ? \"G\" : \"F\" + floor.slice(-1);\n        // Reserve the last slot of each Car/Bike group on every floor exclusively\n        // for vehicles with an active subscription \u2014 so they always have a spot.\n        const isSubscriberSlot = SUBSCRIBER_SLOT_TYPES.includes(vt) && i === count;\n        slots.push({\n          id: id++,\n          code: `${floorCode}-${vt[0]}${vt === \"EV\" ? \"V\" : \"\"}-${String(i).padStart(3, \"0\")}${isSubscriberSlot ? \"-S\" : \"\"}`,\n          floor,\n          vehicleType: vt,\n          status: \"AVAILABLE\",\n          reservationCode: null,\n          subscriberOnly: isSubscriberSlot,\n        });\n      }\n    });\n  });\n  return slots;\n}\n\nfunction seedState() {\n  return {\n    // No pre-seeded accounts anymore \u2014 Customer/Staff/Manager profiles are created\n    // automatically the first time someone signs in (see handleLoginSubmit).\n    users: [],\n    slots: buildSlots(),\n    bookings: [],\n    payments: [],\n    subscriptions: [],\n    notifications: [],\n    seq: { booking: 100001, payment: 1, subscription: 1, notification: 1 },\n    stateVersion: 1,\n  };\n}\n\nlet state = loadState();\nlet session = {\n  user: null,\n  page: \"dashboard\",\n  reserve: { floor: \"\", vehicleType: \"CAR\", slotId: null },\n  search: \"\",\n};\n\nfunction loadState() {\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if (raw) {\n      const loaded = JSON.parse(raw);\n      const fresh = seedState();\n      const merged = Object.assign({}, fresh, loaded);\n      // Registered Customer/Staff/Manager profiles are created at sign-in time now\n      // (no fixed credential list), so keep whatever was actually saved.\n      merged.users = loaded.users || fresh.users;\n      merged.seq = Object.assign({}, fresh.seq, merged.seq);\n      reconcileSlotStatuses(merged);\n      return merged;\n    }\n  } catch (e) {}\n  return seedState();\n}\n// Self-healing cleanup: earlier versions of this app had a bug where a slot could get\n// stuck showing RESERVED/OCCUPIED with nothing actually behind it anymore (e.g. a\n// booking that was since cancelled/completed elsewhere, or a stale write from before\n// the double-booking fixes existed). Anything that isn't backed by a real live\n// booking or an active paid subscription covering today gets freed back up.\nfunction reconcileSlotStatuses(st) {\n  let changed = false;\n  const now = new Date();\n  st.slots.forEach((slot) => {\n    if (slot.status !== \"RESERVED\" && slot.status !== \"OCCUPIED\") return;\n    const liveBooking = st.bookings.find((b) => b.slotId === slot.id && [\"RESERVED\", \"ACTIVE\", \"PENDING_PAYMENT\"].includes(b.status));\n    if (liveBooking) return;\n    const liveSub = st.subscriptions.find((s) => s.slotId === slot.id && s.status === \"ACTIVE\" && new Date(s.startDate) \u003c= now && new Date(s.endDate) >= now);\n    if (liveSub) return;\n    slot.status = \"AVAILABLE\";\n    changed = true;\n  });\n  return changed;\n}\nfunction saveState() {\n  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n}\nfunction nextSeq(kind) {\n  const n = state.seq[kind]++;\n  saveState();\n  return n;\n}\nfunction genBookingId() {\n  return \"SPM-\" + String(nextSeq(\"booking\"));\n}\n\n/* ---------- Toasts ---------- */\nlet toasts = [];\nfunction showToast(message, type) {\n  const id = Date.now() + Math.random();\n  toasts.push({ id, message, type: type || \"info\" });\n  renderToasts();\n  setTimeout(() => {\n    toasts = toasts.filter((t) => t.id !== id);\n    renderToasts();\n  }, 4200);\n}\nfunction renderToasts() {\n  let stack = document.getElementById(\"toast-stack\");\n  if (!stack) {\n    stack = document.createElement(\"div\");\n    stack.id = \"toast-stack\";\n    stack.className = \"toast-stack\";\n    document.body.appendChild(stack);\n  }\n  stack.innerHTML = toasts.map((t) => `\u003cdiv class=\"toast ${t.type}\">${escapeHtml(t.message)}\u003c/div>`).join(\"\");\n}\n\n/* ---------- Modal ---------- */\nfunction showModal({ title, bodyHtml, actions }) {\n  let host = document.getElementById(\"modal-root\");\n  if (!host) {\n    host = document.createElement(\"div\");\n    host.id = \"modal-root\";\n    document.body.appendChild(host);\n  }\n  host.innerHTML = `\n    \u003cdiv class=\"modal-overlay\">\n      \u003cdiv class=\"modal-card\">\n        \u003ch3 style=\"margin-bottom:12px\">${escapeHtml(title)}\u003c/h3>\n        ${bodyHtml || \"\"}\n        \u003cdiv class=\"modal-actions\" style=\"margin-top:16px\">\n          ${actions.map((a, i) => `\u003cbutton class=\"btn ${a.primary ? \"btn-primary\" : \"btn-ghost\"}\" data-modal-action=\"${i}\">${escapeHtml(a.label)}\u003c/button>`).join(\"\")}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>`;\n  host.querySelectorAll(\"[data-modal-action]\").forEach((btn) => {\n    btn.addEventListener(\"click\", () => {\n      const idx = Number(btn.getAttribute(\"data-modal-action\"));\n      const action = actions[idx];\n      // Run the handler FIRST while its inputs are still in the DOM, then close\n      // (unless it wants to stay open, e.g. to show a validation error).\n      action.onClick?.();\n      if (!action.keepOpen) closeModal();\n    });\n  });\n}\nfunction closeModal() {\n  const host = document.getElementById(\"modal-root\");\n  if (host) host.innerHTML = \"\";\n}\n\n/* ---------- Utilities ---------- */\nfunction escapeHtml(str) {\n  const div = document.createElement(\"div\");\n  div.textContent = String(str == null ? \"\" : str);\n  return div.innerHTML;\n}\nfunction money(n) {\n  return Number(n || 0).toFixed(2);\n}\nfunction findSlot(id) {\n  return state.slots.find((s) => s.id === Number(id));\n}\nfunction findBooking(id) {\n  return state.bookings.find((b) => b.id === Number(id));\n}\nfunction findBookingByBookingId(bookingId) {\n  return state.bookings.find((b) => b.bookingId === bookingId);\n}\nfunction fmtTime(iso) {\n  if (!iso) return \"\u2014\";\n  const d = new Date(iso);\n  return d.toLocaleString(\"en-IN\", { day: \"2-digit\", month: \"short\", hour: \"2-digit\", minute: \"2-digit\" });\n}\nfunction minutesBetween(a, b) {\n  return Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));\n}\nfunction calcCharge(vehicleType, minutes) {\n  const rate = VEHICLE_TYPES[vehicleType].rate;\n  const hours = Math.max(1, Math.ceil(minutes / 60));\n  return hours * rate;\n}\nfunction activeSubscriptionFor(vehicleNumber) {\n  const now = new Date();\n  return state.subscriptions.find(\n    (s) =>\n      s.status === \"ACTIVE\" &&\n      s.vehicleNumber.toUpperCase() === (vehicleNumber || \"\").toUpperCase() &&\n      new Date(s.startDate) \u003c= now &&\n      new Date(s.endDate) >= now\n  );\n}\nfunction dateRangesOverlap(startA, endA, startB, endB) {\n  return new Date(startA) \u003c= new Date(endB) && new Date(startB) \u003c= new Date(endA);\n}\nfunction slotBookedForRange(slotId, startDate, endDate, excludeSubId) {\n  return state.subscriptions.find(\n    (s) =>\n      s.slotId === Number(slotId) &&\n      s.status !== \"CANCELLED\" &&\n      s.id !== excludeSubId &&\n      dateRangesOverlap(s.startDate, s.endDate, startDate, endDate)\n  );\n}\n// slotBookedForRange only ever checked OTHER SUBSCRIPTIONS \u2014 it never checked live\n// walk-in bookings. That gap let a subscription get approved/paid and silently\n// overwrite a slot that a walk-in customer was actively, physically parked in right\n// now, leaving two live claims (the walk-in booking AND the subscription) on the\n// same slot at once. This checks the other direction.\nfunction findLiveBookingOnSlot(slotId) {\n  return state.bookings.find((b) => b.slotId === Number(slotId) && [\"RESERVED\", \"ACTIVE\", \"PENDING_PAYMENT\"].includes(b.status));\n}\n// When a walk-in booking frees a slot, hand it back to a paid subscriber whose\n// coverage window includes today if one's waiting \u2014 otherwise it just goes AVAILABLE.\nfunction releaseSlot(slot) {\n  if (!slot) return;\n  const now = new Date();\n  const activeSub = state.subscriptions.find((s) => s.slotId === slot.id && s.status === \"ACTIVE\" && new Date(s.startDate) \u003c= now && new Date(s.endDate) >= now);\n  slot.status = activeSub ? \"RESERVED\" : \"AVAILABLE\";\n}\nfunction daysBetweenInclusive(startDate, endDate) {\n  const start = new Date(startDate);\n  start.setHours(0, 0, 0, 0);\n  const end = new Date(endDate);\n  end.setHours(0, 0, 0, 0);\n  return Math.round((end - start) / 86400000) + 1;\n}\nfunction logNotification(type, to, message) {\n  state.notifications.unshift({ id: nextSeq(\"notification\"), type, to, message, at: new Date().toISOString() });\n  if (state.notifications.length > 200) state.notifications.length = 200;\n}\nfunction todayBounds() {\n  const start = new Date();\n  start.setHours(0, 0, 0, 0);\n  const end = new Date();\n  end.setHours(23, 59, 59, 999);\n  return { start, end };\n}\n\n/* ---------- Root render ---------- */\nconst root = document.getElementById(\"root\");\nfunction render() {\n  if (!session.user) renderLogin();\n  else renderApp();\n}\nfunction navigate(page) {\n  session.page = page;\n  render();\n}\nfunction logout() {\n  session.user = null;\n  render();\n}\n\n/* ---------- Login ---------- */\nlet loginRoleHint = \"ADMIN\";\nconst STAFF_CODE = \"BKC001\";\nconst MANAGER_CODE = \"BKM001\";\nconst ROLE_LABELS = { ADMIN: \"Manager\", STAFF: \"Staff\", CUSTOMER: \"Customer\" };\nlet loginRole = \"CUSTOMER\";\n\nfunction renderLogin() {\n  root.innerHTML = `\n    \u003cdiv class=\"login-wrap\">\n      \u003cdiv class=\"login-left\">\n        \u003cdiv class=\"brand-hero\">\n          \u003csvg class=\"hero-emblem\" viewBox=\"0 0 140 140\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n            \u003ccircle cx=\"70\" cy=\"70\" r=\"66\" stroke=\"var(--cyan)\" stroke-width=\"1\" opacity=\"0.4\"/>\n            \u003crect x=\"20\" y=\"20\" width=\"100\" height=\"100\" rx=\"16\" stroke=\"var(--cyan)\" stroke-width=\"1.5\"/>\n            \u003crect x=\"30\" y=\"30\" width=\"80\" height=\"80\" rx=\"10\" stroke=\"var(--cyan)\" stroke-width=\"0.6\" opacity=\"0.5\"/>\n            \u003ctext x=\"70\" y=\"92\" text-anchor=\"middle\" font-family=\"Sora, sans-serif\" font-size=\"56\" font-weight=\"800\" fill=\"var(--paper)\">P\u003c/text>\n            \u003ccircle cx=\"106\" cy=\"34\" r=\"7\" fill=\"var(--available)\"/>\n          \u003c/svg>\n          \u003ch1 class=\"hero-title\">ParkGrid\u003c/h1>\n          \u003cp class=\"hero-sub\">Smart Parking Management \u2014 reserve, track, and manage every slot from one screen.\u003c/p>\n          \u003cdiv class=\"hero-pills\">\n            \u003cspan class=\"hero-pill\">\ud83c\udd7f\ufe0f Live slot map\u003c/span>\n            \u003cspan class=\"hero-pill\">\ud83d\udcf7 QR entry/exit\u003c/span>\n            \u003cspan class=\"hero-pill\">\ud83d\udcca Revenue analytics\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"login-right\">\n        \u003cform id=\"login-form\" class=\"login-form card\">\n          \u003ch2 style=\"margin-bottom:4px\">Welcome\u003c/h2>\n          \u003cp style=\"color:var(--muted);font-size:13px;margin:0 0 18px\">Runs entirely in your browser \u2014 no server needed.\u003c/p>\n          \u003cdiv class=\"role-toggle\" id=\"role-toggle\">\n            \u003cbutton type=\"button\" data-role=\"CUSTOMER\" class=\"active\">Customer\u003c/button>\n            \u003cbutton type=\"button\" data-role=\"STAFF\">Staff\u003c/button>\n            \u003cbutton type=\"button\" data-role=\"ADMIN\">Manager\u003c/button>\n          \u003c/div>\n          \u003cdiv id=\"login-fields\">\u003c/div>\n          \u003cdiv id=\"login-error\">\u003c/div>\n          \u003cbutton type=\"submit\" class=\"btn btn-primary\" style=\"margin-top:16px;width:100%\">Continue\u003c/button>\n          \u003cp class=\"login-hint\" id=\"login-hint\">\u003c/p>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>`;\n\n  renderLoginFields();\n\n  document.querySelectorAll(\"#role-toggle button\").forEach((btn) => {\n    btn.addEventListener(\"click\", () => {\n      document.querySelectorAll(\"#role-toggle button\").forEach((b) => b.classList.remove(\"active\"));\n      btn.classList.add(\"active\");\n      loginRole = btn.getAttribute(\"data-role\");\n      renderLoginFields();\n    });\n  });\n\n  document.getElementById(\"login-form\").addEventListener(\"submit\", handleLoginSubmit);\n}\n\nfunction renderLoginFields() {\n  const host = document.getElementById(\"login-fields\");\n  const hint = document.getElementById(\"login-hint\");\n  document.getElementById(\"login-error\").innerHTML = \"\";\n\n  if (loginRole === \"CUSTOMER\") {\n    host.innerHTML = `\n      \u003clabel class=\"field-label\">Full name\u003c/label>\n      \u003cinput id=\"lf-name\" class=\"text-input\" required autofocus />\n      \u003clabel class=\"field-label\">Vehicle number\u003c/label>\n      \u003cinput id=\"lf-vehicle\" class=\"text-input\" placeholder=\"e.g. KA-05-AB-1234\" required autocapitalize=\"characters\" />\n      \u003clabel class=\"field-label\">Phone number\u003c/label>\n      \u003cinput id=\"lf-phone\" class=\"text-input\" placeholder=\"10-digit mobile\" required inputmode=\"numeric\" />`;\n    hint.innerHTML = \"No password needed \u2014 your phone number identifies you next time too.\";\n  } else {\n    const codeLabel = loginRole === \"STAFF\" ? \"Staff code\" : \"Manager code\";\n    host.innerHTML = `\n      \u003clabel class=\"field-label\">Full name\u003c/label>\n      \u003cinput id=\"lf-name\" class=\"text-input\" required autofocus />\n      \u003clabel class=\"field-label\">${codeLabel}\u003c/label>\n      \u003cinput id=\"lf-code\" class=\"text-input\" placeholder=\"Provided by your organization\" autocapitalize=\"off\" required />\n      \u003cbutton type=\"button\" id=\"forgot-code-link\" class=\"btn btn-ghost btn-sm\" style=\"margin-top:8px\">Forgot the code?\u003c/button>`;\n    hint.innerHTML =\n      loginRole === \"STAFF\"\n        ? `Ask your manager for the shared staff code.`\n        : `Managers use the shared manager code \u2014 customers and staff can't self-assign this role.`;\n    document.getElementById(\"forgot-code-link\").addEventListener(\"click\", () => {\n      // There's no individual password in this app \u2014 Staff/Manager share one\n      // organization-wide code, so \"resetting\" it means showing whoever's allowed\n      // to see it what the current code is, not a per-person reset flow.\n      const code = loginRole === \"STAFF\" ? STAFF_CODE : MANAGER_CODE;\n      showModal({\n        title: `${codeLabel}`,\n        bodyHtml: `\u003cp style=\"color:var(--paper-dim);font-size:13.5px\">There's no individual password for this role \u2014 everyone on staff shares one organization code.\u003c/p>\n          \u003cdiv class=\"mono\" style=\"font-size:22px;font-weight:700;color:var(--cyan-bright);text-align:center;padding:14px;margin-top:10px;background:var(--surface-raised);border-radius:8px;letter-spacing:.05em\">${code}\u003c/div>\n          \u003cp style=\"color:var(--muted);font-size:12px;margin-top:10px\">If this code may have leaked, ask an admin to change it in the app's source, since it's shared org-wide rather than per-person.\u003c/p>`,\n        actions: [{ label: \"Close\", primary: true }],\n      });\n    });\n  }\n}\n\nfunction handleLoginSubmit(e) {\n  e.preventDefault();\n  const errorEl = document.getElementById(\"login-error\");\n  const name = document.getElementById(\"lf-name\").value.trim();\n\n  if (!name) {\n    errorEl.innerHTML = `\u003cdiv class=\"login-error\">Please fill in every field\u003c/div>`;\n    return;\n  }\n\n  let vehicleNumber = null;\n  let phone = null;\n  let existingUser = null;\n\n  if (loginRole === \"CUSTOMER\") {\n    phone = document.getElementById(\"lf-phone\").value.trim();\n    if (!phone) {\n      errorEl.innerHTML = `\u003cdiv class=\"login-error\">Please fill in every field\u003c/div>`;\n      return;\n    }\n    if (!/^[0-9]{10}$/.test(phone)) {\n      errorEl.innerHTML = `\u003cdiv class=\"login-error\">Enter a valid 10-digit phone number\u003c/div>`;\n      return;\n    }\n    existingUser = state.users.find((u) => u.mobile === phone && u.role === loginRole);\n    vehicleNumber = document.getElementById(\"lf-vehicle\").value.trim();\n    if (!vehicleNumber) {\n      errorEl.innerHTML = `\u003cdiv class=\"login-error\">Enter your vehicle number\u003c/div>`;\n      return;\n    }\n  } else {\n    // Staff/Manager log in with just their name and the shared role code each time \u2014\n    // no phone number is collected or stored for these roles.\n    const code = document.getElementById(\"lf-code\").value.trim();\n    const expected = loginRole === \"STAFF\" ? STAFF_CODE : MANAGER_CODE;\n    if (code !== expected) {\n      errorEl.innerHTML = `\u003cdiv class=\"login-error\">Incorrect ${loginRole === \"STAFF\" ? \"staff\" : \"manager\"} code\u003c/div>`;\n      return;\n    }\n    existingUser = state.users.find((u) => u.fullName.toLowerCase() === name.toLowerCase() && u.role === loginRole);\n  }\n\n  let user = existingUser;\n  if (user) {\n    user.fullName = name; // keep name up to date\n  } else {\n    user = { username: `${loginRole}-${phone || name.replace(/\\s+/g, \"\").toLowerCase()}-${Date.now()}`, fullName: name, role: loginRole, mobile: phone };\n    state.users.push(user);\n  }\n  if (vehicleNumber) user.lastVehicleNumber = vehicleNumber;\n  saveState();\n\n  session.user = user;\n  session.page = \"dashboard\";\n  if (vehicleNumber) session.reserve.lastVehicleNumber = vehicleNumber;\n  render();\n}\n\n/* ---------- App shell ---------- */\nconst NAV_GROUPS = [\n  {\n    label: \"OPERATIONS\",\n    items: [\n      { page: \"dashboard\", label: \"Dashboard\", icon: \"\u25c8\", roles: [\"ADMIN\", \"STAFF\", \"CUSTOMER\"] },\n      { page: \"slots\", label: \"Slot Map\", icon: \"\u25a6\", roles: [\"ADMIN\", \"STAFF\"] },\n      { page: \"reserve\", label: \"Reserve a Slot\", icon: \"\uff0b\", roles: [\"CUSTOMER\"] },\n      { page: \"my-bookings\", label: \"My Bookings\", icon: \"\ud83c\udfab\", roles: [\"CUSTOMER\"] },\n      { page: \"gate\", label: \"Entry / Exit\", icon: \"\ud83d\udea7\", roles: [\"ADMIN\", \"STAFF\"] },\n      { page: \"search\", label: \"Search\", icon: \"\ud83d\udd0e\", roles: [\"ADMIN\", \"STAFF\"] },\n      { page: \"subscriptions\", label: \"Subscriptions\", icon: \"\ud83d\udcc5\", roles: [\"ADMIN\", \"STAFF\", \"CUSTOMER\"] },\n    ],\n  },\n  {\n    label: \"MANAGEMENT\",\n    items: [\n      { page: \"reports\", label: \"Reports & Revenue\", icon: \"\ud83d\udcca\", roles: [\"ADMIN\"] },\n      { page: \"notifications\", label: \"Notification Log\", icon: \"\ud83d\udd14\", roles: [\"ADMIN\", \"STAFF\"] },\n    ],\n  },\n];\nconst PAGE_TITLES = {\n  dashboard: \"Dashboard\",\n  slots: \"Slot Map\",\n  reserve: \"Reserve a Slot\",\n  \"my-bookings\": \"My Bookings\",\n  gate: \"Vehicle Entry / Exit\",\n  search: \"Search\",\n  subscriptions: \"Subscriptions\",\n  reports: \"Reports & Revenue\",\n  notifications: \"Notification Log\",\n};\n\nfunction initialsOf(name) {\n  return (name || \"\").split(\" \").map((p) => p[0]).filter(Boolean).slice(0, 2).join(\"\").toUpperCase();\n}\n\nfunction renderApp() {\n  const role = session.user.role;\n  const allAllowed = NAV_GROUPS.flatMap((g) => g.items).filter((i) => i.roles.includes(role)).map((i) => i.page);\n  if (!allAllowed.includes(session.page)) session.page = allAllowed[0] || \"dashboard\";\n\n  root.innerHTML = `\n    \u003cdiv class=\"app-shell\">\n      \u003caside class=\"sidebar\">\n        \u003cdiv class=\"sidebar-brand-row\">\n          \u003csvg class=\"brand-mark\" viewBox=\"0 0 40 40\" xmlns=\"http://www.w3.org/2000/svg\">\n            \u003crect x=\"3\" y=\"3\" width=\"34\" height=\"34\" rx=\"9\" fill=\"var(--surface-raised)\" stroke=\"var(--cyan)\" stroke-width=\"1.2\"/>\n            \u003ctext x=\"20\" y=\"27\" text-anchor=\"middle\" font-family=\"Sora, sans-serif\" font-size=\"17\" font-weight=\"800\" fill=\"var(--paper)\">P\u003c/text>
