003cbutton class=\"btn btn-ghost btn-sm\" data-nav=\"gate\">Go to Entry/Exit \u2192\u003c/button>\n      \u003c/div>\n      \u003cdiv style=\"margin-top:12px\" id=\"dash-active-list\">\u003c/div>\n    \u003c/div>\n  `;\n  const activeHost = document.getElementById(\"dash-active-list\");\n  const active = state.bookings.filter((b) => b.status === \"ACTIVE\" || b.status === \"PENDING_PAYMENT\");\n  activeHost.innerHTML = active.length === 0\n    ? `\u003cdiv style=\"font-size:13px;color:var(--muted)\">Nothing on-site right now.\u003c/div>`\n    : active.map((b) => `\u003cdiv style=\"display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px\">\u003cspan class=\"mono\">${b.bookingId}\u003c/span>\u003cspan>${VEHICLE_TYPES[b.vehicleType].icon} ${escapeHtml(b.vehicleNumber)} \u00b7 ${b.slotCode}\u003c/span>\u003cspan class=\"badge\" style=\"color:var(--${BOOKING_STATUS_VAR[b.status]});background:var(--${BOOKING_STATUS_VAR[b.status]}-bg)\">${b.status.replace(\"_\", \" \")}\u003c/span>\u003c/div>`).join(\"\");\n  el.querySelectorAll(\"[data-nav]\").forEach((btn) => btn.addEventListener(\"click\", () => navigate(btn.getAttribute(\"data-nav\"))));\n}\n\nfunction renderStaffDashboard(el) {\n  const totalSlots = state.slots.length;\n  const occupied = state.slots.filter((s) => s.status === \"OCCUPIED\").length;\n  const available = state.slots.filter((s) => s.status === \"AVAILABLE\").length;\n  const reserved = state.slots.filter((s) => s.status === \"RESERVED\").length;\n  const pendingPayment = state.bookings.filter((b) => b.status === \"PENDING_PAYMENT\").length;\n\n  el.innerHTML = `\n    \u003cdiv class=\"stat-grid\" style=\"margin-bottom:20px\">\n      ${analyticsStat(\"\ud83c\udd7f\ufe0f\", \"Total slots\", totalSlots)}\n      ${analyticsStat(\"\u2705\", \"Available\", available, \"available\")}\n      ${analyticsStat(\"\ud83d\ude97\", \"Occupied\", occupied, \"occupied\")}\n      ${analyticsStat(\"\ud83d\udd53\", \"Reserved\", reserved, \"reserved\")}\n      ${analyticsStat(\"\ud83d\udcb3\", \"Awaiting payment\", pendingPayment, \"reserved\")}\n    \u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\">\n        \u003ch3 style=\"font-size:14.5px;color:var(--paper-dim)\">On-site right now\u003c/h3>\n        \u003cbutton class=\"btn btn-primary btn-sm\" data-nav=\"gate\">Process entry/exit \u2192\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"dash-active-list-staff\">\u003c/div>\n    \u003c/div>\n  `;\n  const host = document.getElementById(\"dash-active-list-staff\");\n  const active = state.bookings.filter((b) => b.status === \"ACTIVE\" || b.status === \"PENDING_PAYMENT\" || b.status === \"RESERVED\");\n  host.innerHTML = active.length === 0\n    ? `\u003cdiv style=\"font-size:13px;color:var(--muted)\">No bookings need attention right now.\u003c/div>`\n    : active.map((b) => gateBookingCard(b)).join(\"\");\n  wireGateActions(host);\n  el.querySelectorAll(\"[data-nav]\").forEach((btn) => btn.addEventListener(\"click\", () => navigate(btn.getAttribute(\"data-nav\"))));\n}\n\nfunction renderCustomerDashboard(el) {\n  const mine = state.bookings.filter((b) => b.mobile === session.user.mobile);\n  const activeOrReserved = mine.filter((b) => [\"RESERVED\", \"ACTIVE\", \"PENDING_PAYMENT\"].includes(b.status));\n  const availableNow = state.slots.filter((s) => s.status === \"AVAILABLE\").length;\n\n  el.innerHTML = `\n    \u003cdiv class=\"card\" style=\"margin-bottom:20px;background:radial-gradient(circle at 90% -10%, rgba(34,195,230,.12), transparent 60%)\">\n      \u003ch3 style=\"font-size:17px;margin-bottom:6px\">Welcome, ${escapeHtml(session.user.fullName)} \ud83d\udc4b\u003c/h3>\n      \u003cp style=\"color:var(--paper-dim);font-size:13.5px;margin:0 0 16px\">${availableNow} slots available right now across all floors.\u003c/p>\n      \u003cbutton class=\"btn btn-primary\" data-nav=\"reserve\">\uff0b Reserve a slot\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"margin-bottom:20px\">\n      \u003clabel class=\"field-label\" style=\"margin-top:0\">Quick search \u2014 vehicle number, Booking ID, or mobile\u003c/label>\n      \u003cinput id=\"cust-quick-search\" class=\"text-input\" style=\"width:100%\" placeholder=\"Search your bookings\u2026\" />\n      \u003cdiv id=\"cust-quick-results\" style=\"margin-top:12px\">\u003c/div>\n    \u003c/div>\n\n    \u003ch3 style=\"font-size:15px;margin-bottom:12px;color:var(--paper-dim)\">Active / upcoming bookings\u003c/h3>\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n      ${activeOrReserved.length === 0 ? `\u003cdiv class=\"empty-state card\">\u003ch3>No active bookings\u003c/h3>\u003cp>Reserve a slot to get started.\u003c/p>\u003c/div>` : activeOrReserved.map((b) => bookingCardHtml(b)).join(\"\")}\n    \u003c/div>\n  `;\n\n  el.querySelectorAll(\"[data-nav]\").forEach((btn) => btn.addEventListener(\"click\", () => navigate(btn.getAttribute(\"data-nav\"))));\n  wireBookingCardActions(el);\n\n  document.getElementById(\"cust-quick-search\").addEventListener(\"input\", (e) => {\n    const q = e.target.value.trim().toLowerCase();\n    const host = document.getElementById(\"cust-quick-results\");\n    if (!q) { host.innerHTML = \"\"; return; }\n    const matches = mine.filter((b) => b.bookingId.toLowerCase().includes(q) || b.vehicleNumber.toLowerCase().includes(q));\n    host.innerHTML = matches.length === 0\n      ? `\u003cdiv style=\"font-size:12.5px;color:var(--muted)\">No matches.\u003c/div>`\n      : matches.map((b) => `\u003cdiv style=\"font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)\">\u003cspan class=\"mono\">${b.bookingId}\u003c/span> \u2014 ${escapeHtml(b.vehicleNumber)} \u003cspan class=\"badge\" style=\"color:var(--${BOOKING_STATUS_VAR[b.status]});background:var(--${BOOKING_STATUS_VAR[b.status]}-bg);margin-left:6px\">${b.status.replace(\"_\", \" \")}\u003c/span>\u003c/div>`).join(\"\");\n  });\n}\n\n/* ---------- Boot ---------- */\n\n// Live status auto-refresh \u2014 re-renders the current page every few seconds so slot/\n// booking state stays fresh without a manual reload (feature: live status refresh).\nsetInterval(() => {\n  if (session.user && [\"dashboard\", \"slots\"].includes(session.page)) render();\n  else if (session.user && session.page === \"gate\") renderGateActiveList();\n}, 8000);\n\n// Expiry warning \u2014 checks every active booking against its expected exit time and\n// warns (once per booking) when it's within 10 minutes of expiring.\nfunction checkExpiryWarnings() {\n  const soon = Date.now() + 10 * 60000;\n  let changed = false;\n  state.bookings.forEach((b) => {\n    if (b.status === \"ACTIVE\" && b.expectedExit && !b.expiryWarned && new Date(b.expectedExit).getTime() \u003c= soon) {\n      b.expiryWarned = true;\n      changed = true;\n      logNotification(\"SMS\", b.mobile, `Heads up \u2014 your parking for ${b.bookingId} (${b.slotCode}) expires soon at ${fmtTime(b.expectedExit)}. Extend if needed.`);\n      if (session.user && (session.user.mobile === b.mobile || session.user.role !== \"CUSTOMER\")) {\n        showToast(`${b.bookingId} \u2014 parking time expiring soon (${b.slotCode})`, \"warn\");\n      }\n    }\n  });\n  if (changed) saveState();\n}\nsetInterval(checkExpiryWarnings, 15000);\n\n// No-show auto-release \u2014 a RESERVED booking nobody ever entered for eventually frees\n// the slot back up, instead of holding it hostage indefinitely.\nfunction checkReservationNoShows() {\n  let changed = false;\n  state.bookings.forEach((b) => {\n    if (b.status !== \"RESERVED\" || b.entryTime) return;\n    const minutesWaiting = (Date.now() - new Date(b.reservedAt).getTime()) / 60000;\n    if (minutesWaiting >= RESERVATION_AUTO_RELEASE_MINUTES) {\n      b.status = \"CANCELLED\";\n      b.cancelReason = \"No-show \u2014 auto-released\";\n      const slot = findSlot(b.slotId);\n      if (slot && slot.status === \"RESERVED\") releaseSlot(slot);\n      changed = true;\n      logNotification(\"SMS\", b.mobile, `Your reservation ${b.bookingId} (${b.slotCode}) was released after ${RESERVATION_AUTO_RELEASE_MINUTES} minutes with no entry recorded.`);\n      if (session.user && session.user.role !== \"CUSTOMER\") {\n        showToast(`${b.bookingId} auto-released \u2014 no entry recorded (${b.slotCode})`, \"warn\");\n      }\n    }\n  });\n  if (changed) {\n    saveState();\n    render();\n  }\n}\nsetInterval(checkReservationNoShows, 30000);\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "money-management.html", "name": "Money Management", "desc": "Locked with a secret code. Income and expenses for Bala and Kowsi, pie chart and hidden balances.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\" data-theme=\"dark\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Personal Money Management\u003c/title>\n\u003cstyle>\n:root{--bg:#eef0f6;--card:rgba(255,255,255,.85);--ink:#1b1c24;--mute:#6f7385;--line:rgba(0,0,0,.09);--exp:#e5483b;--inc:#1f7de0;--acc:#e5483b;--g:linear-gradient(135deg,#ff6a5c,#ff9a56);--b1:rgba(255,106,92,.25);--b2:rgba(89,169,255,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#14151b;--card:rgba(255,255,255,.06);--ink:#f3f3f7;--mute:#9a9db0;--line:rgba(255,255,255,.1);--exp:#ff7a6c;--inc:#6bb4ff;--acc:#ff5a4f;--b1:rgba(255,90,79,.22);--b2:rgba(89,169,255,.2)}}\n:root[data-theme=\"dark\"]{--bg:#14151b;--card:rgba(255,255,255,.06);--ink:#f3f3f7;--mute:#9a9db0;--line:rgba(255,255,255,.1);--exp:#ff7a6c;--inc:#6bb4ff;--acc:#ff5a4f;--b1:rgba(255,90,79,.22);--b2:rgba(89,169,255,.2)}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nbody::before{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 10% 0,var(--b1),transparent 45%),radial-gradient(circle at 95% 35%,var(--b2),transparent 42%)}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}\n:focus-visible{outline:3px solid var(--inc);outline-offset:2px}\n.app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}\n.who{display:flex;gap:8px;padding:12px 14px 0;overflow-x:auto}\n.pp{display:flex;align-items:center;gap:7px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);white-space:nowrap;font-weight:600;transition:transform .15s}\n.pp:active{transform:scale(.95)}.pp i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#10131c;font-style:normal;font-weight:800}\n.pp.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(255,90,79,.35)}\n.pp[data-a=np]{padding:5px 14px;color:var(--mute)}\n.top{display:flex;align-items:center;justify-content:center;gap:22px;padding:12px;font-size:1.25rem;font-weight:800}\n.top button{font-size:1.6rem;padding:0 12px;color:var(--mute)}\n.tabs{display:flex;margin:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:3px}\n.tabs button{flex:1;padding:9px 0;color:var(--mute);border-radius:9px;font-size:.92rem;transition:.2s}\n.tabs button.on{background:var(--g);color:#fff;font-weight:700}\n.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:12px 14px;padding:14px 0;border-radius:18px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(10px);font-size:.82rem;color:var(--mute);animation:up .4s both}\n.sum b{display:block;font-size:1.08rem}\n.i{color:var(--inc)}.e{color:var(--exp)}\n.dh{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;margin-top:6px;animation:up .35s both}\n.dh .d{font-size:1.55rem;font-weight:800}\n.wd{font-size:.78rem;padding:1px 8px;border-radius:6px;color:#fff;background:#6b6e78}.wd.w0{background:#ff6a5c}.wd.w6{background:#4a90ff}\n.dh .my{color:var(--mute);font-size:.85rem;flex:1}\n.row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;width:calc(100% - 28px);margin:0 14px 8px;text-align:left;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);align-items:center;animation:up .35s both;transition:transform .15s}\n.row:active{transform:scale(.98)}\n.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--b2)}\n.row .m{overflow-wrap:anywhere}.row .m small{display:block;color:var(--mute);font-size:.82rem}\n.row .a{white-space:nowrap;font-weight:700}\n.empty{margin:28px 16px;border:2px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--mute)}\n.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:3;width:60px;height:60px;border-radius:50%;background:var(--g);color:#fff;font-size:2rem;box-shadow:0 6px 18px rgba(255,90,79,.5);animation:pulse 2.4s infinite}\n.bn{position:fixed;left:0;right:0;bottom:0;z-index:2;background:var(--card);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}\n.bn div{max-width:520px;margin:0 auto;display:flex}\n.bn button{flex:1;padding:11px 0;font-size:.8rem;color:var(--mute)}.bn button span{display:block;font-size:1.25rem}.bn button.on{color:var(--acc);font-weight:700}\n.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 14px}\n.cal div{background:var(--card);border-radius:8px;min-height:60px;padding:3px;font-size:.68rem;overflow:hidden}.cal .h{min-height:0;text-align:center;color:var(--mute);background:none}\n.cal b{ class=\"lk\" id=\"lk\">\u003cdiv class=\"em\">\ud83d\udd12\u003c/div>\u003ch1>Personal Money Management\u003c/h1>\u003cp>Enter your secret code to open.\u003c/p>\n\u003cinput type=\"password\" id=\"code\" autocomplete=\"off\" aria-label=\"Secret code\" placeholder=\"Secret code\">\n\u003cp class=\"err\" id=\"lerr\" role=\"alert\">\u003c/p>\u003cbutton class=\"btn\" id=\"unlock\" type=\"button\">Unlock\u003c/button>\n\u003cdiv class=\"ref\">Code for reference\u003cb>1103_B&amp;K\u003c/b>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"app\">\u003cdiv class=\"warn\" id=\"warn\">Saving is blocked in this browser. New entries will disappear on refresh.\u003c/div>\n\u003cdiv id=\"head\">\u003c/div>\u003cdiv id=\"body\">\u003c/div>\u003c/div>\n\u003cbutton class=\"fab\" id=\"fab\" aria-label=\"Add transaction\">+\u003c/button>\n\u003cnav class=\"bn\">\u003cdiv id=\"nav\">\u003c/div>\u003c/nav>\n\n\u003cdialog id=\"dlg\">\u003cform id=\"f\" novalidate>\n  \u003cp class=\"to\" id=\"to\">\u003c/p>\n  \u003cfieldset>\u003clegend>Type\u003c/legend>\u003cdiv class=\"ch\" style=\"grid-template-columns:1fr 1fr\">\n    \u003clabel>\u003cinput type=\"radio\" name=\"type\" value=\"exp\" checked>\u003cspan>Expense\u003c/span>\u003c/label>\n    \u003clabel>\u003cinput type=\"radio\" name=\"type\" value=\"inc\">\u003cspan>Income\u003c/span>\u003c/label>\u003c/div>\u003c/fieldset>\n  \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"date\">Date\u003c/label>\u003cinput type=\"date\" id=\"date\">\u003c/div>\n  \u003cdiv>\u003clabel for=\"amt\">Amount (\u20b9)\u003c/label>\u003cinput type=\"number\" id=\"amt\" inputmode=\"decimal\" min=\"0\" step=\"0.01\">\u003c/div>\u003c/div>\n  \u003clabel for=\"what\">What did you buy? (e.g. Laptop)\u003c/label>\u003cinput type=\"text\" id=\"what\" maxlength=\"100\" autocomplete=\"off\">\n  \u003clabel for=\"where\">Where did you buy it? (e.g. Amazon)\u003c/label>\u003cinput type=\"text\" id=\"where\" maxlength=\"100\" autocomplete=\"off\">\n  \u003cdiv class=\"two\">\u003cdiv>\u003clabel for=\"cat\">Category\u003c/label>\u003cselect id=\"cat\">\u003c/select>\u003c/div>\n  \u003cdiv>\u003clabel for=\"sub\">Sub-category\u003c/label>\u003cinput type=\"text\" id=\"sub\" maxlength=\"40\" placeholder=\"Fruits\">\u003c/div>\u003c/div>\n  \u003cfieldset>\u003clegend>How did you buy/pay?\u003c/legend>\u003cdiv class=\"ch\" id=\"pay\">\u003c/div>\u003c/fieldset>\n  \u003clabel for=\"note\">Note (optional)\u003c/label>\u003cinput type=\"text\" id=\"note\" maxlength=\"200\">\n  \u003cp class=\"err\" id=\"err\" role=\"alert\">\u003c/p>\n  \u003cbutton class=\"btn\" type=\"submit\">Save\u003c/button>\n  \u003cbutton class=\"btn g\" type=\"button\" id=\"del\" hidden>Delete\u003c/button>\n  \u003cbutton class=\"btn g\" type=\"button\" id=\"cancel\">Cancel\u003c/button>\n\u003c/form>\u003c/dialog>\n\n\u003cdialog id=\"rec\">\u003ch3 style=\"margin:0 0 6px\">\u267b\ufe0f Recover deleted person\u003c/h3>\u003cdiv id=\"recl\">\u003c/div>\u003cbutton class=\"btn g\" type=\"button\" id=\"recx\">Close\u003c/button>\u003c/dialog>\n\u003cscript>\nconst KEY='pmm_v3',KH=6544524363532554,PAY=['Cash','UPI','Credit Card','Debit Card','Net Banking','EMI'];\nconst PI={Cash:'\ud83d\udcb5',UPI:'\ud83d\udcf2','Credit Card':'\ud83d\udcb3','Debit Card':'\ud83d\udcb3','Net Banking':'\ud83c\udfe6',EMI:'\ud83d\uddd3\ufe0f'};\nconst CI={Food:'\ud83c\udf5c','Tea & Coffee':'\u2615',Groceries:'\ud83d\uded2','Personal & Lifestyle':'\ud83c\udfac',Transport:'\ud83d\ude8c',Bills:'\ud83d\udca1',Shopping:'\ud83d\udecd\ufe0f',Health:'\ud83d\udc8a',Salary:'\ud83d\udcb0',Other:'\ud83d\udce6'};\nconst COL=['#ff6a5c','#ffb347','#4ade80','#59a9ff','#a78bfa','#f472b6','#2dd4bf','#facc15'],PC=['#59a9ff','#f472b6','#4ade80','#ffb347','#a78bfa'];\nconst MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\nconst h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i\u003cs.length;i++){c=s.charCo Object.entries(g).sort((a,b)=>b[1]-a[1])}\n\nfunction render(){\n  const l=mi(),inc=sum(l,'inc'),ex=sum(l,'exp'),mt=`${MN[m]} ${y}`;\n  let h=`\u003cdiv class=\"who\">${S.people.map(p=>`\u003cbutton data-p=\"${p.id}\" class=\"pp ${p.id===S.cur?'on':''}\">\u003ci style=\"background:${PC[p.c%5]}\">${esc(p.name[0].toUpperCase())}\u003c/i>${esc(p.name)}\u003c/button>`).join('')}\u003cbutton data-a=\"np\" class=\"pp\" aria-label=\"Add person\">+ Person\u003c/button>\u003c/div>`;\n  h+=nav==='more'?`\u003cdiv class=\"top\">More\u003c/div>`:`\u003cdiv class=\"top\">\u003cbutton data-a=\"pm\" aria-label=\"Previous month\">\u2039\u003c/button>\u003cspan>${{trans:mt,stats:'Stats \u00b7 '+mt,accounts:'Accounts \u00b7 '+mt}[nav]}\u003c/span>\u003cbutton data-a=\"nm\" aria-label=\"Next month\">\u203a\u003c/button>\u003c/div>`;\n  if(nav==='trans')h+=`\u003cdiv class=\"tabs\">${['daily','calendar','monthly','total'].map(t=>`\u003cbutton data-t=\"${t}\" class=\"${t===tab?'on':''}\">${t[0].toUpperCase()+t.slice(1)}\u003c/button>`).join('')}\u003c/div>\u003cdiv class=\"sum\">\u003cspan>Income\u003cb class=\"i\">${num(inc)}\u003c/b>\u003c/span>\u003cspan>Expenses\u003cb class=\"e\">${num(ex)}\u003c/b>\u003c/span>\u003cspan>Total\u003cb>${num(inc-ex)}\u003c/b>\u003c/span>\u003c/div>`;\n  $('head').innerHTML=h;\n  $('nav').innerHTML=[['trans','\ud83d\udcd2','Trans.'],['stats','\ud83d\udcca','Stats'],['accounts','\ud83c\udfe6','Accounts'],['more','\u2699\ufe0f','More']].map(([k,i,t])=>`\u003cbutton data-n=\"${k}\" class=\"${k===nav?'on':''}\">\u003cspan>${i}\u003c/span>${t}\u003c/button>`).join('');\n  $('fab').style.display=nav==='trans'?'block':'none';\n  $('body').innerHTML=body(l);\n}\nfunction pie(l){\n  const g=groupSum(l.filter(i=>i.type===st),'cat'),tot=g.reduce((a,x)=>a+x[1],0);\n  const sg=`\u003cdiv class=\"seg\">\u003cbutton data-st=\"exp\" class=\"${st==='exp'?'on':''}\">Expenses\u003c/button>\u003cbutton data-st=\"inc\" class=\"${st==='inc'?'on':''}\">Income\u003c/button>\u003c/div>`;\n  if(!tot)return sg+'\u003cdiv class=\"empty\">Nothing to show for this month yet.\u003c/div>';\n  let a=0;const c=g.map(([n,v],k)=>{const p=v/tot*100,s=`\u003ccircle r=\"15.9155\" cx=\"21\" cy=\"21\" fill=\"none\" stroke=\"${COL[k%8]}\" stroke-width=\"6\" stroke-dasharray=\"${p} ${100-p}\" stroke-dashoffset=\"${-a}\" data-k=\"s:${esc(n)}\" class=\"sl ${sh.has('s:'+n)?'hi':''}\">\u003ctitle>${esc(n)}\u003c/title>\u003c/circle>`;a+=p;return s}).join('');\n  return sg+`\u003csvg class=\"donut\" viewBox=\"0 0 42 42\" role=\"img\" aria-label=\"Pie chart by category\">\u003cg transform=\"rotate(-90 21 21)\">${c}\u003c/g>\u003cg data-k=\"s:all\" style=\"cursor:pointer\">\u003ccircle cx=\"21\" cy=\"21\" r=\"11\" fill=\"var(--bg)\"/>\u003ctext x=\"21\" y=\"20\" text-anchor=\"middle\" font-size=\"3\" fill=\"var(--mute)\">${st==='exp'?'Spent':'Earned'}\u003c/text>\u003ctext x=\"21\" y=\"25\" text-anchor=\"middle\" font-size=\"3.4\" font-weight=\"700\" fill=\"var(--ink)\">${sh.has('s:all')?'\u20b9 '+num(tot):'Tap to view'}\u003c/text>\u003c/g>\u003c/svg>`+\n  g.map(([n,v],k)=>`\u003cbutton class=\"li\" data-k=\"s:${esc(n)}\" style=\"animation-delay:${k*50}ms\">\u003cspan>\u003ci class=\"sw\" style=\"background:${COL[k%8]}\">\u003c/i>${CI[n]||'\ud83c\udff7\ufe0f'} ${esc(n)} \u003cspan class=\"hid\">${Math.round(v/tot*100)}%\u003c/span>\u003c/span>\u003cb class=\"${st==='exp'?'e':'i'}\">${val('s:'+n,v)}\u003c/b>\u003c/button>`).join('');\n}\nfunction body(l){\n  if(nav==='stats')return `\u003cdiv class=\"pad\">${pie(l)}\u003c/div>`;\n  if(nav==='accounts')return `\u003cdiv class=\"pad\">${PAY.map((p,k)=>{const q=l.filter(i=>i.pay===p),o=sh.has('a:'+p);return `\u003cbutton class=\"li\" data-k=\"a:${p}\" style=\"animation-delay:${k*50}ms\">\u003cspan>${PI[p]} ${p}\u003c/span>${o?`\u003cspan>\u003cb class=\"i\">${num(sum(q,'inc'))}\u003c/b> &nbsp; \u003cb class=\"e\">${num(sum(q,'exp'))}\u003c/b>\u003c/span>`:'\u003cspan class=\"hid\">Tap to view \ud83d\udc41\u003c/span>'}\u003c/button>`}).join('')}\u003cp style=\"color:var(--mute);font-size:.85rem\">Tap one to see its amount. Only one amount shows at a time, the one before it hides. Blue is income, red is expenses.\u003c/p>\u003c/div>`;\n  if(nav==='more')return `\u003cdiv class=\"pad\">\u003cbutton class=\"btn g\" data-a=\"lock\">\ud83d\udd12 Lock now\u003c/button>\u003cbutton class=\"btn g\" data-a=\"theme\">\ud83c\udf13 Switch light / dark\u003c/button>\u003cbutton class=\"btn g\" data-a=\"cat\">\ud83c\udff7\ufe0f Add a new category\u003c/button>\u003cbutton class=\"btn g\" data-a=\"csv\">\u2b07\ufe0f Download ${esc(who().name)}'s data (CSV)\u003c/button>\u003cbutton class=\"btn g\" data-a=\"dp\">\ud83d\uddd1\ufe0f Delete ${esc(who().name)} and all records\u003c/button>\u003cbutton class=\"btn g\" data-a=\"rec\">\u267b\ufe0f Recover a deleted person (${S.trash.length})\u003c/button>\u003cp style=\"color:var(--mute);font-size:.85rem\">Everyone's data is saved in this browser only, kept separate for each person. ${mine().length} entries for ${esc(who().name)}.\u003c/p>\u003c/div>`;\n  if(tab==='calendar'){\n    const f=new Date(y,m,1).getDay(),dm=new Date(y,m+1,0).getDate();let c=WD.map(d=>`\u003cdiv class=\"h\">${d[0]}\u003c/div>`).join('')+'\u003cdiv style=\"background:none\">\u003c/div>'.repeat(f);\n    for(let d=1;d\u003c=dm;d++){const q=l.filter(i=>i.date===y+'-'+p2(m+1)+'-'+p2(d)),a=sum(q,'inc'),b=sum(q,'exp');c+=`\u003cdiv>\u003cb>${d}\u003c/b>${a?`\u003cspan class=\"i\">${num(a)}\u003c/span>\u003cbr>`:''}${b?`\u003cspan class=\"e\">${num(b)}\u003c/span>`:''}\u003c/div>`}\n    return `\u003cdiv class=\"cal\">${c}\u003c/div>`;\n  }\n  if(tab==='monthly')return `\u003cdiv class=\"pad\">\u003ch3>${y}\u003c/h3>${MN.map((n,k)=>{const q=mine().filter(i=>i.date.startsWith(y+'-'+p2(k+1)));return `\u003cbutton class=\"li\" data-mo=\"${k}\">\u003cspan>${n}\u003c/span>\u003cspan>\u003cb class=\"i\">${num(sum(q,'inc'))}\u003c/b> &nbsp; \u003cb class=\"e\">${num(sum(q,'exp'))}\u003c ==n.toLowerCase()))S.cats.push(n);save();return S.cats.find(c=>c.toLowerCase()===n.toLowerCase())}\nfunction csv(){const q=s=>'\"'+String(s).replace(/\"/g,'\"\"')+'\"';const r=[['Person','Date','Type','Amount','Category','Sub-category','What','Where','Paid by','Note'].join(',')].concat(mine().map(i=>[who().name,i.date,i.type==='inc'?'Income':'Expense',i.amount,i.cat,i.sub,i.what,i.where,i.pay,i.note].map(q).join(',')));\n  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.join('\\n')],{type:'text/csv'}));a.download=who().name+'-money.csv';a.click()}\n\ndocument.addEventListener('click',e=>{\n  const t=e.target.closest('[data-k],button');if(!t||t.closest('dialog'))return;const d=t.dataset;\n  if(d.k){const had=sh.has(d.k);sh.clear();if(!had)sh.add(d.k)}\n  else if(d.p){S.cur=d.p;save()}\n  else if(d.a==='np'){const n=(prompt('Person name')||'').trim().slice(0,30);if(!n)return;const id='p'+Date.now();S.people.push({id,name:n,c:S.people.length});S.cur=id;save()}\n  else if(d.a==='pm'){m--;if(m\u003c0){m=11;y--}}else if(d.a==='nm'){m++;if(m>11){m=0;y++}}\n  else if(d.st)st=d.st;else if(d.t)tab=d.t;else if(d.n)nav=d.n;else if(d.mo){m=+d.mo;tab='daily'}\n  else if(d.id){openForm(d.id);return}\n  else if(d.a==='theme'){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pmm_theme',n)}catch(x){}}\n  else if(d.a==='lock'){lockNow();return}\n  else if(d.a==='cat'){addCat()}\n  else if(d.a==='csv')csv();\n  else if(d.a==='dp'){if(S.people.length\u003c2){alert('Add another person first. At least one person must stay.');return}\n    if(!confirm('Delete '+who().name+' and all their records? You can recover them later with the secret key.'))return;\n    S.trash.push({p:who(),items:mine(),at:Date.now()});S.items=S.items.filter(i=>i.pid!==S.cur);S.people=S.people.filter(q=>q.id!==S.cur);S.cur=S.people[0].id;save()}\n  else if(d.a==='rec'){if(!S.trash.length){alert('Nothing to recover.');return}const k=prompt('Enter the secret key to recover');if(k===null)return;if(h53(k.trim())!==KH){alert('Wrong secret key');return}openRec();return}\n  else return;\n  render();\n});\n$('pay').innerHTML=PAY.map(p=>`\u003clabel>\u003cinput type=\"radio\" name=\"pay\" value=\"${p}\">\u003cspan>${PI[p]} ${p}\u003c/span>\u003c/label>`).join('');\n$('fab').onclick=()=>openForm(null);$('cancel').onclick=()=>$('dlg').close();\nfunction fillCats(sel){$('cat').innerHTML=S.cats.map(c=>`\u003coption>${esc(c)}\u003c/option>`).join('')+'\u003coption value=\"__new\">\uff0b New category\u2026\u003c/option>';$('cat').value=sel&&S.cats.includes(sel)?sel:S.cats[0]}\n$('cat').onchange=()=>{if($('cat').value==='__new'){const c=addCat();fillCats(c)}};\nfunction openForm(id){\n  editId=id;const i=id?S.items.find(x=>x.id===id):null;$('err').textContent='';\n  $('to').textContent='\ud83d\udcbe Saving to '+who().name+\"'s account\";\n  document.querySelector(`input[name=type][value=${i?i.type:'exp'}]`).checked=true;\n  $('date').value=i?i.date:iso(now.getFullYear()===y&&now.getMonth()===m?new Date():new Date(y,m,1));\n  $('amt').value=i?i.amount:'';$('what').value=i?i.what:'';$('where').value=i?i.where:'';$('sub').value=i?i.sub:'';$('note').value=i?i.note:'';\n  fillCats(i&&i.cat);\n  document.querySelectorAll('input[name=pay]').forEach(r=>r.checked=!!i&&r.value===i.pay);\n  $('del').hidden=!i;$('dlg').showModal();$('what').focus();\n}\n$('del').onclick=()=>{if(confirm('Delete this entry?')){S.items=S.items.filter(x=>x.id!==editId);save();$('dlg').close();render()}};\n$('f').addEventListener('submit',e=>{\n  e.preventDefault();\n  const v={type:document.querySelector('input[name=type]:checked').value,date:$('date').value,amount:parseFloat($('amt').value),what:$('what').value.trim(),where:$('where').value.trim(),cat:$('cat').value,sub:$('sub').value.trim(),note:$('note').value.trim(),pay:(document.querySelector('input[name=pay]:checked')||{}).value};\n  const er=!v.date?'Pick a date.':!(v.amount>=0)?'Enter the amount.':!v.what?'Enter what you bought.':!v.where?'Enter where you bought it.':!v.pay?'Choose how you paid.':'';\n  if(er){$('err').textContent=er;return}\n  if(editId)Object.assign(S.items.find(x=>x.id===editId),v);else S.items.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),at:Date.now(),pid:S.cur,...v});\n  save();y=+v.date.slice(0,4);m=+v.date.slice(5,7)-1;nav='trans';tab='daily';$('dlg').close();render();\n});\nfunction openRec(){\n  $('recl').innerHTML=S.trash.map((t,i)=>`\u003cdiv class=\"li\">\u003cspan>${esc(t.p.name)}\u003cbr>\u003csmall class=\"hid\">${t.items.length} records \u00b7 deleted ${new Date(t.at).toLocaleDateString('en-IN')}\u003c/small>\u003c/span>\u003cbutton class=\"pp on\" data-r=\"${i}\" style=\"padding:8px 16px\">Restore\u003c/button>\u003c/div>`).join('');\n  $('rec').showModal();\n}\n$('recx').onclick=()=>$('rec').close();\n$('recl').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;\n  const t=S.trash.splice(+b.dataset.r,1)[0];\n  if(!S.people.some(q=>q.id===t.p.id))S.people.push(t.p);\n  const have=new Set(S.items.map(i=>i.id));t.items.forEach(i=>{if(!have.has(i.id))S.items.push(i)});\n  S.cur=t.p.id;save();$('rec').close();nav='trans';render();});\nfunction tryUnlock(){\n  if(h53($('code').value.trim())===KH){document.body.classList.remove('locked');$('code').value='';$('lerr').textContent=''}\n  else{$('lerr').textContent='Wrong secret code';$('code').value='';const k=$('lk');k.classList.remove('shake');void k.offsetWidth;k.classList.add('shake');$('code').focus()}\n}\nfunction lockNow(){sh.clear();document.body.classList.add('locked');$('code').focus()}\n$('unlock').onclick=tryUnlock;\n$('code').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});\nload();render();$('code').focus();\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"id": "coin-catcher.html", "name": "Coin Catcher", "desc": "Game: catch gold, silver and bronze coins, dodge bombs, and save each player's best score.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Coin Catcher\u003c/title>\n\u003cstyle>\n:root{--bg:#e6f1ff;--sky1:#b9dcff;--sky2:#eef7ff;--ink:#14243a;--mute:#5b6f88;--card:rgba(255,255,255,.92);--acc:#ff8a00;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0b1324;--sky1:#14284a;--sky2:#0d1a33;--ink:#eaf1ff;--mute:#8da2c4;--card:rgba(22,34,64,.94);--acc:#ffb020;--accink:#1b1200}}\n:root[data-theme=\"dark\"]{--bg:#0b1324;--sky1:#14284a;--sky2:#0d1a33;--ink:#eaf1ff;--mute:#8da2c4;--card:rgba(22,34,64,.94);--acc:#ffb020;--accink:#1b1200}\n*{box-sizing:border-box}html{height:100%}\nbody{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,\"Segoe UI\",sans-serif;display:flex;justify-content:center}\n.game{width:100%;max-width:420px;padding:14px}\n.hud{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin-bottom:10px;font-weight:700}\n.hud small{display:block;color:var(--mute);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}\n.hud b{font-size:1.4rem}\n.wrap{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}\ncanvas{display:block;width:100%;height:auto;touch-action:none;background:var(--sky2)}\n.ov{position:absolute;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35)}\n.ov.hide{display:none}\n.panel{background:var(--card);border-radius:20px;padding:22px 20px;text-align:center;width:100%;max-width:320px;margin:auto}\n.panel input{width:100%;padding:11px;margin:0 0 12px;font:inherit;text-align:center;border-radius:12px;border:1.5px solid var(--mute);background:var(--bg);color:var(--ink)}\n.panel h2{font-size:1rem;margin:18px 0 6px}\n.lb{list-style:none;margin:0;padding:0;text-align:left}.lb li{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(128,128,128,.25)}\n.mut{font-size:.85rem;margin:0}\n.panel h1{margin:0 0 6px;font-size:1.7rem}\n.panel p{margin:0 0 14px;color:var(--mute);font-size:.95rem}\n.panel .big{font-size:2.6rem;line-height:1.1;margin:0 0 4px;color:var(--ink)}\nbutton{font:700 1.05rem system-ui,sans-serif;background:var(--acc);color:var(--accink);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;transition:transform .12s}\nbutton:active{transform:scale(.94)}button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}\n.panel>button{display:block;width:100%}\n.lg{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;font-size:.82rem;color:var(--ink)!important}\n.cn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-weight:800;font-size:.75rem;color:#2b2200;border:2px solid rgba(0,0,0,.35);margin-right:-4px}\n.alt{background:transparent;color:var(--ink);border:2px solid var(--acc);margin-top:10px}\n.panel>.lnk{background:none;color:var(--mute);font-weight:500;font-size:.9rem;text-decoration:underline;padding:8px;width:auto;margin:8px auto 0}\n.tab{position:absolute;top:8px;right:8px;z-index:5;padding:6px 14px;font-size:.85rem;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25)}\n.tip{text-align:center;color:var(--mute);font-size:.85rem;margin-top:10px}\n@media(prefers-reduced-motion:reduce){button{transition:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"game\">\n  \u003cdiv class=\"hud\">\u003cdiv>\u003csmall>Score\u003c/small>\u003cb id=\"sc\">0\u003c/b>\u003c/div>\u003cdiv>\u003csmall>My best\u003c/small>\u003cb id=\"bs\">0\u003c/b>\u003c/div>\u003cdiv>\u003csmall>Lives\u003c/small>\u003cb id=\"lv\">\u2764\ufe0f\u2764\ufe0f\u2764\ufe0f\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"wrap\">\n    \u003ccanvas id=\"cv\" width=\"360\" height=\"520\" aria-label=\"Coin Catcher game area\">\u003c/canvas>\n    \u003cbutton class=\"tab\" id=\"tab\" style=\"display:none\">\ud83c\udfc6 Scores\u003c/button>\n    \u003cdiv class=\"ov\" id=\"ov\">\u003cdiv class=\"panel\" id=\"pn\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"tip\">Drag or move your finger to steer \u00b7 or use \u2190 \u2192 keys\u003cbr>\u2764\ufe0f A bonus heart appears at 500, 1000, 1500\u2026 points if you have fewer than 3 lives. Catch it or skip it.\u003c/p>\n\u003c/div>\n\u003cscript>\nconst W=360,H=520,cv=document.getElementById('cv'),cx=cv.getContext('2d');\nconst $=id=>document.getElementById(id);\nlet scores={},who='';\ntry{scores=JSON.parse(localStorage.getItem('coincatcher_scores')||'{}')}catch(e){scores={}}\ntry{who=localStorage.getItem('coincatcher_last')||''}catch(e){}\nconst cleanName=x=>x.trim().replace(/\\s+/g,' ').slice(0,14);\nconst esc=x=>x.replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction saveScores(){try{localStorage.setItem('coincatcher_scores',JSON.stringify(scores));localStorage.setItem('coincatcher_last',who)}catch(e){}}\n/* Same name (any capital/small letters) = same player. Score only replaces the old one if it is higher. */\nfunction record(name,sc){\n  const k=name.toLowerCase();let r=scores[k],isBest=false;\n  if(!r){r=scores[k]={name,best:sc,plays:0};isBest=sc>0}\n  else if(sc>r.best){r.best=sc;isBest=true}\n  r.plays++;saveScores();return{r,isBest};\n}\nfunction board(){\n  const l=Object.values(scores).sort((a,b)=>b.best-a.best).slice(0,5);\n  return l.length?`\u003col class=\"lb\">${l.map((r,i)=>`\u003cli>\u003cspan>${['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49','4.','5.'][i]} ${esc(r.name)}\u003c/span>\u003cb>${r.best}\u003c/b>\u003c/li>`).join('')}\u003c/ol>`:'\u003cp class=\"mut\">No scores yet. Be the first!\u003c/p>';\n}\nfunction setBest(){$('bs').textContent=(scores[who.toLowerCase()]||{}).best||0}\nlet view='name';\nconst show=h=>{$('pn').innerHTML=h;$('ov').classList.remove('hide');$('tab').style.display='none'};\nfunction showName(){\n  view='name';\n  show(`\u003ch1>\ud83e\ude99 Coin Catcher\u003c/h1>\u003cp class=\"lg\">\u003cspan class=\"cn\" style=\"background:#ffd21f\">5\u003c/span> Gold \u003cspan class=\"cn\" style=\"background:#d5dbe3\">3\u003c/span> Silver \u003cspan class=\"cn\" style=\"background:#cd7f32\">2\u003c/span> Bronze \u003cspan class=\"cn\" style=\"background:#efe9d2\">1\u003c/span> Coin\u003c/p>\u003cp>Catch the coins and dodge bombs \ud83d\udca3!\u003c/p>\u003cinput id=\"nm\" maxlength=\"14\" placeholder=\"Enter your name\" value=\"${esc(who)}\" aria-label=\"Player name\" autocomplete=\"off\">\u003cbutton id=\"go\">Continue\u003c/button>`);\n  $('go').onclick=cont;$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')cont()});$('nm').focus();\n}\nfunction cont(){const n=cleanName($('nm').value);if(!n){$('nm').style.borderColor='#e5483b';$('nm').focus();return}who=n;saveScores();setBest();showMenu()}\nfunction showMenu(){\n  view='menu';\n  show(`\u003ch1>Hi, ${esc(who)}! \ud83d\udc4b\u003c/h1>\u003cp>Your best score: \u003cb>${(scores[who.toLowerCase()]||{}).best||0}\u003c/b>\u003c/p>\u003cbutton id=\"go\">\u25b6 Play\u003c/button>\u003cbutton id=\"sb\" class=\"alt\">\ud83c\udfc6 Score\u003c/button>\u003cbutton id=\"ch\" class=\"lnk\">Change name\u003c/button>`);\n  $('go').onclick=start;$('sb').onclick=()=>showScore(showMenu);$('ch').onclick=showName;$('go').focus();\n}\nfunction showScore(back){\n  view='score';\n  show(`\u003ch1>\ud83c\udfc6 Score\u003c/h1>${fullBoard()}\u003cbutton id=\"bk\" style=\"margin-top:14px\">Back\u003c/button>`);\n  $('bk').onclick=back;$('bk').focus();\n}\nsetBest();\nlet st='idle',score,lives,items,texts,spawn,t0,px,flash,keys={},nextHeart=500,heartOut=false,lastPanel=[];\nconst P={w:78,h:20,y:H-52};\n/* points: plain coin 1, bronze 2, silver 3, gold 5 */\nconst VAL={c1:1,c2:2,c3:3,c5:5};\nconst COIN={c1:['#efe9d2','#8a7f55'],c2:['#cd7f32','#6b3d12'],c3:['#d5dbe3','#6b7684'],c5:['#ffd21f','#a87400']};\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n\nfunction start(){\n  if(st==='play'||!who)return;\n  view='play';\n  score=0;lives=3;items=[];texts=[];spawn=0;flash=0;px=W/2;nextHeart=500;heartOut=false;st='play';$('tab').style.display='block';\n  $('ov').classList.add('hide');upd();t0=performance.now();requestAnimationFrame(loop);\n}\nfunction upd(){$('sc').textContent=score;$('lv').textContent=lives>0?'\u2764\ufe0f'.repeat(lives):'\ud83d\udc94'}\nfunction over(){\n  st='over';\n  const x=record(who,score);setBest();showOver(x.r,x.isBest,score);\n}\nfunction showOver(r,isBest,sc){\n  view='over';\n  show(`\u003cdiv class=\"big\">${isBest?'\ud83c\udfc6':'\ud83d\udca5'}\u003c/div>\u003ch1>Game over\u003c/h1>\u003cp>\u003cb>${esc(r.name)}\u003c/b> scored \u003cb>${sc}\u003c/b>\u003cbr>${isBest?'New best score! \ud83c\udf89':'Best is still \u003cb>'+r.best+'\u003c/b>'}\u003c/p>\u003cbutton id=\"go\">Play again\u003c/button>\u003cbutton id=\"sb\" class=\"alt\">\ud83c\udfc6 Score\u003c/button>\u003cbutton id=\"ch\" class=\"lnk\">Menu\u003c/button>`);\n  $('go').onclick=start;$('sb').onclick=()=>showScore(()=>showOver(r,isBest,sc));$('ch').onclick=showMenu;$('go').focus();\n}\nfunction loop(now){\n  if(st!=='play')return;\n  const dt=Math.min(.05,(now-t0)/1000);t0=now;\n  if(keys.ArrowLeft||keys.a)px-=400*dt;if(keys.ArrowRight||keys.d)px+=400*dt;\n  px=Math.max(P.w/2,Math.min(W-P.w/2,px));\n  spawn-=dt;\n  if(spawn\u003c=0){\n    spawn=Math.max(.36,.85-score*.0012);\n    const r=Math.random(),type=r\u003c.2?'bomb':r\u003c.58?'c1':r\u003c.78?'c2':r\u003c.91?'c3':'c5';\n    items.push({x:20+Math.random()*(W-40),y:-20,type,vy:(150+Math.min(score*.6,230))*(.9+Math.random()*.4),rot:0});\n  }\n  while(score>=nextHeart&&!heartOut){\n    if(lives\u003c3){items.push({x:30+Math.random()*(W-60),y:-20,type:'heart',vy:130});heartOut=true;texts.push({x:W/2,y:70,t:1.6,s:'\u2764\ufe0f Bonus heart!'})}\n    nextHeart+=500;\n  }\n  for(const it of items){\n    it.y+=it.vy*dt;\n    if(!it.dead&&it.y>P.y-14&&it.y\u003cP.y+P.h&&Math.abs(it.x-px)\u003cP.w/2+10){\n      it.dead=true;\n      if(it.type==='bomb'){lives--;flash=.35;texts.push({x:it.x,y:it.y,t:.8,s:'\ud83d\udca5'})}\n      else if(it.type==='heart'){lives=Math.min(3,lives+1);heartOut=false;texts.push({x:it.x,y:it.y,t:.9,s:'+\u2764\ufe0f'})}\n      else{const v=VAL[it.type];score+=v;texts.push({x:it.x,y:it.y,t:.7,s:'+'+v})}\n      upd();\n    }\n  }\n  items=items.filter(i=>!i.dead&&i.y\u003cH+30);\n  if(heartOut&&!items.some(i=>i.type==='heart'))heartOut=false;\n  texts.forEach(t=>{t.t-=dt;t.y-=40*dt});texts=texts.filter(t=>t.t>0);\n  flash=Math.max(0,flash-dt);\n  draw();\n  if(lives\u003c=0){draw();over();return}\n  requestAnimationFrame(loop);\n}\nfunction draw(){\n  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,css('--sky1'));g.addColorStop(1,css('--sky2'));\n  cx.fillStyle=g;cx.fillRect(0,0,W,H);\n  cx.textAlign='center';cx.textBaseline='middle';cx.font='30px serif';\n  for(const it of items){\n    const c=COIN[it.type];\n    if(c){cx.fillStyle=c[0];cx.beginPath();cx.arc(it.x,it.y,16,0,6.283);cx.fill();cx.lineWidth=3;cx.strokeStyle=c[1];cx.stroke();cx.fillStyle=c[1];cx.font='bold 17px system-ui,sans-serif';cx.fillText(VAL[it.type],it.x,it.y+1)}\n    else{cx.font=(it.type==='heart'?'40px':'30px')+' serif';cx.fillText(it.type==='bomb'?'\ud83d\udca3':'\u2764\ufe0f',it.x,it.y)}\n  }\n  cx.fillStyle='#8b5a2b';cx.beginPath();cx.roundRect(px-P.w/2,P.y,P.w,P.h,[4,4,14,14]);cx.fill();\n  cx.fillStyle='#c98a4b';cx.fillRect(px-P.w/2,P.y,P.w,5);\n  cx.font='bold 20px system-ui,sans-serif';cx.fillStyle=css('--ink');\n  for(const t of texts){cx.globalAlpha=Math.min(1,t.t*2);cx.fillText(t.s,t.x,t.y);cx.globalAlpha=1}\n  if(flash>0){cx.fillStyle=`rgba(255,40,40,${flash})`;cx.fillRect(0,0,W,H)}\n}\nfunction steer(e){const r=cv.getBoundingClientRect();px=(e.clientX-r.left)*W/r.width}\ncv.addEventListener('pointermove',e=>{if(st==='play')steer(e)});\ncv.addEventListener('pointerdown',e=>{if(st==='play')steer(e)});\naddEventListener('keydown',e=>{\n  const t=e.target;if(t&&t.id==='nm')return;\n  keys[e.key]=true;\n  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||(e.key===' '&&!(t&&t.tagName==='BUTTON')))e.preventDefault();\n  if((e.key==='Enter'||e.key===' ')&&(view==='menu'||view==='over')&&!(t&&t.tagName==='BUTTON'))start();\n});\naddEventListener('keyup',e=>{keys[e.key]=false});\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play'){st='paused'}else if(!document.hidden&&st==='paused'){st='play';t0=performance.now();requestAnimationFrame(loop)}});\nfunction fullBoard(){\n  const l=Object.values(scores).sort((a,b)=>b.best-a.best).slice(0,20);\n  return l.length?`\u003col class=\"lb\" style=\"max-height:220px;overflow:auto\">${l.map((r,i)=>`\u003cli>\u003cspan>${['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'][i]||(i+1)+'.'} ${esc(r.name)}${r.name.toLowerCase()===who.toLowerCase()?' (you)':''}\u003c/span>\u003cb>${r.best}\u003c/b>\u003c/li>`).join('')}\u003c/ol>`:'\u003cp class=\"mut\">No scores yet.\u003c/p>';\n}\n$('tab').onclick=()=>{\n  if(st!=='play')return;st='viewing';$('tab').style.display='none';\n  $('pn').innerHTML=`\u003ch1>\ud83c\udfc6 Scores\u003c/h1>\u003cp>Now playing: \u003cb>${esc(who)}\u003c/b> \u00b7 score \u003cb>${score}\u003c/b>\u003c/p>${fullBoard()}\u003cbutton id=\"cl\" style=\"margin-top:14px\">Resume\u003c/button>`;\n  $('ov').classList.remove('hide');\n  $('cl').onclick=()=>{$('ov').classList.add('hide');$('tab').style.display='block';st='play';t0=performance.now();requestAnimationFrame(loop)};\n  $('cl').focus();\n};\nshowName();\nif(!cx.roundRect)cx.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"id": "head-or-tail.html", "name": "Head or Tail", "desc": "Game for 2 to 10 players: bet, pick a side, win the pot and become champion.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Head or Tail\u003c/title>\n\u003cstyle>\n:root{--bg:#f1ecff;--g1:rgba(139,92,246,.25);--g2:rgba(255,107,138,.2);--card:rgba(255,255,255,.78);--ink:#1d1340;--mute:#6a5e96;--line:rgba(60,30,140,.16);--acc:#ffc42e;--accink:#2a1d00;--good:#0f9d6b;--bad:#d6335f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#120d2b;--g1:rgba(139,92,246,.35);--g2:rgba(255,107,138,.22);--card:rgba(255,255,255,.07);--ink:#f4f1ff;--mute:#b4a9d9;--line:rgba(255,255,255,.14);--good:#43e6a0;--bad:#ff7391}}\n:root[data-theme=\"dark\"]{--bg:#120d2b;--g1:rgba(139,92,246,.35);--g2:rgba(255,107,138,.22);--card:rgba(255,255,255,.07);--ink:#f4f1ff;--mute:#b4a9d9;--line:rgba(255,255,255,.14);--good:#43e6a0;--bad:#ff7391}\n*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;min-height:100%;color:var(--ink);font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",sans-serif;overflow-x:hidden;background:radial-gradient(800px 480px at 12% -8%,var(--g1),transparent 62%),radial-gradient(700px 480px at 100% 8%,var(--g2),transparent 58%),var(--bg);background-attachment:fixed}\n.app{max-width:640px;margin:0 auto;padding:14px 14px 44px;position:relative}\n.top{display:flex;align-items:center;justify-content:center;position:relative}\nh1{margin:6px 0 2px;font-size:2rem;text-align:center;letter-spacing:-.02em;background:linear-gradient(90deg,#ffd84d,#ff9f43,#ff6b8a);-webkit-background-clip:text;background-clip:text;color:transparent}\n.snd{position:absolute;right:0;top:6px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.1rem}\n.sub{margin:0 0 14px;text-align:center;color:var(--mute);font-size:.9rem}\n.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}\n.card h2{margin:0 0 8px;font-size:1.15rem}\nlabel{display:block;font-weight:600;font-size:.85rem;color:var(--mute);margin:12px 0 5px}\ninput{width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:rgba(127,110,200,.12);border:1.5px solid var(--line);border-radius:12px}\nbutton{font:inherit;cursor:pointer;color:inherit;border:0;background:none}\n:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n.btn{display:block;width:100%;background:linear-gradient(135deg,#ffd84d,#ff9f43);color:var(--accink);font-weight:800;border-radius:14px;padding:13px;margin-top:10px;box-shadow:0 6px 18px rgba(255,159,67,.35)}\n.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}\n.btn.bad{background:linear-gradient(135deg,#ff7391,#ff4d6d);color:#fff;box-shadow:0 6px 18px rgba(255,77,109,.35)}\n.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}\n.btn:active:not([disabled]){transform:scale(.97)}\n.step{display:flex;align-items:center;justify-content:center;gap:18px;font-size:1.5rem;font-weight:800}\n.step button{width:42px;height:42px;border-radius:50%;background:rgba(127,110,200,.15);border:1.5px solid var(--line);font-size:1.4rem}\n.prow{display:grid;grid-template-columns:44px 1fr 108px;gap:8px;align-items:center;margin-bottom:8px}\n.qf{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center}.qf .btn{margin:0;padding:10px}\n.err{color:var(--bad);min-height:1.3em;margin:8px 0 0;font-size:.9rem}\n.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}\n.pill{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.pill b{display:block;font-size:1.25rem;color:var(--ink);letter-spacing:0}\n.arena{position:relative;height:270px;border-radius:24px;background:linear-gradient(180deg,rgba(20,10,60,.55),rgba(80,40,160,.35));border:1px solid var(--line);margin-bottom:12px;overflow:hidden}\n.arena::before{content:\"\";position:absolute;top:0;left:50%;width:280px;height:100%;margin-left:-140px;background:linear-gradient(180deg,rgba(255,226,120,.38),transparent);clip-path:polygon(36% 0,64% 0,100% 100%,0 100%)}\n.arena::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,transparent,rgba(255,196,46,.22))}\n.tosser,.giver{position:absolute;bottom:10px;font-size:3.6rem;line-height:1;z-index:2}.tosser{left:9%}.giver{right:9%}\n.cw{position:absolute;left:50%;bottom:66px;margin-left:-40px;width:80px;height:80px;perspective:700px;z-index:2}\n.coin{position:relative;width:80px;height:80px;transform-style:preserve-3d}\n.f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:grid;place-items:center;font-weight:900;font-size:.85rem;letter-spacing:.05em;color:#6b4a00;background:radial-gradient(circle at 35% 30%,#fff0a0,#ffc42e 55%,#c98a00);border:4px solid #b57c00;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),0 0 24px rgba(255,196,46,.6)}\n.f.bk{transform:rotateX(180deg)}\n.msg{margin:0;font-weight:600}.note{margin:8px 0 0;color:var(--mute);font-size:.88rem}\n.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}\n.pc{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center;position:relative}\n.pc.out{opacity:.45;filter:grayscale(.8)}\n.pc.shine{animation:shine 1.1s ease-out 2}\n@keyframes shine{0%{box-shadow:0 0 0 0 rgba(255,196,46,.95)}100%{box-shadow:0 0 0 26px rgba(255,196,46,0)}}\n.av{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:1.6rem}\n.pc .av{width:58px;height:58px;font-size:2rem;box-shadow:0 4px 12px rgba(0,0,0,.25)}\n.pc b{display:block;margin-top:4px}.pc small{display:block;color:var(--mute);font-size:.78rem;min-height:1.1em}\n.am{display:inline-block;margin-top:6px;padding:3px 14px;border-radius:999px;font-weight:800;font-size:1.1rem;background:rgba(255,196,46,.18);color:var(--ink)}\n.dl{display:block;font-style:normal;font-weight:800;font-size:.85rem}.g{color:var(--good)}.r{color:var(--bad)}\n.badge{position:absolute;top:6px;right:8px;font-size:1.4rem}\n.pk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}\n.pk button{padding:9px;border-radius:12px;border:2px solid var(--line);font-weight:700;background:rgba(127,110,200,.12)}\n.pk button.on{background:linear-gradient(135deg,#ffd84d,#ff9f43);color:var(--accink);border-color:transparent}\n.rank{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line)}.rank.w{font-weight:800;color:var(--good)}\n.kicker{position:fixed;left:-90px;z-index:30;font-size:3rem;line-height:1;pointer-events:none}\n.gift{position:fixed;z-index:30;font-size:2rem;pointer-events:none}\n.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(139,92,246,.75),rgba(10,5,35,.94));overflow:hidden}\n.cbox{position:relative;z-index:2;text-align:center;color:#fff;max-width:340px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}\n@keyframes pop{from{transform:scale(.3);opacity:0}}\n.crown{font-size:3.4rem;line-height:1;animation:bob 1.6s ease-in-out infinite}.cav{display:inline-grid;place-items:center;width:130px;height:130px;border-radius:50%;font-size:4.4rem;border:5px solid #ffd84d;box-shadow:0 0 50px rgba(255,216,77,.8)}\n@keyframes bob{50%{transform:translateY(-10px)}}\n.cbox h2{margin:10px 0 0;font-size:.95rem;letter-spacing:.3em;text-transform:uppercase;color:#ffd84d}\n.cname{font-size:2.2rem;font-weight:900;margin:2px 0}.cmoney{font-size:1.3rem;margin-bottom:6px}.trophy{font-size:2.6rem;margin:8px 0}\n.cf{position:absolute;top:0;font-size:1.6rem;z-index:1;pointer-events:none}\n@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"app\">\n  \u003cdiv class=\"top\">\u003ch1>\ud83e\ude99 Head or Tail\u003c/h1>\u003cbutton class=\"snd\" id=\"snd\" data-a=\"mute\" aria-label=\"Sound on or off\">\ud83d\udd0a\u003c/button>\u003c/div>\n  \u003cp class=\"sub\">Bet, pick a side, win the pot, become champion.\u003c/p>\n  \u003cdiv id=\"main\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kicker\" id=\"kicker\" hidden>\ud83e\udd77\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst esc=x=>String(x).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst r2=x=>Math.round(x*100)/100,money=x=>'\u20b9'+(Number.isInteger(r2(x))?r2(x):r2(x).toFixed(2));\nconst AV=['\ud83e\udd8a','\ud83d\udc3c','\ud83d\udc2f','\ud83d\udc38','\ud83e\udd81','\ud83d\udc35','\ud83d\udc19','\ud83e\udd84','\ud83d\udc27','\ud83d\udc3b'],CL=['#f4a08f','#8fcbea','#9ad9ac','#f7d36b','#c5a8ea','#f2a9cb','#86d8cf','#c3cbd6','#f0b95e','#a9c1da'];\nconst reduce=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;\nlet U={n:3,p:Array.from({length:10},(_,i)=>({name:'Player '+(i+1),amt:''})),bet:20,err:''};\nlet S={ph:'setup',players:[],bet:20,round:0,msg:'',note:'',res:null,maxbet:null,lowIds:[],over:false,err:'',winIds:[]};\nconst act=()=>S.players.filter(p=>p.in);\nconst names=l=>l.map(p=>esc(p.name)).join(' and ');\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst flip=()=>Math.random()\u003c.5?'H':'T';\n\n/* ---------- sound (Web Audio, no files) ---------- */\nlet AC=null,muted=false;\nfunction beep(f,d,type='sine',v=.08,when=0){\n  if(muted)return;\n  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+when;\n    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}\n}\nconst sfx={\n  toss:()=>[0,1,2,3,4,5,6].forEach(i=>beep(420+i*70,.09,'triangle',.05,i*.2)),\n  win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.22,'sine',.09,i*.11)),\n  lose:()=>{beep(220,.25,'sawtooth',.05);beep(160,.4,'sawtooth',.05,.22)},\n  kick:()=>{beep(130,.2,'square',.08);beep(70,.35,'square',.09,.18)},\n  champ:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>beep(f,.3,'sine',.1,i*.15))\n};\n\n/* ---------- screens ---------- */\nfunction plist(){\n  return `\u003cdiv class=\"pl\">${S.players.map((p,i)=>{\n    const st=p.in?(p.pick&&S.ph!=='pick'?'chose '+(p.pick==='H'?'HEAD':'TAIL'):'in the game'):({kicked:'\ud83d\udc62 kicked out',lowest:'out: lowest amount',broke:'out: balance \u20b90'}[p.out]||'out: lost the toss');\n    const d=S.ph==='result'&&p.delta?`\u003cem class=\"dl ${p.delta>0?'g':'r'}\">${p.delta>0?'+':'\u2212'}${money(Math.abs(p.delta))}\u003c/em>`:'';\n    const pk=S.ph==='pick'&&p.in?`\u003cdiv class=\"pk\">\u003cbutton class=\"${p.pick==='H'?'on':''}\" data-a=\"pick\" data-id=\"${p.id}\" data-v=\"H\">Head\u003c/button>\u003cbutton class=\"${p.pick==='T'?'on':''}\" data-a=\"pick\" data-id=\"${p.id}\" data-v=\"T\">Tail\u003c/button>\u003c/div>`:'';\n    return `\u003cdiv class=\"pc ${p.in?'':'out'}\" data-pid=\"${p.id}\">${p.won&&S.ph==='result'?'\u003cspan class=\"badge\">\ud83c\udf81\u003c/span>':''}\u003cspan class=\"av\" style=\"background:${CL[i%10]}\">${AV[i%10]}\u003c/span>\u003cb>${esc(p.name)}\u003c/b>\u003csmall>${st}\u003c/small>\u003cspan class=\"am\">${money(p.amt)}\u003c/span>${d}${pk}\u003c/div>`}).join('')}\u003c/div>`;\n}\nconst arena=()=>`\u003cdiv class=\"arena\">\u003cdiv class=\"tosser\" id=\"tos\">\ud83e\udd39\u003c/div>\u003cdiv class=\"cw\" id=\"cw\">\u003cdiv class=\"coin\" id=\"coin\" ${S.res?`style=\"transform:rotateX(${S.res==='T'?180:0}deg)\"`:''}>\u003cdiv class=\"f\">HEAD\u003c/div>\u003cdiv class=\"f bk\">TAIL\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"giver\" id=\"giver\">\ud83e\uddb8\u003c/div>\u003c/div>`;\n\nfunction render(){\n  const m=$('#main');\n  $('#snd').textContent=muted?'\ud83d\udd07':'\ud83d\udd0a';\n  if(S.ph==='setup'){\n    m.innerHTML=`\u003cdiv class=\"card\">\u003ch2>New game\u003c/h2>\n      \u003clabel>How many players?\u003c/label>\u003cdiv class=\"step\">\u003cbutton data-a=\"n-\" aria-label=\"Fewer players\">\u2212\u003c/button>\u003cspan>${U.n}\u003c/span>\u003cbutton data-a=\"n+\" aria-label=\"More players\">+\u003c/button>\u003c/div>\n      \u003clabel>Player names and their own starting amount (\u20b9)\u003c/label>\n      ${U.p.slice(0,U.n).map((x,i)=>`\u003cdiv class=\"prow\">\u003cspan class=\"av\" style=\"background:${CL[i%10]}\">${AV[i%10]}\u003c/span>\u003cinput data-n=\"${i}\" value=\"${esc(x.name)}\" maxlength=\"14\" aria-label=\"Player ${i+1} name\">\u003cinput data-m=\"${i}\" type=\"number\" min=\"1\" placeholder=\"0\" value=\"${esc(x.amt)}\" aria-label=\"Player ${i+1} starting amount\">\u003c/div>`).join('')}\n      \u003cbutton class=\"btn alt\" data-a=\"qf\" style=\"margin-top:2px\">Copy Player 1's amount to everyone\u003c/button>\n      \u003clabel for=\"ubt\">Bet amount (\u20b9)\u003c/label>\u003cinput id=\"ubt\" type=\"number\" min=\"1\" step=\"0.01\" value=\"${esc(U.bet)}\">\n      \u003cp class=\"err\" role=\"alert\">${esc(U.err)}\u003c/p>\u003cbutton class=\"btn\" data-a=\"start\">Start game\u003c/button>\u003c/div>`;\n    return;\n  }\n  let panel='';const a=act(),min=a.length?Math.min(...a.map(p=>p.amt)):0;\n  if(S.ph==='pick')panel=`\u003cdiv class=\"card\">\u003cp class=\"msg\">Everyone choose Head or Tail, then toss.\u003c/p>${S.note?`\u003cp class=\"note\">\u2139\ufe0f ${esc(S.note)}\u003c/p>`:''}\u003cbutton class=\"btn\" data-a=\"toss\" ${a.every(p=>p.pick)?'':'disabled'}>\ud83e\ude99 Toss the coin\u003c/button>\u003c/div>`;\n  else if(S.ph==='tossing')panel=`\u003cdiv class=\"card\">\u003cp class=\"msg\">Tossing\u2026\u003c/p>\u003c/div>`;\n  else if(S.ph==='result')panel=`\u003cdiv class=\"card\">\u003cp class=\"msg\" aria-live=\"polite\">${S.msg}\u003c/p>\u003cbutton class=\"btn\" data-a=\"next\">${S.over?'\ud83d\udc51 See the champion':'Next round \u2192'}\u003c/button>\u003c/div>`;\n  else if(S.ph==='bet')panel=`\u003cdiv class=\"card\">\u003ch2>Next round\u003c/h2>\u003cp class=\"msg\">Keep the same bet of ${money(S.bet)}?\u003c/p>\u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\u003cbutton class=\"btn\" data-a=\"same\">Yes, play\u003c/button>\u003cbutton class=\"btn alt\" data-a=\"chg\">No, change\u003c/button>\u003c/div>\u003c/div>`;\n  else if(S.ph==='change')panel=`\u003cdiv class=\"card\">\u003ch2>Change bet amount\u003c/h2>${S.maxbet!=null?`\u003cp class=\"msg\">The lowest player has ${money(S.maxbet)}, so the bet can be at most ${money(S.maxbet)}.\u003c/p>`:''}\u003clabel for=\"nb\">New bet (\u20b9)\u003c/label>\u003cinput id=\"nb\" type=\"number\" min=\"0.01\" step=\"0.01\" value=\"${S.maxbet!=null?r2(S.maxbet):S.bet}\">\u003cp class=\"err\" role=\"alert\">${esc(S.err)}\u003c/p>\u003cbutton class=\"btn\" data-a=\"setbet\">Confirm bet\u003c/button>\u003c/div>`;\n  else if(S.ph==='low'){\n    const low=a.filter(p=>S.lowIds.includes(p.id)),all=low.length>=a.length,left=a.filter(p=>!low.includes(p)),lo=Math.min(...a.map(p=>p.amt));\n    const who=low.map(p=>`${esc(p.name)} (${money(p.amt)})`).join(', ');\n    panel=`\u003cdiv class=\"card\">\u003ch2>\u26a0\ufe0f Not enough money\u003c/h2>\u003cp class=\"msg\">${all?`Nobody has enough for the bet of ${money(S.bet)}. The lowest amount is ${money(lo)}, so the bet must come down to ${money(lo)} or less.`:`${who} ${low.length>1?'have':'has'} less than the bet of ${money(S.bet)}. Reduce the bet to ${money(lo)} or less, or kick ${low.length>1?'them':'that player'} out.`}\u003c/p>${!all&&left.length\u003c2?`\u003cp class=\"note\">If you kick, only ${names(left)} will be left, so the game ends and ${names(left)} is the champion.\u003c/p>`:''}${lo>0?`\u003cbutton class=\"btn\" data-a=\"reduce\">Reduce the bet to ${money(lo)} or less\u003c/button>`:''}${all?'':`\u003cbutton class=\"btn bad\" data-a=\"kick\">\ud83d\udc62 Kick ${names(low)}\u003c/button>`}\u003c/div>`}\n  else if(S.ph==='over'){\n    const rk=[...S.players].sort((x,y)=>y.amt-x.amt),top=rk[0].amt,w=rk.filter(p=>p.amt===top);\n    panel=`\u003cdiv class=\"card\">\u003ch2>\ud83c\udfc6 ${w.length>1?'Champions':'Champion'}: ${names(w)}\u003c/h2>\u003cp class=\"msg\">Most money at the end: ${money(top)}.\u003c/p>\n      ${rk.map((p,i)=>`\u003cdiv class=\"rank ${p.amt===top?'w':''}\">\u003cspan>${i+1}. ${esc(p.name)}${p.in?' (still in)':p.out==='kicked'?' (kicked)':''}\u003c/span>\u003cb>${money(p.amt)}\u003c/b>\u003c/div>`).join('')}\n      \u003cbutton class=\"btn\" data-a=\"champ\">\ud83d\udc51 Show champion\u003c/button>\u003cbutton class=\"btn alt\" data-a=\"again\">Play again\u003c/button>\u003c/div>`;}\n  m.innerHTML=`\u003cdiv class=\"bar\">\u003cdiv class=\"pill\">Round\u003cb>${S.round}\u003c/b>\u003c/div>\u003cdiv class=\"pill\">Bet\u003cb>${money(S.bet)}\u003c/b>\u003c/div>\u003cdiv class=\"pill\">Players in\u003cb>${a.length}\u003c/b>\u003c/div>\u003c/div>${arena()}${panel}${plist()}`;\n}\n\n/* ---------- game flow ---------- */\nfunction start(){\n  const list=U.p.slice(0,U.n).map(x=>({name:x.name.trim(),amt:+x.amt})),bt=+U.bet;\n  if(list.some(x=>!x.name)){U.err='Every player needs a name.';return render()}\n  if(new Set(list.map(x=>x.name.toLowerCase())).size\u003clist.length){U.err='Names must be different.';return render()}\n  if(list.some(x=>!(x.amt>0))||!(bt>0)){U.err='Type a starting amount (above 0) for every player, and a bet above 0.';return render()}\n  U.err='';\n  S={ph:'pick',players:list.map((x,i)=>({id:i,name:x.name,amt:r2(x.amt),in:true,pick:null,out:'',delta:0,won:false})),bet:r2(bt),round:0,msg:'',note:'',res:null,maxbet:null,lowIds:[],over:false,err:'',winIds:[]};\n  begin();\n}\nfunction finish(){S.over=true;S.ph='over';render();champion()}\nfunction begin(){\n  S.note='';\n  let a=act();\n  if(a.length\u003c2)return finish();\n  const bk=a.filter(p=>p.amt\u003c=0);\n  if(bk.length){bk.forEach(p=>{p.in=false;p.out='broke'});S.note=`${bk.map(p=>p.name).join(' and ')} had \u20b90 and ${bk.length>1?'were':'was'} removed from the game.`}\n  a=act();if(a.length\u003c2)return finish();\n  const min=Math.min(...a.map(p=>p.amt));\n  if(min\u003cS.bet){\n    if(a.length===2){S.bet=r2(min);S.note+=(S.note?' ':'')+`Only 2 players are left, so the bet was lowered to ${money(S.bet)} for both to play.`}\n    else{S.lowIds=a.filter(p=>p.amt\u003cS.bet).map(p=>p.id);S.ph='low';return render()}\n  }\n  a.forEach(p=>{p.pick=null;p.delta=0;p.won=false});S.round++;S.res=null;S.ph='pick';render();\n}\nasync function animateToss(res){\n  const dur=reduce()?300:1800,cw=$('#cw'),coin=$('#coin'),tos=$('#tos');\n  if(!coin.animate)return;\n  tos.animate([{transform:'rotate(0)'},{transform:'rotate(-22deg) translateY(-10px)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'}],{duration:650});\n  cw.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-150px) scale(1.35)',offset:.5},{transform:'translateY(0) scale(1)'}],{duration:dur,easing:'cubic-bezier(.3,.6,.4,1)'});\n  await coin.animate([{transform:'rotateX(0deg)'},{transform:`rotateX(${360*5+(res==='T'?180:0)}deg)`}],{duration:dur,easing:'ease-out',fill:'forwards'}).finished;\n}\nasync function toss(){\n  if(S.ph!=='pick'||act().some(p=>!p.pick))return;\n  S.ph='tossing';render();sfx.toss();\n  const res=flip();await animateToss(res);\n  S.res=res;resolve(res);S.ph='result';render();\n  if(S.winIds.length){sfx.win();prize(S.winIds)}else sfx.lose();\n}\nfunction resolve(res){\n  const a=act(),bet=S.bet,face=res==='H'?'HEAD':'TAIL';\n  const win=a.filter(p=>p.pick===res),lose=a.filter(p=>p.pick!==res),same=a.every(p=>p.pick===a[0].pick);\n  const before=new Map(a.map(p=>[p.id,p.amt]));S.winIds=[];\n  let msg=`\ud83e\ude99 It's \u003cb>${face}\u003c/b>! `;\n  if(win.length&&lose.length){\n    const share=r2(lose.length*bet/win.length);\n    win.forEach(p=>{p.amt=r2(p.amt+share);p.won=true});S.winIds=win.map(p=>p.id);\n    lose.forEach(p=>{p.amt=r2(p.amt-bet);p.in=false;p.out='lost'});\n    msg+=`${names(win)} ${win.length>1?'win':'wins'} the round and ${win.length>1?'each gets':'gets'} +${money(share)} \ud83c\udf81. ${names(lose)} ${lose.length>1?'lose':'loses'} ${money(bet)} and ${lose.length>1?'are':'is'} out.`;\n  }else if(!win.length){\n    const cut=r2(bet/a.length);a.forEach(p=>p.amt=r2(p.amt-cut));\n    msg+=`Nobody guessed right, so everyone loses ${money(bet)} \u00f7 ${a.length} = ${money(cut)}.`;\n  }else msg+=`Everybody guessed right, so no money moves.`;\n  /* a player whose balance hits \u20b90 is simply removed - no choices, nobody else is affected */\n  const broke=a.filter(p=>p.in&&p.amt\u003c=0);\n  if(broke.length){broke.forEach(p=>{p.in=false;p.out='broke'});msg+=` ${names(broke)} ${broke.length>1?'have':'has'} \u20b90 and ${broke.length>1?'are':'is'} removed from the game.`}\n  const rem=a.filter(p=>p.in);\n  if(same&&rem.length>1){\n    const m=Math.min(...rem.map(p=>p.amt));\n    if(rem.every(p=>p.amt===m))msg+=` Everyone left has the same amount, so the game continues.`;\n    else{const out=rem.filter(p=>p.amt===m);out.forEach(p=>{p.in=false;p.out='lowest'});msg+=` Everyone gave the same answer, so ${names(out)} ${out.length>1?'have':'has'} the lowest amount (${money(m)}) and ${out.length>1?'are':'is'} out.`}\n  }\n  a.forEach(p=>p.delta=r2(p.amt-before.get(p.id)));\n  S.msg=msg;S.over=act().length\u003c=1;\n}\n\n/* ---------- avatars: prize giver, kicker, champion ---------- */\nasync function prize(ids){\n  const g=$('#giver');if(!g||!g.animate||reduce())return;\n  g.animate([{transform:'translateY(0)'},{transform:'translateY(-22px) scale(1.15)'},{transform:'translateY(0)'},{transform:'translateY(-14px)'},{transform:'translateY(0)'}],{duration:1100});\n  const gr=g.getBoundingClientRect();\n  ids.forEach((id,i)=>{\n    const card=$(`[data-pid=\"${id}\"]`);if(!card)return;\n    const cr=card.getBoundingClientRect(),x0=gr.left+gr.width/2-16,y0=gr.top+10;\n    const gift=document.createElement('div');gift.className='gift';gift.textContent='\ud83c\udf81';gift.style.left=x0+'px';gift.style.top=y0+'px';document.body.appendChild(gift);\n    const dx=cr.left+cr.width/2-16-x0,dy=cr.top+20-y0;\n    gift.animate([{transform:'translate(0,0) scale(.6)',opacity:1},{transform:`translate(${dx*.5}px,${Math.min(dy,0)-90}px) scale(1.4) rotate(180deg)`,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(1) rotate(360deg)`,opacity:1}],{duration:950,delay:i*220,easing:'ease-in-out',fill:'forwards'}).finished.then(()=>{gift.remove();card.classList.add('shine');setTimeout(()=>card.classList.remove('shine'),2300)});\n  });\n}\nasync function kick(){\n  if(S.ph!=='low')return;\n  const list=act().filter(p=>S.lowIds.includes(p.id)&&p.amt\u003cS.bet);\n  if(!list.length||list.length>=act().length)return;   /* never kick everyone */\n  S.ph='kicking';const k=$('#kicker');\n  for(const p of list){\n    const el=$(`[data-pid=\"${p.id}\"]`);\n    if(el&&el.animate&&!reduce()){\n      const r=el.getBoundingClientRect();k.hidden=false;k.style.top=(r.top+r.height/2-24)+'px';\n      await k.animate([{left:'-90px'},{left:Math.max(0,r.left-36)+'px'}],{duration:550,fill:'forwards',easing:'ease-out'}).finished;\n      sfx.kick();el.animate([{transform:'none',opacity:1},{transform:'translateX(130vw) rotate(540deg)',opacity:0}],{duration:750,easing:'ease-in',fill:'forwards'});\n      await sleep(650);\n    }else sfx.kick();\n    p.in=false;p.out='kicked';\n  }\n  k.hidden=true;begin();\n}\nfunction champion(){\n  const rk=[...S.players].sort((x,y)=>y.amt-x.amt),top=rk[0].amt,w=rk.filter(p=>p.amt===top),f=w[0],i=S.players.indexOf(f);\n  const old=$('#champ');if(old)old.remove();\n  const o=document.createElement('div');o.id='champ';o.className='ov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Champion');\n  o.innerHTML=`\u003cdiv class=\"cbox\">\u003cdiv class=\"crown\">\ud83d\udc51\u003c/div>\u003cdiv class=\"cav\" style=\"background:${CL[i%10]}\">${AV[i%10]}\u003c/div>\u003ch2>${w.length>1?'Champions':'Champion'}\u003c/h2>\u003cdiv class=\"cname\">${names(w)}\u003c/div>\u003cdiv class=\"cmoney\">${money(top)}\u003c/div>\u003cdiv class=\"trophy\">\ud83e\uddb8\ud83c\udfc6\u003c/div>\u003cbutton class=\"btn\" data-a=\"closechamp\">See ranking\u003c/button>\u003c/div>`;\n  document.body.appendChild(o);sfx.champ();\n  if(!reduce()){const E=['\ud83c\udf89','\u2728','\ud83e\ude99','\u2b50','\ud83c\udf8a'];\n    for(let n=0;n\u003c46;n++){const s=document.createElement('span');s.className='cf';s.textContent=E[n%5];s.style.left=Math.random()*96+'%';o.appendChild(s);\n      if(s.animate)s.animate([{transform:'translateY(-50px) rotate(0)'},{transform:`translateY(${innerHeight+70}px) rotate(${Math.round(Math.random()*720)}deg)`}],{duration:2600+Math.random()*2400,delay:Math.random()*1800,iterations:Infinity})}}\n  o.querySelector('button').focus();\n}\n\n/* ---------- events ---------- */\ndocument.addEventListener('input',e=>{const t=e.target;\n  if(t.dataset.n!==undefined)U.p[+t.dataset.n].name=t.value;\n  else if(t.dataset.m!==undefined)U.p[+t.dataset.m].amt=t.value;\n  else if(t.id==='ubt')U.bet=t.value;else if(t.id==='qf')U.qf=t.value});\ndocument.addEventListener('click',e=>{\n  const t=e.target.closest('[data-a]');if(!t||S.ph==='kicking')return;const a=t.dataset.a;\n  if(a==='mute'){muted=!muted}\n  else if(a==='n-'&&U.n>2)U.n--;\n  else if(a==='n+'&&U.n\u003c10)U.n++;\n  else if(a==='qf'){U.p.forEach(x=>x.amt=U.p[0].amt)}\n  else if(a==='start')return start();\n  else if(a==='pick'){S.players.find(x=>x.id==t.dataset.id).pick=t.dataset.v}\n  else if(a==='toss')return toss();\n  else if(a==='next'){if(S.over){S.ph='over';render();return champion()}S.ph='bet'}\n  else if(a==='same')return begin();\n  else if(a==='chg'){S.maxbet=null;S.err='';S.ph='change'}\n  else if(a==='reduce'){S.maxbet=Math.min(...act().map(p=>p.amt));S.err='';S.ph='change'}\n  else if(a==='setbet'){const v=r2(+$('#nb').value);\n    if(!(v>0)){S.err='Enter a bet above 0.';return render()}\n    if(S.maxbet!=null&&v>S.maxbet){S.err='The bet cannot be more than '+money(S.maxbet)+'.';return render()}\n    S.bet=v;S.err='';S.maxbet=null;return begin()}\n  else if(a==='kick')return kick();\n  else if(a==='champ')return champion();\n  else if(a==='closechamp'){$('#champ').remove();return}\n  else if(a==='again'){U.p.forEach(x=>x.amt='');S.ph='setup'}\n  render();\n});\nrender();\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"id": "task-maintenance.html", "name": "Task Maintenance", "desc": "Daily task and hours tracker with Jira status, hours charts, month reports and CSV/PDF downloads.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Task Maintenance\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f1ff;--card:#fff;--ink:#1c1740;--mute:#756f9c;--line:#e3ddf7;--acc:#6d4aff;--accink:#fff;--good:#0f9d6b;--bad:#e0366b;--soft:#efeaff;--g:linear-gradient(135deg,#6d4aff,#ff5fa2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f0c24;--card:#1a1640;--ink:#f0edff;--mute:#a49fd0;--line:#2e2862;--acc:#9a82ff;--accink:#120a3a;--good:#3ed598;--bad:#ff7391;--soft:#262058;--g:linear-gradient(135deg,#7c5cff,#ff6fb0)}}\n:root[data-theme=\"dark\"]{--bg:#0f0c24;--card:#1a1640;--ink:#f0edff;--mute:#a49fd0;--line:#2e2862;--acc:#9a82ff;
