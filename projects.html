600;white-space:nowrap}\n.item-serve-btn:hover{border-color:var(--brass);background:var(--surface-hover)}\n.stat-card-v2{display:flex;align-items:center;gap:12px}\n.stat-icon{font-size:22px;width:38px;height:38px;border-radius:9px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.revenue-hero{display:flex;align-items:center;background:linear-gradient(135deg, var(--surface-raised), var(--surface));border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;gap:24px}\n.revenue-hero-block{flex:1}\n.revenue-hero-value{font-size:32px;font-weight:700;color:var(--brass-bright);margin-top:4px}\n.revenue-hero-divider{width:1px;align-self:stretch;background:var(--border)}\n@media (max-width:700px){\n  .revenue-hero{flex-direction:column;align-items:stretch;gap:14px}\n  .revenue-hero-divider{width:100%;height:1px}\n}\n.segmented-tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px}\n.segmented-tab{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:none;background:transparent;color:var(--paper-dim);font-size:12.5px;font-weight:600}\n.segmented-tab:hover{color:var(--paper)}\n.segmented-tab.active{background:var(--brass);color:var(--ink)}\n.segmented-tab-count{font-family:var(--font-mono);font-size:10.5px;opacity:0.75}\n.mi-form{display:flex;flex-direction:column;gap:10px}\n.mi-form select,.mi-form input[type=text],.mi-form input[type=number],.mi-form textarea{width:100%}\n.mi-form textarea{min-height:60px;resize:vertical}\n.mi-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.mi-form-row label.small{display:flex;flex-direction:column;gap:4px;min-width:0}\n.mi-form-row input,.mi-form-row select{width:100%;min-width:0}\n.veg-toggle-group{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 0}\n.veg-radio{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--paper-dim);cursor:pointer}\n.veg-radio input{accent-color:var(--brass)}\n.veg-dot{width:12px;height:12px;border-radius:2px;display:inline-block;border:2px solid}\n.veg-dot.veg{border-color:var(--available);background:transparent}\n.veg-dot.nonveg{border-color:var(--occupied);background:transparent}\n.two-col-order{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}\n.two-col-order>div{min-width:0}\n.two-col-admin{display:grid;grid-template-columns:340px 1fr;gap:24px}\n@media (max-width:980px){\n  .two-col-order{grid-template-columns:1fr}\n  .two-col-admin{grid-template-columns:1fr}\n}\n.modal-overlay{position:fixed;inset:0;background:rgba(10,5,6,.6);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}\n.modal-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow)}\n.modal-actions{display:flex;gap:10px;flex-direction:column}\n.modal-actions .btn{width:100%}\n@media (max-width:860px){\n  .sidebar{width:64px;padding:16px 8px}\n  .sidebar-brand,.sidebar-eyebrow,.nav-link span.label,.sidebar-footer{display:none}\n  .nav-link{justify-content:center}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"root\">\u003c/div>\n\u003cscript>\n/* =========================================================\n   BalaKowsi \u2014 standalone client-only restaurant manager\n   No backend. All data lives in localStorage.\n   ========================================================= */\n\nconst STORAGE_KEY = \"tiffin_counter_state_v1\";\nconst MENU_CATALOG_VERSION = 2; // must be declared BEFORE loadState() runs\n\n/* ---------- Menu catalog generator ----------\n   Builds each category up to its target item count from a base list of real\n   dish names, then (if more are needed) prefixes those names with modifiers\n   (\"Special \", \"Family \", ...) to fill out the count without repeating names. */\nfunction expandNames(bases, target, modifiers) {\n  const out = [];\n  const used = new Set();\n  for (const b of bases) {\n    if (out.length >= target) break;\n    if (!used.has(b)) {\n      out.push(b);\n      used.add(b);\n    }\n  }\n  let modIdx = 0,\n    baseIdx = 0,\n    guard = 0;\n  while (out.length \u003c target && guard \u003c 5000) {\n    guard++;\n    const name = `${modifiers[modIdx % modifiers.length]}${bases[baseIdx % bases.length]}`;\n    baseIdx++;\n    if (baseIdx % bases.length === 0) modIdx++;\n    if (!used.has(name)) {\n      out.push(name);\n      used.add(name);\n    }\n  }\n  return out.slice(0, target);\n}\n\nconst NON_VEG_KEYWORDS = [\"chicken\", \"mutton\", \"fish\", \"egg\", \"prawn\", \"beef\", \"omelette\", \"kebab\", \"meat\"];\n\nfunction buildMenuCatalog() {\n  const specs = [\n    {\n      name: \"Desserts\",\n      target: 30,\n      bases: [\"Gulab Jamun\",\"Rasgulla\",\"Kheer\",\"Halwa\",\"Jalebi\",\"Kulfi\",\"Payasam\",\"Mysore Pak\",\"Rasmalai\",\"Barfi\",\"Ladoo\",\"Peda\",\"Sandesh\",\"Falooda\",\"Shrikhand\",\"Basundi\",\"Carrot Halwa\",\"Sooji Halwa\",\"Coconut Ladoo\",\"Chocolate Barfi\",\"Rava Kesari\",\"Semiya Payasam\",\"Badam Halwa\",\"Anjeer Barfi\",\"Motichoor Ladoo\",\"Kaju Katli\",\"Malpua\",\"Doodh Peda\",\"Gajar Halwa\",\"Til Ladoo\"],\n      modifiers: [\"Royal \", \"Special \"],\n      price: [40, 150], prep: [2, 10], spicy: () => \"NONE\", vegDefault: true,\n    },\n    {\n      name: \"Juices\",\n      target: 60,\n      bases: [\"Orange\",\"Watermelon\",\"Pineapple\",\"Mango\",\"Apple\",\"Grape\",\"Pomegranate\",\"Papaya\",\"Guava\",\"Sweet Lime\",\"Carrot\",\"Beetroot\",\"Muskmelon\",\"Chikoo\",\"Banana\",\"Strawberry\",\"Kiwi\",\"Litchi\",\"Sugarcane\",\"Amla\",\"Cucumber\",\"Tomato\",\"Dragon Fruit\",\"Passion Fruit\",\"Custard Apple\"].map((f) => f + \" Juice\"),\n      modifiers: [\"Mixed \", \"Fresh \", \"Chilled \", \"Ginger \", \"Mint \", \"Masala \"],\n      price: [30, 90], prep: [2, 6], spicy: () => \"NONE\", vegDefault: true,\n    },\n    {\n      name: \"Beverages\",\n      target: 65,\n      bases: [\"Filter Coffee\",\"Masala Chai\",\"Ginger Tea\",\"Cardamom Tea\",\"Black Tea\",\"Green Tea\",\"Lemon Tea\",\"Cold Coffee\",\"Iced Tea\",\"Buttermilk\",\"Lassi\",\"Sweet Lassi\",\"Mango Lassi\",\"Rose Milk\",\"Badam Milk\",\"Bournvita\",\"Horlicks\",\"Hot Chocolate\",\"Cappuccino\",\"Espresso\",\"Latte\",\"Mocha\"],\n      modifiers: [\"Special \", \"Chilled \", \"Hot \", \"Extra Strong \", \"Kulhad \"],\n      price: [20, 80], prep: [2, 8], spicy: () => \"NONE\", vegDefault: true,\n    },\n    {\n      name: \"Breakfast\",\n      target: 80,\n      bases: [\"Idly\",\"Dosa\",\"Masala Dosa\",\"Rava Dosa\",\"Onion Dosa\",\"Uttapam\",\"Pongal\",\"Upma\",\"Vada\",\"Medu Vada\",\"Poha\",\"Idiyappam\",\"Appam\",\"Puttu\",\"Chana Bhatura\",\"Aloo Paratha\",\"Paneer Paratha\",\"Poori Sabzi\",\"Vermicelli Upma\",\"Semiya Kesari\",\"Set Dosa\",\"Paper Dosa\",\"Ghee Roast\",\"Podi Dosa\",\"Egg Dosa\",\"Omelette\",\"Bread Omelette\",\"Sandwich\"],\n      modifiers: [\"Mini \", \"Special \", \"Family \", \"Jumbo \", \"Extra Crispy \"],\n      price: [40, 160], prep: [5, 20],\n      spicy: (i) => [\"MILD\", \"MEDIUM\", \"MEDIUM\", \"NONE\"][i % 4],\n    },\n    {\n      name: \"Starters\",\n      target: 40,\n      bases: [\"Gobi Manchurian\",\"Veg Manchurian\",\"Paneer Manchurian\",\"Baby Corn Manchurian\",\"Mushroom Manchurian\",\"Chicken 65\",\"Chilli Chicken\",\"Dragon Chicken\",\"Chicken Manchurian\",\"Chicken Lollipop\",\"Pepper Chicken Dry\",\"Ginger Chicken\",\"Schezwan Chicken\",\"Chicken Majestic\",\"Mutton Chukka\",\"Mutton Sukka\",\"Prawn 65\",\"Fish 65\",\"Squid Fry\",\"Chilli Fish\",\"Chilli Prawns\",\"Paneer 65\",\"Baby Corn Fry\",\"Crispy Corn\",\"Veg Spring Roll\",\"Chicken Spring Roll\",\"Chilli Baby Corn\",\"Kanava Chukka\",\"Egg 65\",\"Chilli Egg\",\"Chicken Kebab\",\"Paneer Chilli\",\"Mushroom 65\",\"Gobi 65\",\"Onion Pakoda\",\"Masala Papad\",\"Chicken Wings\",\"Fish Finger\",\"Veg Cutlet\",\"Chicken Cutlet\"],\n      modifiers: [\"Dry \", \"Gravy \", \"Spicy \", \"Restaurant Style \"],\n      price: [90, 260], prep: [10, 25],\n      spicy: (i) => [\"MEDIUM\", \"HOT\", \"HOT\", \"MEDIUM\"][i % 4],\n    },\n    {\n      name: \"Lunch\",\n      target: 90,\n      bases: [\"Veg Thali\",\"Chicken Biryani\",\"Mutton Biryani\",\"Veg Biryani\",\"Paneer Butter Masala\",\"Dal Tadka\",\"Chole Bhature\",\"Rajma Chawal\",\"Curd Rice\",\"Sambar Rice\",\"Lemon Rice\",\"Tomato Rice\",\"Fried Rice\",\"Chicken Fried Rice\",\"Kadai Paneer\",\"Palak Paneer\",\"Chicken Curry\",\"Fish Curry\",\"Mutton Curry\",\"Egg Curry\",\"Butter Chicken\",\"Kerala Parotta\",\"Chapati Sabzi\",\"Malabar Fish Curry\",\"Prawn Curry\",\"Mixed Veg Curry\"],\n      modifiers: [\"Special \", \"Family Pack \", \"Half \", \"Full \", \"Deluxe \", \"Combo \"],\n      price: [80, 320], prep: [10, 35],\n      spicy: (i) => [\"MEDIUM\", \"HOT\", \"MEDIUM\", \"MILD\"][i % 4],\n    },\n    {\n      name: \"Dinner\",\n      target: 80,\n      bases: [\"Butter Naan\",\"Garlic Naan\",\"Tandoori Roti\",\"Chicken Tikka\",\"Paneer Tikka\",\"Seekh Kebab\",\"Tandoori Chicken\",\"Malai Kofta\",\"Veg Kolhapuri\",\"Chicken Chettinad\",\"Mutton Rogan Josh\",\"Hyderabadi Biryani\",\"Ghee Rice\",\"Prawn Biryani\",\"Egg Biryani\",\"Dal Makhani\",\"Shahi Paneer\",\"Kadhai Chicken\",\"Fish Fry\",\"Chicken Roast\",\"Beef Fry\",\"Pepper Chicken\",\"Andhra Chicken Curry\",\"Kothu Parotta\",\"Chicken 65 Dry\",\"Grilled Fish\",\"Paneer Bhurji\",\"Veg Kurma\"],\n      modifiers: [\"Special \", \"Royal \", \"Tandoori Style \", \"Chef Special \", \"Signature \"],\n      price: [90, 350], prep: [12, 40],\n      spicy: (i) => [\"MEDIUM\", \"HOT\", \"MILD\", \"MEDIUM\"][i % 4],\n    },\n  ];\n\n  const categories = [];\n  const items = [];\n  let categoryId = 1;\n  let itemId = 1;\n\n  specs.forEach((spec) => {\n    categories.push({ id: categoryId, name: spec.name });\n    const names = expandNames(spec.bases, spec.target, spec.modifiers);\n    const [priceMin, priceMax] = spec.price;\n    const [prepMin, prepMax] = spec.prep;\n\n    names.forEach((name, i) => {\n      const lower = name.toLowerCase();\n      const veg = spec.vegDefault !== undefined ? spec.vegDefault : !NON_VEG_KEYWORDS.some((kw) => lower.includes(kw));\n      items.push({\n        id: itemId++,\n        categoryId,\n        name,\n        description: `${name} \u2014 a ${spec.name.toLowerCase()} favourite at BalaKowsi.`,\n        price: priceMin + ((i * 7) % (priceMax - priceMin + 1)),\n        prepTime: prepMin + ((i * 3) % (prepMax - prepMin + 1)),\n        rating: Number((3.8 + (i % 6) * 0.15).toFixed(1)),\n        veg,\n        availableQty: 15 + (i % 25),\n        spicyLevel: spec.spicy ? spec.spicy(i) : \"NONE\",\n        available: true,\n      });\n    });\n\n    categoryId++;\n  });\n\n  return { categories, items, nextCategoryId: categoryId, nextItemId: itemId };\n}\n\nfunction seedState() {\n  const catalog = buildMenuCatalog();\n  return {\n    users: [\n      { username: \"BK101M\", password: \"BK@1103\", fullName: \"Restaurant Manager\", role: \"MANAGER\" },\n      { username: \"BK101C\", password: \"BK@1103\", fullName: \"Counter Cashier\", role: \"CASHIER\" },\n      { username: \"employee1\", password: \"password123\", fullName: \"Anjali Sharma\", role: \"EMPLOYEE\" },\n    ],\n    tables: [\n      { id: 1, tableNumber: 1, capacity: 4, status: \"AVAILABLE\", section: \"NORMAL\" },\n      { id: 2, tableNumber: 2, capacity: 4, status: \"AVAILABLE\", section: \"NORMAL\" },\n      { id: 3, tableNumber: 3, capacity: 6, status: \"AVAILABLE\", section: \"NORMAL\" },\n      { id: 4, tableNumber: 4, capacity: 2, status: \"AVAILABLE\", section: \"NORMAL\" },\n      { id: 5, tableNumber: 5, capacity: 8, status: \"AVAILABLE\", section: \"NORMAL\" },\n    ],\n    categories: catalog.categories,\n    items: catalog.items,\n    orders: [],\n    bills: [],\n    payments: [],\n    seq: { order: 1, bill: 1, nextIds: { table: 6, category: catalog.nextCategoryId, item: catalog.nextItemId, orderItem: 1, order: 1, bill: 1, payment: 1 } },\n    menuCatalogVersion: 2,\n  };\n}\n\ntry { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}\n\n/* Second copy of the data in IndexedDB, so tables/orders survive closing the app\n   even if the browser drops or blocks localStorage. */\nconst IDB = {\n  open() { return new Promise((res, rej) => { try { const r = indexedDB.open(\"tiffin_db\", 1); r.onupgradeneeded = () => r.result.createObjectStore(\"k\"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },\n  async get() { const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction(\"k\").objectStore(\"k\").get(STORAGE_KEY); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },\n  async set(v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(\"k\", \"readwrite\"); t.objectStore(\"k\").put(v, STORAGE_KEY); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },\n};\nlet idbReady = false;\n/* Local-server mode: when started with start-balakowsi.bat the app runs at http://localhost\n   and ALL data is read from / written to balakowsi-data.json next to the app. */\nconst SERVER = location.protocol === \"http:\" && location.hostname === \"localhost\";\nlet serverWriteOk = true;\n\n/* ---- Data file on your computer (Chrome / Edge): every change is also written to a real\n   .json file you choose, so closing the browser or clearing its data cannot lose it. ---- */\nconst FS = !!(window.showSaveFilePicker && window.showOpenFilePicker);\nlet fileHandle = null, fwTimer = null;\nconst FTYPES = [{ description: \"Data file\", accept: { \"application/json\": [\".json\"] } }];\nasync function hGet() { const d = await IDB.open(); return new Promise((r) => { const q = d.transaction(\"k\").objectStore(\"k\").get(\"handle\"); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); }\nasync function hSet(h) { const d = await IDB.open(); return new Promise((r) => { const t = d.transaction(\"k\", \"readwrite\"); t.objectStore(\"k\").put(h, \"handle\"); t.oncomplete = () => r(); t.onerror = () => r(); }); }\nfunction fileBar(msg, fn) {\n  let b = document.getElementById(\"fbar\"); if (b) b.remove();\n  b = document.createElement(\"button\"); b.id = \"fbar\"; b.textContent = msg;\n  b.style.cssText = \"position:fixed;left:0;right:0;top:0;z-index:9999;background:#c47c3e;color:#111;border:0;padding:10px;font:600 14px system-ui,sans-serif;cursor:pointer\";\n  b.onclick = () => { b.remove(); if (fn) fn(); };\n  document.body.appendChild(b);\n}\nasync function writeFile() {\n  if (!fileHandle) return;\n  try { const w = await fileHandle.createWritable(); await w.write(JSON.stringify(state)); await w.close(); }\n  catch (e) { fileBar(\"Data file could not be saved. Click here to reconnect it.\", fsInit); }\n}\nasync function loadFromHandle(h) {\n  const t = await (await h.getFile()).text();\n  if (t.trim()) {\n    const d = JSON.parse(t);\n    if (d && Array.isArray(d.orders) && Array.isArray(d.bills)) {\n      state = migrateState(d);\n      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}\n      render();\n    }\n  } else { await writeFile(); }\n}\nasync function fsInit() {\n  if (SERVER) return;\n  if (!FS) { fileBar(\"\u26a0 This browser cannot save a data file. Open this app in Chrome or Edge, and use Backup often.\"); return; }\n  try {\n    const h = await hGet();\n    if (!h) { fileBar(\"\u26a0 Your data is NOT saved to a file yet. Click here to connect your data file.\", dfConnect); return; }\n    if ((await h.queryPermission({ mode: \"readwrite\" })) === \"granted\") { fileHandle = h; await loadFromHandle(h); }\n    else fileBar(\"Click here to reconnect your data file\", async () => {\n      if ((await h.requestPermission({ mode: \"readwrite\" })) === \"granted\") { fileHandle = h; await loadFromHandle(h); showToast(\"Data file connected\"); }\n    });\n  } catch (e) {}\n}\nasync function dfConnect() {\n  if (!FS) { showToast(\"Data file needs Chrome or Edge on a computer\", \"error\"); return; }\n  try {\n    let h;\n    if (confirm(\"Do you already have a data file?\\n\\nOK = open it\\nCancel = create a new one\")) {\n      [h] = await showOpenFilePicker({ types: FTYPES }); fileHandle = h; await hSet(h); await loadFromHandle(h);\n    } else {\n      h = await showSaveFilePicker({ suggestedName: \"balakowsi-data.json\", types: FTYPES }); fileHandle = h; await hSet(h); await writeFile();\n    }\n    showToast(\"Data file connected. Every change is saved to it.\");\n  } catch (e) {}\n}\nconst hadLS = (() => { try { return localStorage.getItem(STORAGE_KEY) !== null; } catch (e) { return false; } })();\nfunction storageWarn() {\n  const d = document.createElement(\"div\");\n  d.style.cssText = \"position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b3261e;color:#fff;padding:10px 14px;font:14px system-ui,sans-serif;text-align:center\";\n  d.textContent = \"This view is blocking saved data, so changes are lost when you close it. Open the app from your own website link in a normal browser tab, and use Backup often.\";\n  document.body.appendChild(d);\n}\n(async () => {\n  let lsOk = true;\n  try { localStorage.setItem(\"__t\", \"1\"); localStorage.removeItem(\"__t\"); } catch (e) { lsOk = false; }\n  try {\n    if (!hadLS) {\n      const v = await IDB.get();\n      if (v) { state = migrateState(JSON.parse(v)); try { localStorage.setItem(STORAGE_KEY, v); } catch (e) {} render(); }\n    }\n    await IDB.set(JSON.stringify(state));\n    idbReady = true;\n    fsInit();\n  } catch (e) { if (!lsOk) storageWarn(); }\n})();\nlet state = loadState();\nlet session = { user: null, page: \"tables\", takeOrder: { tableId: null, categoryId: \"\", veg: \"\", search: \"\", sortBy: \"name\", cart: [], customerName: \"\" }, menuAdminEdit: null };\n\nfunction loadState() {\n  if (SERVER) {\n    try {\n      const x = new XMLHttpRequest(); x.open(\"GET\", \"/api/data\", false); x.send();\n      if (x.status === 200 && x.responseText.trim()) {\n        const d = JSON.parse(x.responseText);\n        if (d && Array.isArray(d.orders)) return migrateState(d);\n        throw new Error(\"bad data file\");\n      }\n      if (x.status !== 200 && x.status !== 404) throw new Error(\"status \" + x.status);\n    } catch (e) {\n      serverWriteOk = false;\n      alert(\"Could not read balakowsi-data.json, so saving is paused to protect your data.\\nClose this window and start the app again.\\n\\n\" + e);\n    }\n  }\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY);\n    if (raw) {\n      const loaded = JSON.parse(raw);\n      console.log(\"[LOAD] tables in localStorage:\", JSON.stringify(loaded.tables));\n      const result = migrateState(loaded);\n      console.log(\"[LOAD] tables after migrateState:\", JSON.stringify(result.tables));\n      return result;\n    }\n  } catch (e) {\n    console.error(\"[LOAD] error\", e);\n    // Never let a load problem overwrite real data: keep an untouched copy.\n    try { const r = localStorage.getItem(STORAGE_KEY); if (r) localStorage.setItem(STORAGE_KEY + \"_unreadable_\" + Date.now(), r); } catch (x) {}\n  }\n  return seedState();\n}\n\n/* Keeps existing browser data (tables/orders/bills) but brings older saves up to date\n   with new fields/roles/credentials introduced in later versions of this file. */\nfunction migrateState(loaded) {\n  const fresh = seedState();\n  const merged = Object.assign({}, fresh, loaded);\n  // Always adopt the current login credentials/roles rather than a stale saved copy.\n  merged.users = fresh.users;\n  // Make sure any id-sequence keys added later exist even in older saves.\n  merged.seq = merged.seq || fresh.seq;\n  merged.seq.nextIds = Object.assign({}, fresh.seq.nextIds, merged.seq.nextIds);\n  // One-time replacement of the old sample menu with the full catalog \u2014 only runs\n  // once per browser (won't clobber items a manager has since added/edited).\n  if (loaded.menuCatalogVersion !== MENU_CATALOG_VERSION) {\n    merged.categories = fresh.categories;\n    merged.items = fresh.items;\n    merged.seq.nextIds.category = fresh.seq.nextIds.category;\n    merged.seq.nextIds.item = fresh.seq.nextIds.item;\n    merged.menuCatalogVersion = MENU_CATALOG_VERSION;\n  }\n  // One-time cleanup: earlier versions of this app didn't check for duplicate table\n  // numbers within the same section, so some saved browsers ended up with the same\n  // \"Table N\" added twice in one hall.\n  merged.tables = dedupeTables(merged.tables);\n  return merged;\n}\n\n// Keeps only the first (oldest id) of each {tableNumber, section} pair, dropping\n// later duplicates \u2014 but never one that's currently OCCUPIED/RESERVED, to avoid\n// silently deleting a table mid-use. Called both at load time AND every time the\n// Tables page renders, so it self-heals even in a tab that was already open when\n// this fix shipped (i.e. it doesn't require the browser to actually reload).\nfunction dedupeTables(tables) {\n  // Backfill any table saved before it had an explicit section \u2014 this was the actual\n  // root cause of duplicates slipping through: the add-table form's uniqueness check\n  // compared raw `t.section` values, and an old seeded table with no section field at\n  // all (undefined) never matched the string \"NORMAL\", so the check silently missed it.\n  tables.forEach((t) => { if (!t.section) t.section = \"NORMAL\"; });\n  const seenTableKeys = new Set();\n  return [...tables].sort((a, b) => a.id - b.id).filter((t) => {\n    const key = `${t.tableNumber}|${t.section}`;\n    if (!seenTableKeys.has(key)) {\n      seenTableKeys.add(key);\n      return true;\n    }\n    return t.status !== \"AVAILABLE\";\n  });\n}\n\nfunction saveState() {\n  if (SERVER && serverWriteOk) {\n    try { const x = new XMLHttpRequest(); x.open(\"PUT\", \"/api/data\", false); x.send(JSON.stringify(state)); if (x.status !== 200) throw new Error(\"status \" + x.status); }\n    catch (e) { console.error(\"[SAVE] server failed\", e); if (typeof showToast === \"function\") showToast(\"Could not save. Is the black start window still open?\", \"error\"); }\n  }\n  try {\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n  } catch (e) {\n    console.error(\"[SAVE] localStorage failed\", e);\n  }\n  if (idbReady) IDB.set(JSON.stringify(state)).catch(() => {});\n  if (fileHandle) { clearTimeout(fwTimer); fwTimer = setTimeout(writeFile, 300); }\n}\n\nfunction nextId(kind) {\n  const id = state.seq.nextIds[kind]++;\n  saveState();\n  return id;\n}\n\nfunction genOrderNumber() {\n  const d = new Date();\n  const datePart = d.getFullYear().toString() + String(d.getMonth() + 1).padStart(2, \"0\") + String(d.getDate()).padStart(2, \"0\");\n  const n = state.seq.order++;\n  saveState();\n  return \"B&K-\" + datePart + \"-\" + String(n).padStart(4, \"0\");\n}\n\nfunction genBillNumber() {\n  const d = new Date();\n  const datePart = d.getFullYear().toString() + String(d.getMonth() + 1).padStart(2, \"0\") + String(d.getDate()).padStart(2, \"0\");\n  const n = state.seq.bill++;\n  saveState();\n  return \"BILL-\" + datePart + \"-\" + String(n).padStart(4, \"0\");\n}\n\n/* ---------- Toasts ---------- */\nlet toasts = [];\nfunction showToast(message, type) {\n  const id = Date.now() + Math.random();\n  toasts.push({ id, message, type: type || \"info\" });\n  renderToasts();\n  setTimeout(() => {\n    toasts = toasts.filter((t) => t.id !== id);\n    renderToasts();\n  }, 3800);\n}\nfunction renderToasts() {\n  let stack = document.getElementById(\"toast-stack\");\n  if (!stack) {\n    stack = document.createElement(\"div\");\n    stack.id = \"toast-stack\";\n    stack.className = \"toast-stack\";\n    document.body.appendChild(stack);\n  }\n  stack.innerHTML = toasts\n    .map((t) => `\u003cdiv class=\"toast ${t.type === \"error\" ? \"error\" : \"\"}\">${escapeHtml(t.message)}\u003c/div>`)\n    .join(\"\");\n}\n\n/* ---------- Utilities ---------- */\nfunction escapeHtml(str) {\n  const div = document.createElement(\"div\");\n  div.textContent = String(str == null ? \"\" : str);\n  return div.innerHTML;\n}\nfunction money(n) {\n  return Number(n || 0).toFixed(2);\n}\nfunction findTable(id) {\n  return state.tables.find((t) => t.id === Number(id));\n}\nfunction findCategory(id) {\n  return state.categories.find((c) => c.id === Number(id));\n}\nfunction findItem(id) {\n  return state.items.find((i) => i.id === Number(id));\n}\nfunction findOrder(id) {\n  return state.orders.find((o) => o.id === Number(id));\n}\nfunction findBill(id) {\n  return state.bills.find((b) => b.id === Number(id));\n}\nfunction isCancellable(status) {\n  return status === \"PLACED\" || status === \"PREPARING\";\n}\nfunction todayBounds() {\n  const start = new Date();\n  start.setHours(0, 0, 0, 0);\n  const end = new Date();\n  end.setHours(23, 59, 59, 999);\n  return { start, end };\n}\n\n/* ---------- Root render ---------- */\nconst root = document.getElementById(\"root\");\n\nfunction render() {\n  if (!session.user) {\n    renderLogin();\n  } else {\n    renderApp();\n  }\n}\n\nfunction navigate(page) {\n  session.page = page;\n  render();\n}\n\n/* ---------- Login ---------- */\nfunction renderLogin() {\n  root.innerHTML = `\n    \u003cdiv class=\"login-wrap\">\n      \u003cdiv class=\"login-left\">\n        \u003cdiv class=\"brand-hero\">\n          \u003csvg class=\"hero-emblem\" viewBox=\"0 0 140 140\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n            \u003c!-- outer seal rings -->\n            \u003ccircle cx=\"70\" cy=\"70\" r=\"66\" stroke=\"var(--brass)\" stroke-width=\"1\" opacity=\"0.45\"/>\n            \u003ccircle cx=\"70\" cy=\"70\" r=\"58\" stroke=\"var(--brass)\" stroke-width=\"1.5\"/>\n            \u003ccircle cx=\"70\" cy=\"70\" r=\"54\" stroke=\"var(--brass)\" stroke-width=\"0.75\" opacity=\"0.6\"/>\n            \u003c!-- tick marks around the rim -->\n            \u003cg stroke=\"var(--brass)\" stroke-width=\"1\" opacity=\"0.55\">\n              \u003cpath d=\"M70 6v6M70 128v6M6 70h6M128 70h6\"/>\n              \u003cpath d=\"M22.7 22.7l4.2 4.2M113 113l4.2 4.2M22.7 117.3l4.2-4.2M113 27l4.2-4.2\"/>\n            \u003c/g>\n            \u003c!-- laurel branches -->\n            \u003cg stroke=\"var(--brass-bright)\" stroke-width=\"1.6\" stroke-linecap=\"round\" fill=\"none\" opacity=\"0.9\">\n              \u003cpath d=\"M40 96c-10-8-15-20-14-34\"/>\n              \u003cpath d=\"M28 82c-4-2-8-2-11 0M27 71c-4-1-8 0-10 3M28 60c-4 0-7 2-9 5M31 50c-3 1-6 3-8 6\"/>\n              \u003cpath d=\"M100 96c10-8 15-20 14-34\"/>\n              \u003cpath d=\"M112 82c4-2 8-2 11 0M113 71c4-1 8 0 10 3M112 60c4 0 7 2 9 5M109 50c3 1 6 3 8 6\"/>\n            \u003c/g>\n            \u003c!-- monogram -->\n            \u003ctext x=\"70\" y=\"80\" text-anchor=\"middle\" font-family=\"Playfair Display, Georgia, serif\" font-size=\"34\" font-weight=\"600\" fill=\"var(--paper)\">B\u003ctspan fill=\"var(--brass-bright)\" font-size=\"22\">&amp;\u003c/tspan>K\u003c/text>\n            \u003cpath d=\"M50 92h40\" stroke=\"var(--brass)\" stroke-width=\"1\" opacity=\"0.7\"/>\n          \u003c/svg>\n          \u003ch1 class=\"hero-title\">BalaKowsi\u003c/h1>\n          \u003cp class=\"hero-sub\">Tables \u00b7 Kitchen \u00b7 Billing \u00b7 Reports \u2014 run the whole counter from one screen.\u003c/p>\n          \u003cdiv class=\"hero-pills\">\n            \u003cspan class=\"hero-pill\">\ud83c\udf7d Table-side ordering\u003c/span>\n            \u003cspan class=\"hero-pill\">\ud83e\uddfe GST-ready billing\u003c/span>\n            \u003cspan class=\"hero-pill\">\ud83d\udcca Live dashboard\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"login-right\">\n        \u003cform id=\"login-form\" class=\"login-form card\">\n          \u003ch2 style=\"margin-bottom:4px\">Sign in\u003c/h2>\n          \u003cp style=\"color:var(--muted);font-size:13px;margin:0 0 22px\">This runs entirely in your browser \u2014 no server needed.\u003c/p>\n          \u003clabel class=\"field-label\">Username\u003c/label>\n          \u003cinput id=\"login-username\" class=\"text-input\" value=\"BK101M\" autofocus required autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" autocomplete=\"username\" />\n          \u003clabel class=\"field-label\">Password\u003c/label>\n          \u003cinput id=\"login-password\" class=\"text-input\" type=\"password\" required autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" autocomplete=\"current-password\" />\n          \u003cdiv id=\"login-error\">\u003c/div>\n          \u003cbutton type=\"submit\" class=\"btn btn-primary\" style=\"margin-top:16px;width:100%\">Sign in\u003c/button>\n          \u003cbutton type=\"button\" id=\"forgot-password-link\" class=\"btn btn-ghost\" style=\"width:100%;margin-top:8px;font-size:12.5px\">Forgot password?\u003c/button>\n          \u003cp class=\"login-hint\">Manager: \u003cspan class=\"mono\">BK101M / BK@1103\u003c/span> &nbsp;\u00b7&nbsp; Cashier: \u003cspan class=\"mono\">BK101C / BK@1103\u003c/span> &nbsp;\u00b7&nbsp; Staff: \u003cspan class=\"mono\">employee1 / password123\u003c/span>\u003c/p>\n        \u003c/form>\n\n        \u003cform id=\"reset-form\" class=\"login-form card hidden\">\n          \u003ch2 style=\"margin-bottom:4px\">Reset password\u003c/h2>\n          \u003cp style=\"color:var(--muted);font-size:13px;margin:0 0 22px\">Enter your username and choose a new password. Since this app runs locally with no server, there's no email step \u2014 this updates the password right away.\u003c/p>\n          \u003clabel class=\"field-label\">Username\u003c/label>\n          \u003cinput id=\"reset-username\" class=\"text-input\" required autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" />\n          \u003clabel class=\"field-label\">New password\u003c/label>\n          \u003cinput id=\"reset-password1\" class=\"text-input\" type=\"password\" required autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" autocomplete=\"new-password\" />\n          \u003clabel class=\"field-label\">Confirm new password\u003c/label>\n          \u003cinput id=\"reset-password2\" class=\"text-input\" type=\"password\" required autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" autocomplete=\"new-password\" />\n          \u003cdiv id=\"reset-error\">\u003c/div>\n          \u003cbutton type=\"submit\" class=\"btn btn-primary\" style=\"margin-top:16px;width:100%\">Reset password\u003c/button>\n          \u003cbutton type=\"button\" id=\"back-to-signin-link\" class=\"btn btn-ghost\" style=\"width:100%;margin-top:8px;font-size:12.5px\">\u2190 Back to sign in\u003c/button>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  document.getElementById(\"forgot-password-link\").addEventListener(\"click\", () => {\n    document.getElementById(\"login-form\").classList.add(\"hidden\");\n    document.getElementById(\"reset-form\").classList.remove(\"hidden\");\n    document.getElementById(\"reset-username\").focus();\n  });\n  document.getElementById(\"back-to-signin-link\").addEventListener(\"click\", () => {\n    document.getElementById(\"reset-form\").classList.add(\"hidden\");\n    document.getElementById(\"login-form\").classList.remove(\"hidden\");\n  });\n  document.getElementById(\"reset-form\").addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const resetErrorEl = document.getElementById(\"reset-error\");\n    const username = document.getElementById(\"reset-username\").value.trim();\n    const pw1 = document.getElementById(\"reset-password1\").value;\n    const pw2 = document.getElementById(\"reset-password2\").value;\n    const user = state.users.find((u) => u.username === username);\n    if (!user) {\n      resetErrorEl.innerHTML = `\u003cdiv class=\"login-error\">No account found with that username\u003c/div>`;\n      return;\n    }\n    if (pw1.length \u003c 6) {\n      resetErrorEl.innerHTML = `\u003cdiv class=\"login-error\">Password must be at least 6 characters\u003c/div>`;\n      return;\n    }\n    if (pw1 !== pw2) {\n      resetErrorEl.innerHTML = `\u003cdiv class=\"login-error\">Passwords don't match\u003c/div>`;\n      return;\n    }\n    user.password = pw1;\n    saveState();\n    showToast(`Password reset for ${user.username} \u2014 sign in with your new password`);\n    document.getElementById(\"reset-form\").classList.add(\"hidden\");\n    document.getElementById(\"login-form\").classList.remove(\"hidden\");\n    document.getElementById(\"login-username\").value = username;\n    document.getElementById(\"login-password\").value = \"\";\n    document.getElementById(\"login-password\").focus();\n  });\n\n  document.getElementById(\"login-form\").addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const username = document.getElementById(\"login-username\").value.trim();\n    const password = document.getElementById(\"login-password\").value;\n    const user = state.users.find((u) => u.username === username && u.password === password);\n    const errorEl = document.getElementById(\"login-error\");\n    if (!user) {\n      errorEl.innerHTML = `\u003cdiv class=\"login-error\">Invalid username or password\u003c/div>`;\n      return;\n    }\n    session.user = user;\n    session.page = \"tables\";\n    render();\n  });\n}\n\nfunction logout() {\n  session.user = null;\n  render();\n}\n\n/* ---------- App shell ---------- */\nconst NAV_GROUPS = [\n  {\n    label: \"FRONT OF HOUSE\",\n    items: [\n      { page: \"tables\", label: \"Tables\", icon: \"\u25a6\", roles: [\"MANAGER\", \"EMPLOYEE\", \"CASHIER\"] },\n      { page: \"order\", label: \"Take Order\", icon: \"\uff0b\", roles: [\"MANAGER\", \"EMPLOYEE\", \"CASHIER\"] },\n      { page: \"orders\", label: \"Kitchen / Orders\", icon: \"\u2630\", roles: [\"MANAGER\", \"EMPLOYEE\", \"CASHIER\"] },\n      { page: \"billing\", label: \"Billing & Payment\", icon: \"\u00a4\", roles: [\"MANAGER\", \"EMPLOYEE\", \"CASHIER\"] },\n    ],\n  },\n  {\n    label: \"BACK OFFICE\",\n    items: [\n      { page: \"dashboard\", label: \"Dashboard\", icon: \"\u25c8\", roles: [\"MANAGER\", \"EMPLOYEE\", \"CASHIER\"] },\n      { page: \"menu-admin\", label: \"Menu & Tables Admin\", icon: \"\u270e\", roles: [\"MANAGER\", \"EMPLOYEE\", \"CASHIER\"] },\n    ],\n  },\n];\nconst PAGE_TITLES = {\n  tables: \"Tables\",\n  order: \"Take Order\",\n  orders: \"Kitchen / Orders\",\n  billing: \"Billing & Payments\",\n  dashboard: \"Dashboard\",\n  \"menu-admin\": \"Menu Administration\",\n};\n\nfunction initialsOf(name) {\n  return (name || \"\")\n    .split(\" \")\n    .map((p) => p[0])\n    .filter(Boolean)\n    .slice(0, 2)\n    .join(\"\")\n    .toUpperCase();\n}\n\nfunction renderApp() {\n  const role = session.user.role;\n  const isManager = role === \"MANAGER\";\n  const allAllowedPages = NAV_GROUPS.flatMap((g) => g.items).filter((i) => i.roles.includes(role)).map((i) => i.page);\n  if (!allAllowedPages.includes(session.page)) {\n    session.page = allAllowedPages[0] || \"tables\";\n  }\n\n  root.innerHTML = `\n    \u003cdiv class=\"app-shell\">\n      \u003caside class=\"sidebar\">\n        \u003cdiv class=\"sidebar-brand-row\">\n          \u003csvg class=\"brand-mark\" viewBox=\"0 0 40 40\" xmlns=\"http://www.w3.org/2000/svg\">\n            \u003ccircle cx=\"20\" cy=\"20\" r=\"19\" fill=\"var(--surface-raised)\"/>\n            \u003ccircle cx=\"20\" cy=\"20\" r=\"19\" stroke=\"var(--brass)\" stroke-width=\"1.2\"/>\n            \u003ccircle cx=\"20\" cy=\"20\" r=\"15.5\" stroke=\"var(--brass)\" stroke-width=\"0.6\" opacity=\"0.6\"/>\n            \u003ctext x=\"20\" y=\"26\" text-anchor=\"middle\" font-family=\"Playfair Display, Georgia, serif\" font-size=\"13\" font-weight=\"600\" fill=\"var(--paper)\">B\u003ctspan fill=\"var(--brass-bright)\" font-size=\"9\">&amp;\u003c/tspan>K\u003c/text>\n          \u003c/svg>\n          \u003cdiv>\n            \u003cdiv class=\"sidebar-brand\">BalaKowsi\u003c/div>\n            \u003cdiv class=\"sidebar-eyebrow\">HOTEL &amp; RESTAURANT OPS\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        ${NAV_GROUPS.map((group) => {\n          const visibleItems = group.items.filter((i) => i.roles.includes(role));\n          if (visibleItems.length === 0) return \"\";\n          return `\n          \u003cdiv class=\"nav-group-label\">${group.label}\u003c/div>\n          ${visibleItems\n            .map(\n              (n) => `\n            \u003cbutton class=\"nav-link ${session.page === n.page ? \"active\" : \"\"}\" data-nav=\"${n.page}\">\n              \u003cspan aria-hidden=\"true\">${n.icon}\u003c/span>\u003cspan class=\"label\">${n.label}\u003c/span>\n            \u003c/button>`\n            )\n            .join(\"\")}`;\n        }).join(\"\")}\n        \u003cdiv class=\"sidebar-footer\">\n          \u003cdiv class=\"user-avatar\">${initialsOf(session.user.fullName)}\u003c/div>\n          \u003cdiv style=\"flex:1;min-width:0\">\n            \u003cdiv style=\"font-size:12.5px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${escapeHtml(session.user.fullName)}\u003c/div>\n            \u003cdiv class=\"role-chip\" style=\"margin-top:2px\">${role}\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/aside>\n      \u003cdiv class=\"main-area\">\n        \u003cheader class=\"topbar\">\n          \u003ch1>${PAGE_TITLES[session.page] || \"BalaKowsi\"}\u003c/h1>\n          \u003cdiv class=\"topbar-user\">\n            \u003cbutton class=\"logout-btn\" id=\"df-btn\" title=\"Save all data in a file on this computer\">Data file\u003c/button>\n            \u003cbutton class=\"logout-btn\" id=\"bk-exp\" title=\"Download all data as a file\">Backup\u003c/button>\n            \u003cbutton class=\"logout-btn\" id=\"bk-imp\" title=\"Load data from a backup file\">Restore\u003c/button>\n            \u003cinput type=\"file\" id=\"bk-file\" accept=\".json,application/json\" hidden>\n            \u003cbutton class=\"logout-btn\" id=\"logout-btn\">Log out\u003c/button>\n          \u003c/div>\n        \u003c/header>\n        \u003cmain class=\"page\" id=\"page-content\">\u003c/main>\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  document.querySelectorAll(\"[data-nav]\").forEach((btn) => {\n    btn.addEventListener(\"click\", () => navigate(btn.getAttribute(\"data-nav\")));\n  });\n  document.getElementById(\"logout-btn\").addEventListener(\"click\", logout);\n  document.getElementById(\"df-btn\").addEventListener(\"click\", dfConnect);\n  document.getElementById(\"bk-exp\").addEventListener(\"click\", () => {\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: \"application/json\" }));\n    a.download = \"balakowsi-backup-\" + new Date().toISOString().slice(0, 10) + \".json\";\n    a.click();\n    showToast(\"Backup downloaded\");\n  });\n  document.getElementById(\"bk-imp\").addEventListener(\"click\", () => document.getElementById(\"bk-file\").click());\n  document.getElementById(\"bk-file\").addEventListener(\"change\", (e) => {\n    const f = e.target.files[0];\n    if (!f) return;\n    const r = new FileReader();\n    r.onload = () => {\n      try {\n        const d = JSON.parse(r.result);\n        if (!d || !Array.isArray(d.orders) || !Array.isArray(d.bills)) throw new Error(\"bad\");\n        if (!confirm(\"Replace the data in this browser with this backup?\")) return;\n        state = migrateState(d);\n        saveState();\n        render();\n        showToast(\"Backup restored\");\n      } catch (x) { showToast(\"This is not a valid backup file\", \"error\"); }\n    };\n    r.readAsText(f);\n  });\n\n  const pageEl = document.getElementById(\"page-content\");\n  const renderers = {\n    tables: renderTablesPage,\n    order: renderOrderPage,\n    orders: renderOrdersPage,\n    billing: renderBillingPage,\n    dashboard: renderDashboardPage,\n    \"menu-admin\": renderMenuAdminPage,\n  };\n  (renderers[session.page] || renderTablesPage)(pageEl);\n  renderToasts();\n}\n\n/* ---------- Tables page ---------- */\nconst TABLE_STATUSES = [\"AVAILABLE\", \"OCCUPIED\", \"RESERVED\", \"CLEANING\", \"DISABLED\"];\nconst TABLE_COLOR_VAR = { AVAILABLE: \"available\", OCCUPIED: \"occupied\", RESERVED: \"reserved\", CLEANING: \"cleaning\", DISABLED: \"disabled\" };\n\nfunction renderTablesPage(el) {\n  const isManager = session.user.role === \"MANAGER\";\n  const counts = TABLE_STATUSES.reduce((acc, s) => {\n    acc[s] = state.tables.filter((t) => t.status === s).length;\n    return acc;\n  }, {});\n\n  el.innerHTML = `\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px\">\n      \u003cdiv style=\"display:flex;gap:18px;flex-wrap:wrap\">\n        ${TABLE_STATUSES.map(\n          (s) => `\u003cdiv style=\"font-size:12.5px;color:var(--muted)\">\u003cspan class=\"mono\" style=\"color:var(--paper);font-weight:600\">${counts[s] || 0}\u003c/span> ${s.toLowerCase()}\u003c/div>`\n        ).join(\"\")}\n      \u003c/div>\n      ${isManager ? `\u003cbutton class=\"btn btn-primary btn-sm\" id=\"toggle-add-table\">+ Add table\u003c/button>` : \"\"}\n    \u003c/div>\n    \u003cdiv id=\"add-table-form\">\u003c/div>\n    \u003cdiv id=\"tables-grid\" class=\"grid-tables\">\u003c/div>\n  `;\n\n  if (isManager) {\n    document.getElementById(\"toggle-add-table\").addEventListener(\"click\", () => {\n      const formHost = document.getElementById(\"add-table-form\");\n      if (formHost.innerHTML) {\n        formHost.innerHTML = \"\";\n        return;\n      }\n      formHost.innerHTML = `\n        \u003cform id=\"new-table-form\" class=\"card\" style=\"display:flex;gap:12px;align-items:end;margin-bottom:20px;flex-wrap:wrap\">\n          \u003cdiv>\u003clabel class=\"small\">Table number\u003c/label>\u003cbr/>\u003cinput required type=\"number\" min=\"1\" id=\"new-table-number\" style=\"width:110px\" />\u003c/div>\n          \u003cdiv>\u003clabel class=\"small\">Capacity\u003c/label>\u003cbr/>\u003cinput required type=\"number\" min=\"1\" id=\"new-table-capacity\" value=\"4\" style=\"width:110px\" />\u003c/div>\n          \u003cdiv>\u003clabel class=\"small\">Section\u003c/label>\u003cbr/>\n            \u003cselect id=\"new-table-section\" style=\"width:130px\">\n              \u003coption value=\"NORMAL\">Open Hall\u003c/option>\n              \u003coption value=\"AC_HALL\">A/C Hall\u003c/option>\n            \u003c/select>\n          \u003c/div>\n          \u003cbutton type=\"submit\" class=\"btn btn-primary btn-sm\">Save\u003c/button>\n        \u003c/form>`;\n      document.getElementById(\"new-table-form\").addEventListener(\"submit\", (e) => {\n        e.preventDefault();\n        const saveBtn = e.target.querySelector(\"button[type=submit]\");\n        if (saveBtn.disabled) return;\n        saveBtn.disabled = true;\n        const num = Number(document.getElementById(\"new-table-number\").value);\n        const section = document.getElementById(\"new-table-section\").value;\n        // Table numbers only need to be unique WITHIN a section \u2014 Table 1 in the\n        // Open Hall and Table 1 in the A/C Hall are two different physical tables,\n        // not a conflict.\n        if (state.tables.some((t) => t.tableNumber === num && (t.section || \"NORMAL\") === section)) {\n          showToast(`Table ${num} already exists in that section`, \"error\");\n          saveBtn.disabled = false;\n          return;\n        }\n        state.tables.push({\n          id: nextId(\"table\"),\n          tableNumber: num,\n          capacity: Number(document.getElementById(\"new-table-capacity\").value),\n          section,\n          status: \"AVAILABLE\",\n        });\n        saveState();\n        showToast(`Table ${num} added`);\n        renderTablesPage(el);\n      });\n    });\n  }\n\n  renderTablesGrid();\n}\n\nfunction renderTablesGrid() {\n  const grid = document.getElementById(\"tables-grid\");\n  if (!grid) return;\n  const isManager = session.user.role === \"MANAGER\";\n  const deduped = dedupeTables(state.tables);\n  if (deduped.length !== state.tables.length) {\n    state.tables = deduped;\n    saveState();\n  }\n  const sections = [\n    { key: \"NORMAL\", label: \"Open Hall\" },\n    { key: \"AC_HALL\", label: \"A/C Hall\" },\n  ];\n  const tableCard = (t) => {\n    const colorVar = TABLE_COLOR_VAR[t.status];\n    return `\n      \u003cdiv class=\"card\" style=\"border-left:4px solid var(--${colorVar});position:relative\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:start\">\n          \u003cdiv>\n            \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">TABLE\u003c/div>\n            \u003cdiv style=\"font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1\">${String(t.tableNumber).padStart(2, \"0\")}\u003c/div>\n          \u003c/div>\n          \u003cspan class=\"badge\" style=\"color:var(--${colorVar});background:var(--${colorVar}-bg)\">\u003cspan class=\"badge-dot\">\u003c/span>${t.status}\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:8px\">Seats ${t.capacity}\u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:14px\">\n          ${\n            t.status === \"AVAILABLE\"\n              ? `\u003cbutton class=\"btn btn-primary btn-sm\" style=\"flex:1\" data-select-table=\"${t.id}\">Select table\u003c/button>`\n              : t.status === \"RESERVED\"\n              ? `\u003cbutton class=\"btn btn-primary btn-sm\" style=\"flex:1\" data-enter-code=\"${t.id}\">\ud83d\udd12 Enter code\u003c/button>`\n              : `\u003cbutton class=\"btn btn-ghost btn-sm\" style=\"flex:1\" disabled>${t.status}\u003c/button>`\n          }\n          ${\n            isManager\n              ? `\u003cdiv style=\"position:relative\">\n                  \u003cbutton class=\"btn btn-ghost btn-sm\" data-menu-toggle=\"${t.id}\">\u22ef\u003c/button>\n                  \u003cdiv class=\"dropdown hidden\" id=\"dropdown-${t.id}\">\n                    ${[\"AVAILABLE\", \"RESERVED\", \"CLEANING\", \"DISABLED\"].map((s) => `\u003cbutton data-set-status=\"${t.id}|${s}\">Set ${s.toLowerCase()}\u003c/button>`).join(\"\")}\n                    \u003cbutton style=\"color:var(--occupied)\" data-delete-table=\"${t.id}\">Delete table\u003c/button>\n                  \u003c/div>\n                \u003c/div>`\n              : \"\"\n          }\n        \u003c/div>\n      \u003c/div>`;\n  };\n\n  if (state.tables.length === 0) {\n    grid.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No tables yet\u003c/h3>\u003cp>Add your first table to start seating customers.\u003c/p>\u003c/div>`;\n    return;\n  }\n\n  // A/C Hall and Open Hall tables are kept in clearly separate sections \u2014 table\n  // numbers can repeat across sections (Table 1 in each hall is a different table),\n  // so mixing them into one flat list sorted by number alone would be confusing.\n  grid.innerHTML = sections\n    .map((sec) => {\n      const secTables = state.tables.filter((t) => (t.section || \"NORMAL\") === sec.key).sort((a, b) => a.tableNumber - b.tableNumber);\n      if (secTables.length === 0) return \"\";\n      return `\n      \u003cdiv style=\"grid-column:1/-1;margin-top:${sec.key === sections[0].key ? \"0\" : \"18px\"};margin-bottom:2px\">\n        \u003cdiv class=\"mono\" style=\"font-size:11px;color:${sec.key === \"AC_HALL\" ? \"var(--brass-bright)\" : \"var(--muted)\"};letter-spacing:.06em\">${sec.label.toUpperCase()} \u00b7 ${secTables.length} TABLE${secTables.length === 1 ? \"\" : \"S\"}\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px\">\n        ${secTables.map(tableCard).join(\"\")}\n      \u003c/div>`;\n    })\n    .join(\"\");\n\n  grid.querySelectorAll(\"[data-select-table]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const table = findTable(btn.getAttribute(\"data-select-table\"));\n      if (table.status !== \"AVAILABLE\") {\n        showToast(`Table ${table.tableNumber} is not available`, \"error\");\n        renderTablesGrid();\n        return;\n      }\n      table.status = \"OCCUPIED\";\n      saveState();\n      showToast(`Table ${table.tableNumber} is now occupied \u2014 starting an order\u2026`);\n      session.takeOrder.tableId = table.id;\n      navigate(\"order\");\n    })\n  );\n\n  grid.querySelectorAll(\"[data-enter-code]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const table = findTable(btn.getAttribute(\"data-enter-code\"));\n      showReservationCodeModal(table);\n    })\n  );\n\n  grid.querySelectorAll(\"[data-menu-toggle]\").forEach((btn) =>\n    btn.addEventListener(\"click\", (e) => {\n      e.stopPropagation();\n      const id = btn.getAttribute(\"data-menu-toggle\");\n      document.querySelectorAll(\".dropdown\").forEach((d) => {\n        if (d.id !== `dropdown-${id}`) d.classList.add(\"hidden\");\n      });\n      document.getElementById(`dropdown-${id}`).classList.toggle(\"hidden\");\n    })\n  );\n\n  grid.querySelectorAll(\"[data-set-status]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const [id, status] = btn.getAttribute(\"data-set-status\").split(\"|\");\n      const table = findTable(id);\n      table.status = status;\n      if (status === \"RESERVED\") {\n        table.reservationCode = String(Math.floor(1000 + Math.random() * 9000));\n        saveState();\n        showModal({\n          title: `Table ${table.tableNumber} reserved`,\n          message: `Give this code to the customer \u2014 they'll need it to occupy the table: ${table.reservationCode}`,\n          actions: [{ label: \"Got it\", primary: true }],\n        });\n      } else {\n        delete table.reservationCode;\n        saveState();\n        showToast(`Table ${table.tableNumber} \u2192 ${status}`);\n      }\n      renderTablesGrid();\n    })\n  );\n\n  grid.querySelectorAll(\"[data-delete-table]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const table = findTable(btn.getAttribute(\"data-delete-table\"));\n      if (table.status === \"OCCUPIED\") {\n        showToast(\"Cannot delete an occupied table\", \"error\");\n        return;\n      }\n      if (!confirm(`Delete table ${table.tableNumber}?`)) return;\n      state.tables = state.tables.filter((t) => t.id !== table.id);\n      saveState();\n      showToast(`Table ${table.tableNumber} deleted`);\n      renderTablesGrid();\n    })\n  );\n\n  ensureGlobalDropdownCloser();\n}\n\nfunction showReservationCodeModal(table) {\n  let host = document.getElementById(\"modal-root\");\n  if (!host) {\n    host = document.createElement(\"div\");\n    host.id = \"modal-root\";\n    document.body.appendChild(host);\n  }\n  host.innerHTML = `\n    \u003cdiv class=\"modal-overlay\">\n      \u003cdiv class=\"modal-card\">\n        \u003ch3 style=\"margin-bottom:8px\">Table ${table.tableNumber} is reserved\u003c/h3>\n        \u003cp style=\"color:var(--paper-dim);font-size:13.5px;margin:0 0 14px;line-height:1.5\">Enter the 4-digit code given to the customer to occupy this table.\u003c/p>\n        \u003cinput type=\"text\" id=\"reservation-code-input\" class=\"text-input\" maxlength=\"4\" inputmode=\"numeric\" placeholder=\"0000\" style=\"text-align:center;font-family:var(--font-mono);font-size:20px;letter-spacing:6px;margin-bottom:16px\" autofocus />\n        \u003cdiv id=\"reservation-code-error\">\u003c/div>\n        \u003cdiv class=\"modal-actions\">\n          \u003cbutton class=\"btn btn-primary\" id=\"reservation-code-submit\">Unlock table\u003c/button>\n          \u003cbutton class=\"btn btn-ghost\" id=\"reservation-code-cancel\">Cancel\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n  const submit = () => {\n    const entered = document.getElementById(\"reservation-code-input\").value.trim();\n    if (entered === table.reservationCode) {\n      table.status = \"OCCUPIED\";\n      delete table.reservationCode;\n      saveState();\n      closeModal();\n      showToast(`Table ${table.tableNumber} is now occupied \u2014 starting an order\u2026`);\n      session.takeOrder.tableId = table.id;\n      navigate(\"order\");\n    } else {\n      document.getElementById(\"reservation-code-error\").innerHTML = `\u003cdiv class=\"login-error\" style=\"margin-bottom:12px\">This table is reserved.\u003c/div>`;\n    }\n  };\n  document.getElementById(\"reservation-code-submit\").addEventListener(\"click\", submit);\n  document.getElementById(\"reservation-code-cancel\").addEventListener(\"click\", closeModal);\n  document.getElementById(\"reservation-code-input\").addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Enter\") submit();\n  });\n}\n\nlet _dropdownCloserAttached = false;\nfunction ensureGlobalDropdownCloser() {\n  if (_dropdownCloserAttached) return;\n  _dropdownCloserAttached = true;\n  document.addEventListener(\"click\", () => {\n    document.querySelectorAll(\".dropdown\").forEach((d) => d.classList.add(\"hidden\"));\n  });\n}\n\n/* ---------- Take Order page ---------- */\nconst SPICY_ICON = { NONE: \"\", MILD: \"\ud83c\udf36\", MEDIUM: \"\ud83c\udf36\ud83c\udf36\", HOT: \"\ud83c\udf36\ud83c\udf36\ud83c\udf36\", EXTRA_HOT: \"\ud83c\udf36\ud83c\udf36\ud83c\udf36\ud83c\udf36\" };\n\nfunction activeOrderForTable(tableId) {\n  return state.orders.find((o) => o.tableId === Number(tableId) && ![\"COMPLETED\", \"CANCELLED\"].includes(o.status));\n}\n\nfunction unpaidBillForTable(tableId) {\n  return state.bills.find((b) => b.tableId === Number(tableId) && b.status === \"UNPAID\");\n}\n\nfunction tableSelectableForOrder(table) {\n  // The only table that should be off-limits for a NEW/add-on order is one that's\n  // stuck with an unpaid bill and no order currently in flight \u2014 that must be\n  // settled at Billing first. A table that was just selected (freshly OCCUPIED,\n  // no order yet) or mid-order is always fine.\n  if (unpaidBillForTable(table.id) && !activeOrderForTable(table.id)) return false;\n  return true;\n}\n\nfunction renderOrderPage(el) {\n  const to = session.takeOrder;\n\n  el.innerHTML = `\n    \u003cdiv class=\"two-col-order\">\n      \u003cdiv>\n        \u003cdiv class=\"card\" style=\"margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n          \u003cdiv>\n            \u003clabel class=\"small\">Table\u003c/label>\u003cbr/>\n            \u003cselect id=\"ot-table\">\n              \u003coption value=\"\">Choose a table\u2026\u003c/option>\n              ${[\"NORMAL\", \"AC_HALL\"]\n                .map((sec) => {\n                  const secTables = state.tables.filter((t) => (t.section || \"NORMAL\") === sec && tableSelectableForOrder(t));\n                  if (secTables.length === 0) return \"\";\n                  return `\u003coptgroup label=\"${sec === \"AC_HALL\" ? \"A/C Hall\" : \"Open Hall\"}\">\n                    ${secTables.map((t) => `\u003coption value=\"${t.id}\" ${String(t.id) === String(to.tableId) ? \"selected\" : \"\"}>Table ${t.tableNumber} \u2014 ${t.status}\u003c/option>`).join(\"\")}\n                  \u003c/optgroup>`;\n                })\n                .join(\"\")}\n            \u003c/select>\n            ${(() => {\n              const pending = state.tables.filter((t) => !tableSelectableForOrder(t) && !activeOrderForTable(t.id));\n              return pending.length > 0\n                ? `\u003cdiv style=\"font-size:11.5px;color:var(--reserved);margin-top:4px\">${pending.map((t) => \"Table \" + t.tableNumber).join(\", \")} awaiting payment \u2014 settle at Billing first\u003c/div>`\n                : \"\";\n            })()}\n          \u003c/div>\n          \u003cdiv>\n            \u003clabel class=\"small\">Customer name\u003c/label>\u003cbr/>\n            \u003cinput type=\"text\" id=\"ot-customer\" placeholder=\"Optional\" value=\"${escapeHtml(to.customerName)}\" style=\"width:160px\" />\n          \u003c/div>\n          \u003cspan id=\"ot-existing-badge\">\u003c/span>\n        \u003c/div>\n\n        \u003cdiv class=\"card\" style=\"margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap\">\n          \u003cinput type=\"text\" id=\"ot-search\" placeholder=\"Search menu\u2026\" value=\"${escapeHtml(to.search)}\" style=\"flex:1;min-width:160px\" />\n          \u003cselect id=\"ot-category\">\n            \u003coption value=\"\">All categories\u003c/option>\n            ${state.categories.map((c) => `\u003coption value=\"${c.id}\" ${String(c.id) === String(to.categoryId) ? \"selected\" : \"\"}>${escapeHtml(c.name)}\u003c/option>`).join(\"\")}\n          \u003c/select>\n          \u003cselect id=\"ot-veg\">\n            \u003coption value=\"\" ${to.veg === \"\" ? \"selected\" : \"\"}>Veg & Non-veg\u003c/option>\n            \u003coption value=\"true\" ${to.veg === \"true\" ? \"selected\" : \"\"}>Veg only\u003c/option>\n            \u003coption value=\"false\" ${to.veg === \"false\" ? \"selected\" : \"\"}>Non-veg only\u003c/option>\n          \u003c/select>\n          \u003cselect id=\"ot-sort\">\n            \u003coption value=\"name\" ${to.sortBy === \"name\" ? \"selected\" : \"\"}>Sort: Name\u003c/option>\n            \u003coption value=\"price\" ${to.sortBy === \"price\" ? \"selected\" : \"\"}>Sort: Price\u003c/option>\n            \u003coption value=\"popularity\" ${to.sortBy === \"popularity\" ? \"selected\" : \"\"}>Sort: Popularity\u003c/option>\n            \u003coption value=\"prepTime\" ${to.sortBy === \"prepTime\" ? \"selected\" : \"\"}>Sort: Prep time\u003c/option>\n          \u003c/select>\n        \u003c/div>\n\n        \u003cdiv id=\"ot-combos\">\u003c/div>\n\n        \u003cdiv id=\"ot-items-grid\" class=\"grid-items\">\u003c/div>\n      \u003c/div>\n\n      \u003cdiv style=\"position:sticky;top:16px\">\n        \u003cdiv id=\"ot-ticket\">\u003c/div>\n        \u003cbutton class=\"btn btn-primary\" id=\"ot-place-btn\" style=\"width:100%;margin-top:14px;padding:12px\">Place order\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  document.getElementById(\"ot-table\").addEventListener(\"change\", (e) => {\n    to.tableId = e.target.value;\n    renderOrderPage(el);\n  });\n  document.getElementById(\"ot-customer\").addEventListener(\"input\", (e) => (to.customerName = e.target.value));\n  document.getElementById(\"ot-search\").addEventListener(\"input\", (e) => {\n    to.search = e.target.value;\n    renderOrderItemsGrid();\n  });\n  document.getElementById(\"ot-category\").addEventListener(\"change\", (e) => {\n    to.categoryId = e.target.value;\n    renderOrderItemsGrid();\n  });\n  document.getElementById(\"ot-veg\").addEventListener(\"change\", (e) => {\n    to.veg = e.target.value;\n    renderOrderItemsGrid();\n  });\n  document.getElementById(\"ot-sort\").addEventListener(\"change\", (e) => {\n    to.sortBy = e.target.value;\n    renderOrderItemsGrid();\n  });\n  document.getElementById(\"ot-place-btn\").addEventListener(\"click\", handlePlaceOrder);\n\n  renderCombos();\n  renderOrderItemsGrid();\n  renderTicket();\n}\n\nconst COMBO_DEFS = [\n  { name: \"Breakfast Combo\", icon: \"\ud83c\udf05\", items: [{ name: \"Idly\", qty: 2 }, { name: \"Filter Coffee\", qty: 1 }], discountPct: 10 },\n  { name: \"South Indian Combo\", icon: \"\ud83e\udd5e\", items: [{ name: \"Masala Dosa\", qty: 1 }, { name: \"Filter Coffee\", qty: 1 }], discountPct: 10 },\n  { name: \"Thali Combo\", icon: \"\ud83c\udf5b\", items: [{ name: \"Veg Thali\", qty: 1 }, { name: \"Sweet Lassi\", qty: 1 }], discountPct: 12 },\n  { name: \"Tandoori Combo\", icon: \"\ud83c\udf57\", items: [{ name: \"Butter Naan\", qty: 2 }, { name: \"Butter Chicken\", qty: 1 }], discountPct: 12 },\n  { name: \"Juice & Sweet Combo\", icon: \"\ud83e\udd64\", items: [{ name: \"Watermelon Juice\", qty: 1 }, { name: \"Gulab Jamun\", qty: 1 }], discountPct: 10 },\n];\n\nfunction resolveCombo(combo) {\n  const resolvedItems = combo.items.map((ci) => {\n    const item = state.items.find((i) => i.name === ci.name && i.available);\n    return item ? { item, qty: ci.qty } : null;\n  });\n  if (resolvedItems.some((r) => r === null)) return null;\n  const fullPrice = resolvedItems.reduce((sum, r) => sum + r.item.price * r.qty, 0);\n  const comboPrice = Math.round(fullPrice * (1 - combo.discountPct / 100));\n  return { ...combo, resolvedItems, fullPrice, comboPrice };\n}\n\nfunction renderCombos() {\n  const host = document.getElementById(\"ot-combos\");\n  if (!host) return;\n  const combos = COMBO_DEFS.map(resolveCombo).filter(Boolean);\n  if (combos.length === 0) {\n    host.innerHTML = \"\";\n    return;\n  }\n  host.innerHTML = `\n    \u003cdiv style=\"margin-bottom:16px\">\n      \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--brass);letter-spacing:.06em;margin-bottom:8px\">COMBO DEALS\u003c/div>\n      \u003cdiv class=\"combo-strip\">\n        ${combos\n          .map(\n            (c, idx) => `\n          \u003cdiv class=\"combo-card\">\n            \u003cdiv style=\"font-size:20px\">${c.icon}\u003c/div>\n            \u003cdiv style=\"font-weight:600;font-size:13.5px;margin-top:4px\">${escapeHtml(c.name)}\u003c/div>\n            \u003cdiv style=\"font-size:11.5px;color:var(--muted);margin:4px 0 8px\">${c.resolvedItems.map((r) => `${r.qty}\u00d7 ${escapeHtml(r.item.name)}`).join(\" + \")}\u003c/div>\n            \u003cdiv style=\"display:flex;align-items:baseline;gap:6px;margin-bottom:8px\">\n              \u003cspan class=\"mono\" style=\"font-size:16px;font-weight:700;color:var(--brass-bright)\">\u20b9${c.comboPrice}\u003c/span>\n              \u003cspan class=\"mono\" style=\"font-size:11px;color:var(--muted);text-decoration:line-through\">\u20b9${c.fullPrice}\u003c/span>\n            \u003c/div>\n            \u003cbutton class=\"btn btn-primary btn-sm\" style=\"width:100%\" data-add-combo=\"${idx}\">Add combo\u003c/button>\n          \u003c/div>`\n          )\n          .join(\"\")}\n      \u003c/div>\n    \u003c/div>\n  `;\n  host.querySelectorAll(\"[data-add-combo]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const combo = combos[Number(btn.getAttribute(\"data-add-combo\"))];\n      const comboTag = `combo-${combo.name}-${Date.now()}`;\n      combo.resolvedItems.forEach((r) => {\n        // Apply the combo's discount to each item's own unit price, so what lands in\n        // the cart (and later the placed order) matches the discounted combo price\n        // shown on the card \u2014 not the item's full menu price. Every item added this\n        // way shares the same comboTag/comboName so bills can show it as one line.\n        const discountedUnitPrice = Math.round(r.item.price * (1 - combo.discountPct / 100));\n        for (let n = 0; n \u003c r.qty; n++) addToCart(r.item.id, discountedUnitPrice, comboTag, combo.name);\n      });\n      showToast(`${combo.name} added \u2014 \u20b9${combo.comboPrice} (was \u20b9${combo.fullPrice})`);\n    })\n  );\n}\n\nfunction renderOrderItemsGrid() {\n  const to = session.takeOrder;\n  const grid = document.getElementById(\"ot-items-grid\");\n  if (!grid) return;\n\n  let items = state.items.filter((i) => i.available);\n  if (to.categoryId) items = items.filter((i) => i.categoryId === Number(to.categoryId));\n  if (to.veg === \"true\") items = items.filter((i) => i.veg);\n  if (to.veg === \"false\") items = items.filter((i) => !i.veg);\n  if (to.search.trim()) items = items.filter((i) => i.name.toLowerCase().includes(to.search.trim().toLowerCase()));\n\n  const sorters = {\n    name: (a, b) => a.name.localeCompare(b.name),\n    price: (a, b) => a.price - b.price,\n    popularity: (a, b) => b.rating - a.rating,\n    prepTime: (a, b) => a.prepTime - b.prepTime,\n  };\n  items = [...items].sort(sorters[to.sortBy] || sorters.name);\n\n  const existing = activeOrderForTable(to.tableId);\n  document.getElementById(\"ot-existing-badge\").innerHTML = existing\n    ? `\u003cspan class=\"badge\" style=\"color:var(--preparing);background:var(--reserved-bg)\">Adding to order ${existing.orderNumber}\u003c/span>`\n    : \"\";\n  document.getElementById(\"ot-customer\").disabled = !!existing;\n\n  if (items.length === 0) {\n    grid.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No items match\u003c/h3>\u003cp>Try a different search or filter.\u003c/p>\u003c/div>`;\n    return;\n  }\n\n  grid.innerHTML = items\n    .map(\n      (item) => `\n    \u003cdiv class=\"card\" style=\"display:flex;flex-direction:column;gap:8px\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:start\">\n        \u003cspan title=\"${item.veg ? \"Veg\" : \"Non-veg\"}\" style=\"width:14px;height:14px;border:1.5px solid var(--${item.veg ? \"available\" : \"occupied\"});display:inline-flex;align-items:center;justify-content:center\">\n          \u003cspan style=\"width:7px;height:7px;border-radius:50%;background:var(--${item.veg ? \"available\" : \"occupied\"})\">\u003c/span>\n        \u003c/span>\n        \u003cspan class=\"mono\" style=\"font-size:11px;color:var(--muted)\">\u2605 ${Number(item.rating).toFixed(1)}\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"font-family:var(--font-display);font-size:17px;font-weight:600\">${escapeHtml(item.name)}\u003c/div>\n      \u003cdiv style=\"font-size:12.5px;color:var(--muted);min-height:32px\">${escapeHtml(item.description)}\u003c/div>\n      \u003cdiv style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--paper-dim)\">\n        \u003cspan>${item.prepTime} min\u003c/span>\u003cspan>${SPICY_ICON[item.spicyLevel] || \"\"}\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-top:4px\">\n        \u003cspan class=\"mono\" style=\"font-size:17px;font-weight:600;color:var(--brass-bright)\">\u20b9${item.price}\u003c/span>\n        \u003cbutton class=\"btn btn-primary btn-sm\" data-add-cart=\"${item.id}\">Add\u003c/button>\n      \u003c/div>\n    \u003c/div>`\n    )\n    .join(\"\");\n\n  grid.querySelectorAll(\"[data-add-cart]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      addToCart(Number(btn.getAttribute(\"data-add-cart\")));\n    })\n  );\n}\n\nfunction addToCart(itemId, unitPrice, comboTag, comboName) {\n  const to = session.takeOrder;\n  const item = findItem(itemId);\n  const price = unitPrice != null ? unitPrice : item.price;\n  // Only merge with an existing cart line for the same item, AT THE SAME PRICE, AND\n  // the same combo membership \u2014 a combo-discounted unit and a full-price unit of the\n  // same item must stay separate lines, or the discount/combo grouping is lost.\n  const existing = to.cart.find((c) => c.itemId === itemId && c.price === price && (c.comboTag || null) === (comboTag || null));\n  if (existing) {\n    existing.quantity += 1;\n  } else {\n    to.cart.push({ itemId, name: item.name, price, quantity: 1, comboTag: comboTag || null, comboName: comboName || null });\n  }\n  renderTicket();\n}\n\n/* Groups a flat list of cart/order lines so combo purchases show as a single line\n   instead of being scattered as separate items \u2014 used by the ticket, unbilled\n   orders panel, and generated bills. Each returned group is either:\n     { isCombo:false, name, quantity, unitPrice, lineTotal, ...raw }   \u2014 a plain item\n     { isCombo:true, comboName, lines:[...], quantity, lineTotal }    \u2014 one combo */\nfunction groupLinesForDisplay(lines) {\n  const groups = [];\n  const comboIndex = {};\n  lines.forEach((line) => {\n    if (line.comboTag) {\n      let g = comboIndex[line.comboTag];\n      if (!g) {\n        g = { isCombo: true, comboTag: line.comboTag, comboName: line.comboName, lines: [], quantity: 0, lineTotal: 0 };\n        comboIndex[line.comboTag] = g;\n        groups.push(g);\n      }\n      g.lines.push(line);\n      g.quantity += line.quantity;\n      g.lineTotal += (line.price != null ? line.price : line.unitPrice) * line.quantity;\n    } else {\n      groups.push({ isCombo: false, ...line, lineTotal: (line.price != null ? line.price : line.unitPrice) * line.quantity });\n    }\n  });\n  return groups;\n}\n\nfunction updateCartQty(itemId, delta) {\n  const to = session.takeOrder;\n  to.cart = to.cart\n    .map((c) => (c.itemId === itemId ? { ...c, quantity: c.quantity + delta } : c))\n    .filter((c) => c.quantity > 0);\n  renderTicket();\n}\n\nfunction renderTicket() {\n  const to = session.takeOrder;\n  const host = document.getElementById(\"ot-ticket\");\n  if (!host) return;\n\n  const table = to.tableId ? findTable(to.tableId) : null;\n  const existing = to.tableId ? activeOrderForTable(to.tableId) : null;\n  const total = to.cart.reduce((sum, c) => sum + c.price * c.quantity, 0);\n\n  host.innerHTML = `\n    \u003cdiv style=\"background:var(--paper);color:#1c1c1a;padding:22px 20px;border-radius:4px;box-shadow:var(--shadow);background-image:repeating-linear-gradient(to bottom, transparent, transparent 27px, rgba(0,0,0,.04) 27px, rgba(0,0,0,.04) 28px)\">\n      \u003cdiv class=\"mono\" style=\"font-size:11px;color:#8a6d10;letter-spacing:.08em\">${existing ? `ADD-ON \u00b7 ${existing.orderNumber}` : \"NEW ORDER CHIT\"}\u003c/div>\n      \u003cdiv style=\"font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:4px\">${table ? `Table ${table.tableNumber}` : \"No table selected\"}\u003c/div>\n      \u003cdiv class=\"ticket-divider\">\u003c/div>\n      ${\n        to.cart.length === 0\n          ? `\u003cdiv style=\"color:#8a7c55;font-size:13px;padding:16px 0;text-align:center\">Add items from the menu \u2192\u003c/div>`\n          : `\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n              ${groupLinesForDisplay(to.cart)\n                .map((g) =>\n                  g.isCombo\n                    ? `\n                \u003cdiv style=\"border:1px dashed #b8ac8e;border-radius:4px;padding:6px 8px\">\n                  \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700\">\n                    \u003cdiv>\ud83c\udf81 ${escapeHtml(g.comboName)}\u003c/div>\n                    \u003cdiv class=\"mono\">\u20b9${g.lineTotal.toFixed(0)}\u003c/div>\n                  \u003c/div>\n                  ${g.lines.map((l) => `\u003cdiv style=\"font-size:11.5px;color:#8a7c55;padding-left:14px\">${l.quantity}\u00d7 ${escapeHtml(l.name)}\u003c/div>`).join(\"\")}\n                \u003c/div>`\n                    : `\n                \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;font-size:13.5px\">\n                  \u003cdiv style=\"flex:1\">${escapeHtml(g.name)}\u003c/div>\n                  \u003cdiv style=\"display:flex;align-items:center;gap:6px\">\n                    \u003cbutton data-qty=\"${g.itemId}|-1\" style=\"width:20px;height:20px;border-radius:4px;border:1px solid #b8ac8e;background:transparent;color:#1c1c1a;font-size:13px;line-height:1;padding:0\">\u2212\u003c/button>\n                    \u003cspan class=\"mono\" style=\"width:16px;text-align:center\">${g.quantity}\u003c/span>\n                    \u003cbutton data-qty=\"${g.itemId}|1\" style=\"width:20px;height:20px;border-radius:4px;border:1px solid #b8ac8e;background:transparent;color:#1c1c1a;font-size:13px;line-height:1;padding:0\">+\u003c/button>\n                  \u003c/div>\n                  \u003cdiv class=\"mono\" style=\"width:56px;text-align:right\">\u20b9${g.lineTotal.toFixed(0)}\u003c/div>\n                \u003c/div>`\n                )\n                .join(\"\")}\n            \u003c/div>`\n      }\n      \u003cdiv class=\"ticket-divider\">\u003c/div>\n      \u003cdiv class=\"ticket-total\">\u003cspan>TOTAL\u003c/span>\u003cspan class=\"mono\">\u20b9${total.toFixed(2)}\u003c/span>\u003c/div>\n    \u003c/div>\n  `;\n\n  host.querySelectorAll(\"[data-qty]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const [itemId, delta] = btn.getAttribute(\"data-qty\").split(\"|\");\n      updateCartQty(Number(itemId), Number(delta));\n    })\n  );\n\n  const placeBtn = document.getElementById(\"ot-place-btn\");\n  if (placeBtn) {\n    placeBtn.disabled = to.cart.length === 0 || !to.tableId;\n    placeBtn.textContent = existing ? \"Add to order\" : \"Place order\";\n  }\n}\n\nfunction handlePlaceOrder() {\n  const to = session.takeOrder;\n  if (!to.tableId) {\n    showToast(\"Choose a table first\", \"error\");\n    return;\n  }\n  if (to.cart.length === 0) {\n    showToast(\"Add at least one item to the order\", \"error\");\n    return;\n  }\n\n  const existing = activeOrderForTable(to.tableId);\n  if (!existing && !tableSelectableForOrder(findTable(to.tableId))) {\n    showToast(\"This table has an unpaid bill \u2014 settle it at Billing before starting a new order\", \"error\");\n    return;\n  }\n  const newItems = to.cart.map((c) => {\n    const item = findItem(c.itemId);\n    return { id: nextId(\"orderItem\"), itemId: c.itemId, itemName: item.name, quantity: c.quantity, unitPrice: c.price, status: \"PLACED\", comboTag: c.comboTag || null, comboName: c.comboName || null };\n  });\n\n  if (existing) {\n    existing.items.push(...newItems);\n    if ([\"PREPARED\", \"SERVED\"].includes(existing.status)) existing.status = \"PREPARING\";\n    saveState();\n    showToast(`Added ${to.cart.length} item(s) to order ${existing.orderNumber}`);\n  } else {\n    const table = findTable(to.tableId);\n    if (table.status !== \"AVAILABLE\" && table.status !== \"OCCUPIED\") {\n      showToast(`Table ${table.tableNumber} is not available (status: ${table.status})`, \"error\");\n      return;\n    }\n    const order = {\n      id: nextId(\"order\"),\n      orderNumber: genOrderNumber(),\n      tableId: table.id,\n      tableNumber: table.tableNumber,\n      customerName: to.customerName || null,\n      status: \"PLACED\",\n      items: newItems,\n      createdAt: new Date().toISOString(),\n    };\n    state.orders.push(order);\n    table.status = \"OCCUPIED\";\n    saveState();\n    showToast(`Order ${order.orderNumber} placed for table ${table.tableNumber}`);\n  }\n\n  to.cart = [];\n  to.customerName = \"\";\n  navigate(\"orders\");\n}\n\n/* ---------- Orders / Kitchen board ---------- */\nconst NEXT_STATUS = { PLACED: \"PREPARING\", PREPARING: \"PREPARED\" }; // used ONLY by the automatic kitchen timer \u2014 deliberately stops before SERVED\nconst MANUAL_NEXT_STATUS = { PLACED: \"PREPARING\", PREPARING: \"PREPARED\", PREPARED: \"SERVED\" }; // used by staff-clicked buttons \u2014 serving is always a deliberate action\nconst STATUS_ORDER = [\"PLACED\", \"PREPARING\", \"PREPARED\", \"SERVED\", \"COMPLETED\"];\nconst STATUS_FILTERS = [\"ALL\", \"PLACED\", \"PREPARING\", \"PREPARED\", \"SERVED\", \"COMPLETED\", \"CANCELLED\"];\nconst ORDER_COLOR_VAR = { PLACED: \"placed\", PREPARING: \"preparing\", PREPARED: \"prepared\", SERVED: \"served\", COMPLETED: \"completed\", CANCELLED: \"cancelled\" };\nlet ordersFilter = \"ALL\";\n\nfunction orderStatusBadge(status) {\n  const v = ORDER_COLOR_VAR[status] || \"muted\";\n  return `\u003cspan class=\"badge\" style=\"color:var(--${v});background:var(--${v}-bg)\">\u003cspan class=\"badge-dot\">\u003c/span>${status}\u003c/span>`;\n}\n\nfunction releaseTableIfNoActiveOrders(tableId) {\n  const active = state.orders.some((o) => o.tableId === Number(tableId) && ![\"COMPLETED\", \"CANCELLED\"].includes(o.status));\n  if (!active) {\n    const table = findTable(tableId);\n    if (table) table.status = \"AVAILABLE\";\n  }\n}\n\n/* ---------- Generic modal ---------- */\nfunction showModal({ title, message, actions }) {\n  let host = document.getElementById(\"modal-root\");\n  if (!host) {\n    host = document.createElement(\"div\");\n    host.id = \"modal-root\";\n    document.body.appendChild(host);\n  }\n  host.innerHTML = `\n    \u003cdiv class=\"modal-overlay\">\n      \u003cdiv class=\"modal-card\">\n        \u003ch3 style=\"margin-bottom:8px\">${escapeHtml(title)}\u003c/h3>\n        \u003cp style=\"color:var(--paper-dim);font-size:13.5px;margin:0 0 20px;line-height:1.5\">${escapeHtml(message)}\u003c/p>\n        \u003cdiv class=\"modal-actions\">\n          ${actions.map((a, i) => `\u003cbutton class=\"btn ${a.primary ? \"btn-primary\" : \"btn-ghost\"}\" data-modal-action=\"${i}\">${escapeHtml(a.label)}\u003c/button>`).join(\"\")}\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n  host.querySelectorAll(\"[data-modal-action]\").forEach((btn) => {\n    btn.addEventListener(\"click\", () => {\n      const idx = Number(btn.getAttribute(\"data-modal-action\"));\n      closeModal();\n      actions[idx].onClick?.();\n    });\n  });\n}\nfunction closeModal() {\n  const host = document.getElementById(\"modal-root\");\n  if (host) host.innerHTML = \"\";\n}\n\n/* When an order's last active item gets cancelled (or the whole order is explicitly\n   cancelled), don't silently free the table \u2014 ask what's next. Table only goes back\n   to AVAILABLE if the staff explicitly says the visit is complete. */\nfunction handleOrderFullyCancelled(order) {\n  const table = findTable(order.tableId);\n  showModal({\n    title: \"Order cancelled\",\n    message: `All items on ${order.orderNumber} (Table ${order.tableNumber}) are cancelled. What's next for this table?`,\n    actions: [\n      {\n        label: \"Order another item\",\n        primary: true,\n        onClick: () => {\n          session.takeOrder.tableId = order.tableId;\n          navigate(\"order\");\n        },\n      },\n      {\n        label: \"Complete \u2014 free the table\",\n        onClick: () => {\n          if (table) table.status = \"AVAILABLE\";\n          saveState();\n          showToast(`Table ${order.tableNumber} is now available`);\n          if (session.page === \"orders\") renderOrdersGrid();\n          else if (session.page === \"tables\") renderTablesGrid();\n        },\n      },\n    ],\n  });\n}\n\nfunction recalcOrderStatus(order) {\n  const active = order.items.filter((i) => i.status !== \"CANCELLED\");\n  if (active.length === 0) {\n    order.status = \"CANCELLED\";\n    return;\n  }\n  const allSame = active.every((i) => i.status === active[0].status);\n  order.status = allSame ? active[0].status : \"PREPARING\";\n}\n\nconst TRASH_ICON = `\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 16 16\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M2 4h12M5.5 4V2.5a1 1 0 011-1h3a1 1 0 011 1V4M6.5 7.5v4M9.5 7.5v4M3.5 4l.6 8.4a1 1 0 001 .9h5.8a1 1 0 001-.9L13 4\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>`;\n\nfunction renderOrdersPage(el) {\n  const isManager = session.user.role === \"MANAGER\";\n  el.innerHTML = `\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px\">\n      \u003cdiv id=\"orders-filter-bar\">\u003c/div>\n      ${\n        isManager\n          ? `\u003cdiv style=\"display:flex;gap:8px\">\n              \u003cbutton class=\"btn btn-ghost btn-sm\" id=\"clear-completed-btn\">${TRASH_ICON} Delete Completed\u003c/button>\n              \u003cbutton class=\"btn btn-ghost btn-sm\" id=\"clear-cancelled-btn\">${TRASH_ICON} Delete Cancelled\u003c/button>\n            \u003c/div>`\n          : \"\"\n      }\n    \u003c/div>\n    \u003cdiv id=\"orders-grid\" class=\"grid-orders\">\u003c/div>\n  `;\n  renderOrdersFilterBar();\n  renderOrdersGrid();
