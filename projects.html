\n\n  const bulkClear = (status, label) => {\n    const clearable = state.orders.filter((o) => o.status === status);\n    if (clearable.length === 0) {\n      showToast(`No ${label.toLowerCase()} records to clear`, \"error\");\n      return;\n    }\n    if (!confirm(`Delete all ${clearable.length} ${label.toLowerCase()} order record(s)? This also removes any bills/payments tied to them. This cannot be undone.`)) return;\n    clearable.forEach((o) => deleteOrderRecord(o.id, { silent: true }));\n    saveState();\n    showToast(`Cleared ${clearable.length} ${label.toLowerCase()} record(s)`);\n    renderOrdersGrid();\n  };\n  document.getElementById(\"clear-completed-btn\")?.addEventListener(\"click\", () => bulkClear(\"COMPLETED\", \"Completed\"));\n  document.getElementById(\"clear-cancelled-btn\")?.addEventListener(\"click\", () => bulkClear(\"CANCELLED\", \"Cancelled\"));\n}\n\n/* Deletes an order record permanently, along with any bill/payments that reference it.\n   Only meant for orders that are already COMPLETED or CANCELLED \u2014 i.e. done and dusted. */\nfunction deleteOrderRecord(orderId, opts) {\n  orderId = Number(orderId);\n  const order = findOrder(orderId);\n  const affectedBillIds = state.bills.filter((b) => (b.orderIds || [b.orderId]).includes(orderId)).map((b) => b.id);\n  state.payments = state.payments.filter((p) => !affectedBillIds.includes(p.billId));\n  state.bills = state.bills.filter((b) => !affectedBillIds.includes(b.id));\n  state.orders = state.orders.filter((o) => o.id !== orderId);\n\n  // If that was the table's last remaining order record and it's just sitting\n  // OCCUPIED with nothing left to settle, free it rather than leaving it stuck.\n  if (order) {\n    const table = findTable(order.tableId);\n    const stillHasOrders = state.orders.some((o) => o.tableId === order.tableId);\n    if (table && table.status === \"OCCUPIED\" && !stillHasOrders) {\n      table.status = \"AVAILABLE\";\n    }\n  }\n\n  if (!opts || !opts.silent) saveState();\n}\n\nconst FILTER_COLOR_VAR = { ALL: null, PLACED: \"placed\", PREPARING: \"preparing\", PREPARED: \"prepared\", SERVED: \"served\", COMPLETED: \"completed\", CANCELLED: \"cancelled\" };\n\nfunction renderOrdersFilterBar() {\n  const bar = document.getElementById(\"orders-filter-bar\");\n  bar.className = \"segmented-tabs\";\n  bar.innerHTML = STATUS_FILTERS.map((s) => {\n    const count = s === \"ALL\" ? state.orders.length : state.orders.filter((o) => o.status === s).length;\n    const colorVar = FILTER_COLOR_VAR[s];\n    return `\u003cbutton class=\"segmented-tab ${ordersFilter === s ? \"active\" : \"\"}\" data-filter=\"${s}\">\n      ${colorVar ? `\u003cspan class=\"badge-dot\" style=\"color:var(--${colorVar})\">\u003c/span>` : \"\"}\n      ${s} \u003cspan class=\"segmented-tab-count\">${count}\u003c/span>\n    \u003c/button>`;\n  }).join(\"\");\n  bar.querySelectorAll(\"[data-filter]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      ordersFilter = btn.getAttribute(\"data-filter\");\n      renderOrdersFilterBar();\n      renderOrdersGrid();\n    })\n  );\n}\n\nfunction renderOrdersGrid() {\n  const grid = document.getElementById(\"orders-grid\");\n  if (!grid) return;\n\n  const orders = [...state.orders]\n    .filter((o) => ordersFilter === \"ALL\" || o.status === ordersFilter)\n    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));\n\n  if (orders.length === 0) {\n    grid.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No orders here\u003c/h3>\u003cp>Orders will show up as soon as a table places one.\u003c/p>\u003c/div>`;\n    return;\n  }\n\n  grid.innerHTML = orders\n    .map((order) => {\n      const nextStatus = MANUAL_NEXT_STATUS[order.status];\n      return `\n      \u003cdiv class=\"card order-card-v2\" data-order-card=\"${order.id}\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:start\">\n          \u003cdiv>\n            \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">${order.orderNumber}\u003c/div>\n            \u003cdiv style=\"font-family:var(--font-display);font-size:19px;font-weight:600\">Table ${order.tableNumber}\u003c/div>\n            ${order.customerName ? `\u003cdiv style=\"font-size:12.5px;color:var(--muted)\">${escapeHtml(order.customerName)}\u003c/div>` : \"\"}\n          \u003c/div>\n          ${orderStatusBadge(order.status)}\n        \u003c/div>\n        \u003cdiv style=\"margin-top:12px;display:flex;flex-direction:column;gap:6px\">\n          ${[...order.items]\n            .sort((a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0))\n            .map((item) => {\n              const itemNext = MANUAL_NEXT_STATUS[item.status];\n              const canPrioritize = ![\"SERVED\", \"COMPLETED\", \"CANCELLED\"].includes(item.status);\n              return `\n            \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:${item.status === \"CANCELLED\" ? 0.45 : 1};${item.priority && canPrioritize ? \"background:var(--reserved-bg);border-radius:6px;padding:4px 6px;margin:0 -6px\" : \"\"}\">\n              \u003cspan style=\"text-decoration:${item.status === \"CANCELLED\" ? \"line-through\" : \"none\"}\">\n                ${item.priority && canPrioritize ? `\u003cspan title=\"Bring this first\" style=\"margin-right:4px\">\u26a1\u003c/span>` : \"\"}${item.quantity}\u00d7 ${escapeHtml(item.itemName)}\n              \u003c/span>\n              \u003cdiv style=\"display:flex;align-items:center;gap:6px\">\n                ${orderStatusBadge(item.status)}\n                ${\n                  canPrioritize\n                    ? `\u003cbutton class=\"btn-sm item-serve-btn\" data-toggle-priority=\"${order.id}|${item.id}\" title=\"${item.priority ? \"Unmark priority\" : \"Bring this item first\"}\" style=\"${item.priority ? \"border-color:var(--reserved);color:var(--reserved)\" : \"\"}\">\u26a1 ${item.priority ? \"Priority\" : \"Serve first\"}\u003c/button>`\n                    : \"\"\n                }\n                ${\n                  itemNext\n                    ? `\u003cbutton class=\"btn-sm item-serve-btn\" data-item-advance=\"${order.id}|${item.id}|${itemNext}\" title=\"Mark this item ${itemNext.toLowerCase()}\">${itemNext === \"SERVED\" ? \"Serve\" : \"\u2192 \" + itemNext.toLowerCase()}\u003c/button>`\n                    : \"\"\n                }\n                ${\n                  isCancellable(item.status)\n                    ? `\u003cbutton class=\"icon-btn-sm\" data-cancel-item=\"${order.id}|${item.id}\" title=\"Cancel this item\">\u2715\u003c/button>`\n                    : \"\"\n                }\n              \u003c/div>\n            \u003c/div>`;\n            })\n            .join(\"\")}\n        \u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;justify-content:flex-start\">\n          ${nextStatus ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-advance=\"${order.id}|${nextStatus}\">Mark all ${nextStatus.toLowerCase()}\u003c/button>` : \"\"}\n          ${order.status === \"SERVED\" ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-complete=\"${order.id}\">Complete order\u003c/button>` : \"\"}\n          ${[\"PLACED\", \"PREPARING\", \"PREPARED\"].includes(order.status) ? `\u003cbutton class=\"btn btn-danger btn-sm\" data-cancel-order=\"${order.id}\">Cancel order\u003c/button>` : \"\"}\n          ${order.status === \"COMPLETED\" ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-goto-bill=\"${order.id}\">Generate bill \u2192\u003c/button>` : \"\"}\n          ${\n            session.user.role === \"MANAGER\" && order.status === \"CANCELLED\"\n              ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-delete-record=\"${order.id}\" title=\"Delete just this record\">${TRASH_ICON} Delete this record\u003c/button>`\n              : \"\"\n          }\n        \u003c/div>\n      \u003c/div>`;\n    })\n    .join(\"\");\n\n  grid.querySelectorAll(\"[data-toggle-priority]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const [orderId, itemId] = btn.getAttribute(\"data-toggle-priority\").split(\"|\");\n      const order = findOrder(orderId);\n      const item = order.items.find((i) => String(i.id) === String(itemId));\n      item.priority = !item.priority;\n      saveState();\n      showToast(item.priority ? `${item.itemName} flagged \u2014 bring it first` : `${item.itemName} priority cleared`);\n      renderOrdersGrid();\n    })\n  );\n\n  grid.querySelectorAll(\"[data-item-advance]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const [orderId, itemId, status] = btn.getAttribute(\"data-item-advance\").split(\"|\");\n      const order = findOrder(orderId);\n      const item = order.items.find((i) => String(i.id) === String(itemId));\n      item.status = status;\n      recalcOrderStatus(order);\n      saveState();\n      showToast(`${item.itemName} \u2192 ${status}`);\n      renderOrdersGrid();\n    })\n  );\n\n  grid.querySelectorAll(\"[data-cancel-item]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      btn.disabled = true;\n      const [orderId, itemId] = btn.getAttribute(\"data-cancel-item\").split(\"|\");\n      const order = findOrder(orderId);\n      const item = order.items.find((i) => String(i.id) === String(itemId));\n      if (!isCancellable(item.status)) {\n        showToast(`Item cannot be cancelled once it is ${item.status} or later`, \"error\");\n        return;\n      }\n      item.status = \"CANCELLED\";\n      recalcOrderStatus(order);\n      saveState();\n      showToast(`${item.itemName} cancelled`);\n      renderOrdersGrid();\n      if (order.status === \"CANCELLED\") handleOrderFullyCancelled(order);\n    })\n  );\n\n  grid.querySelectorAll(\"[data-advance]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const [orderId, status] = btn.getAttribute(\"data-advance\").split(\"|\");\n      const order = findOrder(orderId);\n      const targetIdx = STATUS_ORDER.indexOf(status);\n      order.items.forEach((i) => {\n        if (i.status === \"CANCELLED\") return;\n        if (STATUS_ORDER.indexOf(i.status) \u003c targetIdx) i.status = status;\n      });\n      recalcOrderStatus(order);\n      saveState();\n      showToast(`Order ${order.orderNumber} \u2192 ${status}`);\n      renderOrdersGrid();\n    })\n  );\n\n  grid.querySelectorAll(\"[data-complete]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      btn.disabled = true;\n      const order = findOrder(btn.getAttribute(\"data-complete\"));\n      order.status = \"COMPLETED\";\n      order.items.forEach((i) => {\n        if (i.status !== \"CANCELLED\") i.status = \"COMPLETED\";\n      });\n      saveState();\n      showToast(`Order ${order.orderNumber} completed`);\n      renderOrdersGrid();\n    })\n  );\n\n  grid.querySelectorAll(\"[data-cancel-order]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const order = findOrder(btn.getAttribute(\"data-cancel-order\"));\n      if (!confirm(`Cancel order ${order.orderNumber}? All its items will be cancelled.`)) return;\n      btn.disabled = true;\n      order.items.forEach((i) => (i.status = \"CANCELLED\"));\n      order.status = \"CANCELLED\";\n      saveState();\n      showToast(`Order ${order.orderNumber} cancelled`);\n      renderOrdersGrid();\n      handleOrderFullyCancelled(order);\n    })\n  );\n\n  grid.querySelectorAll(\"[data-goto-bill]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const order = findOrder(btn.getAttribute(\"data-goto-bill\"));\n      session.billingHighlightTableId = order.tableId;\n      navigate(\"billing\");\n    })\n  );\n\n  grid.querySelectorAll(\"[data-delete-record]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const orderId = Number(btn.getAttribute(\"data-delete-record\"));\n      const order = findOrder(orderId);\n\n      // If this order's bill also covers other orders that AREN'T being deleted,\n      // block it here \u2014 deleting would wipe billing history those still need.\n      const sharedBill = state.bills.find(\n        (b) => (b.orderIds || [b.orderId]).includes(orderId) && (b.orderIds || [b.orderId]).some((oid) => oid !== orderId)\n      );\n      if (sharedBill) {\n        showToast(`This order shares bill ${sharedBill.billNumber} with another order \u2014 use \"Clear all\" to remove them together`, \"error\");\n        return;\n      }\n\n      if (!confirm(`Delete the record for ${order.orderNumber} (Table ${order.tableNumber})? This also removes its bill/payment if any. This cannot be undone.`)) return;\n      deleteOrderRecord(orderId);\n      showToast(`Record ${order.orderNumber} deleted`);\n      renderOrdersGrid();\n    })\n  );\n}\n\n/* ---------- Billing page ---------- */\nconst PAYMENT_METHODS = [\"CASH\", \"UPI\", \"CREDIT_CARD\", \"DEBIT_CARD\"];\nlet billingUI = { gstPercentage: 5, discount: 0, payingBillId: null, method: \"CASH\", billsTab: \"UNPAID\", billDate: \"\" };\n\nfunction renderBillingPage(el) {\n  el.innerHTML = `\n    \u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n      \u003cdiv>\n        \u003ch3 style=\"margin-bottom:12px;font-size:15px;color:var(--paper-dim)\">Completed orders awaiting a bill\u003c/h3>\n        \u003cdiv class=\"card\" style=\"margin-bottom:14px;display:flex;gap:12px\">\n          \u003cdiv>\u003clabel class=\"small\">GST %\u003c/label>\u003cbr/>\u003cinput type=\"number\" id=\"bill-gst\" value=\"${billingUI.gstPercentage}\" style=\"width:70px\" />\u003c/div>\n          \u003cdiv>\u003clabel class=\"small\">Discount \u20b9\u003c/label>\u003cbr/>\u003cinput type=\"number\" id=\"bill-discount\" value=\"${billingUI.discount}\" style=\"width:90px\" />\u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"unbilled-orders\">\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px\">\n          \u003ch3 style=\"font-size:15px;color:var(--paper-dim)\">Bills\u003c/h3>\n          \u003cdiv style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap\">\n            \u003cinput type=\"date\" id=\"bill-date-filter\" value=\"${billingUI.billDate}\" style=\"font-size:12.5px\" title=\"Filter by the day the bill was created\" />\n            ${billingUI.billDate ? `\u003cbutton class=\"btn btn-ghost btn-sm\" id=\"bill-date-clear\">Clear\u003c/button>` : \"\"}\n            \u003cbutton class=\"btn btn-sm ${billingUI.billsTab === \"UNPAID\" ? \"btn-primary\" : \"btn-ghost\"}\" data-bills-tab=\"UNPAID\">Unpaid\u003c/button>\n            \u003cbutton class=\"btn btn-sm ${billingUI.billsTab === \"PAID\" ? \"btn-primary\" : \"btn-ghost\"}\" data-bills-tab=\"PAID\">Paid\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"bill-date-revenue\">\u003c/div>\n        \u003cdiv id=\"bills-list\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  document.getElementById(\"bill-date-filter\").addEventListener(\"change\", (e) => {\n    billingUI.billDate = e.target.value;\n    renderBillsList();\n  });\n  const clearBtn = document.getElementById(\"bill-date-clear\");\n  if (clearBtn) clearBtn.addEventListener(\"click\", () => { billingUI.billDate = \"\"; renderBillingPage(el); });\n\n  document.getElementById(\"bill-gst\").addEventListener(\"input\", (e) => (billingUI.gstPercentage = Number(e.target.value)));\n  document.getElementById(\"bill-discount\").addEventListener(\"input\", (e) => (billingUI.discount = Number(e.target.value)));\n  document.querySelectorAll(\"[data-bills-tab]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      billingUI.billsTab = btn.getAttribute(\"data-bills-tab\");\n      renderBillingPage(el);\n    })\n  );\n\n  renderUnbilledOrders();\n  renderBillsList();\n}\n\nfunction renderUnbilledOrders() {\n  const host = document.getElementById(\"unbilled-orders\");\n  if (!host) return;\n  const billedOrderIds = new Set(state.bills.flatMap((b) => b.orderIds || [b.orderId]));\n  const orders = state.orders.filter((o) => o.status === \"COMPLETED\" && !billedOrderIds.has(o.id));\n\n  if (orders.length === 0) {\n    host.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>Nothing to bill\u003c/h3>\u003cp>Complete an order from the Kitchen board first.\u003c/p>\u003c/div>`;\n    return;\n  }\n\n  // Group unbilled completed orders by table \u2014 a table can rack up several separate\n  // orders through the visit, but they all get settled as ONE combined bill.\n  const byTable = {};\n  orders.forEach((o) => {\n    if (!byTable[o.tableId]) byTable[o.tableId] = [];\n    byTable[o.tableId].push(o);\n  });\n\n  host.innerHTML = `\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n    ${Object.entries(byTable)\n      .map(([tableId, tableOrders]) => {\n        const allItems = tableOrders.flatMap((o) => o.items.filter((i) => i.status !== \"CANCELLED\"));\n        const subtotal = allItems.reduce((sum, i) => sum + i.unitPrice * i.quantity, 0);\n        const orderNumbers = tableOrders.map((o) => o.orderNumber).join(\", \");\n        const customerName = tableOrders.find((o) => o.customerName)?.customerName;\n        const highlighted = String(tableId) === String(session.billingHighlightTableId);\n        return `\n      \u003cdiv class=\"card\" style=\"border-color:${highlighted ? \"var(--brass)\" : \"var(--border)\"}\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:start;margin-bottom:10px\">\n          \u003cdiv>\n            \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">${escapeHtml(orderNumbers)}\u003c/div>\n            \u003cdiv style=\"font-weight:600;font-family:var(--font-display);font-size:17px\">Table ${tableOrders[0].tableNumber} ${customerName ? \"\u00b7 \" + escapeHtml(customerName) : \"\"}\u003c/div>\n            ${tableOrders.length > 1 ? `\u003cdiv style=\"font-size:11.5px;color:var(--brass-bright)\">${tableOrders.length} orders merged into one bill\u003c/div>` : \"\"}\n          \u003c/div>\n          \u003cbutton class=\"btn btn-primary btn-sm\" data-generate-bill=\"${tableId}\">Generate bill\u003c/button>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;flex-direction:column;gap:5px;padding-top:8px;border-top:1px solid var(--border)\">\n          ${groupLinesForDisplay(allItems)\n            .map((g) =>\n              g.isCombo\n                ? `\n            \u003cdiv style=\"font-size:13px;color:var(--paper-dim)\">\n              \u003cdiv style=\"display:flex;justify-content:space-between;font-weight:600\">\n                \u003cspan>\ud83c\udf81 ${escapeHtml(g.comboName)}\u003c/span>\n                \u003cspan class=\"mono\">\u20b9${money(g.lineTotal)}\u003c/span>\n              \u003c/div>\n              ${g.lines.map((l) => `\u003cdiv style=\"font-size:11.5px;color:var(--muted);padding-left:14px\">${l.quantity}\u00d7 ${escapeHtml(l.itemName)}\u003c/div>`).join(\"\")}\n            \u003c/div>`\n                : `\n            \u003cdiv style=\"display:flex;justify-content:space-between;font-size:13px;color:var(--paper-dim)\">\n              \u003cspan>${g.quantity}\u00d7 ${escapeHtml(g.itemName)}\u003c/span>\n              \u003cspan class=\"mono\">\u20b9${money(g.lineTotal)}\u003c/span>\n            \u003c/div>`\n            )\n            .join(\"\")}\n          \u003cdiv style=\"display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)\">\n            \u003cspan>Subtotal\u003c/span>\u003cspan class=\"mono\">\u20b9${money(subtotal)}\u003c/span>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>`;\n      })\n      .join(\"\")}\n  \u003c/div>`;\n\n  host.querySelectorAll(\"[data-generate-bill]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const tableId = Number(btn.getAttribute(\"data-generate-bill\"));\n      const tableOrders = state.orders.filter(\n        (o) => o.tableId === tableId && o.status === \"COMPLETED\" && !new Set(state.bills.flatMap((b) => b.orderIds || [b.orderId])).has(o.id)\n      );\n      const billableItems = tableOrders.flatMap((o) => o.items.filter((i) => i.status !== \"CANCELLED\"));\n      if (billableItems.length === 0) {\n        showToast(\"Cannot generate a bill with no billable items\", \"error\");\n        return;\n      }\n      const subtotal = billableItems.reduce((sum, i) => sum + i.unitPrice * i.quantity, 0);\n      const gstAmount = Math.round(((subtotal * billingUI.gstPercentage) / 100) * 100) / 100;\n      const grandTotal = Math.round((subtotal + gstAmount - billingUI.discount) * 100) / 100;\n      if (grandTotal \u003c 0) {\n        showToast(\"Discount cannot exceed the subtotal plus GST\", \"error\");\n        return;\n      }\n      const table = findTable(tableId);\n      const bill = {\n        id: nextId(\"bill\"),\n        billNumber: genBillNumber(),\n        orderIds: tableOrders.map((o) => o.id),\n        orderId: tableOrders[0].id, // kept for backward compatibility with older saved data\n        orderNumber: tableOrders.map((o) => o.orderNumber).join(\", \"),\n        tableId: tableId,\n        tableNumber: table.tableNumber,\n        customerName: tableOrders.find((o) => o.customerName)?.customerName || null,\n        items: billableItems.map((i) => ({ ...i })),\n        subtotal,\n        gstPercentage: billingUI.gstPercentage,\n        gstAmount,\n        discountAmount: billingUI.discount,\n        grandTotal,\n        status: \"UNPAID\",\n        createdAt: new Date().toISOString(),\n      };\n      state.bills.push(bill);\n      saveState();\n      showToast(`Bill ${bill.billNumber} generated for Table ${table.tableNumber} \u2014 total \u20b9${money(grandTotal)}`);\n      renderUnbilledOrders();\n      renderBillsList();\n    })\n  );\n}\n\nfunction renderBillsList() {\n  const host = document.getElementById(\"bills-list\");\n  const revenueHost = document.getElementById(\"bill-date-revenue\");\n  if (!host) return;\n  let bills = state.bills\n    .filter((b) => b.status === billingUI.billsTab || (billingUI.billsTab === \"PAID\" && b.status !== \"UNPAID\"))\n    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));\n\n  if (billingUI.billDate) {\n    bills = bills.filter((b) => b.createdAt.slice(0, 10) === billingUI.billDate);\n  }\n\n  if (revenueHost) {\n    if (billingUI.billDate) {\n      const paidThatDay = state.bills.filter((b) => b.status === \"PAID\" && b.createdAt.slice(0, 10) === billingUI.billDate);\n      const total = paidThatDay.reduce((sum, b) => sum + b.grandTotal, 0);\n      const dateLabel = new Date(billingUI.billDate + \"T00:00:00\").toLocaleDateString(\"en-IN\", { day: \"numeric\", month: \"short\", year: \"numeric\" });\n      revenueHost.innerHTML = `\u003cdiv class=\"card\" style=\"margin-bottom:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center\">\n        \u003cspan style=\"font-size:12.5px;color:var(--muted)\">Revenue on ${dateLabel}\u003c/span>\n        \u003cspan class=\"mono\" style=\"font-weight:700;color:var(--brass-bright)\">\u20b9${money(total)} \u003cspan style=\"color:var(--muted);font-weight:400\">(${paidThatDay.length} paid bill${paidThatDay.length === 1 ? \"\" : \"s\"})\u003c/span>\u003c/span>\n      \u003c/div>`;\n    } else {\n      revenueHost.innerHTML = \"\";\n    }\n  }\n\n  if (bills.length === 0) {\n    host.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>${billingUI.billDate ? \"No bills on that date\" : billingUI.billsTab === \"UNPAID\" ? \"No unpaid bills\" : \"No paid bills yet\"}\u003c/h3>\u003c/div>`;\n    return;\n  }\n\n  host.innerHTML = `\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n    ${bills\n      .map((bill) => {\n        const paidColorVar = bill.status === \"PAID\" ? \"available\" : \"reserved\";\n        return `\n      \u003cdiv class=\"card\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:start\">\n          \u003cdiv>\n            \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">${bill.billNumber} \u00b7 ${bill.orderNumber}\u003c/div>\n            \u003cdiv style=\"font-weight:600\">Table ${bill.tableNumber}\u003c/div>\n          \u003c/div>\n          \u003cspan class=\"badge\" style=\"color:var(--${paidColorVar});background:var(--${paidColorVar}-bg)\">${bill.status}\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"margin-top:10px;font-size:13px;color:var(--paper-dim)\">\n          ${groupLinesForDisplay(bill.items)\n            .map((g) =>\n              g.isCombo\n                ? `\u003cdiv style=\"margin-bottom:3px\">\n                    \u003cdiv style=\"display:flex;justify-content:space-between\">\u003cspan>\ud83c\udf81 ${escapeHtml(g.comboName)}\u003c/span>\u003cspan class=\"mono\">\u20b9${money(g.lineTotal)}\u003c/span>\u003c/div>\n                    ${g.lines.map((l) => `\u003cdiv style=\"font-size:11px;color:var(--muted);padding-left:14px\">${l.quantity}\u00d7 ${escapeHtml(l.itemName)}\u003c/div>`).join(\"\")}\n                  \u003c/div>`\n                : `\u003cdiv style=\"display:flex;justify-content:space-between\">\u003cspan>${g.quantity}\u00d7 ${escapeHtml(g.itemName)}\u003c/span>\u003cspan class=\"mono\">\u20b9${money(g.lineTotal)}\u003c/span>\u003c/div>`\n            )\n            .join(\"\")}\n          \u003cdiv style=\"border-top:1px dashed var(--border);margin:8px 0\">\u003c/div>\n          \u003cdiv style=\"display:flex;justify-content:space-between\">\u003cspan>Subtotal\u003c/span>\u003cspan class=\"mono\">\u20b9${money(bill.subtotal)}\u003c/span>\u003c/div>\n          \u003cdiv style=\"display:flex;justify-content:space-between\">\u003cspan>GST (${bill.gstPercentage}%)\u003c/span>\u003cspan class=\"mono\">\u20b9${money(bill.gstAmount)}\u003c/span>\u003c/div>\n          ${bill.discountAmount > 0 ? `\u003cdiv style=\"display:flex;justify-content:space-between\">\u003cspan>Discount\u003c/span>\u003cspan class=\"mono\">\u2212\u20b9${money(bill.discountAmount)}\u003c/span>\u003c/div>` : \"\"}\n          \u003cdiv style=\"display:flex;justify-content:space-between;font-weight:700;font-size:14.5px\">\u003cspan>Grand total\u003c/span>\u003cspan class=\"mono\">\u20b9${money(bill.grandTotal)}\u003c/span>\u003c/div>\n        \u003c/div>\n        ${\n          bill.status === \"UNPAID\"\n            ? `\u003cdiv style=\"margin-top:12px\" id=\"pay-zone-${bill.id}\">\n                ${\n                  billingUI.payingBillId === bill.id\n                    ? `\u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\n                        \u003cdiv style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n                          \u003cselect id=\"pay-method-${bill.id}\">${PAYMENT_METHODS.map((m) => `\u003coption value=\"${m}\" ${billingUI.method === m ? \"selected\" : \"\"}>${m.replace(\"_\", \" \")}\u003c/option>`).join(\"\")}\u003c/select>\n                          \u003clabel style=\"font-size:12px;color:var(--paper-dim);display:flex;align-items:center;gap:6px\">Extra discount \u20b9\n                            \u003cinput type=\"number\" id=\"pay-discount-${bill.id}\" value=\"0\" min=\"0\" style=\"width:80px\" />\n                          \u003c/label>\n                        \u003c/div>\n                        \u003cdiv style=\"font-size:12.5px;color:var(--muted)\">Amount due: \u003cspan class=\"mono\" id=\"pay-due-${bill.id}\" style=\"color:var(--brass-bright);font-weight:700\">\u20b9${money(bill.grandTotal)}\u003c/span>\u003c/div>\n                        \u003cdiv style=\"display:flex;gap:8px\">\n                          \u003cbutton class=\"btn btn-primary btn-sm\" data-confirm-pay=\"${bill.id}\">Confirm payment\u003c/button>\n                          \u003cbutton class=\"btn btn-ghost btn-sm\" data-cancel-pay=\"${bill.id}\">Cancel\u003c/button>\n                        \u003c/div>\n                      \u003c/div>`\n                    : `\u003cbutton class=\"btn btn-primary btn-sm\" data-start-pay=\"${bill.id}\">Receive payment\u003c/button>`\n                }\n              \u003c/div>`\n            : \"\"\n        }\n      \u003c/div>`;\n      })\n      .join(\"\")}\n  \u003c/div>`;\n\n  host.querySelectorAll(\"[data-start-pay]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      billingUI.payingBillId = Number(btn.getAttribute(\"data-start-pay\"));\n      renderBillsList();\n    })\n  );\n  host.querySelectorAll(\"[data-cancel-pay]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      billingUI.payingBillId = null;\n      renderBillsList();\n    })\n  );\n  host.querySelectorAll(\"select[id^=pay-method-]\").forEach((sel) =>\n    sel.addEventListener(\"change\", (e) => (billingUI.method = e.target.value))\n  );\n  host.querySelectorAll(\"input[id^=pay-discount-]\").forEach((inp) =>\n    inp.addEventListener(\"input\", () => {\n      const billId = Number(inp.id.replace(\"pay-discount-\", \"\"));\n      const bill = findBill(billId);\n      const extra = Number(inp.value || 0);\n      const due = Math.max(0, bill.grandTotal - extra);\n      const dueEl = document.getElementById(`pay-due-${billId}`);\n      if (dueEl) dueEl.textContent = \"\u20b9\" + money(due);\n    })\n  );\n  host.querySelectorAll(\"[data-confirm-pay]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const bill = findBill(btn.getAttribute(\"data-confirm-pay\"));\n      const methodSel = document.getElementById(`pay-method-${bill.id}`);\n      const method = methodSel ? methodSel.value : billingUI.method;\n      const discountInp = document.getElementById(`pay-discount-${bill.id}`);\n      const extraDiscount = Math.min(Number(discountInp?.value || 0), bill.grandTotal);\n      const amountPaid = Math.round((bill.grandTotal - extraDiscount) * 100) / 100;\n\n      if (extraDiscount > 0) {\n        bill.discountAmount = Math.round((bill.discountAmount + extraDiscount) * 100) / 100;\n        bill.grandTotal = amountPaid;\n      }\n\n      state.payments.push({\n        id: nextId(\"payment\"),\n        billId: bill.id,\n        billNumber: bill.billNumber,\n        method,\n        amount: amountPaid,\n        status: \"SUCCESS\",\n        paidAt: new Date().toISOString(),\n      });\n      bill.status = \"PAID\";\n\n      const orderIds = bill.orderIds || [bill.orderId];\n      orderIds.forEach((oid) => {\n        const order = findOrder(oid);\n        if (order) {\n          order.status = \"COMPLETED\";\n          order.items.forEach((i) => {\n            if (i.status !== \"CANCELLED\") i.status = \"COMPLETED\";\n          });\n        }\n      });\n      const table = findTable(bill.tableId);\n      if (table) table.status = \"AVAILABLE\";\n\n      saveState();\n      billingUI.payingBillId = null;\n      showToast(`Payment received for ${bill.billNumber} \u2014 table is now available`);\n      renderBillsList();\n      renderUnbilledOrders();\n    })\n  );\n}\n\n/* ---------- Dashboard page ---------- */\nfunction renderDashboardPage(el) {\n  const isManager = session.user.role === \"MANAGER\";\n  const { start, end } = todayBounds();\n  const yStart = new Date(start);\n  yStart.setDate(yStart.getDate() - 1);\n  const yEnd = new Date(end);\n  yEnd.setDate(yEnd.getDate() - 1);\n\n  const ordersToday = state.orders.filter((o) => {\n    const d = new Date(o.createdAt);\n    return d >= start && d \u003c= end;\n  });\n  const totalTables = state.tables.length;\n  const availableTables = state.tables.filter((t) => t.status === \"AVAILABLE\").length;\n  const occupiedTables = state.tables.filter((t) => t.status === \"OCCUPIED\").length;\n  const reservedTables = state.tables.filter((t) => t.status === \"RESERVED\").length;\n  const pendingOrders = state.orders.filter((o) => o.status === \"PLACED\").length;\n  const preparingOrders = state.orders.filter((o) => o.status === \"PREPARING\").length;\n  const completedToday = ordersToday.filter((o) => o.status === \"COMPLETED\").length;\n  const revenueToday = state.bills\n    .filter((b) => b.status === \"PAID\" && new Date(b.createdAt) >= start && new Date(b.createdAt) \u003c= end)\n    .reduce((sum, b) => sum + b.grandTotal, 0);\n  const revenueYesterday = state.bills\n    .filter((b) => b.status === \"PAID\" && new Date(b.createdAt) >= yStart && new Date(b.createdAt) \u003c= yEnd)\n    .reduce((sum, b) => sum + b.grandTotal, 0);\n  const revenueDelta = revenueYesterday > 0 ? Math.round(((revenueToday - revenueYesterday) / revenueYesterday) * 100) : null;\n\n  const stat = (icon, label, value, colorVar) => `\n    \u003cdiv class=\"card stat-card-v2\" style=\"border-left:3px solid ${colorVar ? `var(--${colorVar})` : \"var(--border)\"}\">\n      \u003cdiv class=\"stat-icon\">${icon}\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"stat-label\">${label}\u003c/div>\n        \u003cdiv class=\"mono stat-value\" style=\"color:${colorVar ? `var(--${colorVar})` : \"var(--paper)\"}\">${value}\u003c/div>\n      \u003c/div>\n    \u003c/div>`;\n\n  const funnel = [\n    { label: \"Pending\", value: pendingOrders, colorVar: \"placed\" },\n    { label: \"Preparing\", value: preparingOrders, colorVar: \"preparing\" },\n    { label: \"Completed today\", value: completedToday, colorVar: \"completed\" },\n  ];\n  const maxFunnel = Math.max(1, ...funnel.map((f) => f.value));\n\n  const occSlices = [\n    { label: \"Available\", value: availableTables, colorVar: \"available\" },\n    { label: \"Occupied\", value: occupiedTables, colorVar: \"occupied\" },\n    { label: \"Reserved\", value: reservedTables, colorVar: \"reserved\" },\n    { label: \"Other\", value: Math.max(totalTables - availableTables - occupiedTables - reservedTables, 0), colorVar: \"disabled\" },\n  ].filter((s) => s.value > 0);\n  const totalOcc = occSlices.reduce((s, o) => s + o.value, 0) || 1;\n\n  el.innerHTML = `\n    ${\n      isManager\n        ? `\n    \u003cdiv class=\"revenue-hero\">\n      \u003cdiv class=\"revenue-hero-block\">\n        \u003cdiv class=\"stat-label\">Revenue today\u003c/div>\n        \u003cdiv class=\"mono revenue-hero-value\">\u20b9${Math.round(revenueToday).toLocaleString(\"en-IN\")}\u003c/div>\n        ${\n          revenueDelta !== null\n            ? `\u003cdiv style=\"font-size:12px;color:${revenueDelta >= 0 ? \"var(--available)\" : \"var(--occupied)\"}\">${revenueDelta >= 0 ? \"\u25b2\" : \"\u25bc\"} ${Math.abs(revenueDelta)}% vs yesterday\u003c/div>`\n            : `\u003cdiv style=\"font-size:12px;color:var(--muted)\">No data from yesterday to compare\u003c/div>`\n        }\n      \u003c/div>\n      \u003cdiv class=\"revenue-hero-divider\">\u003c/div>\n      \u003cdiv class=\"revenue-hero-block\">\n        \u003cdiv class=\"stat-label\">Revenue yesterday\u003c/div>\n        \u003cdiv class=\"mono revenue-hero-value\" style=\"color:var(--paper-dim)\">\u20b9${Math.round(revenueYesterday).toLocaleString(\"en-IN\")}\u003c/div>\n      \u003c/div>\n    \u003c/div>`\n        : \"\"\n    }\n\n    \u003cdiv class=\"stat-grid\">\n      ${stat(\"\ud83c\udf7d\", \"Total tables\", totalTables)}\n      ${stat(\"\ud83d\udfe2\", \"Available\", availableTables, \"available\")}\n      ${stat(\"\ud83d\udd34\", \"Occupied\", occupiedTables, \"occupied\")}\n      ${stat(\"\ud83d\udfe0\", \"Reserved\", reservedTables, \"reserved\")}\n      ${stat(\"\ud83d\udccb\", \"Orders today\", ordersToday.length)}\n      ${stat(\"\u23f3\", \"Pending orders\", pendingOrders, \"placed\")}\n      ${stat(\"\ud83d\udd25\", \"Preparing\", preparingOrders, \"preparing\")}\n      ${stat(\"\u2705\", \"Completed today\", completedToday, \"completed\")}\n    \u003c/div>\n\n    \u003cdiv style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px\">\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:14.5px;margin-bottom:14px;color:var(--paper-dim)\">Table occupancy\u003c/h3>\n        \u003cdiv style=\"display:flex;height:22px;border-radius:6px;overflow:hidden;margin-bottom:14px\">\n          ${occSlices.map((s) => `\u003cdiv style=\"width:${(s.value / totalOcc) * 100}%;background:var(--${s.colorVar})\">\u003c/div>`).join(\"\")}\n        \u003c/div>\n        \u003cdiv style=\"display:flex;gap:16px;justify-content:center;flex-wrap:wrap\">\n          ${occSlices.map((s) => `\u003cdiv style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--paper-dim)\">\u003cspan style=\"width:8px;height:8px;border-radius:50%;background:var(--${s.colorVar})\">\u003c/span>${s.label} (${s.value})\u003c/div>`).join(\"\")}\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:14.5px;margin-bottom:14px;color:var(--paper-dim)\">Order funnel (today)\u003c/h3>\n        ${funnel\n          .map(\n            (f) => `\n          \u003cdiv class=\"bar-row\">\n            \u003cspan style=\"width:90px;color:var(--paper-dim)\">${f.label}\u003c/span>\n            \u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:${(f.value / maxFunnel) * 100}%;background:var(--${f.colorVar})\">\u003c/div>\u003c/div>\n            \u003cspan class=\"mono\" style=\"width:24px;text-align:right\">${f.value}\u003c/span>\n          \u003c/div>`\n          )\n          .join(\"\")}\n      \u003c/div>\n    \u003c/div>\n  `;\n}\n\n/* ---------- Menu Admin page ---------- */\nconst SPICY_LEVELS = [\"NONE\", \"MILD\", \"MEDIUM\", \"HOT\", \"EXTRA_HOT\"];\nlet menuAdminEditId = null;\nlet menuAdminItemFilter = \"ALL\";\n\nfunction renderMenuAdminPage(el) {\n  const isManager = session.user.role === \"MANAGER\";\n  el.innerHTML = `\n    \u003cdiv class=\"two-col-admin\">\n      \u003cdiv>\n        \u003cdiv class=\"card\" style=\"margin-bottom:20px\">\n          \u003ch3 style=\"font-size:14.5px;margin-bottom:10px\">Categories\u003c/h3>\n          ${\n            isManager\n              ? `\u003cform id=\"new-category-form\" style=\"display:flex;gap:8px;margin-bottom:12px\">\n                  \u003cinput type=\"text\" id=\"new-category-name\" placeholder=\"New category name\" style=\"flex:1;min-width:0\" />\n                  \u003cbutton type=\"submit\" class=\"btn btn-primary btn-sm\">Add\u003c/button>\n                \u003c/form>`\n              : `\u003cdiv style=\"font-size:12px;color:var(--muted);margin-bottom:12px\">Only managers can add categories.\u003c/div>`\n          }\n          \u003cdiv id=\"category-list\" style=\"display:flex;flex-direction:column;gap:4px\">\u003c/div>\n        \u003c/div>\n\n        \u003cdiv class=\"card\">\n          \u003ch3 style=\"font-size:14.5px;margin-bottom:4px\" id=\"item-form-title\">New menu item\u003c/h3>\n          ${!isManager ? `\u003cdiv style=\"font-size:12px;color:var(--muted);margin-bottom:10px\">Only managers can add new items. Editing/reactivating existing items is fine.\u003c/div>` : `\u003cdiv style=\"margin-bottom:10px\">\u003c/div>`}\n          \u003cform id=\"item-form\" class=\"mi-form\">\n            \u003cselect id=\"mi-category\" required>\u003coption value=\"\">Category\u2026\u003c/option>${state.categories.map((c) => `\u003coption value=\"${c.id}\">${escapeHtml(c.name)}\u003c/option>`).join(\"\")}\u003c/select>\n            \u003cinput type=\"text\" id=\"mi-name\" placeholder=\"Item name\" required />\n            \u003ctextarea id=\"mi-description\" placeholder=\"Description\">\u003c/textarea>\n            \u003cdiv class=\"mi-form-row\">\n              \u003clabel class=\"small\">Price \u20b9\u003cinput type=\"number\" id=\"mi-price\" placeholder=\"0\" required />\u003c/label>\n              \u003clabel class=\"small\">Prep time (min)\u003cinput type=\"number\" id=\"mi-preptime\" placeholder=\"0\" required />\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"mi-form-row\">\n              \u003clabel class=\"small\">Available qty\u003cinput type=\"number\" id=\"mi-qty\" placeholder=\"0\" />\u003c/label>\n              \u003clabel class=\"small\">Spicy level\u003cselect id=\"mi-spicy\">${SPICY_LEVELS.map((s) => `\u003coption value=\"${s}\">${s}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"veg-toggle-group\">\n              \u003cspan class=\"small\" style=\"margin-right:4px\">Type\u003c/span>\n              \u003clabel class=\"veg-radio\">\u003cinput type=\"radio\" name=\"mi-veg\" id=\"mi-veg-yes\" value=\"veg\" checked />\u003cspan class=\"veg-dot veg\">\u003c/span> Veg\u003c/label>\n              \u003clabel class=\"veg-radio\">\u003cinput type=\"radio\" name=\"mi-veg\" id=\"mi-veg-no\" value=\"nonveg\" />\u003cspan class=\"veg-dot nonveg\">\u003c/span> Non-veg\u003c/label>\n            \u003c/div>\n            \u003cdiv style=\"display:flex;gap:8px;margin-top:4px\">\n              \u003cbutton type=\"submit\" class=\"btn btn-primary btn-sm\" style=\"flex:1\" id=\"item-form-submit\" ${!isManager ? \"disabled\" : \"\"}>Create item\u003c/button>\n              \u003cbutton type=\"button\" class=\"btn btn-ghost btn-sm hidden\" id=\"item-form-cancel\">Cancel\u003c/button>\n            \u003c/div>\n          \u003c/form>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv>\n        \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n          \u003ch3 style=\"font-size:14.5px;color:var(--paper-dim)\">All items (\u003cspan id=\"item-count\">${state.items.length}\u003c/span>)\u003c/h3>\n          \u003cselect id=\"admin-item-filter\">\n            \u003coption value=\"ALL\">Show all\u003c/option>\n            \u003coption value=\"AVAILABLE\">Available only\u003c/option>\n            \u003coption value=\"UNAVAILABLE\">Unavailable only\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv id=\"admin-items-list\" style=\"display:flex;flex-direction:column;gap:8px\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  document.getElementById(\"new-category-form\")?.addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const input = document.getElementById(\"new-category-name\");\n    const name = input.value.trim();\n    if (!name) return;\n    if (state.categories.some((c) => c.name.toLowerCase() === name.toLowerCase())) {\n      showToast(\"Category already exists\", \"error\");\n      return;\n    }\n    state.categories.push({ id: nextId(\"category\"), name });\n    saveState();\n    input.value = \"\";\n    showToast(\"Category added\");\n    renderMenuAdminPage(el);\n  });\n\n  document.getElementById(\"item-form\").addEventListener(\"submit\", (e) => {\n    e.preventDefault();\n    const isManagerNow = session.user.role === \"MANAGER\";\n    if (!menuAdminEditId && !isManagerNow) {\n      showToast(\"Only managers can add new items\", \"error\");\n      return;\n    }\n    const categoryId = Number(document.getElementById(\"mi-category\").value);\n    if (!categoryId) {\n      showToast(\"Choose a category\", \"error\");\n      return;\n    }\n    const payload = {\n      categoryId,\n      name: document.getElementById(\"mi-name\").value.trim(),\n      description: document.getElementById(\"mi-description\").value.trim(),\n      price: Number(document.getElementById(\"mi-price\").value),\n      prepTime: Number(document.getElementById(\"mi-preptime\").value),\n      availableQty: Number(document.getElementById(\"mi-qty\").value || 0),\n      spicyLevel: document.getElementById(\"mi-spicy\").value,\n      veg: document.getElementById(\"mi-veg-yes\").checked,\n    };\n\n    if (menuAdminEditId) {\n      const item = findItem(menuAdminEditId);\n      Object.assign(item, payload);\n      showToast(\"Item updated\");\n    } else {\n      state.items.push({ id: nextId(\"item\"), ...payload, rating: 0, available: true });\n      showToast(\"Item created\");\n    }\n    saveState();\n    resetItemForm();\n    renderAdminItemsList();\n  });\n\n  document.getElementById(\"item-form-cancel\").addEventListener(\"click\", resetItemForm);\n  document.getElementById(\"admin-item-filter\").value = menuAdminItemFilter;\n  document.getElementById(\"admin-item-filter\").addEventListener(\"change\", (e) => {\n    menuAdminItemFilter = e.target.value;\n    renderAdminItemsList();\n  });\n\n  renderCategoryList();\n  renderAdminItemsList();\n}\n\nfunction resetItemForm() {\n  menuAdminEditId = null;\n  const form = document.getElementById(\"item-form\");\n  if (form) form.reset();\n  const title = document.getElementById(\"item-form-title\");\n  if (title) title.textContent = \"New menu item\";\n  const submitBtn = document.getElementById(\"item-form-submit\");\n  if (submitBtn) {\n    submitBtn.textContent = \"Create item\";\n    submitBtn.disabled = session.user.role !== \"MANAGER\";\n  }\n  const cancelBtn = document.getElementById(\"item-form-cancel\");\n  if (cancelBtn) cancelBtn.classList.add(\"hidden\");\n}\n\nfunction renderCategoryList() {\n  const host = document.getElementById(\"category-list\");\n  if (!host) return;\n  host.innerHTML = state.categories.map((c) => `\u003cdiv style=\"font-size:13px;color:var(--paper-dim);padding:4px 0\">${escapeHtml(c.name)}\u003c/div>`).join(\"\");\n}\n\nfunction renderAdminItemsList() {\n  const host = document.getElementById(\"admin-items-list\");\n  if (!host) return;\n  document.getElementById(\"item-count\").textContent = state.items.length;\n\n  const visibleItems = state.items.filter((item) => {\n    if (menuAdminItemFilter === \"AVAILABLE\") return item.available;\n    if (menuAdminItemFilter === \"UNAVAILABLE\") return !item.available;\n    return true;\n  });\n\n  if (visibleItems.length === 0) {\n    host.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No items here\u003c/h3>\u003cp>Try a different filter.\u003c/p>\u003c/div>`;\n    return;\n  }\n\n  host.innerHTML = visibleItems\n    .map((item) => {\n      const cat = findCategory(item.categoryId);\n      return `\n      \u003cdiv class=\"card\" style=\"display:flex;justify-content:space-between;align-items:center;opacity:${item.available ? 1 : 0.6}\">\n        \u003cdiv>\n          \u003cdiv style=\"font-weight:600\">${escapeHtml(item.name)} \u003cspan style=\"font-size:11px;color:var(--muted)\">(${cat ? escapeHtml(cat.name) : \"\u2014\"})\u003c/span>\u003c/div>\n          \u003cdiv style=\"font-size:12.5px;color:var(--muted)\">\u20b9${item.price} \u00b7 ${item.prepTime} min \u00b7 ${item.veg ? \"Veg\" : \"Non-veg\"} \u00b7 \u003cspan style=\"color:${item.available ? \"var(--available)\" : \"var(--occupied)\"}\">${item.available ? \"Available\" : \"Unavailable\"}\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;gap:6px\">\n          \u003cbutton class=\"btn btn-ghost btn-sm\" data-edit-item=\"${item.id}\">Edit\u003c/button>\n          ${\n            item.available\n              ? `\u003cbutton class=\"btn btn-danger btn-sm\" data-remove-item=\"${item.id}\">Remove\u003c/button>`\n              : `\u003cbutton class=\"btn btn-primary btn-sm\" data-reactivate-item=\"${item.id}\">Reactivate\u003c/button>`\n          }\n        \u003c/div>\n      \u003c/div>`;\n    })\n    .join(\"\");\n\n  host.querySelectorAll(\"[data-edit-item]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const item = findItem(btn.getAttribute(\"data-edit-item\"));\n      menuAdminEditId = item.id;\n      document.getElementById(\"mi-category\").value = item.categoryId;\n      document.getElementById(\"mi-name\").value = item.name;\n      document.getElementById(\"mi-description\").value = item.description || \"\";\n      document.getElementById(\"mi-price\").value = item.price;\n      document.getElementById(\"mi-preptime\").value = item.prepTime;\n      document.getElementById(\"mi-qty\").value = item.availableQty;\n      document.getElementById(\"mi-spicy\").value = item.spicyLevel;\n      document.getElementById(\"mi-veg-yes\").checked = item.veg;\n      document.getElementById(\"mi-veg-no\").checked = !item.veg;\n      document.getElementById(\"item-form-title\").textContent = \"Edit item\";\n      const submitBtn = document.getElementById(\"item-form-submit\");\n      submitBtn.textContent = \"Update item\";\n      submitBtn.disabled = false;\n      document.getElementById(\"item-form-cancel\").classList.remove(\"hidden\");\n      window.scrollTo({ top: 0, behavior: \"smooth\" });\n    })\n  );\n\n  host.querySelectorAll(\"[data-remove-item]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const item = findItem(btn.getAttribute(\"data-remove-item\"));\n      if (!confirm(`Mark \"${item.name}\" unavailable?`)) return;\n      item.available = false;\n      saveState();\n      showToast(`${item.name} marked unavailable \u2014 find it again anytime via the \"Reactivate\" button here`);\n      renderAdminItemsList();\n    })\n  );\n\n  host.querySelectorAll(\"[data-reactivate-item]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const item = findItem(btn.getAttribute(\"data-reactivate-item\"));\n      item.available = true;\n      saveState();\n      showToast(`${item.name} is available again`);\n      renderAdminItemsList();\n    })\n  );\n}\n\n/* ---------- Boot ---------- */\n\n// Kitchen \"auto-cook\" simulation: orders move themselves along PLACED -> PREPARING ->\n// PREPARED -> SERVED every ~6s, so you don't have to click through every stage by hand.\n// Staff can still override at any point (advance early, or cancel while eligible).\n// It deliberately stops at SERVED \u2014 completing + billing stays a deliberate staff action.\nfunction autoAdvanceTick() {\n  let changed = false;\n  state.orders.forEach((order) => {\n    const next = NEXT_STATUS[order.status];\n    if (!next) return;\n    const targetIdx = STATUS_ORDER.indexOf(next);\n    order.items.forEach((i) => {\n      if (i.status === \"CANCELLED\") return;\n      if (STATUS_ORDER.indexOf(i.status) \u003c targetIdx) i.status = next;\n    });\n    recalcOrderStatus(order);\n    changed = true;\n  });\n  if (!changed) return;\n  saveState();\n  if (session.user && session.page === \"orders\") renderOrdersGrid();\n  if (session.user && session.page === \"dashboard\") renderDashboardPage(document.getElementById(\"page-content\"));\n}\nsetInterval(autoAdvanceTick, 6000);\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "school-management.html", "name": "EduAdmin", "desc": "School management system for students, staff and administration.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>EduAdmin \u2014 School Management System\u003c/title>\n\u003cstyle>\n  :root{\n    --bg:#0d1b2a; --panel:#132a3e; --panel2:#0f2337; --border:#1f3f57;\n    --text:#e8f1f8; --text-dim:#8fa8bd; --amber:#f2a541; --green:#3ecf8e;\n    --red:#ef5b5b; --blue:#4fa3e3; --purple:#a78bfa; --radius:14px;\n  }\n  *{box-sizing:border-box;}\n  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}\n  .hidden{display:none !important;}\n\n  /* ===== LOGIN ===== */\n  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}\n  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px;width:380px;max-width:100%;}\n  .login-card h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:8px;}\n  .login-card .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}\n  .field{margin-bottom:14px;}\n  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;}\n  .field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;}\n  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}\n  .role-opt{border:1px solid var(--border);background:var(--panel2);color:var(--text-dim);border-radius:9px;padding:9px 6px;text-align:center;font-size:12.5px;cursor:pointer;}\n  .role-opt.active{border-color:var(--amber);color:var(--amber);background:rgba(242,165,65,.08);}\n  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}\n  .btn-amber{background:var(--amber);color:#1a1206;}\n  .btn-amber:hover{filter:brightness(1.08);}\n  .btn-amber:disabled{opacity:.45;cursor:not-allowed;}\n  .login-err{color:var(--red);font-size:13px;margin-top:10px;display:none;}\n  .demo-box{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}\n  .demo-box summary{cursor:pointer;color:var(--blue);font-size:12.5px;}\n  .demo-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);padding:5px 0;border-bottom:1px dashed var(--border);}\n  .demo-row b{color:var(--text);}\n  .demo-row span{font-family:'Consolas',monospace;color:var(--green);}\n\n  /* ===== APP SHELL ===== */\n  #app-screen{display:none;min-height:100vh;}\n  header{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--panel2);}\n  header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:9px;}\n  .who{display:flex;align-items:center;gap:12px;font-size:13.5px;}\n  .who .role-tag{background:var(--panel);border:1px solid var(--border);padding:4px 10px;border-radius:20px;color:var(--amber);font-size:11.5px;font-weight:700;text-transform:uppercase;}\n  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;}\n  .btn-ghost:hover{border-color:var(--blue);}\n  .wrap{max-width:1180px;margin:0 auto;padding:24px;}\n\n  .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}\n  .tab-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);padding:9px 16px;border-radius:9px;font-size:13.5px;cursor:pointer;}\n  .tab-btn.active{border-color:var(--amber);color:var(--amber);background:rgba(242,165,65,.08);}\n\n  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}\n  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}\n  .stat-card .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}\n  .stat-card .val{font-size:26px;font-weight:700;margin-top:6px;}\n\n  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}\n  .panel h3{margin:0 0 14px;font-size:15.5px;}\n  .panel .desc{color:var(--text-dim);font-size:13px;margin:-8px 0 16px;}\n  .row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}\n  .row-flex select, .row-flex input{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:13.5px;}\n\n  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}\n  th,td{padding:10px 13px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);}\n  th{background:var(--panel2);color:var(--text-dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.4px;}\n  tr:last-child td{border-bottom:none;}\n  tr:hover td{background:#12293d;}\n  .idcode{font-family:'Consolas',monospace;color:var(--blue);font-size:12px;}\n  .pw{font-family:'Consolas',monospace;color:var(--green);font-size:12px;}\n  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(167,139,250,.15);color:var(--purple);}\n  .badge.present{background:rgba(62,207,142,.15);color:var(--green);}\n  .badge.absent{background:rgba(239,91,91,.15);color:var(--red);}\n  .badge.completed{background:rgba(62,207,142,.15);color:var(--green);}\n  .badge.pending{background:rgba(242,165,65,.15);color:var(--amber);}\n\n  .toggle-att{border:1px solid var(--border);background:var(--panel2);color:var(--text-dim);padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;margin-right:4px;}\n  .toggle-att.present.on{background:rgba(62,207,142,.18);border-color:var(--green);color:var(--green);}\n  .toggle-att.absent.on{background:rgba(239,91,91,.18);border-color:var(--red);color:var(--red);}\n  .marks-input{width:70px;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:13px;}\n\n  .profile-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:460px;}\n  .profile-card .avatar{width:56px;height:56px;border-radius:50%;background:var(--amber);color:#1a1206;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}\n  .profile-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}\n  .profile-row span:first-child{color:var(--text-dim);}\n\n  .topper-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--panel2);}\n  .topper-rank{width:30px;height:30px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--amber);border:1px solid var(--border);}\n  .topper-item.me{border-color:var(--amber);}\n  .subj-block{margin-bottom:16px;}\n  .subj-block .subj-head{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:6px;}\n  .progress-bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-bottom:8px;}\n  .progress-fill{height:100%;background:var(--green);}\n  .topic-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--text-dim);border-bottom:1px dashed var(--border);}\n\n  .task-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--panel2);}\n  .task-card .task-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}\n  .task-card .task-loc{font-weight:700;font-size:14.5px;}\n  .task-card .task-title{color:var(--text-dim);font-size:13px;margin-bottom:10px;}\n  .badge.open{background:rgba(239,91,91,.15);color:var(--red);}\n  .badge.inprogress{background:rgba(242,165,65,.15);color:var(--amber);}\n  .status-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}\n  .status-btn{border:1px solid var(--border);background:var(--panel);color:var(--text-dim);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;}\n  .status-btn.active{border-color:var(--amber);color:var(--amber);}\n  .mat-list{margin-top:10px;font-size:12.5px;color:var(--text-dim);}\n  .mat-list li{margin-bottom:3px;}\n  .mat-add-row{display:flex;gap:6px;margin-top:8px;}\n  .mat-add-row input{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:7px;font-size:12.5px;}\n  .mat-add-row button{border:1px solid var(--border);background:var(--panel);color:var(--amber);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;}\n\n  /* Calendar */\n  .cal-wrap{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px;}\n  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}\n  .cal-nav button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:13px;}\n  .cal-nav .cal-title{font-weight:700;font-size:14px;}\n  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}\n  .cal-dow{text-align:center;font-size:11px;color:var(--text-dim);text-transform:uppercase;padding-bottom:4px;}\n  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;background:var(--panel);border:1px solid var(--border);}\n  .cal-cell.empty{background:transparent;border:none;}\n  .cal-cell.present{background:rgba(62,207,142,.16);border-color:var(--green);color:var(--green);}\n  .cal-cell.absent{background:rgba(239,91,91,.16);border-color:var(--red);color:var(--red);}\n  .cal-cell.today{outline:2px solid var(--amber);}\n  .cal-cell.clickable{cursor:pointer;}\n  .cal-cell.clickable:hover{border-color:var(--blue);}\n  .cal-cell.selected{outline:2px solid var(--blue);}\n  .cal-legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--text-dim);flex-wrap:wrap;}\n  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}\n  .cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}\n\n  /* Reminder / info modal */\n  .reminder-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;background:var(--panel2);}\n  .reminder-item .r-days{color:var(--amber);font-weight:700;font-size:12px;}\n\n  /* dark-theme inputs/selects inside any table (fixes native white dropdowns) */\n  td input, td select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12.5px;}\n  td select{cursor:pointer;}\n\n  .school-topper-card{border:2px solid var(--amber);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:rgba(242,165,65,.08);display:flex;align-items:center;gap:14px;}\n  .school-topper-card .trophy{font-size:26px;}\n  .school-topper-card .st-name{font-weight:700;font-size:15px;}\n  .school-topper-card .st-meta{color:var(--text-dim);font-size:12.5px;}\n\n  /* Day-grouped timetable editor */\n  .tt-day-block{margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--border);}\n  .tt-day-block:last-child{border-bottom:none;}\n  .tt-day-block h4{margin:0 0 8px;color:var(--amber);font-size:13.5px;text-transform:uppercase;letter-spacing:.4px;}\n\n  /* Custom time picker (Hour / Minute / AM-PM) \u2014 replaces the plain native clock widget */\n  .time-picker{display:inline-flex;align-items:center;gap:3px;}\n  .time-picker select{padding:5px 3px!important;text-align:center;cursor:pointer;}\n  .time-picker select[data-tp-h]{width:42px;}\n  .time-picker select[data-tp-m]{width:48px;}\n  .time-picker select[data-tp-ap]{width:52px;font-weight:700;color:var(--amber)!important;}\n  .time-picker .tp-colon{color:var(--text-dim);font-weight:700;}\n\n  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:50;}\n  .modal-bg.open{display:flex;}\n  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;width:400px;max-width:92vw;max-height:85vh;overflow-y:auto;}\n  #op-modal-bg .modal{display:flex;flex-direction:column;max-height:82vh;overflow:hidden;}\n  #op-modal-body{overflow-y:auto;flex:1 1 auto;min-height:0;margin:6px 0;padding-right:6px;}\n  .modal h3{margin:0 0 16px;font-size:16px;}\n  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}\n  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);padding:12px 18px;border-radius:10px;font-size:13.5px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}\n  .toast.show{display:block;animation:fade 2.5s forwards;}\n  @keyframes fade{0%{opacity:0;transform:translateX(-50%) translateY(6px);}10%{opacity:1;transform:translateX(-50%) translateY(0);}85%{opacity:1;}100%{opacity:0;}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003c!-- ============ LOGIN ============ -->\n\u003cdiv id=\"login-screen\">\n  \u003cdiv class=\"login-card\">\n    \u003ch1>\ud83c\udfeb EduAdmin\u003c/h1>\n    \u003cdiv class=\"sub\">School Management System \u2014 sign in\u003c/div>\n\n    \u003cdiv class=\"field\">\u003clabel>Name / Username\u003c/label>\u003cinput id=\"li-name\" placeholder=\"e.g. Balasubramani\">\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel>Password\u003c/label>\u003cinput id=\"li-pass\" type=\"password\" placeholder=\"e.g. Bala@STU001\">\u003c/div>\n\n    \u003clabel style=\"display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;\">Login as\u003c/label>\n    \u003cdiv class=\"role-grid\">\n      \u003cdiv class=\"role-opt active\" data-role=\"student\">\ud83c\udf93 Student\u003c/div>\n      \u003cdiv class=\"role-opt\" data-role=\"staff\">\ud83d\udc69\u200d\ud83c\udfeb Staff\u003c/div>\n      \u003cdiv class=\"role-opt\" data-role=\"housekeeping\">\ud83e\uddf9 Housekeeping / Maintenance\u003c/div>\n      \u003cdiv class=\"role-opt\" data-role=\"management\">\ud83d\uddc2\ufe0f Management\u003c/div>\n    \u003c/div>\n\n    \u003cbutton class=\"btn btn-amber\" id=\"login-btn\" disabled>Loading saved data\u2026\u003c/button>\n    \u003cdiv class=\"login-err\" id=\"login-err\">Name, password, or role doesn't match our records.\u003c/div>\n\n    \u003cdetails class=\"demo-box\">\n      \u003csummary>Show test credentials\u003c/summary>\n      \u003cdiv id=\"demo-list\">\u003c/div>\n    \u003c/details>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ============ APP ============ -->\n\u003cdiv id=\"app-screen\">\n  \u003cheader>\n    \u003ch1>\ud83c\udfeb EduAdmin\u003c/h1>\n    \u003cdiv class=\"who\">\n      \u003cspan id=\"who-name\">\u003c/span>\n      \u003cspan class=\"role-tag\" id=\"who-role\">\u003c/span>\n      \u003cbutton class=\"btn-ghost\" id=\"logout-btn\">Log Out\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv class=\"wrap\">\n    \u003c!-- MANAGEMENT VIEW -->\n    \u003cdiv id=\"view-management\" class=\"hidden\">\n      \u003cdiv class=\"tabs\">\n        \u003cbutton class=\"tab-btn active\" data-tab=\"overview\">Overview\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"students\">Students\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"staff\">Staff\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"housekeeping\">Housekeeping\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"classes\">Classes &amp; Sections\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"myattendance\">My Attendance\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"attendance\">Student Attendance\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"timetable\">Timetable\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"exams\">Exams\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"holidays\">Holidays\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"syllabus\">Syllabus\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"marks\">Marks\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"toppers\">Toppers\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"reports\">Reports\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"maintenance\">Maintenance\u003c/button>\n        \u003cbutton class=\"tab-btn\" data-tab=\"leave\">Leave Requests\u003c/button>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-overview\">\n        \u003cdiv class=\"stats\">\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">Total Students\u003c/div>\u003cdiv class=\"val\" id=\"m-total-students\">0\u003c/div>\u003c/div>\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">Total Staff\u003c/div>\u003cdiv class=\"val\" id=\"m-total-staff\">0\u003c/div>\u003c/div>\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">Housekeeping / Maintenance\u003c/div>\u003cdiv class=\"val\" id=\"m-total-hsk\">0\u003c/div>\u003c/div>\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">Classes \u00d7 Sections\u003c/div>\u003cdiv class=\"val\">12 \u00d7 3\u003c/div>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"panel\">\n          \u003ch3>School Structure\u003c/h3>\n          \u003cp style=\"color:var(--text-dim);font-size:13.5px;line-height:1.6;\">\n            Classes 1\u201312, each split into Sections A, B and C. Every section holds 30 students,\n            giving 90 students per class and 1,080 students school-wide. Each account gets an\n            auto-generated ID and password in the format \u003cb style=\"color:var(--text)\">First 4 letters of name\u003c/b> +\n            \u003cb style=\"color:var(--text)\">@\u003c/b> + \u003cb style=\"color:var(--text)\">Role Code\u003c/b> +\n            \u003cb style=\"color:var(--text)\">3-digit serial\u003c/b> (e.g. \u003cspan class=\"pw\">Bala@STU001\u003c/span>).\n          \u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-students\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003cdiv class=\"row-flex\" style=\"justify-content:space-between;\">\n            \u003ch3 style=\"margin:0;\">Browse / Manage Students\u003c/h3>\n            \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"add-student-btn\">+ Add Student\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"sel-class\">\u003c/select>\n            \u003cselect id=\"sel-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n          \u003c/div>\n          \u003ctable>\n            \u003cthead>\u003ctr>\u003cth>Roll No\u003c/th>\u003cth>Student ID\u003c/th>\u003cth>Name\u003c/th>\u003cth>Password\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"students-tbody\">\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-staff\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003cdiv class=\"row-flex\" style=\"justify-content:space-between;\">\n            \u003ch3 style=\"margin:0;\">Staff Directory\u003c/h3>\n            \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"add-staff-btn\">+ Add Staff\u003c/button>\n          \u003c/div>\n          \u003ctable>\n            \u003cthead>\u003ctr>\u003cth>Staff ID\u003c/th>\u003cth>Name\u003c/th>\u003cth>Subject / Role\u003c/th>\u003cth>Password\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"staff-tbody\">\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cdiv class=\"panel\">\n          \u003ch3>Assign Class Teacher\u003c/h3>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"assign-class\">\u003c/select>\n            \u003cselect id=\"assign-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n            \u003cselect id=\"assign-staff\">\u003c/select>\n            \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"assign-teacher-btn\">Assign\u003c/button>\n          \u003c/div>\n          \u003ctable>\u003cthead>\u003ctr>\u003cth>Class - Section\u003c/th>\u003cth>Class Teacher\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"assign-tbody\">\u003c/tbody>\u003c/table>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-housekeeping\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003cdiv class=\"row-flex\" style=\"justify-content:space-between;\">\n            \u003ch3 style=\"margin:0;\">Housekeeping / Maintenance\u003c/h3>\n            \u003cbutton class=\"btn btn "panel\">\n          \u003ch3>Attendance Register \u2014 Add / View\u003c/h3>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"mgt-att-class\">\u003c/select>\n            \u003cselect id=\"mgt-att-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n          \u003c/div>\n          \u003cdiv id=\"mgt-att-calendar\">\u003c/div>\n          \u003cinput type=\"hidden\" id=\"mgt-att-date\">\n          \u003ch3 style=\"margin-top:18px;\">Roster \u2014 \u003cspan id=\"mgt-att-seldate\">\u003c/span> \u003cspan id=\"mgt-att-recorded-badge\" class=\"badge\" style=\"margin-left:8px;\">\u003c/span>\u003c/h3>\n          \u003ctable>\u003cthead>\u003ctr>\u003cth>Roll\u003c/th>\u003cth>Name\u003c/th>\u003cth>Attendance\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"mgt-att-tbody\">\u003c/tbody>\u003c/table>\n          \u003cbutton class=\"btn btn-amber\" style=\"width:auto;margin-top:12px;\" id=\"mgt-att-save\">Save Attendance\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-timetable\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003cdiv class=\"row-flex\" style=\"justify-content:space-between;\">\n            \u003ch3 style=\"margin:0;\">Daily Timetable\u003c/h3>\n            \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" data-open-editor=\"mgt-tt-editor\" data-editor-title=\"Edit Daily Timetable\" data-refresh=\"renderMgtTimetableReadonly\">Edit Timetable\u003c/button>\n          \u003c/div>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"mgt-tt-class\">\u003c/select>\n            \u003cselect id=\"mgt-tt-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n          \u003c/div>\n          \u003cdiv id=\"mgt-tt-readonly\">\u003c/div>\ ead>\u003ctbody id=\"mgt-syl-tbody\">\u003c/tbody>\u003c/table>\n          \u003cdiv class=\"row-flex\" style=\"margin-top:12px;\">\n            \u003cinput type=\"text\" id=\"mgt-syl-topic\" placeholder=\"New topic name\">\n            \u003cbutton class=\"btn btn-amber\" style=\"width:auto;\" id=\"mgt-syl-add\">+ Add Topic\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-marks\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>Student Marks \u2014 Add / Update\u003c/h3>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"mgt-marks-class\">\u003c/select>\n            \u003cselect id=\"mgt-marks-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n            \u003cselect id=\"mgt-marks-exam\">\u003c/select>\n            \u003cselect id=\"mgt-marks-subject\">\u003c/select>\n          \u003c/div>\n          \u003ctable>\u003cthead>\u003ctr>\u003cth>Roll\u003c/th>\u003cth>Name\u003c/th>\u003cth>Marks\u003c/th>\u003cth>Max\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"mgt-marks-tbody\">\u003c/tbody>\u003c/table>\n          \u003cbutton class=\"btn btn-amber\" style=\"width:auto;margin-top:12px;\" id=\"mgt-marks-save\">Save Marks\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-toppers\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>\ud83c\udfc6 School Topper\u003c/h3>\n          \u003cdiv class=\"row-flex\">\u003cselect id=\"mgt-schooltopper-exam\">\u003c/select>\u003c/div>\n          \u003cdiv id=\"mgt-schooltopper-card\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"panel\">\n          \u003ch3>Class / Section Toppers\u003c/h3>\n          \u003cdiv class=\"row-flex\">\n            \u003cselect id=\"mgt-topper-class\">\u003c/select>\n            \u003cselect id=\"mgt-topper-section\">\u003coption value=\"A\">Section A\u003c/option>\u003coption value=\"B\">Section B\u003c/option>\u003coption value=\"C\">Section C\u003c/option>\u003c/select>\n            \u003cselect id=\"mgt-topper-exam\">\u003c/select>\n          \u003c/div>\n          \u003cdiv id=\"mgt-topper-list\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-reports\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>School Reports\u003c/h3>\n          \u003cp class=\"desc\">Attendance and Term 1 Exam averages, computed live across all classes.\u003c/p>\n          \u003ctable>\n            \u003cthead>\u003ctr>\u003cth>Class\u003c/th>\u003cth>Students\u003c/th>\u003cth>Avg Attendance %\u003c/th>\u003cth>Avg Marks (Term 1 Exam)\u003c/th>\u003c/tr>\u003c/thead>\n            \u003ctbody id=\"rep-tbody\">\u003c/tbody>\n          \u003c/table>\n        \u003c/div>\n        \u003cdiv class=\"stats\" style=\"grid-template-columns:repeat(3,1fr);\">\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">Open Maintenance Issues\u003c/div>\u003cdiv class=\"val\" id=\"rep-open\">0\u003c/div>\u003c/div>\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">In Progress\u003c/div>\u003cdiv class=\"val\" id=\"rep-inprogress\">0\u003c/div>\u003c/div>\n          \u003cdiv class=\"stat-card\">\u003cdiv class=\"lbl\">Completed\u003c/div>\u003cdiv class=\"val\" id=\"rep-completed\">0\u003c/div>\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"tab-maintenance\" class=\"hidden\">\n        \u003cdiv class=\"panel\">\n          \u003ch3>Report a New Issue\u003c/h3>\n          \u003cdiv class=\"field\">\u003clabel>Location\u003c/label>\u003cinput id=\"mgt-rep-location\" placeholder=\"e.g. Classroom 5A\">\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel>Issue\u003c/label>\u003cinput id=\"mgt-rep-title\" placeholder=\"e.g. Ceiling fan not working\">\u003c/div>\n          \u003cdiv class=\"field\">
