\n          \u003c/svg>\n          \u003cdiv>\n            \u003cdiv class=\"sidebar-brand\">ParkGrid\u003c/div>\n            \u003cdiv class=\"sidebar-eyebrow\">SMART PARKING\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        ${NAV_GROUPS.map((group) => {\n          const visible = group.items.filter((i) => i.roles.includes(role));\n          if (visible.length === 0) return \"\";\n          return `\u003cdiv class=\"nav-group-label\">${group.label}\u003c/div>\n          ${visible.map((n) => `\u003cbutton class=\"nav-link ${session.page === n.page ? \"active\" : \"\"}\" data-nav=\"${n.page}\">\u003cspan aria-hidden=\"true\">${n.icon}\u003c/span>\u003cspan class=\"label\">${n.label}\u003c/span>\u003c/button>`).join(\"\")}`;\n        }).join(\"\")}\n        \u003cdiv class=\"sidebar-footer\">\n          \u003cdiv class=\"user-avatar\">${initialsOf(session.user.fullName)}\u003c/div>\n          \u003cdiv style=\"flex:1;min-width:0\">\n            \u003cdiv style=\"font-size:12.5px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${escapeHtml(session.user.fullName)}\u003c/div>\n            \u003cdiv class=\"role-chip\" style=\"margin-top:2px\">${ROLE_LABELS[role] || role}\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/aside>\n      \u003cdiv class=\"main-area\">\n        \u003cheader class=\"topbar\">\n          \u003ch1>${PAGE_TITLES[session.page] || \"ParkGrid\"}\u003c/h1>\n          \u003cdiv class=\"topbar-user\">\n            \u003cspan class=\"badge\" style=\"color:var(--available);background:var(--available-bg)\">\u003cspan class=\"badge-dot\">\u003c/span>LIVE\u003c/span>\n            \u003cbutton class=\"logout-btn\" id=\"logout-btn\">Log out\u003c/button>\n          \u003c/div>\n        \u003c/header>\n        \u003cmain class=\"page\" id=\"page-content\">\u003c/main>\n      \u003c/div>\n    \u003c/div>`;\n\n  document.querySelectorAll(\"[data-nav]\").forEach((btn) => btn.addEventListener(\"click\", () => navigate(btn.getAttribute(\"data-nav\"))));\n  document.getElementById(\"logout-btn\").addEventListener(\"click\", logout);\n\n  const pageEl = document.getElementById(\"page-content\");\n  const renderers = {\n    dashboard: renderDashboardPage,\n    slots: renderSlotsPage,\n    reserve: renderReservePage,\n    \"my-bookings\": renderMyBookingsPage,\n    gate: renderGatePage,\n    search: renderSearchPage,\n    subscriptions: renderSubscriptionsPage,\n    reports: renderReportsPage,\n    notifications: renderNotificationsPage,\n  };\n  (renderers[session.page] || renderDashboardPage)(pageEl);\n  renderToasts();\n}\n\n/* ---------- Slot Map page ---------- */\nconst SLOT_STATUS_VAR = { AVAILABLE: \"available\", RESERVED: \"reserved\", OCCUPIED: \"occupied\", OUT_OF_SERVICE: \"outofservice\" };\nlet slotFilter = { floor: \"\", vehicleType: \"\" };\n\nfunction renderSlotsPage(el) {\n  const isAdmin = session.user.role === \"ADMIN\";\n  el.innerHTML = `\n    \u003cdiv class=\"card\" style=\"margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:end\">\n      \u003cdiv>\u003clabel class=\"small\">Floor\u003c/label>\u003cbr/>\n        \u003cselect id=\"slot-filter-floor\">\u003coption value=\"\">All floors\u003c/option>${FLOORS.map((f) => `\u003coption value=\"${f}\">${f}\u003c/option>`).join(\"\")}\u003c/select>\n      \u003c/div>\n      \u003cdiv>\u003clabel class=\"small\">Vehicle type\u003c/label>\u003cbr/>\n        \u003cselect id=\"slot-filter-type\">\u003coption value=\"\">All types\u003c/option>${Object.entries(VEHICLE_TYPES).map(([k, v]) => `\u003coption value=\"${k}\">${v.icon} ${v.label}\u003c/option>`).join(\"\")}\u003c/select>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;gap:14px;margin-left:auto;flex-wrap:wrap\">\n        ${[\"AVAILABLE\", \"RESERVED\", \"OCCUPIED\", \"OUT_OF_SERVICE\"].map((s) => {\n          const count = state.slots.filter((sl) => sl.status === s).length;\n          const v = SLOT_STATUS_VAR[s];\n          return `\u003cdiv style=\"font-size:12px;color:var(--muted)\">\u003cspan class=\"badge-dot\" style=\"color:var(--${v});display:inline-block;margin-right:5px\">\u003c/span>\u003cspan class=\"mono\" style=\"color:var(--paper);font-weight:600\">${count}\u003c/span> ${s.replace(\"_\", \" \").toLowerCase()}\u003c/div>`;\n        }).join(\"\")}\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"slots-grid-host\">\u003c/div>\n  `;\n  document.getElementById(\"slot-filter-floor\").addEventListener(\"change\", (e) => { slotFilter.floor = e.target.value; renderSlotsGrid(); });\n  document.getElementById(\"slot-filter-type\").addEventListener(\"change\", (e) => { slotFilter.vehicleType = e.target.value; renderSlotsGrid(); });\n  renderSlotsGrid();\n}\n\nfunction findSlotHold(slotId) {\n  // Whatever is currently claiming this slot's RESERVED (or OCCUPIED) status \u2014 a\n  // regular booking or a date-range subscription \u2014 and whether it's actually paid.\n  const booking = state.bookings.find((b) => b.slotId === slotId && [\"RESERVED\", \"ACTIVE\", \"PENDING_PAYMENT\"].includes(b.status));\n  if (booking) {\n    return { type: \"booking\", record: booking, paid: booking.paymentStatus === \"PAID\" || booking.paymentStatus === \"SUBSCRIPTION\", amountDue: booking.charges || 0 };\n  }\n  const now = new Date();\n  const sub = state.subscriptions.find(\n    (s) => s.slotId === slotId && [\"PENDING_APPROVAL\", \"PENDING_PAYMENT\", \"ACTIVE\"].includes(s.status) && new Date(s.startDate) \u003c= now && new Date(s.endDate) >= now\n  );\n  if (sub) {\n    return { type: \"subscription\", record: sub, paid: sub.status === \"ACTIVE\", amountDue: sub.price || 0 };\n  }\n  return null;\n}\n\nfunction renderSlotsGrid() {\n  const host = document.getElementById(\"slots-grid-host\");\n  if (!host) return;\n  if (reconcileSlotStatuses(state)) saveState();\n  const canManage = session.user.role === \"ADMIN\" || session.user.role === \"STAFF\";\n  let slots = state.slots;\n  if (slotFilter.floor) slots = slots.filter((s) => s.floor === slotFilter.floor);\n  if (slotFilter.vehicleType) slots = slots.filter((s) => s.vehicleType === slotFilter.vehicleType);\n\n  const byFloor = {};\n  slots.forEach((s) => { (byFloor[s.floor] = byFloor[s.floor] || []).push(s); });\n\n  host.innerHTML = Object.keys(byFloor).length === 0\n    ? `\u003cdiv class=\"empty-state card\">\u003ch3>No slots match\u003c/h3>\u003c/div>`\n    : Object.entries(byFloor)\n        .map(\n          ([floor, floorSlots]) => `\n      \u003cdiv style=\"margin-bottom:22px\">\n        \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--cyan);letter-spacing:.06em;margin-bottom:10px\">${floor.toUpperCase()}\u003c/div>\n        \u003cdiv class=\"slots-grid\">\n          ${floorSlots\n            .map((s) => {\n              const v = SLOT_STATUS_VAR[s.status];\n              const vt = VEHICLE_TYPES[s.vehicleType];\n              const hold = s.status === \"RESERVED\" ? findSlotHold(s.id) : null;\n              const overdue = hold && hold.type === \"booking\" ? reservationOverdueInfo(hold.record) : { isWarning: false };\n              return `\n            \u003cdiv class=\"slot-tile\" style=\"border-color:${overdue.isWarning ? \"var(--occupied)\" : `var(--${v})`};${overdue.isWarning ? \"background:var(--occupied-bg)\" : \"\"}\">\n              \u003cdiv style=\"display:flex;justify-content:space-between;align-items:start\">\n                \u003cspan class=\"mono\" style=\"font-weight:700;font-size:13px\">${s.code}\u003c/span>\n                \u003cspan style=\"font-size:15px\">${overdue.isWarning ? \"\u26a0\" : vt.icon}\u003c/span>\n              \u003c/div>\n              ${s.subscriberOnly ? `\u003cdiv style=\"font-size:10px;color:var(--cyan-bright);margin-top:3px\">\ud83d\udd12 Subscriber slot\u003c/div>` : \"\"}\n              \u003cspan class=\"badge\" style=\"color:var(--${overdue.isWarning ? \"occupied\" : v});background:var(--${overdue.isWarning ? \"occupied\" : v}-bg);margin-top:8px\">${overdue.isWarning ? \"NO-SHOW RISK\" : s.status.replace(\"_\", \" \")}\u003c/span>\n              ${canManage ? `\u003cbutton class=\"btn btn-ghost btn-sm\" style=\"width:100%;margin-top:8px\" data-manage-slot=\"${s.id}\">Manage\u003c/button>` : \"\"}\n            \u003c/div>`;\n            })\n            .join(\"\")}\n        \u003c/div>\n      \u003c/div>`\n        )\n        .join(\"\");\n\n  host.querySelectorAll(\"[data-manage-slot]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const slot = findSlot(btn.getAttribute(\"data-manage-slot\"));\n      const hold = slot.status === \"RESERVED\" || slot.status === \"OCCUPIED\" ? findSlotHold(slot.id) : null;\n      const unpaidWarning =\n        hold && !hold.paid\n          ? `\u003cdiv class=\"login-error\" style=\"margin-top:10px\">\u26a0 This slot is linked to ${hold.type === \"booking\" ? `booking \u003cstrong>${hold.record.bookingId}\u003c/strong>` : `a slot reservation for \u003cstrong>${hold.record.vehicleNumber}\u003c/strong>`}, and payment is \u003cstrong>not completed\u003c/strong> (\u20b9${hold.amountDue} due). Freeing or disabling this slot will NOT cancel that charge \u2014 check with billing first.\u003c/div>`\n          : \"\";\n      showModal({\n        title: `Manage ${slot.code}`,\n        bodyHtml: `\u003cp style=\"color:var(--paper-dim);font-size:13px;margin:0 0 4px\">Current status: \u003cstrong style=\"color:var(--paper)\">${slot.status.replace(\"_\", \" \")}\u003c/strong>\u003c/p>\n          \u003cp style=\"color:var(--muted);font-size:12px\">Changing status here overrides any active booking link for this slot \u2014 use with care.\u003c/p>${unpaidWarning}`,\n        actions: [\n          { label: \"Mark Available\", primary: true, onClick: () => setSlotStatus(slot, \"AVAILABLE\", hold) },\n          { label: \"Mark Out of Service / Maintenance\", onClick: () => setSlotStatus(slot, \"OUT_OF_SERVICE\", hold) },\n          { label: \"Cancel\" },\n        ],\n      });\n    })\n  );\n}\n\nfunction setSlotStatus(slot, status, hold) {\n  if (hold && !hold.paid) {\n    const ok = confirm(`Payment for this slot's reservation is NOT completed yet (\u20b9${hold.amountDue} due). Are you sure you want to change slot ${slot.code} to ${status.replace(\"_\", \" \")} anyway?`);\n    if (!ok) return;\n  }\n  slot.status = status;\n  saveState();\n  showToast(`${slot.code} \u2192 ${status.replace(\"_\", \" \")}`);\n  if (session.page === \"slots\") renderSlotsGrid();\n}\n\n/* ---------- Reserve a Slot page (Customer) ---------- */\nfunction renderReservePage(el) {\n  const r = session.reserve;\n  const myVehicle = session.user.lastVehicleNumber || \"\";\n  const mySub = myVehicle ? activeSubscriptionFor(myVehicle) : null;\n\n  el.innerHTML = `\n    ${\n      mySub\n        ? `\u003cdiv class=\"card\" style=\"margin-bottom:16px;border-color:var(--available);background:var(--available-bg)\">\n            \u003cstrong style=\"color:var(--available)\">\u2713 Subscriber\u003c/strong> \u2014 ${escapeHtml(myVehicle)} has slot \u003cstrong>${mySub.slotCode}\u003c/strong> reserved (till ${fmtTime(mySub.endDate)}). Parking is free, and slots marked \u003cspan class=\"mono\">-S\u003c/span> are also open to you.\n          \u003c/div>`\n        : \"\"\n    }\n    \u003cdiv class=\"two-col\">\n      \u003cdiv>\n        \u003cdiv class=\"card\" style=\"margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap\">\n          \u003cdiv>\u003clabel class=\"small\">Floor\u003c/label>\u003cbr/>\n            \u003cselect id=\"rs-floor\">\u003coption value=\"\">All floors\u003c/option>${FLOORS.map((f) => `\u003coption value=\"${f}\" ${f === r.floor ? \"selected\" : \"\"}>${f}\u003c/option>`).join(\"\")}\u003c/select>\n          \u003c/div>\n          \u003cdiv>\u003clabel class=\"small\">Vehicle type\u003c/label>\u003cbr/>\n            \u003cselect id=\"rs-type\">${Object.entries(VEHICLE_TYPES).map(([k, v]) => `\u003coption value=\"${k}\" ${k === r.vehicleType ? \"selected\" : \"\"}>${v.icon} ${v.label} \u2014 \u20b9${v.rate}/hr\u003c/option>`).join(\"\")}\u003c/select>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"rs-slots-grid\" class=\"slots-grid\">\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"card\" id=\"rs-booking-form\">\n          \u003ch3 style=\"font-size:15px;margin-bottom:12px\">Booking details\u003c/h3>\n          \u003cp id=\"rs-selected-slot\" style=\"color:var(--muted);font-size:13px;margin-bottom:14px\">Pick an available slot on the left.\u003c/p>\n          \u003clabel class=\"field-label\" style=\"margin-top:0\">Vehicle number\u003c/label>\n          \u003cinput id=\"rs-vehicle-number\" class=\"text-input\" placeholder=\"e.g. KA-05-AB-1234\" value=\"${escapeHtml(myVehicle)}\" />\n          \u003clabel class=\"field-label\">Mobile number\u003c/label>\n          \u003cinput id=\"rs-mobile\" class=\"text-input\" value=\"${escapeHtml(session.user.mobile || \"\")}\" />\n          \u003clabel class=\"field-label\">Expected duration\u003c/label>\n          \u003cselect id=\"rs-duration\" class=\"text-input\">\n            \u003coption value=\"1\">1 hour\u003c/option>\n            \u003coption value=\"2\" selected>2 hours\u003c/option>\n            \u003coption value=\"4\">4 hours\u003c/option>\n            \u003coption value=\"8\">8 hours\u003c/option>\n            \u003coption value=\"24\">Full day (24 hours)\u003c/option>\n          \u003c/select>\n          \u003cbutton class=\"btn btn-primary\" id=\"rs-confirm-btn\" style=\"width:100%;margin-top:16px\" disabled>Confirm Reservation\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n  document.getElementById(\"rs-floor\").addEventListener(\"change\", (e) => { r.floor = e.target.value; renderReserveSlotsGrid(); });\n  document.getElementById(\"rs-type\").addEventListener(\"change\", (e) => { r.vehicleType = e.target.value; r.slotId = null; renderReserveSlotsGrid(); });\n  document.getElementById(\"rs-vehicle-number\").addEventListener(\"input\", () => renderReserveSlotsGrid());\n  document.getElementById(\"rs-confirm-btn\").addEventListener(\"click\", handleConfirmReservation);\n  renderReserveSlotsGrid();\n}\n\nfunction slotHasSubscriptionNow(slotId) {\n  // slot.status only gets physically flipped to RESERVED when a subscription's date\n  // range happens to cover \"today\" at the moment it's approved \u2014 that's not a\n  // reliable enough signal on its own. A walk-in booking must also be checked\n  // directly against any subscription (pending or active) that covers right now,\n  // or a slot can end up double-committed to both a subscriber and a walk-in.\n  return !!slotBookedForRange(slotId, new Date().toISOString(), new Date().toISOString());\n}\n\nfunction renderReserveSlotsGrid() {\n  const host = document.getElementById(\"rs-slots-grid\");\n  if (!host) return;\n  if (reconcileSlotStatuses(state)) saveState();\n  const r = session.reserve;\n  const typedVehicle = document.getElementById(\"rs-vehicle-number\")?.value.trim() || session.user.lastVehicleNumber || \"\";\n  const isSubscriber = typedVehicle ? !!activeSubscriptionFor(typedVehicle) : false;\n\n  let slots = state.slots.filter((s) => s.vehicleType === r.vehicleType);\n  if (r.floor) slots = slots.filter((s) => s.floor === r.floor);\n\n  host.innerHTML = slots\n    .map((s) => {\n      const v = SLOT_STATUS_VAR[s.status];\n      const subHold = s.status === \"AVAILABLE\" && slotHasSubscriptionNow(s.id);\n      const locked = s.subscriberOnly && !isSubscriber;\n      const selectable = s.status === \"AVAILABLE\" && !locked && !subHold;\n      const isSelected = r.slotId === s.id;\n      return `\n      \u003cdiv class=\"slot-tile\" style=\"border-color:${isSelected ? \"var(--cyan)\" : s.subscriberOnly ? \"var(--cyan)\" : `var(--${v})`};${selectable ? \"cursor:pointer\" : \"opacity:.6\"};${s.subscriberOnly ? \"background-image:linear-gradient(160deg, rgba(34,195,230,.08), transparent 60%)\" : \"\"}\" ${selectable ? `data-pick-slot=\"${s.id}\"` : \"\"}>\n        \u003cspan class=\"mono\" style=\"font-weight:700;font-size:13px\">${s.code}\u003c/span>\n        \u003cdiv style=\"font-size:11px;color:var(--muted);margin-top:2px\">${s.floor}\u003c/div>\n        ${s.subscriberOnly ? `\u003cdiv style=\"font-size:10.5px;color:var(--cyan-bright);margin-top:4px\">\ud83d\udd12 ${locked ? \"Subscribers only\" : \"Reserved for you\"}\u003c/div>` : \"\"}\n        \u003cspan class=\"badge\" style=\"color:var(--${subHold ? \"reserved\" : v});background:var(--${subHold ? \"reserved\" : v}-bg);margin-top:8px\">${subHold ? \"RESERVED (subscriber)\" : s.status.replace(\"_\", \" \")}\u003c/span>\n      \u003c/div>`;\n    })\n    .join(\"\");\n\n  host.querySelectorAll(\"[data-pick-slot]\").forEach((tile) =>\n    tile.addEventListener(\"click\", () => {\n      const slot = findSlot(tile.getAttribute(\"data-pick-slot\"));\n      if (slot.status !== \"AVAILABLE\") {\n        showToast(\"This parking slot is already reserved.\", \"error\");\n        renderReserveSlotsGrid();\n        return;\n      }\n      if (slotHasSubscriptionNow(slot.id)) {\n        showToast(\"This slot is held by a subscriber right now.\", \"error\");\n        renderReserveSlotsGrid();\n        return;\n      }\n      if (slot.subscriberOnly && !isSubscriber) {\n        showToast(\"This slot is reserved for active subscribers only.\", \"error\");\n        return;\n      }\n      r.slotId = slot.id;\n      document.getElementById(\"rs-selected-slot\").innerHTML = `Selected: \u003cstrong style=\"color:var(--cyan-bright)\">${slot.code}\u003c/strong> (${slot.floor})`;\n      document.getElementById(\"rs-confirm-btn\").disabled = false;\n      renderReserveSlotsGrid();\n    })\n  );\n}\n\nfunction handleConfirmReservation() {\n  const r = session.reserve;\n  const slot = findSlot(r.slotId);\n  if (!slot || slot.status !== \"AVAILABLE\") {\n    showToast(\"This parking slot is already reserved.\", \"error\");\n    r.slotId = null;\n    renderReserveSlotsGrid();\n    return;\n  }\n  const duration = Number(document.getElementById(\"rs-duration\").value);\n  const now = new Date();\n  const expectedExit = new Date(now.getTime() + duration * 3600 * 1000);\n  // Check the WHOLE booking window against subscriptions, not just this instant \u2014\n  // otherwise a long walk-in booking made today can still collide with a\n  // subscription that starts tomorrow, recreating the same double-booking bug.\n  if (slotBookedForRange(slot.id, now.toISOString(), expectedExit.toISOString())) {\n    showToast(\"This slot has a subscriber reservation starting during your booking window \u2014 pick another slot or a shorter duration.\", \"error\");\n    r.slotId = null;\n    renderReserveSlotsGrid();\n    return;\n  }\n  const vehicleNumber = document.getElementById(\"rs-vehicle-number\").value.trim();\n  const mobile = document.getElementById(\"rs-mobile\").value.trim();\n  if (!vehicleNumber || !mobile) {\n    showToast(\"Enter vehicle number and mobile number\", \"error\");\n    return;\n  }\n\n  const bookingId = genBookingId();\n  const booking = {\n    id: Date.now(),\n    bookingId,\n    slotId: slot.id,\n    slotCode: slot.code,\n    floor: slot.floor,\n    vehicleType: slot.vehicleType,\n    vehicleNumber,\n    mobile,\n    customerName: session.user.fullName,\n    plannedDurationHours: duration,\n    status: \"RESERVED\",\n    reservedAt: new Date().toISOString(),\n    entryTime: null,\n    exitTime: null,\n    expectedExit: null,\n    extendedBy: 0,\n    charges: 0,\n    paymentStatus: \"UNPAID\",\n    paymentMethod: null,\n    expiryWarned: false,\n  };\n  state.bookings.push(booking);\n  slot.status = \"RESERVED\";\n  saveState();\n\n  logNotification(\"SMS\", mobile, `Booking confirmed! ${bookingId} for slot ${slot.code}. Show your QR at the gate.`);\n  logNotification(\"EMAIL\", mobile, `Your ParkGrid reservation ${bookingId} is confirmed.`);\n\n  showModal({\n    title: \"Reservation confirmed\",\n    bodyHtml: `\n      \u003cdiv style=\"text-align:center\">\n        \u003cdiv class=\"qr-box\">${qrImg(bookingId, 160)}\u003c/div>\n        \u003cdiv class=\"mono\" style=\"margin-top:12px;font-size:16px;font-weight:700;color:var(--cyan-bright)\">${bookingId}\u003c/div>\n        \u003cdiv style=\"font-size:12.5px;color:var(--muted);margin-top:4px\">Slot ${slot.code} \u00b7 ${slot.floor}\u003c/div>\n        \u003cp style=\"font-size:12px;color:var(--muted);margin-top:12px\">Show this QR code at the gate for entry. A confirmation SMS/email has been sent (simulated).\u003c/p>\n      \u003c/div>`,\n    actions: [{ label: \"Done\", primary: true, onClick: () => navigate(\"my-bookings\") }],\n  });\n\n  r.slotId = null;\n}\n\nfunction qrImg(data, size) {\n  const url = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(data)}`;\n  return `\u003cimg src=\"${url}\" width=\"${size}\" height=\"${size}\" alt=\"QR code for ${escapeHtml(data)}\" style=\"display:block\" onerror=\"this.outerHTML='\u003cdiv class=mono style=padding:20px;font-size:11px;color:#555>QR unavailable offline\u003cbr/>Code: ${escapeHtml(data)}\u003c/div>'\" />`;\n}\n\n/* ---------- My Bookings page (Customer) ---------- */\nconst BOOKING_STATUS_VAR = { RESERVED: \"reserved\", ACTIVE: \"active\", PENDING_PAYMENT: \"reserved\", COMPLETED: \"completed\", CANCELLED: \"cancelled\" };\n\nfunction renderMyBookingsPage(el) {\n  const mine = state.bookings\n    .filter((b) => b.mobile === session.user.mobile || b.customerName === session.user.fullName)\n    .sort((a, b) => new Date(b.reservedAt) - new Date(a.reservedAt));\n\n  if (mine.length === 0) {\n    el.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No bookings yet\u003c/h3>\u003cp>Reserve a slot to see it here.\u003c/p>\u003c/div>`;\n    return;\n  }\n\n  el.innerHTML = `\u003cdiv style=\"display:flex;flex-direction:column;gap:12px\">\n    ${mine.map((b) => bookingCardHtml(b)).join(\"\")}\n  \u003c/div>`;\n\n  wireBookingCardActions(el);\n}\n\nconst RESERVATION_WARN_MINUTES = 15; // no-show warning threshold\nconst RESERVATION_AUTO_RELEASE_MINUTES = 30; // auto-free the slot threshold\n\nfunction reservationOverdueInfo(b) {\n  if (b.status !== \"RESERVED\" || b.entryTime) return { minutesWaiting: 0, isWarning: false };\n  const minutesWaiting = (Date.now() - new Date(b.reservedAt).getTime()) / 60000;\n  return { minutesWaiting, isWarning: minutesWaiting >= RESERVATION_WARN_MINUTES };\n}\n\nfunction bookingCardHtml(b) {\n  const v = BOOKING_STATUS_VAR[b.status];\n  const vt = VEHICLE_TYPES[b.vehicleType];\n  const overdue = reservationOverdueInfo(b);\n  return `\n    \u003cdiv class=\"card\" data-booking-card=\"${b.id}\" style=\"${overdue.isWarning ? \"border-color:var(--occupied);background:var(--occupied-bg)\" : \"\"}\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px\">\n        \u003cdiv>\n          \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">${b.bookingId}\u003c/div>\n          \u003cdiv style=\"font-weight:700;font-family:var(--font-display);font-size:17px\">${vt.icon} ${escapeHtml(b.vehicleNumber)}\u003c/div>\n          \u003cdiv style=\"font-size:12.5px;color:var(--muted)\">${b.slotCode} \u00b7 ${b.floor}\u003c/div>\n        \u003c/div>\n        ${\n          overdue.isWarning\n            ? `\u003cspan class=\"badge\" style=\"color:var(--occupied);background:var(--occupied-bg);height:fit-content\">\u26a0 NO-SHOW RISK \u00b7 ${Math.floor(overdue.minutesWaiting)}m\u003c/span>`\n            : `\u003cspan class=\"badge\" style=\"color:var(--${v});background:var(--${v}-bg);height:fit-content\">${b.status.replace(\"_\", \" \")}\u003c/span>`\n        }\n      \u003c/div>\n      ${overdue.isWarning ? `\u003cdiv style=\"font-size:12px;color:var(--occupied);margin-top:6px\">Reserved but nobody has entered yet \u2014 this slot auto-releases at ${RESERVATION_AUTO_RELEASE_MINUTES} minutes if unclaimed.\u003c/div>` : \"\"}\n      \u003cdiv style=\"display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--paper-dim)\">\n        \u003cdiv>Reserved: \u003cspan class=\"mono\">${fmtTime(b.reservedAt)}\u003c/span>\u003c/div>\n        ${b.entryTime ? `\u003cdiv>Entry: \u003cspan class=\"mono\">${fmtTime(b.entryTime)}\u003c/span>\u003c/div>` : \"\"}\n        ${b.exitTime ? `\u003cdiv>Exit: \u003cspan class=\"mono\">${fmtTime(b.exitTime)}\u003c/span>\u003c/div>` : \"\"}\n        ${b.expectedExit && b.status === \"ACTIVE\" ? `\u003cdiv>Expected out: \u003cspan class=\"mono\">${fmtTime(b.expectedExit)}\u003c/span>\u003c/div>` : \"\"}\n      \u003c/div>\n      ${b.charges > 0 ? `\u003cdiv style=\"margin-top:8px;font-size:13.5px;font-weight:700\">Charges: \u003cspan class=\"mono\">\u20b9${money(b.charges)}\u003c/span> \u003cspan style=\"font-weight:400;color:var(--muted);font-size:12px\">(${b.paymentStatus})\u003c/span>\u003c/div>` : \"\"}\n      \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\">\n        ${b.status === \"RESERVED\" ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-view-qr=\"${b.id}\">View QR\u003c/button>` : \"\"}\n        ${b.status === \"RESERVED\" ? `\u003cbutton class=\"btn btn-danger btn-sm\" data-cancel-booking=\"${b.id}\">Cancel booking\u003c/button>` : \"\"}\n        ${b.status === \"ACTIVE\" ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-extend-booking=\"${b.id}\">Extend duration\u003c/button>` : \"\"}\n        ${b.status === \"PENDING_PAYMENT\" ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-pay-booking=\"${b.id}\">Pay \u20b9${money(b.charges)}\u003c/button>` : \"\"}\n        ${b.status === \"COMPLETED\" ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-download-receipt=\"${b.id}\">Download receipt\u003c/button>` : \"\"}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction wireBookingCardActions(el) {\n  el.querySelectorAll(\"[data-view-qr]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const b = findBooking(btn.getAttribute(\"data-view-qr\"));\n      showModal({\n        title: b.bookingId,\n        bodyHtml: `\u003cdiv style=\"text-align:center\">\u003cdiv class=\"qr-box\">${qrImg(b.bookingId, 180)}\u003c/div>\u003cdiv style=\"font-size:12px;color:var(--muted);margin-top:10px\">Show this at the gate for entry\u003c/div>\u003c/div>`,\n        actions: [{ label: \"Close\", primary: true }],\n      });\n    })\n  );\n\n  el.querySelectorAll(\"[data-cancel-booking]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const b = findBooking(btn.getAttribute(\"data-cancel-booking\"));\n      if (!confirm(`Cancel booking ${b.bookingId}?`)) return;\n      b.status = \"CANCELLED\";\n      const slot = findSlot(b.slotId);\n      if (slot && slot.status === \"RESERVED\") releaseSlot(slot);\n      saveState();\n      showToast(`Booking ${b.bookingId} cancelled`);\n      logNotification(\"SMS\", b.mobile, `Your booking ${b.bookingId} has been cancelled.`);\n      render();\n    })\n  );\n\n  el.querySelectorAll(\"[data-extend-booking]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const b = findBooking(btn.getAttribute(\"data-extend-booking\"));\n      showModal({\n        title: `Extend ${b.bookingId}`,\n        bodyHtml: `\u003clabel class=\"field-label\" style=\"margin-top:0\">Add how many hours?\u003c/label>\n          \u003cselect id=\"extend-hours\" class=\"text-input\">\u003coption value=\"1\">1 hour\u003c/option>\u003coption value=\"2\">2 hours\u003c/option>\u003coption value=\"4\">4 hours\u003c/option>\u003c/select>`,\n        actions: [\n          {\n            label: \"Extend\",\n            primary: true,\n            onClick: () => {\n              const hrs = Number(document.getElementById(\"extend-hours\")?.value || 1);\n              b.expectedExit = new Date(new Date(b.expectedExit).getTime() + hrs * 3600000).toISOString();\n              b.extendedBy += hrs;\n              b.expiryWarned = false;\n              saveState();\n              showToast(`${b.bookingId} extended by ${hrs}h \u2014 new expected exit ${fmtTime(b.expectedExit)}`);\n              render();\n            },\n          },\n          { label: \"Cancel\" },\n        ],\n      });\n    })\n  );\n\n  el.querySelectorAll(\"[data-pay-booking]\").forEach((btn) => btn.addEventListener(\"click\", () => openPaymentModal(findBooking(btn.getAttribute(\"data-pay-booking\")))));\n  el.querySelectorAll(\"[data-download-receipt]\").forEach((btn) => btn.addEventListener(\"click\", () => downloadReceipt(findBooking(btn.getAttribute(\"data-download-receipt\")))));\n}\n\n/* ---------- Payment ---------- */\nconst PAYMENT_METHODS = [\"CASH\", \"UPI\", \"CREDIT_CARD\", \"DEBIT_CARD\"];\n\nfunction openPaymentModal(booking) {\n  showModal({\n    title: `Pay for ${booking.bookingId}`,\n    bodyHtml: `\n      \u003cdiv style=\"font-size:13.5px;color:var(--paper-dim);margin-bottom:14px\">\n        Vehicle \u003cstrong style=\"color:var(--paper)\">${escapeHtml(booking.vehicleNumber)}\u003c/strong> \u00b7 ${booking.slotCode}\u003cbr/>\n        Duration: ${minutesBetween(booking.entryTime, booking.exitTime)} min\n      \u003c/div>\n      \u003cdiv style=\"font-size:24px;font-weight:800;font-family:var(--font-mono);color:var(--cyan-bright);margin-bottom:14px\">\u20b9${money(booking.charges)}\u003c/div>\n      \u003clabel class=\"field-label\" style=\"margin-top:0\">Payment method\u003c/label>\n      \u003cselect id=\"pay-method\" class=\"text-input\">${PAYMENT_METHODS.map((m) => `\u003coption value=\"${m}\">${m.replace(\"_\", \" \")}\u003c/option>`).join(\"\")}\u003c/select>`,\n    actions: [\n      {\n        label: \"Confirm payment\",\n        primary: true,\n        onClick: () => {\n          const method = document.getElementById(\"pay-method\")?.value || \"CASH\";\n          state.payments.push({ id: nextSeq(\"payment\"), bookingId: booking.bookingId, amount: booking.charges, method, paidAt: new Date().toISOString() });\n          booking.status = \"COMPLETED\";\n          booking.paymentStatus = \"PAID\";\n          booking.paymentMethod = method;\n          const slot = findSlot(booking.slotId);\n          if (slot) releaseSlot(slot);\n          saveState();\n          logNotification(\"SMS\", booking.mobile, `Payment of \u20b9${money(booking.charges)} received for ${booking.bookingId}. Thank you!`);\n          showToast(`Payment received \u2014 ${booking.bookingId} complete`);\n          render();\n        },\n      },\n      { label: \"Cancel\" },\n    ],\n  });\n}\n\nfunction downloadReceipt(booking) {\n  const vt = VEHICLE_TYPES[booking.vehicleType];\n  const html = `\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=\"utf-8\">\u003ctitle>Receipt ${booking.bookingId}\u003c/title>\n    \u003cstyle>body{font-family:'JetBrains Mono',monospace;max-width:380px;margin:30px auto;color:#12181f}\n    .divider{border-top:1px dashed #8b93a3;margin:10px 0}\n    .row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}\n    h2{margin-bottom:2px}\u003c/style>\u003c/head>\u003cbody>\n    \u003ch2>ParkGrid\u003c/h2>\n    \u003cdiv style=\"font-size:11px;color:#666\">Smart Parking Management \u2014 Payment Receipt\u003c/div>\n    \u003cdiv class=\"divider\">\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Booking ID\u003c/span>\u003cstrong>${booking.bookingId}\u003c/strong>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Vehicle\u003c/span>\u003cspan>${vt.icon} ${escapeHtml(booking.vehicleNumber)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Slot\u003c/span>\u003cspan>${booking.slotCode} (${booking.floor})\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Entry\u003c/span>\u003cspan>${fmtTime(booking.entryTime)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Exit\u003c/span>\u003cspan>${fmtTime(booking.exitTime)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Duration\u003c/span>\u003cspan>${minutesBetween(booking.entryTime, booking.exitTime)} min\u003c/span>\u003c/div>\n    \u003cdiv class=\"divider\">\u003c/div>\n    \u003cdiv class=\"row\" style=\"font-size:16px;font-weight:700\">\u003cspan>TOTAL PAID\u003c/span>\u003cspan>\u20b9${money(booking.charges)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan>Method\u003c/span>\u003cspan>${(booking.paymentMethod || \"\").replace(\"_\", \" \")}\u003c/span>\u003c/div>\n    \u003cdiv class=\"divider\">\u003c/div>\n    \u003cdiv style=\"text-align:center;font-size:11px;color:#888;margin-top:16px\">Thank you for parking with us.\u003c/div>\n    \u003cscript>window.print && setTimeout(()=>{},100)\u003c\\/script>\n    \u003c/body>\u003c/html>`;\n  const blob = new Blob([html], { type: \"text/html\" });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `Receipt-${booking.bookingId}.html`;\n  a.click();\n  URL.revokeObjectURL(url);\n  showToast(\"Receipt downloaded \u2014 open it and print to PDF if needed\");\n}\n\n/* ---------- Gate: Entry / Exit page (Staff/Admin) ---------- */\nfunction renderGatePage(el) {\n  el.innerHTML = `\n    \u003cdiv class=\"two-col\">\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:15px;margin-bottom:12px\">Find a booking\u003c/h3>\n        \u003cp style=\"font-size:12.5px;color:var(--muted);margin-bottom:12px\">Scan the customer's QR (enter the Booking ID it encodes) or search by vehicle number / mobile.\u003c/p>\n        \u003cinput id=\"gate-search\" class=\"text-input\" placeholder=\"Booking ID, vehicle number, or mobile\" style=\"width:100%\" />\n        \u003cbutton class=\"btn btn-primary\" id=\"gate-search-btn\" style=\"width:100%;margin-top:10px\">Find\u003c/button>\n        \u003cdiv id=\"gate-result\" style=\"margin-top:16px\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:15px;margin-bottom:12px\">Currently on-site\u003c/h3>\n        \u003cdiv id=\"gate-active-list\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n  document.getElementById(\"gate-search-btn\").addEventListener(\"click\", handleGateSearch);\n  document.getElementById(\"gate-search\").addEventListener(\"keydown\", (e) => { if (e.key === \"Enter\") handleGateSearch(); });\n  renderGateActiveList();\n}\n\nfunction handleGateSearch() {\n  const q = document.getElementById(\"gate-search\").value.trim().toLowerCase();\n  const resultHost = document.getElementById(\"gate-result\");\n  if (!q) {\n    resultHost.innerHTML = \"\";\n    return;\n  }\n  const matches = state.bookings.filter(\n    (b) => b.bookingId.toLowerCase().includes(q) || b.vehicleNumber.toLowerCase().includes(q) || b.mobile.includes(q)\n  ).filter((b) => ![\"COMPLETED\", \"CANCELLED\"].includes(b.status));\n\n  if (matches.length === 0) {\n    resultHost.innerHTML = `\u003cdiv style=\"font-size:13px;color:var(--muted)\">No active/reserved booking found.\u003c/div>`;\n    return;\n  }\n  resultHost.innerHTML = matches.map((b) => gateBookingCard(b)).join(\"\");\n  wireGateActions(resultHost);\n}\n\nfunction gateBookingCard(b) {\n  const v = BOOKING_STATUS_VAR[b.status];\n  const vt = VEHICLE_TYPES[b.vehicleType];\n  return `\n    \u003cdiv class=\"card\" style=\"margin-bottom:10px\">\n      \u003cdiv style=\"display:flex;justify-content:space-between\">\n        \u003cdiv>\n          \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">${b.bookingId}\u003c/div>\n          \u003cdiv style=\"font-weight:700\">${vt.icon} ${escapeHtml(b.vehicleNumber)} \u00b7 ${b.slotCode}\u003c/div>\n        \u003c/div>\n        \u003cspan class=\"badge\" style=\"color:var(--${v});background:var(--${v}-bg)\">${b.status.replace(\"_\", \" \")}\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;gap:8px;margin-top:12px\">\n        ${b.status === \"RESERVED\" ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-process-entry=\"${b.id}\">Process Entry\u003c/button>` : \"\"}\n        ${b.status === \"ACTIVE\" ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-process-exit=\"${b.id}\">Process Exit\u003c/button>` : \"\"}\n        ${b.status === \"PENDING_PAYMENT\" ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-collect-pay=\"${b.id}\">Collect \u20b9${money(b.charges)}\u003c/button>` : \"\"}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction wireGateActions(host) {\n  host.querySelectorAll(\"[data-process-entry]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const b = findBooking(btn.getAttribute(\"data-process-entry\"));\n      const slot = findSlot(b.slotId);\n      // The reservation should have left this slot RESERVED for this booking. If it's\n      // now OCCUPIED (another car already parked there) or OUT_OF_SERVICE (taken\n      // offline since the reservation was made), don't silently overwrite that \u2014\n      // make staff pick a different slot for this booking instead.\n      if (!slot || slot.status === \"OCCUPIED\" || slot.status === \"OUT_OF_SERVICE\") {\n        openReassignSlotModal(b);\n        return;\n      }\n      completeEntry(b, slot);\n      handleGateSearch();\n      renderGateActiveList();\n    })\n  );\n  host.querySelectorAll(\"[data-process-exit]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const b = findBooking(btn.getAttribute(\"data-process-exit\"));\n      b.exitTime = new Date().toISOString();\n      const sub = activeSubscriptionFor(b.vehicleNumber);\n\n      if (sub) {\n        // Covered by an active subscription \u2014 no per-visit charge, settle immediately.\n        b.charges = 0;\n        b.status = \"COMPLETED\";\n        b.paymentStatus = \"SUBSCRIPTION\";\n        b.paymentMethod = \"SUBSCRIPTION\";\n        const slot = findSlot(b.slotId);\n        if (slot) releaseSlot(slot);\n        saveState();\n        showToast(`${b.bookingId} \u2014 covered by your slot reservation (${sub.slotCode}), no charge`);\n        logNotification(\"SMS\", b.mobile, `${b.bookingId} exit recorded \u2014 covered by your reserved slot ${sub.slotCode} (valid till ${fmtTime(sub.endDate)}). No charge.`);\n      } else {\n        b.charges = calcCharge(b.vehicleType, minutesBetween(b.entryTime, b.exitTime));\n        b.status = \"PENDING_PAYMENT\";\n        saveState();\n        showToast(`${b.bookingId} \u2014 exit recorded, \u20b9${money(b.charges)} due`);\n      }\n      handleGateSearch();\n      renderGateActiveList();\n    })\n  );\n  host.querySelectorAll(\"[data-collect-pay]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => openPaymentModal(findBooking(btn.getAttribute(\"data-collect-pay\"))))\n  );\n}\n\nfunction completeEntry(b, slot) {\n  b.status = \"ACTIVE\";\n  b.entryTime = new Date().toISOString();\n  b.expectedExit = new Date(Date.now() + b.plannedDurationHours * 3600000).toISOString();\n  slot.status = \"OCCUPIED\";\n  b.slotId = slot.id;\n  b.slotCode = slot.code;\n  b.floor = slot.floor;\n  saveState();\n  showToast(`${b.bookingId} \u2014 vehicle entered, slot ${b.slotCode} occupied`);\n  logNotification(\"SMS\", b.mobile, `Vehicle entry confirmed for ${b.bookingId} at ${fmtTime(b.entryTime)}, slot ${b.slotCode}.`);\n}\n\nfunction openReassignSlotModal(b) {\n  const oldSlot = findSlot(b.slotId);\n  const candidates = state.slots.filter((s) => s.status === \"AVAILABLE\" && s.vehicleType === b.vehicleType && !(s.subscriberOnly && !activeSubscriptionFor(b.vehicleNumber)));\n  if (candidates.length === 0) {\n    showModal({\n      title: \"No slots free right now\",\n      bodyHtml: `\u003cp style=\"color:var(--paper-dim);font-size:13.5px\">Slot \u003cstrong>${oldSlot ? oldSlot.code : b.slotCode}\u003c/strong> reserved for ${escapeHtml(b.bookingId)} is ${oldSlot ? oldSlot.status.replace(\"_\", \" \").toLowerCase() : \"unavailable\"}, and there's no other free ${VEHICLE_TYPES[b.vehicleType].label} slot right now. Try again once one frees up, or cancel this booking.\u003c/p>`,\n      actions: [{ label: \"Close\", primary: true }],\n    });\n    return;\n  }\n  showModal({\n    title: `Slot ${oldSlot ? oldSlot.code : b.slotCode} isn't free`,\n    bodyHtml: `\u003cp style=\"color:var(--paper-dim);font-size:13.5px;margin-bottom:12px\">\n        ${oldSlot ? `\u003cstrong>${oldSlot.code}\u003c/strong> is currently \u003cstrong style=\"color:var(--occupied)\">${oldSlot.status.replace(\"_\", \" \")}\u003c/strong>` : \"The originally reserved slot is unavailable\"} \u2014 pick a different slot for ${escapeHtml(b.bookingId)} (${escapeHtml(b.vehicleNumber)}) to complete entry.\n      \u003c/p>\n      \u003cselect id=\"reassign-slot-select\" class=\"text-input\" style=\"width:100%\">\n        ${candidates.map((s) => `\u003coption value=\"${s.id}\">${s.code} \u2014 ${s.floor}\u003c/option>`).join(\"\")}\n      \u003c/select>`,\n    actions: [\n      {\n        label: \"Assign & process entry\",\n        primary: true,\n        onClick: () => {\n          const newSlot = findSlot(document.getElementById(\"reassign-slot-select\").value);\n          if (!newSlot || newSlot.status !== \"AVAILABLE\") {\n            showToast(\"That slot was just taken \u2014 try again.\", \"error\");\n            return;\n          }\n          // Free the old slot only if it was still holding this booking's reservation.\n          if (oldSlot && oldSlot.status === \"RESERVED\") oldSlot.status = \"AVAILABLE\";\n          completeEntry(b, newSlot);\n          showToast(`Reassigned to ${newSlot.code} and entry processed`);\n          handleGateSearch();\n          renderGateActiveList();\n        },\n      },\n      { label: \"Cancel\" },\n    ],\n  });\n}\n\nfunction renderGateActiveList() {\n  const host = document.getElementById(\"gate-active-list\");\n  if (!host) return;\n  const active = state.bookings.filter((b) => b.status === \"ACTIVE\" || b.status === \"PENDING_PAYMENT\");\n  if (active.length === 0) {\n    host.innerHTML = `\u003cdiv style=\"font-size:13px;color:var(--muted)\">No vehicles currently on-site.\u003c/div>`;\n    return;\n  }\n  host.innerHTML = active.map((b) => gateBookingCard(b)).join(\"\");\n  wireGateActions(host);\n}\n\n/* ---------- Search page ---------- */\nfunction renderSearchPage(el) {\n  el.innerHTML = `\n    \u003cdiv class=\"card\" style=\"margin-bottom:16px\">\n      \u003clabel class=\"field-label\" style=\"margin-top:0\">Vehicle number, Booking ID, or mobile number\u003c/label>\n      \u003cinput id=\"search-input\" class=\"text-input\" style=\"width:100%\" placeholder=\"Search vehicle history\u2026\" />\n    \u003c/div>\n    \u003cdiv id=\"search-results\">\u003c/div>\n  `;\n  document.getElementById(\"search-input\").addEventListener(\"input\", (e) => {\n    session.search = e.target.value;\n    renderSearchResults();\n  });\n  document.getElementById(\"search-input\").value = session.search || \"\";\n  renderSearchResults();\n}\n\nfunction renderSearchResults() {\n  const host = document.getElementById(\"search-results\");\n  if (!host) return;\n  const q = (session.search || \"\").trim().toLowerCase();\n  if (!q) {\n    host.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>Search vehicle history\u003c/h3>\u003cp>Enter a vehicle number, Booking ID, or mobile number above.\u003c/p>\u003c/div>`;\n    return;\n  }\n  const results = state.bookings\n    .filter((b) => b.bookingId.toLowerCase().includes(q) || b.vehicleNumber.toLowerCase().includes(q) || b.mobile.includes(q))\n    .sort((a, b) => new Date(b.reservedAt) - new Date(a.reservedAt));\n\n  if (results.length === 0) {\n    host.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No matches\u003c/h3>\u003c/div>`;\n    return;\n  }\n  host.innerHTML = `\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n    ${results\n      .map((b) => {\n        const v = BOOKING_STATUS_VAR[b.status];\n        const vt = VEHICLE_TYPES[b.vehicleType];\n        return `\n      \u003cdiv class=\"card\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n          \u003cdiv>\n            \u003cdiv class=\"mono\" style=\"font-size:11px;color:var(--muted)\">${b.bookingId} \u00b7 ${escapeHtml(b.mobile)}\u003c/div>\n            \u003cdiv style=\"font-weight:700\">${vt.icon} ${escapeHtml(b.vehicleNumber)} \u00b7 ${b.slotCode}\u003c/div>\n          \u003c/div>\n          \u003cspan class=\"badge\" style=\"color:var(--${v});background:var(--${v}-bg)\">${b.status.replace(\"_\", \" \")}\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--paper-dim)\">\n          \u003cdiv>Entry: \u003cspan class=\"mono\">${fmtTime(b.entryTime)}\u003c/span>\u003c/div>\n          \u003cdiv>Exit: \u003cspan class=\"mono\">${fmtTime(b.exitTime)}\u003c/span>\u003c/div>\n          \u003cdiv>Duration: \u003cspan class=\"mono\">${b.entryTime && b.exitTime ? minutesBetween(b.entryTime, b.exitTime) + \" min\" : \"\u2014\"}\u003c/span>\u003c/div>\n          \u003cdiv>Payment: \u003cspan class=\"mono\">${b.paymentStatus}\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/div>`;\n      })\n      .join(\"\")}\n  \u003c/div>`;\n}\n\n/* ---------- Subscriptions page ---------- */\nlet subForm = { floor: FLOORS[0], vehicleType: \"CAR\", slotId: null, startDate: \"\", endDate: \"\" };\n\nfunction renderSubscriptionsPage(el) {\n  const isCustomer = session.user.role === \"CUSTOMER\";\n  const isStaffOrAdmin = !isCustomer;\n  const mine = state.subscriptions.filter((s) => s.mobile === session.user.mobile);\n  const all = state.subscriptions;\n  const pendingApproval = state.subscriptions.filter((s) => s.status === \"PENDING_APPROVAL\");\n  const today = new Date().toISOString().slice(0, 10);\n\n  el.innerHTML = `\n    ${isCustomer ? `\n    \u003cdiv class=\"card\" style=\"margin-bottom:20px\">\n      \u003ch3 style=\"font-size:15px;margin-bottom:4px\">Request a slot for a date range\u003c/h3>\n      \u003cp style=\"font-size:11.5px;color:var(--muted);margin-bottom:14px\">Pick an exact slot and dates. Your request goes to staff for approval first \u2014 once accepted, you'll pay for the full period. \u003cstrong style=\"color:var(--reserved)\">Payment is non-refundable\u003c/strong>, even if you finish early.\u003c/p>\n\n      \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px\">\n        \u003cinput id=\"sub-vehicle\" class=\"text-input\" placeholder=\"Vehicle number\" value=\"${escapeHtml(session.user.lastVehicleNumber || \"\")}\" />\n        \u003cselect id=\"sub-floor\">${FLOORS.map((f) => `\u003coption value=\"${f}\" ${f === subForm.floor ? \"selected\" : \"\"}>${f}\u003c/option>`).join(\"\")}\u003c/select>\n        \u003cselect id=\"sub-vtype\">${Object.entries(VEHICLE_TYPES).map(([k, v]) => `\u003coption value=\"${k}\" ${k === subForm.vehicleType ? \"selected\" : \"\"}>${v.icon} ${v.label} \u2014 \u20b9${v.dailyRate}/day\u003c/option>`).join(\"\")}\u003c/select>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px\">\n        \u003cdiv>\u003clabel class=\"small\">From\u003c/label>\u003cbr/>\u003cinput type=\"date\" id=\"sub-start\" class=\"text-input\" min=\"${today}\" value=\"${subForm.startDate}\" />\u003c/div>\n        \u003cdiv>\u003clabel class=\"small\">To\u003c/label>\u003cbr/>\u003cinput type=\"date\" id=\"sub-end\" class=\"text-input\" min=\"${today}\" value=\"${subForm.endDate}\" />\u003c/div>\n      \u003c/div>\n\n      \u003cdiv id=\"sub-slot-picker\" class=\"slots-grid\" style=\"margin-bottom:12px\">\u003c/div>\n      \u003cdiv id=\"sub-price-summary\">\u003c/div>\n      \u003cbutton class=\"btn btn-primary\" id=\"sub-buy-btn\" style=\"width:100%;margin-top:12px\" disabled>Request reservation\u003c/button>\n    \u003c/div>` : \"\"}\n    ${isStaffOrAdmin && pendingApproval.length > 0 ? `\n    \u003cdiv class=\"card\" style=\"margin-bottom:20px;border-color:var(--reserved)\">\n      \u003ch3 style=\"font-size:15px;margin-bottom:12px;color:var(--reserved)\">\u23f3 Pending approval (${pendingApproval.length})\u003c/h3>\n      \u003cdiv id=\"sub-pending-list\" style=\"display:flex;flex-direction:column;gap:10px\">\u003c/div>\n    \u003c/div>` : \"\"}\n    \u003ch3 style=\"font-size:15px;margin-bottom:12px;color:var(--paper-dim)\">${isCustomer ? \"My reservations\" : \"All slot reservations\"}\u003c/h3>\n    \u003cdiv id=\"sub-list\">\u003c/div>\n  `;\n\n  if (isCustomer) {\n    document.getElementById(\"sub-floor\").addEventListener(\"change\", (e) => { subForm.floor = e.target.value; subForm.slotId = null; renderSubSlotPicker(); });\n    document.getElementById(\"sub-vtype\").addEventListener(\"change\", (e) => { subForm.vehicleType = e.target.value; subForm.slotId = null; renderSubSlotPicker(); });\n    document.getElementById(\"sub-start\").addEventListener(\"change\", (e) => { subForm.startDate = e.target.value; renderSubSlotPicker(); });\n    document.getElementById(\"sub-end\").addEventListener(\"change\", (e) => { subForm.endDate = e.target.value; renderSubSlotPicker(); });\n    document.getElementById(\"sub-buy-btn\").addEventListener(\"click\", handleSubscriptionRequest);\n    renderSubSlotPicker();\n  }\n\n  if (isStaffOrAdmin && pendingApproval.length > 0) {\n    renderSubPendingList(pendingApproval);\n  }\n\n  renderSubList(el, isCustomer, isCustomer ? mine : all);\n}\n\nfunction renderSubPendingList(pendingApproval) {\n  const host = document.getElementById(\"sub-pending-list\");\n  if (!host) return;\n  host.innerHTML = pendingApproval\n    .map(\n      (s) => `\n    \u003cdiv class=\"card\" style=\"background:var(--surface-hover)\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n        \u003cdiv>\n          \u003cdiv style=\"font-weight:700\">${escapeHtml(s.vehicleNumber)} \u00b7 Slot ${s.slotCode} \u00b7 ${escapeHtml(s.customerName)}\u003c/div>\n          \u003cdiv style=\"font-size:12.5px;color:var(--muted)\">${s.floor} \u00b7 ${new Date(s.startDate).toLocaleDateString(\"en-IN\")} \u2192 ${new Date(s.endDate).toLocaleDateString(\"en-IN\")} \u00b7 \u20b9${money(s.price)}\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"display:flex;gap:8px;margin-top:10px\">\n        \u003cbutton class=\"btn btn-primary btn-sm\" data-accept-sub=\"${s.id}\">Accept\u003c/button>\n        \u003cbutton class=\"btn btn-danger btn-sm\" data-reject-sub=\"${s.id}\">Reject\u003c/button>\n      \u003c/div>\n    \u003c/div>`\n    )\n    .join(\"\");\n\n  host.querySelectorAll(\"[data-accept-sub]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const sub = state.subscriptions.find((s) => s.id === Number(btn.getAttribute(\"data-accept-sub\")));\n      const conflict = slotBookedForRange(sub.slotId, sub.startDate, sub.endDate, sub.id);\n      if (conflict) {\n        showToast(\"That slot has since been taken for an overlapping period \u2014 reject or ask the customer to re-request.\", \"error\");\n        return;\n      }\n      const liveBooking = findLiveBookingOnSlot(sub.slotId);\n      if (liveBooking && (new Date(sub.startDate) \u003c= new Date() && new Date(sub.endDate) >= new Date())) {\n        showToast(`Slot ${sub.slotCode} currently has an active walk-in booking (${liveBooking.bookingId}) \u2014 it needs to be freed before you can accept a subscription covering today.`, \"error\");\n        return;\n      }\n      sub.status = \"PENDING_PAYMENT\";\n      saveState();\n      showToast(`Accepted ${sub.vehicleNumber}'s request \u2014 awaiting payment of \u20b9${money(sub.price)}`);\n      logNotification(\"SMS\", sub.mobile, `Your slot reservation request for ${sub.slotCode} was accepted. Please complete payment of \u20b9${money(sub.price)} to confirm.`);\n      render();\n    })\n  );\n  host.querySelectorAll(\"[data-reject-sub]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const sub = state.subscriptions.find((s) => s.id === Number(btn.getAttribute(\"data-reject-sub\")));\n      if (!confirm(`Reject ${sub.vehicleNumber}'s request for slot ${sub.slotCode}?`)) return;\n      sub.status = \"CANCELLED\";\n      saveState();\n      showToast(`Request rejected \u2014 ${sub.vehicleNumber} notified`);\n      logNotification(\"SMS\", sub.mobile, `Your slot reservation request for ${sub.slotCode} was declined by staff. No charge was made.`);\n      render();\n    })\n  );\n}\n\nfunction renderSubSlotPicker() {\n  const host = document.getElementById(\"sub-slot-picker\");\n  const summaryHost = document.getElementById(\"sub-price-summary\");\n  const buyBtn = document.getElementById(\"sub-buy-btn\");\n  if (!host) return;\n\n  if (!subForm.startDate || !subForm.endDate) {\n    host.innerHTML = `\u003cdiv style=\"font-size:12.5px;color:var(--muted)\">Pick a date range above to see available slots.\u003c/div>`;\n    summaryHost.innerHTML = \"\";\n    buyBtn.disabled = true;\n    return;\n  }\n  if (new Date(subForm.endDate) \u003c new Date(subForm.startDate)) {\n    host.innerHTML = `\u003cdiv style=\"font-size:12.5px;color:var(--occupied)\">\"To\" date must be on or after \"From\" date.\u003c/div>`;\n    summaryHost.innerHTML = \"\";\n    buyBtn.disabled = true;\n    return;\n  }\n\n  const slots = state.slots.filter((s) => s.floor === subForm.floor && s.vehicleType === subForm.vehicleType);\n  host.innerHTML = slots\n    .map((s) => {\n      const conflict = slotBookedForRange(s.id, subForm.startDate, subForm.endDate);\n      const outOfService = s.status === \"OUT_OF_SERVICE\";\n      const blocked = !!conflict || outOfService;\n      const isSelected = subForm.slotId === s.id;\n      return `\n      \u003cdiv class=\"slot-tile\" style=\"border-color:${isSelected ? \"var(--cyan)\" : blocked ? \"var(--occupied)\" : \"var(--available)\"};${blocked ? \"opacity:.55\" : \"cursor:pointer\"}\" ${!blocked ? `data-pick-sub-slot=\"${s.id}\"` : \"\"}>\n        \u003cspan class=\"mono\" style=\"font-weight:700;font-size:13px\">${s.code}\u003c/span>\n        \u003cdiv style=\"font-size:10.5px;color:var(--muted);margin-top:4px\">${blocked ? (outOfService ? \"Out of service\" : `Booked ${fmtTime(conflict.startDate).split(\",\")[0]}\u2013${fmtTime(conflict.endDate).split(\",\")[0]}`) : \"Free for these dates\"}\u003c/div>\n      \u003c/div>`;\n    })\n    .join(\"\");\n\n  host.querySelectorAll(\"[data-pick-sub-slot]\").forEach((tile) =>\n    tile.addEventListener(\"click\", () => {\n      subForm.slotId = Number(tile.getAttribute(\"data-pick-sub-slot\"));\n      renderSubSlotPicker();\n    })\n  );\n\n  const days = daysBetweenInclusive(subForm.startDate, subForm.endDate);\n  const rate = VEHICLE_TYPES[subForm.vehicleType].dailyRate;\n  const total = days * rate;\n  const slot = subForm.slotId ? findSlot(subForm.slotId) : null;\n  summaryHost.innerHTML = `\n    \u003cdiv style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0;border-top:1px solid var(--border);margin-top:4px\">\n      \u003cspan>${slot ? `Slot ${slot.code}` : \"No slot selected\"} \u00b7 ${days} day${days > 1 ? \"s\" : \"\"} \u00d7 \u20b9${rate}\u003c/span>\n      \u003cstrong class=\"mono\" style=\"color:var(--cyan-bright)\">\u20b9${money(total)}\u003c/strong>\n    \u003c/div>`;\n  buyBtn.disabled = !slot;\n}\n\nfunction handleSubscriptionRequest() {\n  const vehicleNumber = document.getElementById(\"sub-vehicle\").value.trim();\n  if (!vehicleNumber) { showToast(\"Enter a vehicle number\", \"error\"); return; }\n  if (!subForm.slotId) { showToast(\"Pick a slot\", \"error\"); return; }\n\n  const conflict = slotBookedForRange(subForm.slotId, subForm.startDate, subForm.endDate);\n  if (conflict) {\n    showToast(\"This parking slot is already reserved for those dates.\", \"error\");\n    renderSubSlotPicker();\n    return;\n  }\n\n  const slot = findSlot(subForm.slotId);\n  const days = daysBetweenInclusive(subForm.startDate, subForm.endDate);\n  const price = days * VEHICLE_TYPES[slot.vehicleType].dailyRate;\n  const subId = nextSeq(\"subscription\");\n  const startIso = new Date(subForm.startDate + \"T00:00:00\").toISOString();\n  const endIso = new Date(subForm.endDate + \"T23:59:59\").toISOString();\n\n  // No payment is taken yet, and the slot isn't locked yet \u2014 staff must accept the\n  // request first (Part 2), and payment happens as its own explicit step (Part 1 & 4)\n  // once accepted, exactly like the pay-at-exit flow for regular bookings.\n  state.subscriptions.push({\n    id: subId, customerName: session.user.fullName, mobile: session.user.mobile,\n    vehicleNumber, slotId: slot.id, slotCode: slot.code, floor: slot.floor, vehicleType: slot.vehicleType,\n    startDate: startIso, endDate: endIso, price, paymentMethod: null, status: \"PENDING_APPROVAL\",\n  });\n  saveState();\n\n  showToast(`Request sent for slot ${slot.code}, ${subForm.startDate} \u2192 ${subForm.endDate} \u2014 awaiting staff approval`);\n  logNotification(\"EMAIL\", session.user.mobile, `Your request for slot ${slot.code} (${vehicleNumber}), ${subForm.startDate} to ${subForm.endDate}, is awaiting staff approval.`);\n\n  subForm = { floor: subForm.floor, vehicleType: subForm.vehicleType, slotId: null, startDate: \"\", endDate: \"\" };\n  render();\n}\n\nfunction openSubscriptionPaymentModal(sub) {\n  showModal({\n    title: `Pay for slot ${sub.slotCode}`,\n    bodyHtml: `\n      \u003cdiv style=\"font-size:13.5px;color:var(--paper-dim);margin-bottom:14px\">\n        Vehicle \u003cstrong style=\"color:var(--paper)\">${escapeHtml(sub.vehicleNumber)}\u003c/strong> \u00b7 ${sub.slotCode} \u00b7 ${sub.floor}\u003cbr/>\n        ${new Date(sub.startDate).toLocaleDateString(\"en-IN\")} \u2192 ${new Date(sub.endDate).toLocaleDateString(\"en-IN\")}\n      \u003c/div>\n      \u003cdiv style=\"font-size:24px;font-weight:800;font-family:var(--font-mono);color:var(--cyan-bright);margin-bottom:14px\">\u20b9${money(sub.price)}\u003c/div>\n      \u003cp style=\"font-size:11.5px;color:var(--muted);margin-bottom:10px\">Payment is for the full period and is non-refundable.\u003c/p>\n      \u003clabel class=\"field-label\" style=\"margin-top:0\">Payment method\u003c/label>\n      \u003cselect id=\"sub-pay-method\" class=\"text-input\">${PAYMENT_METHODS.map((m) => `\u003coption value=\"${m}\">${m.replace(\"_\", \" \")}\u003c/option>`).join(\"\")}\u003c/select>`,\n    actions: [\n      {\n        label: \"Confirm payment\",\n        primary: true,\n        onClick: () => {\n          const method = document.getElementById(\"sub-pay-method\")?.value || \"CASH\";\n          const conflict = slotBookedForRange(sub.slotId, sub.startDate, sub.endDate, sub.id);\n          if (conflict) {\n            showToast(\"That slot is no longer free for these dates \u2014 payment cancelled.\", \"error\");\n            return;\n          }\n          state.payments.push({ id: nextSeq(\"payment\"), bookingId: `SUBSCRIPTION-${sub.id}`, amount: sub.price, method, paidAt: new Date().toISOString(), isSubscription: true });\n          sub.status = \"ACTIVE\";\n          sub.paymentMethod = method;\n          const slot = findSlot(sub.slotId);\n          const now = new Date();\n          const coversToday = slot && new Date(sub.startDate) \u003c= now && new Date(sub.endDate) >= now;\n          const liveBooking = coversToday ? findLiveBookingOnSlot(sub.slotId) : null;\n          if (coversToday && !liveBooking) {\n            slot.status = \"RESERVED\";\n          } else if (liveBooking) {\n            // Don't silently overwrite a slot a walk-in customer is actively using \u2014\n            // the subscription is still paid and ACTIVE, it just won't physically\n            // claim the slot until that booking's vehicle actually leaves.\n            showToast(`Payment received, but slot ${sub.slotCode} currently has an active walk-in booking (${liveBooking.bookingId}) \u2014 it'll take effect once that vehicle exits.`, \"warn\");\n          }\n          saveState();\n          showToast(`Payment received \u2014 slot ${sub.slotCode} reservation is now active`);\n          logNotification(\"SMS\", sub.mobile, `Payment of \u20b9${money(sub.price)} received for slot ${sub.slotCode}. Your reservation is confirmed.`);\n          render();\n        },\n      },\n      { label: \"Cancel\" },\n    ],\n  });\n}\n\nfunction renderSubList(el, isCustomer, list) {\n  const host = document.getElementById(\"sub-list\");\n  const now = new Date();\n  const isAdmin = session.user.role === \"ADMIN\";\n  host.innerHTML = list.length === 0\n    ? `\u003cdiv class=\"empty-state card\">\u003ch3>No reservations yet\u003c/h3>\u003c/div>`\n    : `\u003cdiv style=\"display:flex;flex-direction:column;gap:10px\">\n        ${list\n          .sort((a, b) => new Date(b.startDate) - new Date(a.startDate))\n          .map((s) => {\n            const isCancelled = s.status === \"CANCELLED\";\n            const isPendingApproval = s.status === \"PENDING_APPROVAL\";\n            const isPendingPayment = s.status === \"PENDING_PAYMENT\";\n            const isExpired = s.status === \"ACTIVE\" && new Date(s.endDate) \u003c now;\n            const isUpcoming = s.status === \"ACTIVE\" && new Date(s.startDate) > now;\n            const isLive = s.status === \"ACTIVE\" && !isExpired && !isUpcoming;\n            const statusLabel = isCancelled ? \"CANCELLED\" : isPendingApproval ? \"AWAITING APPROVAL\" : isPendingPayment ? \"AWAITING PAYMENT\" : isExpired ? \"EXPIRED\" : isUpcoming ? \"UPCOMING\" : \"ACTIVE\";\n            const colorVar = isCancelled ? \"cancelled\" : isPendingApproval || isPendingPayment ? \"reserved\" : isExpired ? \"outofservice\" : isUpcoming ? \"reserved\" : \"available\";\n            const canCancel = isCustomer && (isPendingApproval || isPendingPayment || isLive || isUpcoming);\n            const alreadyPaid = s.status === \"ACTIVE\";\n            return `\n          \u003cdiv class=\"card\">\n            \u003cdiv style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n              \u003cdiv>\n                \u003cdiv style=\"font-weight:700\">${escapeHtml(s.vehicleNumber)} \u00b7 Slot ${s.slotCode} ${!isCustomer ? `\u00b7 ${escapeHtml(s.customerName)}` : \"\"}\u003c/div>\n                \u003cdiv style=\"font-size:12.5px;color:var(--muted)\">${s.floor} \u00b7 \u20b9${money(s.price)} total (non-refundable)\u003c/div>\n              \u003c/div>\n              \u003cspan class=\"badge\" style=\"color:var(--${colorVar});background:var(--${colorVar}-bg)\">${statusLabel}\u003c/span>\n            \u003c/div>\n            \u003cdiv style=\"font-size:12px;color:var(--paper-dim);margin-top:8px\">${new Date(s.startDate).toLocaleDateString(\"en-IN\")} \u2192 ${new Date(s.endDate).toLocaleDateString(\"en-IN\")}\u003c/div>\n            \u003cdiv style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\">\n              ${isPendingPayment ? `\u003cbutton class=\"btn btn-primary btn-sm\" data-pay-sub=\"${s.id}\">Pay \u20b9${money(s.price)}\u003c/button>` : \"\"}\n              ${canCancel ? `\u003cbutton class=\"btn btn-danger btn-sm\" data-cancel-sub=\"${s.id}\">Cancel${alreadyPaid ? \" (no refund)\" : \"\"}\u003c/button>` : \"\"}\n              ${isAdmin ? `\u003cbutton class=\"btn btn-danger btn-sm\" data-delete-sub=\"${s.id}\">Delete\u003c/button>` : \"\"}\n            \u003c/div>\n          \u003c/div>`;\n          })\n          .join(\"\")}\n      \u003c/div>`;\n\n  host.querySelectorAll(\"[data-pay-sub]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const sub = state.subscriptions.find((s) => s.id === Number(btn.getAttribute(\"data-pay-sub\")));\n      openSubscriptionPaymentModal(sub);\n    })\n  );\n\n  host.querySelectorAll(\"[data-cancel-sub]\").forEach((btn) =>\n    btn.addEventListener(\"click\", () => {\n      const sub = state.subscriptions.find((s) => s.id === Number(btn.getAttribute(\"data-cancel-sub\")));\n      const paid = sub.status === \"ACTIVE\";\n      const msg = paid\n        ? `Cancel this reservation for slot ${sub.slotCode}? You already paid \u20b9${money(sub.price)} for the full period and this will NOT be refunded.`\n        : `Cancel this request for slot ${sub.slotCode}? No payment has been made yet.`;\n      if (!confirm(msg)) return;\n      sub.status = \"CANCELLED\";\n      const slot = findSlot(sub.slotId);\n      // Only free the slot if nothing else currently claims it.\n      if (slot && slot.status === \"RESERVED\" && !slotBookedForRange(slot.id, new Date().toISOString(), new Date().toISOString())) {\n        slot.status = \"AVAILABLE\";\n      }\n      saveState();\n      showToast(paid ? `Reservation cancelled \u2014 \u20b9${money(sub.price)} already paid is not refunded` : \"Request cancelled \u2014 no charge was made\");\n      render();\n    })\n  );\n\n  if (isAdmin) {\n    host.querySelectorAll(\"[data-delete-sub]\").forEach((btn) =>\n      btn.addEventListener(\"click\", () => {\n        const sub = state.subscriptions.find((s) => s.id === Number(btn.getAttribute(\"data-delete-sub\")));\n        if (!confirm(`Permanently delete this subscription record for slot ${sub.slotCode} (${sub.vehicleNumber})? This cannot be undone.`)) return;\n        const slot = findSlot(sub.slotId);\n        state.subscriptions = state.subscriptions.filter((s) => s.id !== sub.id);\n        // If the slot was held occupied/reserved on account of this subscription, and\n        // nothing else (booking or another subscription) still claims it, free it back\n        // to available now that the record is gone.\n        if (slot && (slot.status === \"RESERVED\" || slot.status === \"OCCUPIED\")) {\n          const heldByBooking = state.bookings.some((b) => b.slotId === slot.id && [\"RESERVED\", \"ACTIVE\", \"PENDING_PAYMENT\"].includes(b.status));\n          const heldBySubscription = !!slotBookedForRange(slot.id, new Date().toISOString(), new Date().toISOString());\n          if (!heldByBooking && !heldBySubscription) {\n            slot.status = \"AVAILABLE\";\n          }\n        }\n        saveState();\n        showToast(`Subscription for ${sub.slotCode} deleted${slot && slot.status === \"AVAILABLE\" ? \" \u2014 slot freed up\" : \"\"}`);\n        render();\n      })\n    );\n  }\n}\n\n/* ---------- Notification log page ---------- */\nfunction renderNotificationsPage(el) {\n  const isAdmin = session.user.role === \"ADMIN\";\n  if (state.notifications.length === 0) {\n    el.innerHTML = `\u003cdiv class=\"empty-state card\">\u003ch3>No notifications yet\u003c/h3>\u003cp>SMS/Email confirmations are logged here (simulated \u2014 this static app has no real SMS/Email provider connected).\u003c/p>\u003c/div>`;\n    return;\n  }\n  el.innerHTML = `\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px\">\n      \u003cp style=\"font-size:12px;color:var(--muted);margin:0\">These are simulated \u2014 sending real SMS/Email requires connecting a backend provider (e.g. Twilio, SendGrid).\u003c/p>\n      ${isAdmin ? `\u003cbutton class=\"btn btn-danger btn-sm\" id=\"notif-delete-all\" style=\"flex-shrink:0\">Delete all\u003c/button>` : \"\"}\n    \u003c/div>\n    \u003cdiv style=\"display:flex;flex-direction:column;gap:8px\">\n    ${state.notifications\n      .map(\n        (n) => `\n      \u003cdiv class=\"card\" style=\"padding:12px 16px\">\n        \u003cdiv style=\"display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)\">\n          \u003cspan class=\"mono\">${n.type} \u2192 ${escapeHtml(n.to)}\u003c/span>\n          \u003cspan style=\"display:flex;align-items:center;gap:10px;flex-shrink:0\">\n            \u003cspan class=\"mono\">${fmtTime(n.at)}\u003c/span>\n            ${isAdmin ? `\u003cbutton class=\"btn btn-danger btn-sm\" style=\"padding:2px 8px\" data-delete-notification=\"${n.id}\">Delete\u003c/button>` : \"\"}\n          \u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"font-size:13px;margin-top:4px\">${escapeHtml(n.message)}\u003c/div>\n      \u003c/div>`\n      )\n      .join(\"\")}\n    \u003c/div>`;\n\n  if (isAdmin) {\n    el.querySelectorAll(\"[data-delete-notification]\").forEach((btn) =>\n      btn.addEventListener(\"click\", () => {\n        const id = Number(btn.getAttribute(\"data-delete-notification\"));\n        if (!confirm(\"Delete this notification log entry? This cannot be undone.\")) return;\n        state.notifications = state.notifications.filter((n) => n.id !== id);\n        saveState();\n        showToast(\"Notification deleted\");\n        render();\n      })\n    );\n\n    document.getElementById(\"notif-delete-all\").addEventListener(\"click\", () => {\n      if (!confirm(`Delete all ${state.notifications.length} notification log entries? This cannot be undone.`)) return;\n      state.notifications = [];\n      saveState();\n      showToast(\"All notifications deleted\");\n      render();\n    });\n  }\n}\n\n/* ---------- Reports & Revenue page (Admin only) ---------- */\nfunction revenueInRange(start, end) {\n  const parkingRevenue = state.bookings\n    .filter((b) => b.status === \"COMPLETED\" && b.exitTime && new Date(b.exitTime) >= start && new Date(b.exitTime) \u003c= end)\n    .reduce((sum, b) => sum + b.charges, 0);\n  const subscriptionRevenue = state.payments\n    .filter((p) => p.isSubscription && new Date(p.paidAt) >= start && new Date(p.paidAt) \u003c= end)\n    .reduce((sum, p) => sum + p.amount, 0);\n  return parkingRevenue + subscriptionRevenue;\n}\n\nfunction renderReportsPage(el) {\n  const now = new Date();\n  const { start: todayStart, end: todayEnd } = todayBounds();\n  const yestStart = new Date(todayStart); yestStart.setDate(yestStart.getDate() - 1);\n  const yestEnd = new Date(todayEnd); yestEnd.setDate(yestEnd.getDate() - 1);\n  const weekStart = new Date(todayStart); weekStart.setDate(weekStart.getDate() - 6);\n  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);\n  const yearStart = new Date(now.getFullYear(), 0, 1);\n\n  const revToday = revenueInRange(todayStart, todayEnd);\n  const revYesterday = revenueInRange(yestStart, yestEnd);\n  const revWeek = revenueInRange(weekStart, todayEnd);\n  const revMonth = revenueInRange(monthStart, todayEnd);\n  const revYear = revenueInRange(yearStart, todayEnd);\n\n  const totalVehicles = state.bookings.length;\n  const occupiedSlots = state.slots.filter((s) => s.status === \"OCCUPIED\").length;\n  const availableSlots = state.slots.filter((s) => s.status === \"AVAILABLE\").length;\n  const cancelledBookings = state.bookings.filter((b) => b.status === \"CANCELLED\").length;\n  const completedBookings = state.bookings.filter((b) => b.status === \"COMPLETED\").length;\n\n  el.innerHTML = `\n    \u003cdiv class=\"stat-grid\" style=\"margin-bottom:20px\">\n      ${reportStat(\"\ud83d\udcb0\", \"Today\", revToday, \"available\")}\n      ${reportStat(\"\ud83d\udcc5\", \"Yesterday\", revYesterday)}\n      ${reportStat(\"\ud83d\uddd3\", \"Last 7 days\", revWeek)}\n      ${reportStat(\"\ud83d\udcc6\", \"This month\", revMonth)}\n      ${reportStat(\"\ud83d\udcc8\", \"This year\", revYear)}\n    \u003c/div>\n\n    \u003cdiv class=\"stat-grid\" style=\"margin-bottom:20px\">\n      ${analyticsStat(\"\ud83d\ude97\", \"Total bookings\", totalVehicles)}\n      ${analyticsStat(\"\ud83c\udd7f\ufe0f\", \"Occupied now\", occupiedSlots, \"occupied\")}\n      ${analyticsStat(\"\u2705\", \"Available now\", availableSlots, \"available\")}\n      ${analyticsStat(\"\u274c\", \"Cancelled\", cancelledBookings, \"cancelled\")}\n      ${analyticsStat(\"\ud83c\udfc1\", \"Completed\", completedBookings, \"completed\")}\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"margin-bottom:20px\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n        \u003ch3 style=\"font-size:15px\">Export\u003c/h3>\n        \u003cdiv style=\"display:flex;gap:8px\">\n          \u003cbutton class=\"btn btn-ghost btn-sm\" id=\"export-csv-btn\">\u2b07 Export CSV (Excel)\u003c/button>\n          \u003cbutton class=\"btn btn-ghost btn-sm\" id=\"export-pdf-btn\">\ud83d\udda8 Print / Save as PDF\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cp style=\"font-size:11.5px;color:var(--muted);margin-top:8px\">CSV opens directly in Excel/Sheets. \"Print / Save as PDF\" uses your browser's print dialog \u2014 choose \"Save as PDF\" as the destination.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"two-col\">\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:14.5px;margin-bottom:14px;color:var(--paper-dim)\">Occupancy by status\u003c/h3>\n        ${occupancyDonut()}\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:14.5px;margin-bottom:14px;color:var(--paper-dim)\">Revenue trend (last 7 days)\u003c/h3>\n        ${revenueBarChart()}\n      \u003c/div>\n    \u003c/div>\n  `;\n\n  document.getElementById(\"export-csv-btn\").addEventListener(\"click\", exportBookingsCsv);\n  document.getElementById(\"export-pdf-btn\").addEventListener(\"click\", () => window.print());\n}\n\nfunction reportStat(icon, label, value, colorVar) {\n  return `\u003cdiv class=\"card stat-card-v2\">\u003cdiv class=\"stat-icon\">${icon}\u003c/div>\u003cdiv>\u003cdiv class=\"stat-label\">${label}\u003c/div>\u003cdiv class=\"mono stat-value\" style=\"color:${colorVar ? `var(--${colorVar})` : \"var(--paper)\"}\">\u20b9${Math.round(value).toLocaleString(\"en-IN\")}\u003c/div>\u003c/div>\u003c/div>`;\n}\nfunction analyticsStat(icon, label, value, colorVar) {\n  return `\u003cdiv class=\"card stat-card-v2\">\u003cdiv class=\"stat-icon\">${icon}\u003c/div>\u003cdiv>\u003cdiv class=\"stat-label\">${label}\u003c/div>\u003cdiv class=\"mono stat-value\" style=\"color:${colorVar ? `var(--${colorVar})` : \"var(--paper)\"}\">${value}\u003c/div>\u003c/div>\u003c/div>`;\n}\n\nfunction occupancyDonut() {\n  const counts = { AVAILABLE: 0, RESERVED: 0, OCCUPIED: 0, OUT_OF_SERVICE: 0 };\n  state.slots.forEach((s) => counts[s.status]++);\n  const total = state.slots.length || 1;\n  const colors = { AVAILABLE: \"#2fd67e\", RESERVED: \"#f2b23c\", OCCUPIED: \"#f2495c\", OUT_OF_SERVICE: \"#6c7891\" };\n  let offset = 0;\n  const circumference = 2 * Math.PI * 46;\n  const segments = Object.entries(counts)\n    .filter(([, v]) => v > 0)\n    .map(([k, v]) => {\n      const frac = v / total;\n      const dash = frac * circumference;\n      const seg = `\u003ccircle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"${colors[k]}\" stroke-width=\"16\" stroke-dasharray=\"${dash} ${circumference - dash}\" stroke-dashoffset=\"${-offset}\" transform=\"rotate(-90 60 60)\"/>`;\n      offset += dash;\n      return seg;\n    })\n    .join(\"\");\n  return `\n    \u003cdiv style=\"display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n      \u003csvg width=\"120\" height=\"120\" viewBox=\"0 0 120 120\">${segments}\u003ctext x=\"60\" y=\"65\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"18\" font-weight=\"700\" fill=\"var(--paper)\">${total}\u003c/text>\u003c/svg>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:6px\">\n        ${Object.entries(counts)\n          .map(([k, v]) => `\u003cdiv style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--paper-dim)\">\u003cspan style=\"width:9px;height:9px;border-radius:2px;background:${colors[k]}\">\u003c/span>${k.replace(\"_\", \" \")} (${v})\u003c/div>`)\n          .join(\"\")}\n      \u003c/div>\n    \u003c/div>`;\n}\n\nfunction revenueBarChart() {\n  const days = [];\n  for (let i = 6; i >= 0; i--) {\n    const d = new Date();\n    d.setDate(d.getDate() - i);\n    d.setHours(0, 0, 0, 0);\n    const e = new Date(d);\n    e.setHours(23, 59, 59, 999);\n    days.push({ label: d.toLocaleDateString(\"en-IN\", { weekday: \"short\" }), value: revenueInRange(d, e) });\n  }\n  const max = Math.max(1, ...days.map((d) => d.value));\n  return `\u003cdiv style=\"display:flex;align-items:end;gap:10px;height:140px\">\n    ${days\n      .map(\n        (d) => `\n      \u003cdiv style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:6px\">\n        \u003cdiv class=\"mono\" style=\"font-size:10px;color:var(--muted)\">\u20b9${Math.round(d.value)}\u003c/div>\n        \u003cdiv style=\"width:100%;background:var(--cyan);border-radius:4px 4px 0 0;height:${Math.max(3, (d.value / max) * 90)}px\">\u003c/div>\n        \u003cdiv style=\"font-size:10.5px;color:var(--muted)\">${d.label}\u003c/div>\n      \u003c/div>`\n      )\n      .join(\"\")}\n  \u003c/div>`;\n}\n\nfunction exportBookingsCsv() {\n  const headers = [\"Booking ID\", \"Vehicle Number\", \"Vehicle Type\", \"Slot\", \"Floor\", \"Status\", \"Mobile\", \"Entry\", \"Exit\", \"Charges\", \"Payment Status\", \"Payment Method\"];\n  const rows = state.bookings.map((b) => [\n    b.bookingId, b.vehicleNumber, b.vehicleType, b.slotCode, b.floor, b.status, b.mobile,\n    b.entryTime || \"\", b.exitTime || \"\", b.charges, b.paymentStatus, b.paymentMethod || \"\",\n  ]);\n  const csv = [headers, ...rows].map((r) => r.map((c) => `\"${String(c).replace(/\"/g, '\"\"')}\"`).join(\",\")).join(\"\\n\");\n  const blob = new Blob([csv], { type: \"text/csv\" });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = `parkgrid-bookings-${new Date().toISOString().slice(0, 10)}.csv`;\n  a.click();\n  URL.revokeObjectURL(url);\n  showToast(\"CSV exported\");\n}\n\n/* ---------- Dashboard page (role-aware) ---------- */\nfunction renderDashboardPage(el) {\n  const role = session.user.role;\n  if (role === \"ADMIN\") renderAdminDashboard(el);\n  else if (role === \"STAFF\") renderStaffDashboard(el);\n  else renderCustomerDashboard(el);\n}\n\nfunction renderAdminDashboard(el) {\n  const { start: todayStart, end: todayEnd } = todayBounds();\n  const revToday = revenueInRange(todayStart, todayEnd);\n  const totalSlots = state.slots.length;\n  const occupied = state.slots.filter((s) => s.status === \"OCCUPIED\").length;\n  const available = state.slots.filter((s) => s.status === \"AVAILABLE\").length;\n  const reserved = state.slots.filter((s) => s.status === \"RESERVED\").length;\n  const activeBookings = state.bookings.filter((b) => b.status === \"ACTIVE\").length;\n  const pendingPayment = state.bookings.filter((b) => b.status === \"PENDING_PAYMENT\").length;\n\n  el.innerHTML = `\n    \u003cdiv class=\"stat-grid\" style=\"margin-bottom:20px\">\n      ${reportStat(\"\ud83d\udcb0\", \"Revenue today\", revToday, \"available\")}\n      ${analyticsStat(\"\ud83c\udd7f\ufe0f\", \"Total slots\", totalSlots)}\n      ${analyticsStat(\"\u2705\", \"Available\", available, \"available\")}\n      ${analyticsStat(\"\ud83d\ude97\", \"Occupied\", occupied, \"occupied\")}\n      ${analyticsStat(\"\ud83d\udd53\", \"Reserved\", reserved, \"reserved\")}\n      ${analyticsStat(\"\ud83d\udcb3\", \"Awaiting payment\", pendingPayment, \"reserved\")}\n    \u003c/div>\n    \u003cdiv class=\"two-col\">\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:14.5px;margin-bottom:14px;color:var(--paper-dim)\">Occupancy by status\u003c/h3>\n        ${occupancyDonut()}\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003ch3 style=\"font-size:14.5px;margin-bottom:14px;color:var(--paper-dim)\">Revenue trend (last 7 days)\u003c/h3>\n        ${revenueBarChart()}\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"card\" style=\"margin-top:20px\">\n      \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\">\n        \u003ch3 style=\"font-size:14.5px;color:var(--paper-dim)\">On-site right now\u003c/h3>\n        \u
