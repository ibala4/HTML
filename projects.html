\"progress-bar\">\u003cdiv class=\"progress-fill\" style=\"width:${pct}%;\">\u003c/div>\u003c/div>\n      ${topics.map(t=>`\u003cdiv class=\"topic-row\">\u003cspan>${t.topic}\u003c/span>\u003cspan class=\"badge ${t.status.toLowerCase()}\">${t.status}\u003c/span>\u003c/div>`).join('')}\n    \u003c/div>`;\n  }).join('');\n}\nfunction renderMgtSyllabusReadonly(){ renderSyllabusReadonlyFor('mgt'); }\nfunction renderStfSyllabusReadonly(){ renderSyllabusReadonlyFor('stf'); }\n\n/* ================= LEAVE REQUESTS ================= */\nfunction renderStuLeave(){\n  $('#stu-leave-staff').innerHTML = staff.map(s=>`\u003coption value=\"${s.id}\">${s.name} (${s.role})\u003c/option>`).join('');\n  const mine = leaveRequests.filter(l=>l.studentId===currentUser.id);\n  $('#stu-leave-list').innerHTML = mine.length ? mine.map(l=>{\n    const st = staff.find(x=>x.id===l.staffId);\n    return `\n    \u003cdiv class=\"task-card\">\n      \u003cdiv class=\"task-head\">\n        \u003cdiv>\u003cdiv class=\"task-loc\">${l.from} \u2192 ${l.to}\u003c/div>\u003cdiv class=\"task-title\">${l.reason}\u003c/div>\u003cdiv style=\"color:var(--text-dim);font-size:12px;margin-top:4px;\">To: ${st ? st.name : 'Staff'}\u003c/div>\u003c/div>\n        \u003cspan class=\"badge ${l.status==='Approved'?'completed':l.status==='Rejected'?'open':'pending'}\">${l.status}\u003c/span>\n      \u003c/div>\n      ${l.comment ? `\u003cdiv style=\"font-size:12.5px;color:var(--text-dim);margin-top:6px;\">Staff comment: ${l.comment}\u003c/div>` : ''}\n    \u003c/div>`;\n  }).join('') : '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No leave requests yet.\u003c/p>';\n}\n$('#stu-leave-submit').addEventListener('click', ()=>{\n  const staffId = $('#stu-leave-staff').value;\n  const from = $('#stu-leave-from').value;\n  const to = $('#stu-leave-to').value;\n  const reason = $('#stu-leave-reason').value.trim();\n  if(!staffId){ showToast('Choose a staff member to send this to'); return; }\n  if(!from || !to || !reason){ showToast('Fill in from date, to date, and reason'); return; }\n  leaveRequests.unshift({id:newLeaveId(), studentId: currentUser.id, staffId, from, to, reason, status:'Pending', comment:'', createdAt: todayStr()});\n  $('#stu-leave-from').value=''; $('#stu-leave-to').value=''; $('#stu-leave-reason').value='';\n  showToast('Leave request submitted');\n  renderStuLeave();\n});\n\nfunction staffLeaveCardHtml(l){\n  const s = students.find(x=>x.id===l.studentId);\n  const toStaff = staff.find(x=>x.id===l.staffId);\n  return `\n  \u003cdiv class=\"task-card\" data-leave=\"${l.id}\">\n    \u003cdiv class=\"task-head\">\n      \u003cdiv>\u003cdiv class=\"task-loc\">${s ? s.name : l.studentId}${s ? ' \u2014 Class '+s.cls+' '+s.section : ''}\u003c/div>\u003cdiv class=\"task-title\">${l.from} \u2192 ${l.to} \u2014 ${l.reason}\u003c/div>\u003cdiv style=\"color:var(--text-dim);font-size:12px;margin-top:4px;\">To: ${toStaff ? toStaff.name : 'Unassigned'}\u003c/div>\u003c/div>\n      \u003cspan class=\"badge ${l.status==='Approved'?'completed':l.status==='Rejected'?'open':'pending'}\">${l.status}\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"mat-add-row\">\n      \u003cinput type=\"text\" placeholder=\"Comment (optional)\" data-leave-comment=\"${l.id}\" value=\"${l.comment||''}\">\n    \u003c/div>\n    \u003cdiv class=\"status-btns\">\n      \u003cbutton class=\"status-btn ${l.status==='Approved'?'active':''}\" data-leave-status=\"${l.id}\" data-val=\"Approved\">Approve\u003c/button>\n      \u003cbutton class=\"status-btn ${l.status==='Rejected'?'active':''}\" data-leave-status=\"${l.id}\" data-val=\"Rejected\">Reject\u003c/button>\n      \u003cbutton class=\"status-btn ${l.status==='Pending'?'active':''}\" data-leave-status=\"${l.id}\" data-val=\"Pending\">Pending\u003c/button>\n    \u003c/div>\n  \u003c/div>`;\n}\nfunction wireLeaveCardHandlers(containerSel, rerender){\n  $$(`${containerSel} [data-leave-status]`).forEach(b=>b.addEventListener('click', ()=>{\n    const l = leaveRequests.find(x=>x.id===b.dataset.leaveStatus);\n    if(!l) return;\n    const commentInp = document.querySelector(`[data-leave-comment=\"${l.id}\"]`);\n    l.status = b.dataset.val;\n    l.comment = commentInp ? commentInp.value.trim() : l.comment;\n    showToast(`Leave request ${l.status.toLowerCase()}`);\n    rerender();\n  }));\n}\nfunction renderStfLeave(){\n  const mine = leaveRequests.filter(l=>l.staffId===currentUser.id);\n  $('#stf-leave-list').innerHTML = mine.length ? mine.map(staffLeaveCardHtml).join('') : '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No leave requests addressed to you yet.\u003c/p>';\n  wireLeaveCardHandlers('#stf-leave-list', renderStfLeave);\n}\nfunction renderMgtLeave(){\n  $('#mgt-leave-list').innerHTML = leaveRequests.length ? leaveRequests.map(staffLeaveCardHtml).join('') : '\u003cp style=\"color:var(--text-dim);font-size:13px;\">No leave requests yet.\u003c/p>';\n  wireLeaveCardHandlers('#mgt-leave-list', renderMgtLeave);\n}\n\n/* ================= SELF-ATTENDANCE (Staff & Management mark their own presence) ================= */\nfunction renderStfMyAttendance(){\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  renderCalendar('stf-myatt-calendar', { markerFn: d => attendance[currentUser.id][d] || null, selectable:false });\n  const marked = !!attendance[currentUser.id][todayStr()];\n  $('#stf-mark-btn').disabled = marked;\n  $('#stf-mark-btn').textContent = marked ? 'Already Marked Today' : 'Mark Today Present';\n}\n$('#stf-mark-btn').addEventListener('click', ()=>{\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  attendance[currentUser.id][todayStr()] = 'present';\n  showToast('Attendance marked for today');\n  renderStfMyAttendance();\n});\nfunction renderMgtMyAttendance(){\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  renderCalendar('mgt-myatt-calendar', { markerFn: d => attendance[currentUser.id][d] || null, selectable:false });\n  const marked = !!attendance[currentUser.id][todayStr()];\n  $('#mgt-mark-btn').disabled = marked;\n  $('#mgt-mark-btn').textContent = marked ? 'Already Marked Today' : 'Mark Today Present';\n}\n$('#mgt-mark-btn').addEventListener('click', ()=>{\n  if(!attendance[currentUser.id]) attendance[currentUser.id] = {};\n  attendance[currentUser.id][todayStr()] = 'present';\n  showToast('Attendance marked for today');\n  renderMgtMyAttendance();\n});\n\n/* ================= EXAM REMINDER POPUP (students) ================= */\nfunction checkExamReminders(){\n  const rows = (examTimetable[String(currentUser.cls)] || []).filter(r => r.date >= todayStr());\n  if(!rows.length) return;\n  const sorted = rows.slice().sort((a,b)=>a.date.localeCompare(b.date));\n  $('#reminder-list').innerHTML = sorted.map(r=>{\n    const days = Math.round((new Date(r.date) - new Date(todayStr())) / 86400000);\n    const dayLabel = days\u003c=0 ? 'Today' : days===1 ? 'Tomorrow' : `In ${days} days`;\n    return `\u003cdiv class=\"reminder-item\">\u003cdiv class=\"r-days\">${dayLabel} \u2014 ${r.date}\u003c/div>\u003cdiv>\u003cb>${r.subject}\u003c/b> (${r.exam})\u003c/div>\u003cdiv style=\"color:var(--text-dim);font-size:12px;\">${r.time}\u003c/div>\u003c/div>`;\n  }).join('');\n  $('#reminder-modal-bg').classList.add('open');\n}\n$('#reminder-close').addEventListener('click', ()=> $('#reminder-modal-bg').classList.remove('open'));\n$('#reminder-modal-bg').addEventListener('click', e=>{ if(e.target.id==='reminder-modal-bg') $('#reminder-modal-bg').classList.remove('open'); });\n\n/* ================= TERM-END NOTIFICATION (staff/management) ================= */\n// For each exam name, find its last (latest) scheduled date across all classes.\n// If that date has arrived, nudge staff to prepare the syllabus for the next term.\nfunction checkTermCompletion(){\n  const lastDateByExam = {};\n  Object.keys(examTimetable).forEach(cls=>{\n    (examTimetable[cls] || []).forEach(r=>{\n      if(!lastDateByExam[r.exam] || r.date > lastDateByExam[r.exam]) lastDateByExam[r.exam] = r.date;\n    });\n  });\n  const today = todayStr();\n  const completed = Object.keys(lastDateByExam).filter(exam => lastDateByExam[exam] \u003c= today);\n  if(!completed.length) return;\n  // Only notify about the most recently completed exam so it doesn't spam old terms forever.\n  const exam = completed.sort((a,b)=>lastDateByExam[b].localeCompare(lastDateByExam[a]))[0];\n  const lastDate = lastDateByExam[exam];\n  $('#staff-notify-text').innerHTML = `\u003cb>${exam}\u003c/b> wrapped up on \u003cb>${lastDate}\u003c/b>. Please prepare and update the syllabus for the next term's exam in the Syllabus tab.`;\n  $('#staff-notify-modal-bg').classList.add('open');\n}\n$('#staff-notify-close').addEventListener('click', ()=> $('#staff-notify-modal-bg').classList.remove('open'));\n$('#staff-notify-modal-bg').addEventListener('click', e=>{ if(e.target.id==='staff-notify-modal-bg') $('#staff-notify-modal-bg').classList.remove('open'); });\n\n/* ================= PERSISTENT SHARED STORAGE (syncs data across roles/logins) ================= */\nfunction snapshotState(){\n  return {\n    students, staff, housekeeping, management,\n    sectionsByClass, classTeachers,\n    holidays, dailyTimetable, examTimetable, syllabus, attendance, marksData,\n    issues, issueSerial, serial,\n    leaveRequests, leaveSerial,\n  };\n}\nfunction applyState(s){\n  if(!s) return;\n  if(s.students) students = s.students;\n  if(s.staff) staff = s.staff;\n  if(s.housekeeping) housekeeping = s.housekeeping;\n  if(s.management) management = s.management;\n  if(s.sectionsByClass) sectionsByClass = s.sectionsByClass;\n  if(s.classTeachers) classTeachers = s.classTeachers;\n  if(s.holidays) holidays = s.holidays;\n  if(s.dailyTimetable) dailyTimetable = s.dailyTimetable;\n  if(s.examTimetable) examTimetable = s.examTimetable;\n  if(s.syllabus) syllabus = s.syllabus;\n  if(s.attendance) attendance = s.attendance;\n  if(s.marksData) marksData = s.marksData;\n  if(s.issues) issues = s.issues;\n  if(typeof s.issueSerial === 'number') issueSerial = s.issueSerial;\n  if(typeof s.serial === 'number') serial = s.serial;\n  if(s.leaveRequests) leaveRequests = s.leaveRequests;\n  if(typeof s.leaveSerial === 'number') leaveSerial = s.leaveSerial;\n}\nlet saveTimer = null;\nfunction scheduleSave(){\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(saveNow, 400);\n}\nasync function saveNow(){\n  const payload = JSON.stringify(snapshotState());\n  try{\n    if(typeof window.storage !== 'undefined'){\n      await window.storage.set('school-db', payload, true);\n    } else {\n      localStorage.setItem('school-db', payload);\n    }\n  }catch(e){ console.warn('Save failed', e); }\n}\nasync function loadState(){\n  let raw = null;\n  try{\n    if(typeof window.storage !== 'undefined'){\n      const res = await window.storage.get('school-db', true);\n      raw = res && res.value;\n    } else {\n      raw = localStorage.getItem('school-db');\n    }\n  }catch(e){ raw = null; }\n  if(!raw) return;\n  try{ applyState(JSON.parse(raw)); }\n  catch(e){ /* corrupted or no saved data yet \u2014 keep the seeded defaults */ }\n}\n(async function boot(){\n  await loadState();\n  renderDemoList();\n  const btn = $('#login-btn');\n  btn.disabled = false;\n  btn.textContent = 'Login';\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "waterbook.html", "name": "WaterBook", "desc": "Tanker delivery tracker: log and follow water deliveries.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>WaterBook \u2014 Tanker Delivery Tracker\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#0A2233;\n  --bg-elevated:#0E2C42;\n  --surface:#123551;\n  --surface-2:#17415F;\n  --border:#1F4D6C;\n  --aqua:#22C3D6;\n  --aqua-bright:#66E3EE;\n  --aqua-deep:#1591A6;\n  --amber:#FFB020;\n  --amber-bright:#FFC94D;\n  --leaf:#3DD68C;\n  --danger:#FF6B6B;\n  --text:#EAF6FB;\n  --text-dim:#87ABC0;\n  --paper:#F4FBFD;\n  --text-on-paper:#0A2233;\n  --radius:18px;\n  --radius-sm:12px;\n}\n*{box-sizing:border-box;margin:0;padding:0;}\nhtml,body{height:100%;}\nbody{\n  font-family:'Inter',sans-serif;\n  color:var(--text);\n  min-height:100vh;\n  background:\n    radial-gradient(1100px 550px at 100% -10%, rgba(34,195,214,.16), transparent 60%),\n    radial-gradient(900px 500px at -10% 110%, rgba(255,176,32,.08), transparent 55%),\n    var(--bg);\n  -webkit-font-smoothing:antialiased;\n  padding-bottom:60px;\n}\n::selection{background:var(--aqua);color:#04222c;}\n::-webkit-scrollbar{width:10px;}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}\ninput,select,textarea{font-family:inherit;color:inherit;}\nh1,h2,h3{font-family:'Baloo 2',sans-serif;}\n\n/* ---------- Header ---------- */\n.header{\n  display:flex;align-items:center;justify-content:space-between;gap:20px;\n  padding:22px 5vw 18px;flex-wrap:wrap;\n}\n.brand{display:flex;align-items:center;gap:12px;}\n.brand-mark{\n  width:46px;height:46px;border-radius:14px;flex-shrink:0;\n  background:linear-gradient(155deg,var(--aqua-bright),var(--aqua-deep));\n  display:flex;align-items:center;justify-content:center;font-size:22px;\n  box-shadow:0 6px 18px rgba(34,195,214,.35);\n}\n.brand-text h1{font-size:21px;font-weight:700;letter-spacing:-.01em;}\n.brand-text p{font-size:12px;color:var(--text-dim);margin-top:1px;}\n\n.role-switch{\n  display:flex;background:var(--surface);border:1px solid var(--border);border-radius:30px;padding:4px;gap:2px;\n}\n.role-btn{\n  padding:9px 18px;border-radius:24px;font-size:13px;font-weight:600;color:var(--text-dim);\n  display:flex;align-items:center;gap:7px;transition:.18s ease;white-space:nowrap;\n}\n.role-btn.active{background:linear-gradient(155deg,var(--aqua-bright),var(--aqua-deep));color:#04222c;}\n.role-btn:not(.active):hover{color:var(--text);}\n\n.wrap{padding:0 5vw;max-width:1180px;margin:0 auto;}\n.view{display:none;}\n.view.active{display:block;animation:fadein .3s ease;}\n@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}\n\n.page-head{margin:6px 0 24px;}\n.page-head h2{font-size:26px;font-weight:700;}\n.page-head p{color:var(--text-dim);font-size:13.5px;margin-top:4px;}\n\n.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}\n.card{\n  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;\n}\n.card-title{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}\n\n.field{margin-bottom:15px;}\n.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);margin-bottom:7px;}\n.field input,.field select,.field textarea{\n  width:100%;padding:11px 14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:11px;\n  font-size:13.5px;color:var(--text);\n}\n.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--aqua);}\n.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n\n.toggle-group{display:flex;gap:8px;}\n.toggle-opt{\n  flex:1;padding:10px;border-radius:11px;border:1px solid var(--border);background:var(--bg-elevated);\n  text-align:center;font-size:13px;font-weight:600;color:var(--text-dim);\n}\n.toggle-opt.active{background:rgba(34,195,214,.16);border-color:var(--aqua);color:var(--aqua-bright);}\n\n.urgent-toggle{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:13px 15px;border-radius:11px;background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.35);\n  margin-bottom:15px;\n}\n.urgent-toggle .lbl{font-size:13px;font-weight:600;color:var(--amber-bright);display:flex;align-items:center;gap:8px;}\n.switch{width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;transition:.2s;flex-shrink:0;}\n.switch.on{background:var(--amber);}\n.switch::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;}\n.switch.on::after{left:21px;}\n\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:8px;\n  padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:700;width:100%;transition:.15s ease;\n}\n.btn-primary{background:linear-gradient(155deg,var(--aqua-bright),var(--aqua-deep));color:#04222c;}\n.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);}\n.btn-amber{background:linear-gradient(155deg,var(--amber-bright),var(--amber));color:#3A2400;}\n.btn-amber:hover{filter:brightness(1.07);}\n.btn-ghost{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);}\n.btn-ghost:hover{background:var(--surface-2);}\n.btn-sm{padding:8px 14px;font-size:12.5px;width:auto;}\n.btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important;filter:none !important;}\n\n/* ---------- Code card ---------- */\n.code-card{\n  background:linear-gradient(155deg,var(--paper),#E4F2F6);color:var(--text-on-paper);\n  border-radius:16px;padding:20px;text-align:center;margin-top:10px;\n  border:2px dashed var(--aqua-deep);\n}\n.code-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#3F6A78;margin-bottom:6px;}\n.code-card .code{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;letter-spacing:.06em;color:var(--aqua-deep);}\n.code-card .sub{font-size:11.5px;color:#5A7B86;margin-top:6px;}\n\n/* ---------- Status badges ---------- */\n.badge{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px 11px;border-radius:20px;font-weight:700;white-space:nowrap;}\n.badge-pending{background:rgba(255,176,32,.16);color:var(--amber-bright);}\n.badge-progress{background:rgba(34,195,214,.16);color:var(--aqua-bright);}\n.badge-done{background:rgba(61,214,140,.16);color:var(--leaf);}\n.badge-urgent{background:rgba(255,107,107,.18);color:var(--danger);animation:pulse 1.6s infinite;}\n.badge-rejected{background:rgba(255,107,107,.16);color:var(--danger);}\n@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}\n\n/* ---------- Wizard steps ---------- */\n.wizard-steps{display:flex;align-items:center;gap:10px;margin-bottom:24px;max-width:480px;}\n.wizard-step{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-dim);white-space:nowrap;}\n.wizard-step .num{\n  width:24px;height:24px;border-radius:50%;background:var(--bg-elevated);border:2px solid var(--border);\n  display:flex;align-items:center;justify-content:center;font-size:11.5px;flex-shrink:0;\n}\n.wizard-step.active{color:var(--text);}\n.wizard-step.active .num{background:var(--aqua);border-color:var(--aqua-bright);color:#04222c;}\n.wizard-step.done .num{background:var(--leaf);border-color:var(--leaf);color:#04220f;}\n.wizard-step-line{flex:1;height:2px;background:var(--border);}\n\ninput[type=range]{accent-color:var(--aqua);height:6px;cursor:pointer;}\n\n/* ---------- Request list rows ---------- */\n.req-row{\n  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:13px;background:var(--bg-elevated);\n  border:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap;\n}\n.req-row .code-mini{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--aqua-bright);font-weight:700;min-width:88px;}\n.req-row .info{flex:1;min-width:160px;}\n.req-row .info .name{font-size:13.5px;font-weight:600;}\n.req-row .info .addr{font-size:11.5px;color:var(--text-dim);margin-top:2px;}\n.req-row .meta{font-size:11.5px;color:var(--text-dim);text-align:right;}\n\n/* ---------- Stat cards ---------- */\n.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}\n.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;}\n.stat-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--stat-c,var(--aqua));}\n.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dim);margin-bottom:8px;}\n.stat-value{font-family:'Baloo 2',sans-serif;font-size:27px;font-weight:700;}\n\n/* ---------- Fleet ---------- */\n.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}\n.lorry-card{\n  background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:16px;\n  display:flex;flex-direction:column;gap:8px;\n}\n.lorry-card.busy{border-color:var(--amber);}\n.lorry-top{display:flex;align-items:center;justify-content:space-between;}\n.lorry-icon{font-size:22px;}\n.lorry-plate{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);}\n.lorry-driver{font-size:13.5px;font-weight:600;}\n.lorry-cap{font-size:11.5px;color:var(--text-dim);}\n\n/* ---------- Leaderboard ---------- */\n.lb-row{\n  display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:13px;background:var(--bg-elevated);\n  border:1px solid var(--border);margin-bottom:9px;\n}\n.lb-rank{width:26px;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;color:var(--text-dim);flex-shrink:0;}\n.lb-row.top .lb-rank{font-size:18px;}\n.lb-name{flex:1;min-width:120px;}\n.lb-name .n{font-size:13.5px;font-weight:600;}\n.lb-name .p{font-size:11.5px;color:var(--text-dim);}\n.lb-points{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--amber-bright);font-size:14px;}\n.stat-mini{\n  display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border);\n  padding:6px 12px;border-radius:20px;font-size:12px;color:var(--text-dim);\n}\n.stat-mini b{color:var(--amber-bright);}\n\n/* ---------- Assign picker ---------- */\n.assign-picker{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:flex;gap:8px;flex-wrap:wrap;}\n.assign-pick-btn{\n  padding:8px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:600;\n}\n.assign-pick-btn:hover{border-color:var(--aqua);color:var(--aqua-bright);}\n\n/* ---------- Tracker: road + truck ---------- */\n.tracker{margin-top:8px;}\n.road-wrap{\n  position:relative;height:96px;border-radius:16px;background:var(--bg-elevated);border:1px solid var(--border);\n  overflow:hidden;margin-bottom:18px;\n}\n.road-line{\n  position:absolute;top:50%;left:8%;right:8%;height:3px;transform:translateY(-50%);\n  background-image:repeating-linear-gradient(90deg, var(--border) 0 10px, transparent 10px 20px);\n}\n.road-fill{\n  position:absolute;top:50%;left:8%;height:3px;transform:translateY(-50%);\n  background:linear-gradient(90deg,var(--aqua-deep),var(--aqua-bright));\n  transition:width .8s cubic-bezier(.4,0,.2,1);border-radius:4px;\n}\n.road-node{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:22px;z-index:2;}\n.road-node.depot{left:8%;}\n.road-node.home{left:92%;}\n.road-truck{\n  position:absolute;top:50%;font-size:26px;transform:translate(-50%,-62%);\n  transition:left .8s cubic-bezier(.4,0,.2,1);z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));\n}\n.road-truck.moving{animation:bob .5s ease-in-out infinite alternate;}\n@keyframes bob{from{transform:translate(-50%,-62%) translateY(0);}to{transform:translate(-50%,-62%) translateY(-4px);}}\n.road-drops{position:absolute;top:66%;font-size:11px;opacity:.7;transition:left .8s cubic-bezier(.4,0,.2,1);}\n\n.tracker-body{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;}\n.stage-list{display:flex;flex-direction:column;gap:0;}\n.stage-item{display:flex;align-items:center;gap:12px;padding:8px 0;position:relative;}\n.stage-item:not(:last-child)::after{\n  content:'';position:absolute;left:15px;top:34px;width:2px;height:calc(100% - 6px);background:var(--border);\n}\n.stage-dot{\n  width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;\n  background:var(--bg-elevated);border:2px solid var(--border);flex-shrink:0;z-index:1;color:var(--text-dim);\n}\n.stage-item.done .stage-dot{background:var(--leaf);border-color:var(--leaf);color:#04220f;}\n.stage-item.current .stage-dot{background:var(--aqua);border-color:var(--aqua-bright);color:#04222c;box-shadow:0 0 0 5px rgba(34,195,214,.18);}\n.stage-item.done:not(:last-child)::after{background:var(--leaf);}\n.stage-label{font-size:13px;font-weight:600;color:var(--text-dim);}\n.stage-item.done .stage-label,.stage-item.current .stage-label{color:var(--text);}\n.stage-time{font-size:10.5px;color:var(--text-dim);margin-left:auto;font-family:'JetBrains Mono',monospace;}\n\n/* ---------- Gauge ---------- */\n.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}\n.gauge{\n  width:128px;height:128px;border-radius:50%;position:relative;overflow:hidden;\n  background:var(--bg-elevated);border:3px solid var(--border);\n}\n.gauge-water{position:absolute;left:-25%;width:150%;height:150%;transition:top .8s cubic-bezier(.4,0,.2,1);top:100%;}\n.gauge-water .w1,.gauge-water .w2{\n  position:absolute;left:0;top:0;width:200%;height:200%;background:var(--aqua);border-radius:44%;opacity:.9;\n}\n.gauge-water .w1{animation:spin 7s linear infinite;background:var(--aqua-deep);opacity:.8;}\n.gauge-water .w2{animation:spin 5s linear infinite reverse;background:var(--aqua);opacity:.7;}\n@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}\n.gauge-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;z-index:2;text-shadow:0 2px 8px rgba(0,0,0,.4);}\n.gauge-caption{font-size:11px;color:var(--text-dim);text-align:center;}\n\n.order-summary{\n  display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);\n}\n.order-summary .item .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);}\n.order-summary .item .v{font-size:13.5px;font-weight:600;margin-top:2px;}\n\n/* ---------- Toast ---------- */\n.toast{\n  position:fixed;top:20px;right:20px;z-index:80;\n  background:linear-gradient(155deg,var(--paper),#E4F2F6);color:var(--text-on-paper);\n  padding:14px 18px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.35);\n  display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;\n  transform:translateX(140%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:320px;\n}\n.toast.show{transform:translateX(0);}\n\n.empty{\n  border:1.5px dashed var(--border);border-radius:14px;padding:26px;text-align:center;color:var(--text-dim);font-size:13px;\n}\n\n.driver-select{margin-bottom:20px;}\n.driver-order-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}\n\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}\n\n@media (max-width:860px){\n  .grid-2{grid-template-columns:1fr;}\n  .stats-row{grid-template-columns:repeat(2,1fr);}\n  .tracker-body{grid-template-columns:1fr;justify-items:center;}\n}\n@media (max-width:520px){\n  .stats-row{grid-template-columns:1fr;}\n  .field-row{grid-template-columns:1fr;}\n  .header{flex-direction:column;align-items:flex-start;}\n  .role-switch{width:100%;overflow-x:auto;}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"toast\" id=\"toast\">\u003cspan id=\"toast-icon\">\ud83d\udca7\u003c/span>\u003cspan id=\"toast-msg\">\u003c/span>\u003c/div>\n\n\u003cheader class=\"header\">\n  \u003cdiv class=\"brand\">\n    \u003cdiv class=\"brand-mark\">\ud83d\udca7\u003c/div>\n    \u003cdiv class=\"brand-text\">\n      \u003ch1>WaterBook\u003c/h1>\n      \u003cp>Tanker booking &amp; live delivery tracking\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"role-switch\">\n    \u003cbutton class=\"role-btn active\" data-role=\"customer\">\ud83c\udfe0 Book Water\u003c/button>\n    \u003cbutton class=\"role-btn\" data-role=\"track\">\ud83d\udccd Track Order\u003c/button>\n    \u003cbutton class=\"role-btn\" data-role=\"manager\">\ud83e\udded Dispatch\u003c/button>\n    \u003cbutton class=\"role-btn\" data-role=\"driver\">\ud83d\ude9a Driver Cab\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"wrap\">\n\n  \u003c!-- ============ CUSTOMER VIEW (booking wizard) ============ -->\n  \u003csection class=\"view active\" id=\"view-customer\">\n    \u003cdiv class=\"page-head\">\n      \u003ch2>Book a Water Tanker\u003c/h2>\n      \u003cp>Two quick steps \u2014 enter details, then pick a time slot.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"wizard-steps\">\n      \u003cdiv class=\"wizard-step active\" id=\"wz-dot-1\">\u003cspan class=\"num\">1\u003c/span> Name &amp; Address\u003c/div>\n      \u003cdiv class=\"wizard-step-line\">\u003c/div>\n      \u003cdiv class=\"wizard-step\" id=\"wz-dot-2\">\u003cspan class=\"num\">2\u003c/span> Time Slot\u003c/div>\n    \u003c/div>\n\n    \u003c!-- STEP 1: Name & Address -->\n    \u003cdiv id=\"wz-step-1\">\n      \u003cdiv class=\"card\" style=\"max-width:480px;\">\n        \u003cdiv class=\"card-title\">\ud83d\udc64 Name &amp; Address\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Full Name\u003c/label>\u003cinput id=\"c-name\" placeholder=\"e.g. Priya Sharma\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Mobile Number\u003c/label>\u003cinput id=\"c-mobile\" placeholder=\"98765 43210\" maxlength=\"10\">\u003c/div>\n        \u003cdiv class=\"field\">\n          \u003clabel>Address Type\u003c/label>\n          \u003cdiv class=\"toggle-group\">\n            \u003cbutton class=\"toggle-opt active\" data-addrtype=\"PG\">PG / Hostel\u003c/button>\n            \u003cbutton class=\"toggle-opt\" data-addrtype=\"Home\">Home\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"field\">\u003clabel id=\"c-addrname-label\">PG Name\u003c/label>\u003cinput id=\"c-addrname\" placeholder=\"e.g. Sunrise Boys PG\">\u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Full Address\u003c/label>\u003ctextarea id=\"c-address\" rows=\"2\" placeholder=\"House / Building, Street, Area, City\">\u003c/textarea>\u003c/div>\n        \u003cbutton class=\"btn btn-primary\" id=\"c-next-step\">Next: Time Slot \u2192\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- STEP 2: Time Slot -->\n    \u003cdiv id=\"wz-step-2\" style=\"display:none;\">\n      \u003cdiv class=\"card\" style=\"max-width:480px;\">\n        \u003cdiv class=\"card-title\">\ud83d\udeb0 Choose a Time Slot\u003c/div>\n        \u003cdiv class=\"urgent-toggle\">\n          \u003cspan class=\"lbl\">\u26a1 Need it urgently?\u003c/span>\n          \u003cdiv class=\"switch\" id=\"urgent-switch\">\u003c/div>\n        \u003c/div>\n        \u003cdiv id=\"schedule-fields\">\n          \u003cdiv class=\"field-row\">\n            \u003cdiv class=\"field\">\u003clabel>Date\u003c/label>\u003cinput type=\"date\" id=\"c-date\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel>Time\u003c/label>\u003cinput type=\"time\" id=\"c-time\" value=\"10:00\">\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"field\">\u003clabel>Notes (optional)\u003c/label>\u003ctextarea id=\"c-notes\" rows=\"2\" placeholder=\"Gate code, landmark, tank size\u2026\">\u003c/textarea>\u003c/div>\n        \u003cdiv style=\"display:flex;gap:10px;\">\n          \u003cbutton class=\"btn btn-ghost\" id=\"c-back-step\" style=\"flex:0 0 auto;width:auto;padding:12px 18px;\">\u2190 Back\u003c/button>\n          \u003cbutton class=\"btn btn-amber\" id=\"c-submit-request\">Submit Request\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"c-code-result\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"page-head\" style=\"margin-top:30px;\">\n      \u003ch2 style=\"font-size:19px;\">Recent Requests\u003c/h2>\n      \u003cp>Every booking made on this device today.\u003c/p>\n    \u003c/div>\n    \u003cdiv id=\"c-my-requests\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ TRACK VIEW (separate from booking) ============ -->\n  \u003csection class=\"view\" id=\"view-track\">\n    \u003cdiv class=\"page-head\">\n      \u003ch2>Track Your Delivery\u003c/h2>\n      \u003cp>Enter the booking code you received to see live status.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"card\" style=\"max-width:480px;\">\n      \u003cdiv class=\"field\">\u003clabel>Booking Code\u003c/label>\u003cinput id=\"c-track-code\" placeholder=\"e.g. WB-4821\" style=\"font-family:'JetBrains Mono',monospace;\">\u003c/div>\n      \u003cbutton class=\"btn btn-ghost\" id=\"c-track-btn\">Check Status\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"c-track-result\" style=\"margin-top:22px;\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ MANAGER / DISPATCH VIEW ============ -->\n  \u003csection class=\"view\" id=\"view-manager\">\n    \u003cdiv class=\"page-head\">\n      \u003ch2>Dispatch Control\u003c/h2>\n      \u003cp>Assign incoming requests to an available tanker.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"max-width:520px;margin-bottom:24px;\">\n      \u003cdiv class=\"card-title\">\u23f1\ufe0f Auto-Delivery Speed\u003c/div>\n      \u003cp style=\"font-size:12.5px;color:var(--text-dim);margin-bottom:14px;\">\n        Total time a run takes to move itself from \u003cb style=\"color:var(--text)\">Driver Accepted\u003c/b> to \u003cb style=\"color:var(--text)\">Filling Your Tank\u003c/b> \u2014 the driver only ever taps Accept and Complete.\n      \u003c/p>\n      \u003cdiv class=\"field\" style=\"margin-bottom:4px;\">\n        \u003clabel>Duration: \u003cspan id=\"m-duration-val\" style=\"color:var(--aqua-bright);\">5\u003c/span> min \u003cspan style=\"color:var(--text-dim);text-transform:none;font-size:11px;\">(min 1, max 15)\u003c/span>\u003c/label>\n        \u003cinput type=\"range\" id=\"m-duration-slider\" min=\"1\" max=\"15\" step=\"1\" value=\"5\" style=\"width:100%;\">\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"stats-row\">\n      \u003cdiv class=\"stat-card\" style=\"--stat-c:var(--amber)\">\u003cdiv class=\"stat-label\">Pending Requests\u003c/div>\u003cdiv class=\"stat-value\" id=\"m-stat-pending\">0\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\" style=\"--stat-c:var(--aqua)\">\u003cdiv class=\"stat-label\">Active Deliveries\u003c/div>\u003cdiv class=\"stat-value\" id=\"m-stat-active\">0\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\" style=\"--stat-c:var(--leaf)\">\u003cdiv class=\"stat-label\">Lorries Free\u003c/div>\u003cdiv class=\"stat-value\" id=\"m-stat-free\">0 / 0\u003c/div>\u003c/div>\n      \u003cdiv class=\"stat-card\" style=\"--stat-c:var(--aqua-bright)\">\u003cdiv class=\"stat-label\">Completed Today\u003c/div>\u003cdiv class=\"stat-value\" id=\"m-stat-done\">0\u003c/div>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"grid-2\">\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-title\">\ud83d\udce5 Incoming Requests\u003c/div>\n        \u003cdiv id=\"m-pending-list\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-title\" style=\"justify-content:space-between;\">\n          \u003cspan>\ud83d\ude9a Fleet Status\u003c/span>\n          \u003cbutton class=\"btn btn-ghost btn-sm\" id=\"m-add-lorry-toggle\">+ Add Lorry\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"m-add-lorry-form\" style=\"display:none;margin-bottom:16px;padding:14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;\">\n          \u003cdiv class=\"field-row\">\n            \u003cdiv class=\"field\">\u003clabel>Driver Name\u003c/label>\u003cinput id=\"nl-driver\" placeholder=\"e.g. Bala Murugan\">\u003c/div>\n            \u003cdiv class=\"field\">\u003clabel>Plate Number\u003c/label>\u003cinput id=\"nl-plate\" placeholder=\"KA-05 XY 1122\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"field\">\u003clabel>Tank Capacity\u003c/label>\u003cinput id=\"nl-capacity\" placeholder=\"6000 L\">\u003c/div>\n          \u003cbutton class=\"btn btn-primary btn-sm\" id=\"nl-save\" style=\"width:100%;\">Add to Fleet\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"fleet-grid\" id=\"m-fleet-grid\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"page-head\" style=\"margin-top:26px;\">\n      \u003ch2 style=\"font-size:19px;\">\ud83c\udfc6 Driver Leaderboard\u003c/h2>\n      \u003cp>Urgent runs earn 10 points \u00b7 standard runs earn 5 points.\u003c/p>\n    \u003c/div>\n    \u003cdiv id=\"m-leaderboard\">\u003c/div>\n\n    \u003cdiv class=\"page-head\" style=\"margin-top:26px;\">\n      \u003ch2 style=\"font-size:19px;\">Active Deliveries\u003c/h2>\n    \u003c/div>\n    \u003cdiv id=\"m-active-list\">\u003c/div>\n\n    \u003cdiv class=\"page-head\" style=\"margin-top:26px;\">\n      \u003ch2 style=\"font-size:19px;\">\u274c Rejected Requests\u003c/h2>\n    \u003c/div>\n    \u003cdiv id=\"m-rejected-list\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ DRIVER VIEW ============ -->\n  \u003csection class=\"view\" id=\"view-driver\">\n    \u003cdiv class=\"page-head\">\n      \u003ch2>Driver Cab\u003c/h2>\n      \u003cp>Pick your lorry to see your assigned run.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"field driver-select\" style=\"max-width:340px;\">\n      \u003clabel>I'm driving\u003c/label>\n      \u003cselect id=\"d-lorry-select\">\u003c/select>\n    \u003c/div>\n\n    \u003cdiv id=\"d-content\">\u003c/div>\n  \u003c/section>\n\n\u003c/div>\n\n\u003cscript>\n/* ================= STATE ================= */\nconst STAGES = [\n  {key:'requested', label:'Request Received', icon:'\ud83d\udcdd'},\n  {key:'assigned', label:'Lorry Assigned', icon:'\ud83d\ude9a'},\n  {key:'accepted', label:'Driver Accepted', icon:'\u2705'},\n  {key:'filling_depot', label:'Filling Tanker at Depot', icon:'\ud83d\udee2\ufe0f'},\n  {key:'on_the_way', label:'On the Way', icon:'\ud83d\udee3\ufe0f'},\n  {key:'arrived', label:'Arrived at Your Location', icon:'\ud83d\udccd'},\n  {key:'filling_location', label:'Filling Your Tank', icon:'\ud83d\udca7'},\n  {key:'completed', label:'Delivery Completed', icon:'\ud83c\udf89'},\n];\n// Only two manual taps for the driver: Accept the run, and confirm it's done.\n// Everything between (filling the tanker \u2192 on the way \u2192 arrived \u2192 filling the tank)\n// now advances on its own \u2014 total time is set by Dispatch (1\u201315 min), instead of a click each time.\nconst NEXT_ACTION_LABEL = ['','Accept Order','','','','','Complete Delivery',''];\nconst autoTimers = {}; // orderCode -> timeout id, so we never double-schedule\n\nconst state = {\n  customer: null, // {name, mobile, addrType, addrName, address}\n  orders: [\n    // seed a couple of demo orders so Dispatch/Driver aren't empty on first load\n    {code:'WB-3190', name:'Ashwin Rao', mobile:'9845012233', addrType:'PG', addrName:'Green Nest PG', address:'4th Cross, BTM Layout, Bengaluru', date:'', time:'', urgent:true, notes:'Ring bell twice', stageIdx:0, lorryId:null, createdAt:Date.now()-1000*60*10, timestamps:{}},\n    {code:'WB-2207', name:'Meera Iyer', mobile:'9900112244', addrType:'Home', addrName:'', address:'12, Lakeview Road, Indiranagar, Bengaluru', date:'2026-08-19', time:'11:00', urgent:false, notes:'', stageIdx:4, lorryId:'L2', createdAt:Date.now()-1000*60*40, timestamps:{}},\n  ],\n  lorries: [\n    {id:'L1', plate:'KA-05 AB 1234', driver:'Ramesh Kumar', capacity:'6000 L', status:'idle', orderCode:null, points:15, completedToday:2},\n    {id:'L2', plate:'KA-05 CD 5566', driver:'Suresh Naik', capacity:'8000 L', status:'busy', orderCode:'WB-2207', points:5, completedToday:1},\n    {id:'L3', plate:'KA-05 EF 7788', driver:'Manjunath Gowda', capacity:'6000 L', status:'idle', orderCode:null, points:0, completedToday:0},\n    {id:'L4', plate:'KA-05 GH 9900', driver:'Farhan Sheikh', capacity:'5000 L', status:'idle', orderCode:null, points:10, completedToday:1},\n    {id:'L5', plate:'KA-05 IJ 3344', driver:'Dinesh Patil', capacity:'8000 L', status:'idle', orderCode:null, points:0, completedToday:0},\n  ],\n  nextLorryNum: 6,\n  autoDurationMinutes: 5, // manager-controlled: 1\u201315 min for the whole automatic run\n};\nlet lastSubmitAt = 0;\nlet draftCustomer = null; // step 1 details, held until step 2 is submitted\nstate.orders[1].timestamps.assigned = new Date(Date.now()-1000*60*35).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\nstate.orders[1].timestamps.on_the_way = new Date(Date.now()-1000*60*15).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\nlet notifiedCompleted = new Set();\nlet notifiedRejected = new Set();\n\n/* ================= HELPERS ================= */\nconst $ = s => document.querySelector(s);\nconst $$ = s => Array.from(document.querySelectorAll(s));\nfunction genCode(){\n  let code;\n  do{ code = 'WB-' + (1000 + Math.floor(Math.random()*9000)); }\n  while(state.orders.some(o=>o.code===code));\n  return code;\n}\nfunction pctFor(idx){ return Math.round(idx/(STAGES.length-1)*100); }\nfunction findOrder(code){ return state.orders.find(o=>o.code.toLowerCase()===String(code).trim().toLowerCase()); }\nfunction lorryFor(order){ return state.lorries.find(l=>l.id===order.lorryId); }\n\n// Auto-advances an order through the stages the driver doesn't tap manually:\n// accepted(2) -> filling_depot(3) -> on_the_way(4) -> arrived(5) -> filling_location(6).\n// Stops at 6, where the driver taps \"Complete Delivery\" themselves.\n// The four steps split state.autoDurationMinutes evenly (with a little jitter) so the\n// whole automatic run finishes in whatever total Dispatch has dialed in (1\u201315 min).\nfunction scheduleAuto(order){\n  if(!order || order.stageIdx \u003c 2 || order.stageIdx >= 6) return;\n  if(autoTimers[order.code]) return; // already scheduled, don't double up\n  const totalMs = Math.max(1, Math.min(15, state.autoDurationMinutes)) * 60 * 1000;\n  const perStep = totalMs / 4;\n  const jitter = perStep * 0.2;\n  const delay = Math.max(1500, perStep - jitter + Math.random()*jitter*2);\n  autoTimers[order.code] = setTimeout(()=>{\n    delete autoTimers[order.code];\n    if(order.stageIdx>=2 && order.stageIdx\u003c6){\n      order.stageIdx += 1;\n      order.timestamps[STAGES[order.stageIdx].key] = new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\n      renderAll();\n      scheduleAuto(order);\n    }\n  }, delay);\n}\n\nfunction showToast(msg, icon='\ud83d\udca7'){\n  $('#toast-icon').textContent = icon;\n  $('#toast-msg').textContent = msg;\n  $('#toast').classList.add('show');\n  clearTimeout(window.__toastTimer);\n  window.__toastTimer = setTimeout(()=> $('#toast').classList.remove('show'), 4200);\n}\n\n/* ================= ROLE SWITCH ================= */\n$$('.role-btn').forEach(b=>b.addEventListener('click', ()=>{\n  $$('.role-btn').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  $$('.view').forEach(v=>v.classList.remove('active'));\n  $('#view-'+b.dataset.role).classList.add('active');\n  renderAll();\n}));\n\n/* ================= TRACKER (shared component) ================= */\nfunction trackerHTML(order){\n  const pct = pctFor(order.stageIdx);\n  const l = lorryFor(order);\n  const moving = order.stageIdx===4;\n  return `\n    \u003cdiv class=\"tracker\">\n      \u003cdiv class=\"order-summary\">\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Code\u003c/div>\u003cdiv class=\"v\" style=\"font-family:'JetBrains Mono',monospace;color:var(--aqua-bright)\">${order.code}\u003c/div>\u003c/div>\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Customer\u003c/div>\u003cdiv class=\"v\">${order.name}\u003c/div>\u003c/div>\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Lorry\u003c/div>\u003cdiv class=\"v\">${l ? l.plate : 'Not assigned yet'}\u003c/div>\u003c/div>\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Driver\u003c/div>\u003cdiv class=\"v\">${l ? l.driver : '\u2014'}\u003c/div>\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"road-wrap\">\n        \u003cdiv class=\"road-line\">\u003c/div>\n        \u003cdiv class=\"road-fill\" style=\"width:${Math.max(pct-8,0)*0.84}%\">\u003c/div>\n        \u003cdiv class=\"road-node depot\">\ud83c\udfed\u003c/div>\n        \u003cdiv class=\"road-node home\">${order.addrType==='PG'?'\ud83c\udfe2':'\ud83c\udfe0'}\u003c/div>\n        \u003cdiv class=\"road-truck ${moving?'moving':''}\" style=\"left:${8 + pct*0.84}%;\">\ud83d\ude9a\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"tracker-body\">\n        \u003cdiv class=\"stage-list\">\n          ${STAGES.map((s,i)=>`\n            \u003cdiv class=\"stage-item ${i\u003corder.stageIdx?'done':''} ${i===order.stageIdx?'current':''}\">\n              \u003cdiv class=\"stage-dot\">${i\u003corder.stageIdx?'\u2713':s.icon}\u003c/div>\n              \u003cdiv class=\"stage-label\">${s.label}\u003c/div>\n              ${order.timestamps[s.key] ? `\u003cdiv class=\"stage-time\">${order.timestamps[s.key]}\u003c/div>` : ''}\n            \u003c/div>\n          `).join('')}\n        \u003c/div>\n        \u003cdiv class=\"gauge-wrap\">\n          \u003cdiv class=\"gauge\">\n            \u003cdiv class=\"gauge-water\" style=\"top:${100-pct}%;\">\n              \u003cdiv class=\"w1\">\u003c/div>\u003cdiv class=\"w2\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"gauge-pct\">${pct}%\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"gauge-caption\">${STAGES[order.stageIdx].label}\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  `;\n}\n\n/* ================= CUSTOMER VIEW (booking wizard) ================= */\nlet selectedAddrType = 'PG';\n$$('.toggle-opt[data-addrtype]').forEach(b=>b.addEventListener('click', ()=>{\n  $$('.toggle-opt[data-addrtype]').forEach(x=>x.classList.remove('active'));\n  b.classList.add('active');\n  selectedAddrType = b.dataset.addrtype;\n  $('#c-addrname-label').textContent = selectedAddrType==='PG' ? 'PG Name' : 'Home / Building Name';\n  $('#c-addrname').placeholder = selectedAddrType==='PG' ? 'e.g. Sunrise Boys PG' : 'e.g. Meera Residency';\n}));\n\nfunction goToStep(n){\n  $('#wz-step-1').style.display = n===1 ? 'block' : 'none';\n  $('#wz-step-2').style.display = n===2 ? 'block' : 'none';\n  $('#wz-dot-1').classList.toggle('active', n===1);\n  $('#wz-dot-1').classList.toggle('done', n===2);\n  $('#wz-dot-2').classList.toggle('active', n===2);\n}\n\n$('#c-next-step').addEventListener('click', ()=>{\n  const name = $('#c-name').value.trim();\n  const mobile = $('#c-mobile').value.trim();\n  const addrName = $('#c-addrname').value.trim();\n  const address = $('#c-address').value.trim();\n  if(!name || mobile.length\u003c10 || !address){\n    showToast('Please fill name, a valid 10-digit mobile, and address', '\u26a0\ufe0f');\n    return;\n  }\n  draftCustomer = {name, mobile, addrType:selectedAddrType, addrName, address};\n  $('#c-date').value = new Date().toISOString().slice(0,10);\n  goToStep(2);\n});\n\n$('#c-back-step').addEventListener('click', ()=> goToStep(1));\n\nfunction resetWizard(){\n  draftCustomer = null;\n  $('#c-name').value=''; $('#c-mobile').value=''; $('#c-addrname').value=''; $('#c-address').value='';\n  $('#c-notes').value=''; $('#c-code-result').innerHTML='';\n  urgentOn = false;\n  $('#urgent-switch').classList.remove('on');\n  $('#schedule-fields').style.display='block';\n  goToStep(1);\n}\n\nlet urgentOn = false;\n$('#urgent-switch').addEventListener('click', ()=>{\n  urgentOn = !urgentOn;\n  $('#urgent-switch').classList.toggle('on', urgentOn);\n  $('#schedule-fields').style.display = urgentOn ? 'none' : 'block';\n});\n\n$('#c-submit-request').addEventListener('click', ()=>{\n  if(!draftCustomer){ showToast('Please complete your name & address first', '\u26a0\ufe0f'); goToStep(1); return; }\n\n  // require a schedule unless marked urgent\n  if(!urgentOn && (!$('#c-date').value || !$('#c-time').value)){\n    showToast('Please pick a date & time, or mark it Urgent', '\u26a0\ufe0f');\n    $('#c-date').focus();\n    return;\n  }\n\n  // block accidental double-taps / repeat submits within 3s\n  const now = Date.now();\n  if(now - lastSubmitAt \u003c 3000){\n    showToast('Hang on \u2014 that request was just submitted', '\u23f3');\n    return;\n  }\n  lastSubmitAt = now;\n\n  $('#c-submit-request').disabled = true;\n  setTimeout(()=>{ $('#c-submit-request').disabled = false; }, 3000);\n\n  const code = genCode();\n  const order = {\n    code,\n    name: draftCustomer.name,\n    mobile: draftCustomer.mobile,\n    addrType: draftCustomer.addrType,\n    addrName: draftCustomer.addrName,\n    address: draftCustomer.address,\n    date: urgentOn ? '' : $('#c-date').value,\n    time: urgentOn ? '' : $('#c-time').value,\n    urgent: urgentOn,\n    notes: $('#c-notes').value.trim(),\n    stageIdx: 0,\n    lorryId: null,\n    rejected: false,\n    rejectReason: '',\n    createdAt: Date.now(),\n    timestamps: {requested: new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}\n  };\n  state.orders.unshift(order);\n  $('#c-code-result').innerHTML = `\n    \u003cdiv class=\"code-card\">\n      \u003cdiv class=\"lbl\">Your Booking Code\u003c/div>\n      \u003cdiv class=\"code\">${code}\u003c/div>\n      \u003cdiv class=\"sub\">Share this code with the Track Order tab anytime \u2014 the same code goes to Dispatch.\u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"btn btn-ghost\" id=\"c-new-request\" style=\"margin-top:14px;\">Book Another Request \u2192\u003c/button>\n  `;\n  showToast(`Request submitted! Code ${code}`, '\u2705');\n  renderAll();\n\n  // loop back to Name & Address for the next person, same as a shared kiosk would\n  clearTimeout(window.__wizardResetTimer);\n  window.__wizardResetTimer = setTimeout(resetWizard, 6000);\n  $('#c-new-request').addEventListener('click', ()=>{\n    clearTimeout(window.__wizardResetTimer);\n    resetWizard();\n  });\n});\n\n$('#c-track-btn').addEventListener('click', ()=>{\n  const order = findOrder($('#c-track-code').value);\n  if(!order){\n    $('#c-track-result').innerHTML = `\u003cdiv class=\"empty\">No request found for that code. Double-check and try again.\u003c/div>`;\n    return;\n  }\n  if(order.rejected){\n    $('#c-track-result').innerHTML = `\n      \u003cdiv class=\"card\" style=\"border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.06);\">\n        \u003cdiv class=\"card-title\" style=\"color:var(--danger);\">\ud83d\udeab Request Rejected\u003c/div>\n        \u003cp style=\"font-size:13.5px;color:var(--text-dim);\">Dispatch couldn't fulfil booking \u003cb style=\"color:var(--text)\">${order.code}\u003c/b>.\u003c/p>\n        \u003cp style=\"font-size:13px;margin-top:8px;\">\u003cb>Reason:\u003c/b> ${order.rejectReason || 'Not specified'}\u003c/p>\n      \u003c/div>`;\n    return;\n  }\n  $('#c-track-result').innerHTML = trackerHTML(order);\n});\n\nfunction renderCustomerRequests(){\n  const recent = [...state.orders].sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);\n  $('#c-my-requests').innerHTML = recent.length ? recent.map(o=>`\n    \u003cdiv class=\"req-row\">\n      \u003cspan class=\"code-mini\">${o.code}\u003c/span>\n      \u003cdiv class=\"info\">\n        \u003cdiv class=\"name\">${o.name} \u2014 ${o.addrType==='PG' ? (o.addrName||'PG') : (o.addrName||'Home')}\u003c/div>\n        \u003cdiv class=\"addr\">${o.address}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"meta\">${o.urgent ? 'Urgent' : (o.date ? o.date+' \u00b7 '+o.time : '\u2014')}\u003c/div>\n      ${o.rejected\n        ? '\u003cspan class=\"badge badge-rejected\">Rejected\u003c/span>'\n        : (o.urgent && o.stageIdx\u003cSTAGES.length-1 ? '\u003cspan class=\"badge badge-urgent\">Urgent\u003c/span>' : '')}\n      ${!o.rejected ? `\u003cspan class=\"badge ${o.stageIdx===STAGES.length-1?'badge-done':(o.stageIdx===0?'badge-pending':'badge-progress')}\">${STAGES[o.stageIdx].label}\u003c/span>` : ''}\n      \u003cbutton class=\"btn btn-ghost btn-sm\" data-viewcode=\"${o.code}\">Track\u003c/button>\n    \u003c/div>\n  `).join('') : `\u003cdiv class=\"empty\">No requests yet \u2014 book one above \ud83d\udca7\u003c/div>`;\n\n  $$('[data-viewcode]').forEach(b=>b.addEventListener('click', ()=>{\n    $$('.role-btn').forEach(x=>x.classList.remove('active'));\n    $('.role-btn[data-role=\"track\"]').classList.add('active');\n    $$('.view').forEach(v=>v.classList.remove('active'));\n    $('#view-track').classList.add('active');\n    $('#c-track-code').value = b.dataset.viewcode;\n    $('#c-track-btn').click();\n  }));\n\n  // completion + rejection notifications, session-wide since this device can serve many requesters\n  state.orders.forEach(o=>{\n    if(o.stageIdx===STAGES.length-1 && !o.rejected && !notifiedCompleted.has(o.code)){\n      notifiedCompleted.add(o.code);\n      showToast(`${o.code} delivered! Tank is full \ud83c\udf89`, '\ud83c\udf89');\n    }\n    if(o.rejected && !notifiedRejected.has(o.code)){\n      notifiedRejected.add(o.code);\n      showToast(`${o.code} was rejected: ${o.rejectReason || 'no reason given'}`, '\ud83d\udeab');\n    }\n  });\n}\n\n/* ================= MANAGER VIEW ================= */\n$('#m-duration-slider').addEventListener('input', ()=>{\n  state.autoDurationMinutes = Number($('#m-duration-slider').value);\n  $('#m-duration-val').textContent = state.autoDurationMinutes;\n});\n\n$('#m-add-lorry-toggle').addEventListener('click', ()=>{\n  const f = $('#m-add-lorry-form');\n  f.style.display = f.style.display==='none' ? 'block' : 'none';\n});\n$('#nl-save').addEventListener('click', ()=>{\n  const driver = $('#nl-driver').value.trim();\n  const plate = $('#nl-plate').value.trim();\n  const capacity = $('#nl-capacity').value.trim() || '6000 L';\n  if(!driver || !plate){\n    showToast('Enter a driver name and plate number', '\u26a0\ufe0f');\n    return;\n  }\n  const id = 'L' + (state.nextLorryNum++);\n  state.lorries.push({id, plate, driver, capacity, status:'idle', orderCode:null, points:0, completedToday:0});\n  $('#nl-driver').value=''; $('#nl-plate').value=''; $('#nl-capacity').value='';\n  $('#m-add-lorry-form').style.display='none';\n  showToast(`${driver} added to the fleet as ${id}`, '\ud83d\ude9a');\n  populateDriverSelect();\n  renderAll();\n});\n\nfunction renderManager(){\n  const pending = state.orders.filter(o=>o.stageIdx===0 && !o.rejected);\n  const active = state.orders.filter(o=>o.stageIdx>0 && o.stageIdx\u003cSTAGES.length-1 && !o.rejected);\n  const done = state.orders.filter(o=>o.stageIdx===STAGES.length-1 && !o.rejected);\n  const rejected = state.orders.filter(o=>o.rejected);\n  const freeLorries = state.lorries.filter(l=>l.status==='idle');\n\n  $('#m-stat-pending').textContent = pending.length;\n  $('#m-stat-active').textContent = active.length;\n  $('#m-stat-free').textContent = `${freeLorries.length} / ${state.lorries.length}`;\n  $('#m-stat-done').textContent = done.length;\n\n  $('#m-pending-list').innerHTML = pending.length ? pending.map(o=>`\n    \u003cdiv class=\"req-row\" style=\"flex-direction:column;align-items:stretch;\">\n      \u003cdiv style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;\">\n        \u003cspan class=\"code-mini\">${o.code}\u003c/span>\n        \u003cdiv class=\"info\">\n          \u003cdiv class=\"name\">${o.name} \u00b7 ${o.mobile}\u003c/div>\n          \u003cdiv class=\"addr\">${o.addrType==='PG'?'\ud83c\udfe2':'\ud83c\udfe0'} ${o.addrName ? o.addrName+' \u2014 ' : ''}${o.address}\u003c/div>\n        \u003c/div>\n        ${o.urgent ? '\u003cspan class=\"badge badge-urgent\">Urgent\u003c/span>' : `\u003cspan class=\"meta\" style=\"font-size:11.5px;color:var(--text-dim)\">${o.date} \u00b7 ${o.time}\u003c/span>`}\n        \u003cbutton class=\"btn btn-primary btn-sm\" data-assignopen=\"${o.code}\">Assign Lorry\u003c/button>\n        \u003cbutton class=\"btn btn-ghost btn-sm\" data-rejectopen=\"${o.code}\" style=\"color:var(--danger);border-color:rgba(255,107,107,.4);\">Reject\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"assign-picker\" id=\"assign-${o.code}\" style=\"display:none;\">\n        ${state.lorries.filter(l=>l.status==='idle').map(l=>`\u003cbutton class=\"assign-pick-btn\" data-assign=\"${o.code}|${l.id}\">\ud83d\ude9a ${l.id} \u00b7 ${l.driver}\u003c/button>`).join('') || '\u003cspan style=\"font-size:12px;color:var(--text-dim)\">No lorries free right now\u003c/span>'}\n      \u003c/div>\n      \u003cdiv class=\"assign-picker\" id=\"reject-${o.code}\" style=\"display:none;\">\n        \u003cinput id=\"reject-reason-${o.code}\" placeholder=\"Reason (optional) \u2014 e.g. Outside service area\" style=\"flex:1;min-width:200px;padding:9px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:9px;font-size:12.5px;color:var(--text);\">\n        \u003cbutton class=\"assign-pick-btn\" data-rejectconfirm=\"${o.code}\" style=\"color:var(--danger);border-color:rgba(255,107,107,.4);\">Confirm Reject\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `).join('') : `\u003cdiv class=\"empty\">No pending requests \u2014 all caught up! \ud83c\udf0a\u003c/div>`;\n\n  $$('[data-assignopen]').forEach(b=>b.addEventListener('click', ()=>{\n    const el = $('#assign-'+b.dataset.assignopen);\n    el.style.display = el.style.display==='none' ? 'flex' : 'none';\n  }));\n  $$('[data-rejectopen]').forEach(b=>b.addEventListener('click', ()=>{\n    const el = $('#reject-'+b.dataset.rejectopen);\n    el.style.display = el.style.display==='none' ? 'flex' : 'none';\n  }));\n  $$('[data-rejectconfirm]').forEach(b=>b.addEventListener('click', ()=>{\n    const code = b.dataset.rejectconfirm;\n    const order = findOrder(code);\n    const reasonInput = $('#reject-reason-'+code);\n    order.rejected = true;\n    order.rejectReason = (reasonInput && reasonInput.value.trim()) || 'Not specified';\n    order.timestamps.rejected = new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\n    showToast(`${code} rejected`, '\ud83d\udeab');\n    renderAll();\n  }));\n  $$('[data-assign]').forEach(b=>b.addEventListener('click', ()=>{\n    const [code, lid] = b.dataset.assign.split('|');\n    const order = findOrder(code);\n    const lorry = state.lorries.find(l=>l.id===lid);\n    order.lorryId = lid;\n    order.stageIdx = 1;\n    order.timestamps.assigned = new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\n    lorry.status='busy';\n    lorry.orderCode=code;\n    showToast(`${code} assigned to ${lorry.id} (${lorry.driver})`, '\ud83d\ude9a');\n    renderAll();\n  }));\n\n  $('#m-fleet-grid').innerHTML = state.lorries.map(l=>`\n    \u003cdiv class=\"lorry-card ${l.status==='busy'?'busy':''}\">\n      \u003cdiv class=\"lorry-top\">\u003cspan class=\"lorry-icon\">\ud83d\ude9a\u003c/span>\u003cspan class=\"badge ${l.status==='busy'?'badge-progress':'badge-done'}\">${l.status==='busy'?'On Delivery':'Idle'}\u003c/span>\u003c/div>\n      \u003cdiv class=\"lorry-driver\">${l.driver}\u003c/div>\n      \u003cdiv class=\"lorry-plate\">${l.plate}\u003c/div>\n      \u003cdiv class=\"lorry-cap\">Capacity: ${l.capacity}\u003c/div>\n      ${l.orderCode ? `\u003cdiv class=\"lorry-cap\">Run: \u003cb style=\"color:var(--aqua-bright)\">${l.orderCode}\u003c/b>\u003c/div>` : ''}\n      \u003cdiv class=\"stat-mini\">\u2705 \u003cb>${l.completedToday}\u003c/b> today \u00b7 \u003cb>${l.points}\u003c/b> pts\u003c/div>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:6px;margin-top:4px;\">\n        ${l.status==='busy' ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-unassignrun=\"${l.id}\">Unassign Run\u003c/button>` : ''}\n        \u003cbutton class=\"btn btn-ghost btn-sm\" data-removelorry=\"${l.id}\" style=\"color:var(--danger);\">Remove Driver\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  `).join('');\n\n  // Unassign Run \u2014 only clears the current delivery, driver stays in the fleet\n  $$('[data-unassignrun]').forEach(b=>b.addEventListener('click', ()=>{\n    const l = state.lorries.find(x=>x.id===b.dataset.unassignrun);\n    if(!l || !l.orderCode) return;\n    if(!confirm(`Send run ${l.orderCode} back to Pending? ${l.driver} (${l.id}) stays in the fleet.`)) return;\n    const order = findOrder(l.orderCode);\n    if(order){\n      clearTimeout(autoTimers[order.code]);\n      delete autoTimers[order.code];\n      order.stageIdx = 0;\n      order.lorryId = null;\n      ['assigned','accepted','filling_depot','on_the_way','arrived','filling_location'].forEach(k=>delete order.timestamps[k]);\n      showToast(`${order.code} sent back to Pending`, '\u21a9\ufe0f');\n    }\n    l.status = 'idle';\n    l.orderCode = null;\n    renderAll();\n  }));\n\n  // Remove Driver \u2014 deletes the driver from the fleet, requires manager password\n  $$('[data-removelorry]').forEach(b=>b.addEventListener('click', ()=>{\n    const l = state.lorries.find(x=>x.id===b.dataset.removelorry);\n    if(!l) return;\n    const pwd = prompt(`Manager password required to remove ${l.driver} (${l.id}) from the fleet:`);\n    if(pwd === null) return; // cancelled\n    if(pwd !== '1234'){\n      showToast('Incorrect password \u2014 driver not removed', '\u26d4');\n      return;\n    }\n    if(l.status==='busy' && !confirm(`${l.driver} (${l.id}) is still on delivery ${l.orderCode}. Removing them also sends that run back to Pending. Continue?`)) return;\n    if(l.orderCode){\n      const order = findOrder(l.orderCode);\n      if(order){\n        clearTimeout(autoTimers[order.code]);\n        delete autoTimers[order.code];\n        order.stageIdx = 0;\n        order.lorryId = null;\n        ['assigned','accepted','filling_depot','on_the_way','arrived','filling_location'].forEach(k=>delete order.timestamps[k]);\n        showToast(`${order.code} sent back to Pending`, '\u21a9\ufe0f');\n      }\n    }\n    state.lorries = state.lorries.filter(x=>x.id!==l.id);\n    showToast(`${l.driver} removed from fleet`, '\ud83d\uddd1\ufe0f');\n    populateDriverSelect();\n    renderAll();\n  }));\n\n  // leaderboard, ranked by points\n  const ranked = [...state.lorries].sort((a,b)=>b.points-a.points);\n  const medals = ['\ud83e\udd47','\ud83e\udd48','\ud83e\udd49'];\n  $('#m-leaderboard').innerHTML = ranked.length ? ranked.map((l,i)=>`\n    \u003cdiv class=\"lb-row ${i\u003c3?'top':''}\">\n      \u003cspan class=\"lb-rank\">${medals[i] || (i+1)}\u003c/span>\n      \u003cdiv class=\"lb-name\">\u003cdiv class=\"n\">${l.driver}\u003c/div>\u003cdiv class=\"p\">${l.id} \u00b7 ${l.plate}\u003c/div>\u003c/div>\n      \u003cspan class=\"stat-mini\">\u2705 \u003cb>${l.completedToday}\u003c/b> completed today\u003c/span>\n      \u003cspan class=\"lb-points\">${l.points} pts\u003c/span>\n    \u003c/div>\n  `).join('') : `\u003cdiv class=\"empty\">No drivers in the fleet yet.\u003c/div>`;\n\n  $('#m-active-list').innerHTML = active.length ? active.map(o=>{\n    const pct = pctFor(o.stageIdx);\n    const l = lorryFor(o);\n    const canReject = o.stageIdx===1; // assigned, but driver hasn't accepted yet\n    return `\n    \u003cdiv class=\"req-row\">\n      \u003cspan class=\"code-mini\">${o.code}\u003c/span>\n      \u003cdiv class=\"info\">\n        \u003cdiv class=\"name\">${o.name} \u2014 ${l?l.id:'\u2014'} (${l?l.driver:'\u2014'})\u003c/div>\n        \u003cdiv class=\"addr\">${STAGES[o.stageIdx].label}\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex:1;min-width:120px;background:var(--bg-elevated);border-radius:20px;height:8px;overflow:hidden;\">\n        \u003cdiv style=\"width:${pct}%;height:100%;background:linear-gradient(90deg,var(--aqua-deep),var(--aqua-bright));\">\u003c/div>\n      \u003c/div>\n      \u003cspan class=\"badge badge-progress\">${pct}%\u003c/span>\n      ${canReject ? `\u003cbutton class=\"btn btn-ghost btn-sm\" data-rejectassigned=\"${o.code}\" style=\"color:var(--danger);border-color:rgba(255,107,107,.4);\">Reject\u003c/button>` : ''}\n    \u003c/div>`;\n  }).join('') : `\u003cdiv class=\"empty\">No deliveries in progress right now.\u003c/div>`;\n\n  $$('[data-rejectassigned]').forEach(b=>b.addEventListener('click', ()=>{\n    const code = b.dataset.rejectassigned;\n    const order = findOrder(code);\n    const reason = prompt('Reason for rejecting this assigned order? (optional)') || 'Not specified';\n    const lorry = lorryFor(order);\n    if(lorry){ lorry.status='idle'; lorry.orderCode=null; }\n    order.rejected = true;\n    order.rejectReason = reason;\n    order.lorryId = null;\n    order.timestamps.rejected = new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\n    showToast(`${code} rejected \u2014 ${lorry ? lorry.id+' freed up' : ''}`, '\ud83d\udeab');\n    renderAll();\n  }));\n\n  $('#m-rejected-list').innerHTML = rejected.length ? rejected.map(o=>`\n    \u003cdiv class=\"req-row\">\n      \u003cspan class=\"code-mini\">${o.code}\u003c/span>\n      \u003cdiv class=\"info\">\n        \u003cdiv class=\"name\">${o.name} \u00b7 ${o.mobile}\u003c/div>\n        \u003cdiv class=\"addr\">Reason: ${o.rejectReason || 'Not specified'}\u003c/div>\n      \u003c/div>\n      \u003cspan class=\"meta\">${o.timestamps.rejected || ''}\u003c/span>\n      \u003cspan class=\"badge badge-rejected\">Rejected\u003c/span>\n    \u003c/div>\n  `).join('') : `\u003cdiv class=\"empty\">No rejected requests \u2014 nice and tidy.\u003c/div>`;\n}\n\n/* ================= DRIVER VIEW ================= */\nfunction populateDriverSelect(){\n  $('#d-lorry-select').innerHTML = state.lorries.map(l=>`\u003coption value=\"${l.id}\">${l.id} \u2014 ${l.driver}\u003c/option>`).join('');\n}\n$('#d-lorry-select').addEventListener('change', renderDriver);\n\nfunction renderDriver(){\n  const lid = $('#d-lorry-select').value || (state.lorries[0] && state.lorries[0].id);\n  const lorry = state.lorries.find(l=>l.id===lid);\n  if(!lorry){ $('#d-content').innerHTML = `\u003cdiv class=\"empty\">No lorries in the fleet. Ask Dispatch to add one.\u003c/div>`; return; }\n\n  const statsBar = `\n    \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      \u003cspan class=\"stat-mini\">\u2705 \u003cb>${lorry.completedToday}\u003c/b> completed today\u003c/span>\n      \u003cspan class=\"stat-mini\">\ud83c\udfc6 \u003cb>${lorry.points}\u003c/b> points total\u003c/span>\n    \u003c/div>`;\n\n  const order = lorry.orderCode ? findOrder(lorry.orderCode) : null;\n\n  if(!order){\n    $('#d-content').innerHTML = statsBar + `\u003cdiv class=\"empty\">No active run assigned to ${lorry.driver} right now. Sit tight \u2014 Dispatch will assign one soon \ud83d\ude9a\u003c/div>`;\n    return;\n  }\n\n  const actionIdx = order.stageIdx; // action moves stageIdx -> stageIdx+1\n  const actionLabel = NEXT_ACTION_LABEL[actionIdx] || null;\n  const isAuto = actionIdx>=2 && actionIdx\u003c6; // between Accept and Complete \u2014 runs on its own\n\n  let footer;\n  if(actionLabel){\n    footer = `\u003cbutton class=\"btn btn-primary\" style=\"margin-top:18px;\" id=\"d-advance\">${actionLabel} \u2192\u003c/button>`;\n  } else if(isAuto){\n    footer = `\u003cdiv class=\"stat-mini\" style=\"margin-top:18px;justify-content:center;width:100%;padding:12px;\">\n      \u003cspan class=\"road-truck moving\" style=\"position:static;font-size:16px;\">\ud83d\udd04\u003c/span>\n      Moving on its own \u2014 updates in a minute or two, no tap needed\n    \u003c/div>`;\n  } else {\n    footer = `\u003cdiv class=\"empty\" style=\"margin-top:18px;\">Delivery complete \u2014 nice work! \ud83c\udf89\u003c/div>`;\n  }\n\n  $('#d-content').innerHTML = statsBar + `\n    \u003cdiv class=\"driver-order-card\">\n      \u003cdiv class=\"order-summary\">\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Code\u003c/div>\u003cdiv class=\"v\" style=\"font-family:'JetBrains Mono',monospace;color:var(--aqua-bright)\">${order.code}\u003c/div>\u003c/div>\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Customer\u003c/div>\u003cdiv class=\"v\">${order.name} \u00b7 ${order.mobile}\u003c/div>\u003c/div>\n        \u003cdiv class=\"item\">\u003cdiv class=\"k\">Deliver To\u003c/div>\u003cdiv class=\"v\">${order.addrType==='PG'?'\ud83c\udfe2':'\ud83c\udfe0'} ${order.addrName||order.addrType}\u003c/div>\u003c/div>\n        ${order.urgent ? '\u003cspan class=\"badge badge-urgent\">Urgent\u003c/span>' : ''}\n      \u003c/div>\n      \u003cp style=\"font-size:13px;color:var(--text-dim);margin-bottom:14px;\">${order.address}${order.notes ? ' \u2014 '+order.notes : ''}\u003c/p>\n      ${trackerHTML(order)}\n      ${footer}\n    \u003c/div>\n  `;\n\n  const advBtn = $('#d-advance');\n  if(advBtn) advBtn.addEventListener('click', ()=>{\n    order.stageIdx += 1;\n    order.timestamps[STAGES[order.stageIdx].key] = new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});\n    if(order.stageIdx === STAGES.length-1){\n      lorry.status='idle';\n      lorry.orderCode=null;\n      const earned = order.urgent ? 10 : 5;\n      lorry.points += earned;\n      lorry.completedToday += 1;\n      showToast(`${order.code} delivered! +${earned} pts for ${lorry.driver} \ud83c\udfc6`, '\ud83c\udf89');\n    } else if(order.stageIdx===2){\n      // just accepted \u2014 hand off to the auto-advance chain\n      scheduleAuto(order);\n      showToast(`Order accepted \u2014 now moving through the run automatically`, '\ud83d\udd04');\n    }\n    renderAll();\n  });\n}\n\n/* ================= RENDER ALL ================= */\nfunction renderAll(){\n  renderCustomerRequests();\n  renderManager();\n  renderDriver();\n}\npopulateDriverSelect();\nstate.orders.forEach(scheduleAuto);\nrenderAll();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": "leave-management-app.html", "name": "LeaveDesk", "desc": "Leave management portal for requests and approvals.", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n\u003ctitle>LeaveDesk \u2014 Leave Management Portal\u003c/title>\n\u003clink rel=\"icon\" type=\"image/png\" href=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAMhUlEQVR4nOWbe4zdxXXHP2dm7mPvPr3GENs8TLAhBBsDrpAS2/EDJVF4KI0SJ2qF4wYSCanln1ZtIC21XbVVVSollFZpSkElTqQKF/6InVQtxfZio7bQEIgDFEzCgp21Y3u9u97Hff1mTv/4/e7de+29670Xm93AdzV37+5v5szvzDlz5pwzM8JU2KqG7SiIwlaz4q77NojRO9BoraouAe0FnbLp7EEAOSUi/Yjbr0F2HXzsr/bC9gAqbEXYLmGqVnXYtEntzp3iAVbcPbJFxNwLrBKbRUMZQhlVf+H5aQEiFkwKMSnUFwB+rBoePvho9+NQz1u1Te0f69btdX19G6Jrf+fwspTtecSkOtapLxCicQCPiiDxUL9HPDULRVFEFbDGtSM2SyiP9ZX98Nde++fLDlV4rDSoMlJ5cN2Wo+ttqutJMaleXxqJAIOIiavONbVvhORdVQMQbLrbaSif8uXTn3/l8YX7agchHoCtatguYfnmgXWS6vwRorkQFSIR42aRi/MG1RAZl3WoTGh59Naf7VjUV+FZKgbv+juHl4SU/EREuoMveBFjf20Efi4IqAZvbNaq6ogp640//V5PP1sRU6kTTHmHsZnuEOUjQSyqxCr/PiiqCGJDlI+MzXQHU95RMzZw7ZeP3ZnKzN8RFQYjEXlfqH0jqGrksvNduTi4+bXvfuh7smmT2leyx160qfYVIZoIgJ3tl7zA8MbljC+PH7yu8KGb5KN3Ht5obNszGkoKMleXt/MMVTFpCT5/i1OVz2EzaCgF0Pe79CsIYjNWo8LnHMga9SUIKnPWvTnfUER9CZA1DnQJoQSign5ARkBUCCVAlziBnhA8xKvlLL/ZewRFVD0CPU71A8L0FFDAfWCk3gCOD7AGADhtUQOMCMbU/y8ECE0OqLONDa9WP0A1iXXPs7xa0gARYTzvKZbr22ZSQi5rmIldEcAHODnaOLkiyYcRsFZIOyGdkqTt+RmJpm g:#141A2A;\n    --sidebar-bg-2:#1B2338;\n    --sidebar-text:#AEB6C9;\n    --sidebar-active:#232C46;\n    --radius:12px;\n    --shadow: 0 1px 2px rgba(16,24,40,0.05), 0 1px 3px rgba(16,24,40,0.06);\n  }\n  *{ box-sizing:border-box; }\n  html,body{ margin:0; padding:0; }\n  body{\n    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;\n    -webkit-font-smoothing:antialiased; min-height:100vh;\n  }\n  .mono{ font-family:'JetBrains Mono',monospace; }\n  .hidden{ display:none !important; }\n  button{ font-family:'Inter',sans-serif; }\n  a{ color:inherit; }\n\n  /* ---------------- LOGIN ---------------- */\n  #loginScreen{\n    min-height:100vh; display:flex; align-items:center; justify-content:center;\n    background:\n      radial-gradient(circle at 15% 15%, rgba(35,84,230,0.10), transparent 45%),\n      radial-gradient(circle at 85% 85%, rgba(35,84,230,0.08), transparent 45%),\n      var(--sidebar-bg);\n    padding:24px;\n  }\n  .login-wrap{ width:100%; max-width:920px; display:grid; grid-template-columns:1fr 1fr; border-radius:20px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.35); }\n  @media (max-width:760px){ .login-wrap{ grid-template-columns:1fr; } .login-side{ display:none; } }\n  .login-side{\n    background:linear-gradient(160deg, var(--sidebar-bg-2), var(--sidebar-bg));\n    color:#fff; padding:48px 40px; display:flex; flex-direction:column; justify-content:space-between;\n  }\n  .login-side .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.2rem; }\n  .login-side .brand .mark{ width:34px; height:34px; border-radius:9px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:1rem; }\n  .login-side h2{ font-size:1.5rem; line-height:1.4; font-weight:700; margin:36px 0 10px; }\n  .login-side p{ color:#9AA3B8; font-size:0.9rem; line-height:1.6; }\n  .role-card-list{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }\n  .role-card{\n    display:flex;
